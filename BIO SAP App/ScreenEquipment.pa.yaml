                                    PaddingBottom: |-
                                        =0
                                    PaddingLeft: |-
                                        =0
                                    PaddingRight: |-
                                        =0
                                    PaddingTop: |-
                                        =0
                                    Size: |-
                                        =13
                                    Text: |-
                                        ="Create, change and delete equipment"
                                    Visible: |-
                                        =LayoutRank >= 2
                                    Wrap: |-
                                        =false
                              - imgEqMode:
                                  Control: Image
                                  Properties:
                                    AccessibleLabel: |-
                                        =If(IfError(varEqViewOnly, false), "View mode - fields are locked", "Edit mode")
                                    AlignInContainer: |-
                                        =AlignInContainer.Start
                                    BorderStyle: |-
                                        =BorderStyle.None
                                    BorderThickness: |-
                                        =0
                                    Height: |-
                                        =26
                                    Image: |-
                                        =If(IfError(varEqBadgeOn, false), "data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='104' height='26' viewBox='0 0 104 26'><rect width='104' height='26' rx='13' fill='" & If(IfError(varEqViewOnly, false), C.'hex-state-info-bg', C.'hex-state-neutral-bg') & "'/>" & If(IfError(varEqViewOnly, false), "<g transform='translate(8 6) scale(0.583333)' fill='none' stroke='" & If(IfError(varEqViewOnly, false), C.'hex-state-info-fg', C.'hex-state-warn-fg') & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z M12 14.8a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6Z'/></g>", "<g transform='translate(8 6) scale(0.583333)' fill='none' stroke='" & If(IfError(varEqViewOnly, false), C.'hex-state-info-fg', C.'hex-state-warn-fg') & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 20h4.5L19.3 9.2a2 2 0 0 0 0-2.8l-1.7-1.7a2 2 0 0 0-2.8 0L4 15.5V20Z M13.5 6l4.5 4.5'/></g>") & "<text x='26' y='17.5' font-family='Segoe UI, sans-serif' font-size='12' font-weight='600' fill='" & If(IfError(varEqViewOnly, false), C.'hex-state-info-fg', C.'hex-state-warn-fg') & "'>" & If(IfError(varEqViewOnly, false), "View mode", "Edit mode") & "</text></svg>"), "")
                                    ImagePosition: |-
                                        =ImagePosition.Fit
                                    LayoutMinWidth: |-
                                        =104
                                    OnSelect: |-
                                        =false
                                    TabIndex: |-
                                        =0
                                    Visible: |-
                                        =LayoutRank >= 2
                                    Width: |-
                                        =104
                        - btnEqEditRequest:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Edit this equipment request"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-default'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'text-primary'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Edit"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 96)
                              OnSelect: |-
                                  =Set(varEqViewOnly, false)
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Edit"
                              Tooltip: |-
                                  ="Edit this equipment request"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Visible: |-
                                  =IfError(varEqViewOnly && varEqCanEdit, false)
                              Width: |-
                                  =If(LayoutRank < 2, 40, 96)
                        - btnEqDeleteRequest:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Delete this equipment request"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-error'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'state-error-fg'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Delete"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 106)
                              OnSelect: |-
                                  =Set(varEqDeleteOpen, true)
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Delete"
                              Tooltip: |-
                                  ="Delete this draft equipment request"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Visible: |-
                                  =!IfError(varEqViewOnly, true) && !IsBlank(varEqRequestGuid)
                              Width: |-
                                  =If(LayoutRank < 2, 40, 106)
                        - btnEqSendDraft:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Save draft"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-default'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'text-primary'
                              DisplayMode: |-
                                  =If(varEqViewOnly || CountRows(Filter(colEqRows, Status <> "submitted")) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Save"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 135)
                              OnSelect: |-
                                  =Set(varEqSaving, true);
                                  If(
                                      CountRows(Filter(colEqRows, Status <> "submitted")) = 0,
                                      Notify("There are no rows to save.", NotificationType.Warning),
                                  
                                      Set(
                                          varEqIdx,
                                          If(!IsBlank(varEqRequestGuid), LookUp(MD_RequestIndex, RequestGuid = varEqRequestGuid))
                                      );
                                      If(
                                          !IsBlank(varEqIdx) &&
                                          !((Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe && (varEqIdx.Status.Value = "Kladde")) || (IsAdmin && (varEqIdx.Status.Value = "Kladde" || varEqIdx.Status.Value = "AfventerInfo"))),
                                          Notify("This request can no longer be changed.", NotificationType.Warning),
                                  
                                      IfError(
                                          If(
                                              IsBlank(varEqRequestGuid),
                                              Set(varEqRequestGuid, Text(GUID()))
                                          );
                                          Set(varEqAdmFrom, Coalesce(varEqIdx.Status.Value, ""));
                                          Set(
                                              varEqIdx,
                                              Patch(
                                                  MD_RequestIndex,
                                                  Coalesce(varEqIdx, Defaults(MD_RequestIndex)),
                                                  {
                                                      RequestNo: Coalesce(varEqRequestNo, varEqRequestGuid),
                                                      Domain: { Value: "Equipment" },
                                                      Status: { Value: Coalesce(varEqIdx.Status.Value, "Kladde") },
                                                      StatusStep: Coalesce(varEqIdx.StatusStep, 1),
                                                      IsOpen: true,
                                                      RequestGuid: varEqRequestGuid,
                                                      RequesterEmail: Coalesce(varEqIdx.RequesterEmail, varEqMe),
                                                      RequesterName: Coalesce(varEqIdx.RequesterName, User().FullName),
                                                      ShortText: "Equipment: " & CountRows(Filter(colEqRows, Status <> "submitted")) & " row(s)",
                                                      Plant: First(Filter(colEqRows, Status <> "submitted")).Plant,
                                                      ItemCount: CountRows(Filter(colEqRows, Status <> "submitted")),
                                                      AppUrl: "https://apps.powerapps.com/play/e/e0f8f822-d16a-e878-ba4e-fb42bc617e47/a/17f6f493-203d-40a1-9fe4-2c99b04b85a5?domain=equipment&reqid=" & varEqRequestGuid,
                                                      LastActionOn: Now(),
                                                      LastActionBy: varEqMe
                                                  }
                                              )
                                          );
                                  
                                          // Foerste gang bliver indeksraekkens eget ID til nummeret
                                          If(
                                              IsBlank(varEqRequestNo),
                                              Set(varEqRequestNo, "EQ-" & Text(varEqIdx.ID, "000000"));
                                              Patch(MD_RequestIndex, varEqIdx, { RequestNo: varEqRequestNo })
                                          );
                                  
                                          Patch(
                                              EquipmentItems,
                                              ForAll(Filter(colEqRows, Status <> "submitted") As X, { ID: X.RowId }),
                                              ForAll(
                                                  Filter(colEqRows, Status <> "submitted"),
                                                  {
                                                      RequestNo: varEqRequestNo,
                                                      RequestGuid: varEqRequestGuid
                                                  }
                                              )
                                          );
                                  
                                          If(
                                              (!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)),
                                              ClearCollect(
                                                  colEqRows,
                                                  ForAll(
                                                      SortByColumns(Filter(EquipmentItems, RequestGuid = varEqRequestGuid), "Created", SortOrder.Descending) As R,
                                                      {
                                                          RowId: R.ID,
                                                          ItemKey: Coalesce(R.ItemKey, ""),
                                                          RequestNo: Coalesce(R.RequestNo, ""),
                                                          Status: Coalesce(R.RowStatus.Value, "valid"),
                                                          FileCount: Coalesce(R.FileCount, 0),
                                                          Description: Coalesce(R.Description, ""),
                                                          Plant: Coalesce(R.Plant, ""),
                                                          RequestType: Coalesce(R.RequestType, ""),
                                                          EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                                          Manufacturer: Coalesce(R.Manufacturer, ""),
                                                          TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                                          SerialNumber: Coalesce(R.SerialNumber, ""),
                                                          FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                          ClassData: Coalesce(R.ClassData, ""),
                                                          RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                                          Placement: Coalesce(R.Placement, ""),
                                                          WarrantyStart: R.WarrantyStart,
                                                          WarrantyEnd: R.WarrantyEnd,
                                                          EquipmentNumber: Coalesce(R.EquipmentNumber, "")
                                                      }
                                                  )
                                              ),
                                              ClearCollect(
                                                  colEqRows,
                                                  ForAll(
                                                      SortByColumns(Filter(EquipmentItems, RequesterEmail = varEqMe), "Created", SortOrder.Descending) As R,
                                                      {
                                                          RowId: R.ID,
                                                          ItemKey: Coalesce(R.ItemKey, ""),
                                                          RequestNo: Coalesce(R.RequestNo, ""),
                                                          Status: Coalesce(R.RowStatus.Value, "valid"),
                                                          FileCount: Coalesce(R.FileCount, 0),
                                                          Description: Coalesce(R.Description, ""),
                                                          Plant: Coalesce(R.Plant, ""),
                                                          RequestType: Coalesce(R.RequestType, ""),
                                                          EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                                          Manufacturer: Coalesce(R.Manufacturer, ""),
                                                          TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                                          SerialNumber: Coalesce(R.SerialNumber, ""),
                                                          FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                          ClassData: Coalesce(R.ClassData, ""),
                                                          RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                                          Placement: Coalesce(R.Placement, ""),
                                                          WarrantyStart: R.WarrantyStart,
                                                          WarrantyEnd: R.WarrantyEnd,
                                                          EquipmentNumber: Coalesce(R.EquipmentNumber, "")
                                                      }
                                                  )
                                              )
                                          );
                                  
                                          Set(varEqInfo, "Saved: " & varEqRequestNo);
                                          Notify("Saved as " & varEqRequestNo & " - see it on the landing page.", NotificationType.Success),
                                  
                                          Set(varEqInfo, "Save failed: " & FirstError.Message);
                                          Notify("Save failed: " & FirstError.Message, NotificationType.Error)
                                      )
                                      )
                                  );
                                  Set(varEqSaving, false)
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Save draft"
                              Tooltip: |-
                                  ="Put the request on the landing page as Draft - rows stay editable"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Width: |-
                                  =If(LayoutRank < 2, 40, 135)
                        - btnEqSubmit:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Submit"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              BasePaletteColor: |-
                                  =C.'color-brand-primary'
                              Color: |-
                                  =C.'text-on-primary'
                              DisplayMode: |-
                                  =If(varEqViewOnly || CountRows(Filter(colEqRows, Status = "valid")) = 0, DisplayMode.Disabled, DisplayMode.Edit)
