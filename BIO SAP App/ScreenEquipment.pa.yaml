                                !IsBlank(gblEqReqId) && varEqRequestGuid <> gblEqReqId,
                                Set(varEqRequestGuid, gblEqReqId);
                                Set(varEqIdx, LookUp(MD_RequestIndex, RequestGuid = varEqRequestGuid));
                                If(
                                    IsBlank(varEqIdx),
                                    Notify("Could not find the request behind this link. Rows you save start a new request.",
                                        NotificationType.Warning);
                                    Set(varEqRequestGuid, ""); Set(varEqRequestNo, ""),
                                    Set(varEqRequestNo, varEqIdx.RequestNo);
                                    Set(varEqCanEdit, ((Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe && (varEqIdx.Status.Value = "Kladde")) || (IsAdmin && (varEqIdx.Status.Value = "Kladde" || varEqIdx.Status.Value = "AfventerInfo"))));
                                    Set(varEqViewOnly, !(Lower(Coalesce(gblEqMode, "")) = "edit" && varEqCanEdit))
                                )
                            );
                            Set(varEqLoadStep, "Loading saved rows");
                            If(
                                (!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)),
                                ClearCollect(
                                    colEqRows,
                                    ForAll(
                                        SortByColumns(Filter(EquipmentItems, RequestGuid = varEqRequestGuid), "Created", SortOrder.Descending) As R,
                                        {
                                            RowId: R.ID,
                                            ItemKey: Coalesce(R.ItemKey, ""),
