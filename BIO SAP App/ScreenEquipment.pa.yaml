                                                                { f: "Serial number", a: Text(o.SerialNumber), b: Text(varEqFSerialNumber) },
                                                                { f: "Functional location", a: Text(o.FunctionalLocation), b: Text(varEqFFunctionalLocation) },
                                                                { f: "Class data", a: Text(o.ClassData), b: Text(varEqFClassData) },
                                                                { f: "Room coordinates", a: Text(o.RoomCoordinates), b: Text(varEqFRoomCoordinates) },
                                                                { f: "Placement text", a: Text(o.Placement), b: Text(varEqFPlacement) },
                                                                { f: "Warranty from", a: Text(o.WarrantyStart), b: Text(varEqFWarrantyStart) },
                                                                { f: "Warranty to", a: Text(o.WarrantyEnd), b: Text(varEqFWarrantyEnd) }
                                                                ),
                                                                Coalesce(a, "") <> Coalesce(b, "")
                                                            ),
                                                            o.ItemKey & " " & f & ": " & Coalesce(a, "(blank)") & " → " & Coalesce(b, "(blank)"),
                                                            "; "
                                                        )
                                                    ), "")
                                                );
                                                IfError(
                                                Set(
                                                    varEqSpRow,
                                                    Patch(
                                                        EquipmentItems,
                                                        If(
                                                            IsBlank(varEqActiveRowId),
                                                            Defaults(EquipmentItems),
                                                            LookUp(EquipmentItems, ID = varEqActiveRowId)
                                                        ),
                                                        {
                                                        Description: Trim(varEqFText),
                                                        Plant: varEqFPlant,
                                                        RequestType: Trim(Coalesce(varEqFRequestType, "")),
                                                        EquipmentCategory: Trim(Coalesce(varEqFEquipmentCategory, "")),
                                                        Manufacturer: Trim(Coalesce(varEqFManufacturer, "")),
                                                        TypeDesignation: Trim(Coalesce(varEqFTypeDesignation, "")),
                                                        SerialNumber: Trim(Coalesce(varEqFSerialNumber, "")),
                                                        FunctionalLocation: Trim(Coalesce(varEqFFunctionalLocation, "")),
                                                        ClassData: Trim(Coalesce(varEqFClassData, "")),
                                                        RoomCoordinates: Trim(Coalesce(varEqFRoomCoordinates, "")),
                                                        Placement: Trim(Coalesce(varEqFPlacement, "")),
                                                        WarrantyStart: varEqFWarrantyStart,
                                                        WarrantyEnd: varEqFWarrantyEnd,
                                                        RowStatus: { Value: "draft" },
                                                        RequesterEmail: If((!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)), Lower(varEqIdx.RequesterEmail), varEqMe),
                                                        RequesterName: If((!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)), varEqIdx.RequesterName, User().FullName)
                                                        }
                                                    )
                                                );
                                                Set(varEqActiveRowId, varEqSpRow.ID);
                                            
                                                If(
                                                    (!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)) && Coalesce(varEqSpRow.RequestGuid, "") <> varEqRequestGuid,
                                                    Set(
                                                        varEqSpRow,
                                                        Patch(EquipmentItems, varEqSpRow, { RequestGuid: varEqRequestGuid, RequestNo: varEqRequestNo })
                                                    )
                                                );
                                            
                                                // Noeglen er lavet af raekkens eget ID og kan derfor foerst
                                                // dannes, naar raekken findes. Derfor to skrivninger paa en ny
                                                // raekke og een paa en gammel
                                                If(
                                                    IsBlank(varEqSpRow.ItemKey),
                                                    Patch(
                                                        EquipmentItems,
                                                        varEqSpRow,
                                                        {
                                                            RowId: varEqSpRow.ID,
                                                            ItemKey: "EQ-" & Text(varEqSpRow.ID, "000000"),
                                                            AttachmentFolder: "TaskListDocuments/" & "EQ-" & Text(varEqSpRow.ID, "000000")
                                                        }
                                                    )
                                                );
                                                Set(varEqRowStatus, "draft");
                                                If(
                                                    (!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)) && (varEqAdmNew || !IsBlank(varEqAdmDiff)),
                                                    IfError(
                                                        Patch(MD_ApprovalLog, Defaults(MD_ApprovalLog), {
                                                            Title: varEqRequestNo,
                                                            RequestGuid: varEqRequestGuid,
                                                            Stage: "Admin",
                                                            Decision: "AdminEdit",
                                                            Detail: Left(If(varEqAdmNew, "New row " & Coalesce(varEqSpRow.ItemKey, "EQ-" & Text(varEqSpRow.ID, "000000")), varEqAdmDiff), 255),
                                                            Comment: If(varEqAdmNew, "New row " & Coalesce(varEqSpRow.ItemKey, "EQ-" & Text(varEqSpRow.ID, "000000")), varEqAdmDiff),
                                                            DecidedByEmail: Lower(User().Email),
                                                            DecidedOn: Now()
                                                        });
                                                        true,
                                                        Set(gblToast, { Text: "The change was saved, but the admin log entry failed: " & FirstError.Message, Kind: "Warning", At: Now() });
                                                        false
                                                    )
                                                );
                                            
                                                If(
                                                    (!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)),
                                                    ClearCollect(
                                                        colEqRows,
                                                        ForAll(
                                                            SortByColumns(Filter(EquipmentItems, RequestGuid = varEqRequestGuid), "Created", SortOrder.Descending) As R,
                                                            {
                                                                RowId: R.ID,
                                                                ItemKey: Coalesce(R.ItemKey, ""),
                                                                RequestNo: Coalesce(R.RequestNo, ""),
                                                                Status: Coalesce(R.RowStatus.Value, "valid"),
                                                                FileCount: Coalesce(R.FileCount, 0),
                                                                Description: Coalesce(R.Description, ""),
                                                                Plant: Coalesce(R.Plant, ""),
                                                                RequestType: Coalesce(R.RequestType, ""),
                                                                EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                                                Manufacturer: Coalesce(R.Manufacturer, ""),
                                                                TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                                                SerialNumber: Coalesce(R.SerialNumber, ""),
                                                                FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                                ClassData: Coalesce(R.ClassData, ""),
                                                                RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                                                Placement: Coalesce(R.Placement, ""),
                                                                WarrantyStart: R.WarrantyStart,
                                                                WarrantyEnd: R.WarrantyEnd,
                                                                EquipmentNumber: Coalesce(R.EquipmentNumber, "")
                                                            }
                                                        )
                                                    ),
                                                    ClearCollect(
                                                        colEqRows,
                                                        ForAll(
                                                            SortByColumns(Filter(EquipmentItems, RequesterEmail = varEqMe), "Created", SortOrder.Descending) As R,
                                                            {
                                                                RowId: R.ID,
                                                                ItemKey: Coalesce(R.ItemKey, ""),
                                                                RequestNo: Coalesce(R.RequestNo, ""),
                                                                Status: Coalesce(R.RowStatus.Value, "valid"),
                                                                FileCount: Coalesce(R.FileCount, 0),
                                                                Description: Coalesce(R.Description, ""),
                                                                Plant: Coalesce(R.Plant, ""),
                                                                RequestType: Coalesce(R.RequestType, ""),
                                                                EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                                                Manufacturer: Coalesce(R.Manufacturer, ""),
                                                                TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                                                SerialNumber: Coalesce(R.SerialNumber, ""),
                                                                FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                                ClassData: Coalesce(R.ClassData, ""),
                                                                RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                                                Placement: Coalesce(R.Placement, ""),
                                                                WarrantyStart: R.WarrantyStart,
                                                                WarrantyEnd: R.WarrantyEnd,
                                                                EquipmentNumber: Coalesce(R.EquipmentNumber, "")
                                                            }
                                                        )
                                                    )
                                                );
                                            
                                                Set(varEqInfo, "Saved as draft row " & LookUp(colEqRows, RowId = varEqActiveRowId).ItemKey & " - " & Trim(If(IsBlank(varEqFPlant), "Plant is required to submit the row.", "")));
                                                Set(gblToast, { Text: "Saved as draft row " & LookUp(colEqRows, RowId = varEqActiveRowId).ItemKey & " - " & Trim(If(IsBlank(varEqFPlant), "Plant is required to submit the row.", "")), Kind: "Warning", At: Now() }); true,
                                            
                                                Set(varEqInfo, "Save failed: " & FirstError.Message);
                                                Set(gblToast, { Text: "Save failed: " & FirstError.Message, Kind: "Error", At: Now() }); true
                                                )
                                            )
                                        );
                                        Set(varEqSaving, false)
                                    RadiusBottomLeft: |-
