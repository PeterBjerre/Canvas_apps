                                              =Max(0, Min(117, ((Max(0, Min(211, ((Max(0, (((((App.Width - If(LayoutRank >= 2, 56, 0)))) - 24 - 34)) - (If(LayoutRank >= 2, (32) + 10, 0)) - (If(IfError(varEqViewOnly && varEqCanEdit, false), (If(LayoutRank < 2, 40, 96)) + 10, 0)) - (If(!IfError(varEqViewOnly, true) && !IsBlank(varEqRequestGuid), (If(LayoutRank < 2, 40, 106)) + 10, 0)) - ((If(LayoutRank < 2, 40, 135)) + 10) - ((106) + 10) - ((If(LayoutRank < 2, 70, 148)) + 10) - 2))))))) - (If(IsBlank(varEqRequestNo), 0, 6 + 88))))
                                          Wrap: |-
                                              =false
                                    - imgEqNumber:
                                        Control: Image
                                        Properties:
                                          AccessibleLabel: |-
                                              ="Number " & varEqRequestNo
                                          AlignInContainer: |-
                                              =AlignInContainer.Center
                                          BorderStyle: |-
                                              =BorderStyle.None
                                          BorderThickness: |-
                                              =0
                                          Height: |-
                                              =26
                                          Image: |-
                                              =If(IsBlank(varEqRequestNo), "", "data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='88' height='26' viewBox='0 0 88 26'><rect width='88' height='26' rx='13' fill='" & C.'hex-domain-eq' & "' fill-opacity='0.12'/><text x='44' y='17.5' text-anchor='middle' font-family='Segoe UI, sans-serif' font-size='12' font-weight='600' fill='" & C.'hex-domain-eq' & "'>" & varEqRequestNo & "</text></svg>"))
                                          ImagePosition: |-
                                              =ImagePosition.Fit
                                          LayoutMinWidth: |-
                                              =88
                                          OnSelect: |-
                                              =false
                                          TabIndex: |-
                                              =0
                                          Width: |-
                                              =88
                              - txtEqSub:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: |-
                                        ="Create, change and delete equipment"
                                    BorderStyle: |-
                                        =BorderStyle.None
                                    BorderThickness: |-
                                        =0
                                    Color: |-
