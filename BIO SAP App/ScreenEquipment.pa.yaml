                                ClearCollect(
                                    colEqRows,
                                    ForAll(
                                        SortByColumns(Filter(EquipmentItems, RequesterEmail = varEqMe), "Created", SortOrder.Descending) As R,
                                        {
                                            RowId: R.ID,
