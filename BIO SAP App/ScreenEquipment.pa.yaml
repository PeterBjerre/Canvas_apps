                        OnSelect: |-
                            =If(
                                IsBlank(LookUp(colEqRows, RowId = varEqDocsId).ItemKey),
                                Notify("Save the row first - the folder is named after the row key.", NotificationType.Warning),
                            
                                Set(
                                    varEqAttJson,
                                    'BioSap-GetSubmittedAttachments'.Run("TaskListDocuments/" & LookUp(colEqRows, RowId = varEqDocsId).ItemKey).files
                                );
                                RemoveIf(colEqAttachments, RowId = varEqDocsId);
                                Collect(
                                    colEqAttachments,
                                    ForAll(
                                        ParseJSON(Coalesce(varEqAttJson, "[]")) As J,
                                        {
                                            RowId: varEqDocsId,
                                            FileName: Text(J.Name),
                                            FileUrl: Text(J.Link),
                                            Identifier: Text(J.Identifier),
                                            Selected: false
                                        }
                                    )
                                );
                                With(
                                    { n: CountRows(Filter(colEqAttachments, RowId = varEqDocsId)) },
                                    Patch(
                                        EquipmentItems,
                                        LookUp(EquipmentItems, ID = varEqDocsId),
                                        { FileCount: n }
                                    );
                                    UpdateIf(
                                        colEqRows,
                                        RowId = varEqDocsId,
