                =IfError(
                    // Har en sletning roert det, skaermen viser? (tools/request_delete.py)
                    Set(varEqStaleNow, Coalesce(gblEqStale, false));
                    If(
                        varEqStaleNow,
                        Set(gblEqStale, false);
                        If(
                            !IsBlank(varEqRequestGuid) && IsBlank(LookUp(MD_RequestIndex, RequestGuid = varEqRequestGuid)),
                            Set(gblEqWant, Blank());
                            Set(varEqOpened, "")
