                    );
                
                    // DEN SAMLEDE APP: klargoer skaermen, naar hubben eller et dyblink
                    // beder om noget andet end det, den viser. Se BIO SAP App/build/
                    // build_screens.py, open_block().
                    With(
                        { wantKey: If(
                            gblNavTo = "Eq",
                            "new:0",
                            Coalesce(
                            gblEqWant,
                            If(Lower(Param("domain")) = "equipment", "link:" & Param("reqid")),
                            "new"
                        )
                        ) },
                        If(
                            wantKey <> Coalesce(varEqOpened, ""),
                            Set(varEqLoading, true);
                            Set(varEqOpened, wantKey);
                            Set(
                                gblEqReqId,
                                If(StartsWith(wantKey, "req:"), Mid(wantKey, 5),
                                   StartsWith(wantKey, "edit:"), Mid(wantKey, 6),
                                   StartsWith(wantKey, "link:"), Mid(wantKey, 6), "")
                            );
                            Set(gblEqMode, If(StartsWith(wantKey, "edit:") || (StartsWith(wantKey, "link:") && Lower(Coalesce(Param("mode"), "")) = "edit"), "edit", "view"));
                            // Live status (issue #92): the first step is the request itself.
                            Set(varEqLoadFailed, false);
                            Set(varEqLoadSlow, false);
                            Set(varEqLoadStep, If(IsBlank(gblEqReqId), "Setting up a new request", "Finding the request"));
