                        DisplayMode: |-
                            =If(IsBlank(varEqDocsId), DisplayMode.Disabled, DisplayMode.Edit)
                        Font: |-
                            =Font.'Segoe UI'
                        FontWeight: |-
                            =FontWeight.Semibold
                        Height: |-
                            =36
                        Layout: |-
                            =ButtonLayout.TextOnly
                        LayoutMinWidth: |-
                            =If(((Min(760, App.Width - 32)) - 36) >= (195) + (175) + (164) + 16, 195, 0)
                        OnSelect: |-
                            =If(
                                IsBlank(LookUp(colEqRows, RowId = varEqDocsId).ItemKey),
                                Notify("Save the row first - the folder is named after the row key.", NotificationType.Warning),
                            
                                If(
                                    CountRows(attEqPicker.Attachments) = 0,
                                    Notify("Choose one or more files first.", NotificationType.Warning),
                            
                                    ClearCollect(
                                        colEqAttUp,
                                        ForAll(
                                            attEqPicker.Attachments As F,
                                            {
                                                Name: F.Name,
                                                Ok: IfError(
                                                    Lower(
                                                        Text(
                                                            'BioSap-TaskListAttachment'.Run(
                                                                LookUp(colEqRows, RowId = varEqDocsId).ItemKey,
                                                                { file: { contentBytes: F.Value, name: F.Name } }
                                                            ).flowrunsuccess
                                                        )
                                                    ) = "true",
                                                    false
                                                )
                                            }
                                        )
                                    );
                                    Reset(attEqPicker);
                            
                                    Set(
                                        varEqAttJson,
                                        'BioSap-GetSubmittedAttachments'.Run("TaskListDocuments/" & LookUp(colEqRows, RowId = varEqDocsId).ItemKey).files
                                    );
                                    RemoveIf(colEqAttachments, RowId = varEqDocsId);
                                    Collect(
                                        colEqAttachments,
                                        ForAll(
                                            ParseJSON(Coalesce(varEqAttJson, "[]")) As J,
                                            {
                                                RowId: varEqDocsId,
                                                FileName: Text(J.Name),
                                                FileUrl: Text(J.Link),
                                                Identifier: Text(J.Identifier),
                                                Selected: false
                                            }
                                        )
                                    );
                                    With(
                                        { n: CountRows(Filter(colEqAttachments, RowId = varEqDocsId)) },
                                        Patch(
                                            EquipmentItems,
                                            LookUp(EquipmentItems, ID = varEqDocsId),
                                            { FileCount: n }
                                        );
                                        UpdateIf(
                                            colEqRows,
                                            RowId = varEqDocsId,
                                            { FileCount: n }
                                        )
                                    );
                            
                                    If(
                                        CountRows(Filter(colEqAttUp, Ok = false)) > 0,
                                        Notify(
                                            "SharePoint refused: " &
                                            Concat(Filter(colEqAttUp, Ok = false), Name, ", "),
                                            NotificationType.Error
                                        ),
                                        Notify("Document(s) uploaded.", NotificationType.Success)
                                    )
                                )
                            )
