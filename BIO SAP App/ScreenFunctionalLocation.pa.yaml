                            =ButtonLayout.TextOnly
                        OnSelect: |-
                            =Set(varFlConfirmSubmit, false)
                        RadiusBottomLeft: |-
                            =10
                        RadiusBottomRight: |-
                            =10
                        RadiusTopLeft: |-
