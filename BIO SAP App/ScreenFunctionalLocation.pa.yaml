            Font: |-
                =Font.'Segoe UI'
            FontWeight: |-
                =FontWeight.Semibold
            Height: |-
                =36
            Layout: |-
                =ButtonLayout.TextOnly
            OnSelect: |-
                =IfError(
                    // Har en sletning roert det, skaermen viser? (tools/request_delete.py)
                    Set(varFlStaleNow, Coalesce(gblFlStale, false));
                    If(
                        varFlStaleNow,
                        Set(gblFlStale, false);
                        If(
                            !IsBlank(varFlRequestGuid) && IsBlank(LookUp(MD_RequestIndex, RequestGuid = varFlRequestGuid)),
                            Set(gblFlWant, Blank());
                            Set(varFlOpened, "")
                        )
                    );
                
                    // DEN SAMLEDE APP: klargoer skaermen, naar hubben eller et dyblink
                    // beder om noget andet end det, den viser. Se BIO SAP App/build/
                    // build_screens.py, open_block().
                    With(
                        { wantKey: If(
                            gblNavTo = "Fl",
                            "new:0",
                            Coalesce(
                            gblFlWant,
                            If(Lower(Param("domain")) = "functionallocation", "link:" & Param("reqid")),
                            "new"
                        )
                        ) },
                        If(
                            wantKey <> Coalesce(varFlOpened, ""),
                            Set(varFlLoading, true);
                            Set(varFlOpened, wantKey);
                            Set(
                                gblFlReqId,
                                If(StartsWith(wantKey, "req:"), Mid(wantKey, 5),
                                   StartsWith(wantKey, "edit:"), Mid(wantKey, 6),
                                   StartsWith(wantKey, "link:"), Mid(wantKey, 6), "")
                            );
                            Set(gblFlMode, If(StartsWith(wantKey, "edit:") || (StartsWith(wantKey, "link:") && Lower(Coalesce(Param("mode"), "")) = "edit"), "edit", "view"));
                            // Live status (issue #92): the first step is the request itself.
                            Set(varFlLoadFailed, false);
                            Set(varFlLoadSlow, false);
                            Set(varFlLoadStep, If(IsBlank(gblFlReqId), "Setting up a new request", "Finding the request"));
                            If(false, ClearCollect(colFlRows, { RowGuid: "", RowNo: 0, SpId: 0, FL: "", Description: "", KksType: "", AssignedClass: "", Status: "", FirstIssue: "", FirstWarning: "", IssueCount: 0, WarningCount: 0, Pos: 0, FlBad: false, DescBad: false, Hint: "" }));
                
                            If(false, ClearCollect(colFlVals, { RowGuid: "", Field: "", Value: "" }));
                
                            If(false, ClearCollect(colFlIssues, { RowGuid: "", Ord: 0, Sev: "", Code: "", Field: "", Short: "", Msg: "" }));
                
                            If(false, ClearCollect(colFlIssuesRaw, { RowGuid: "", Ord: 0, Sev: "", Code: "", Field: "", Short: "", Msg: "" }));
                
                            If(false, ClearCollect(colFlCalc, { RowGuid: "", RowNo: 0, SpId: 0, FL: "", Description: "", IsBlankRow: false, KksType: "", SynIssue: "", Legacy: false, K12: "", K17: "", Cls: "", SpoolCls: "", MFlReq: "", MDup: "", MDescReq: "", MDescLen: "", MKks: "", MRules: "", MPlant: "", MFunc: "", MU: "", MBrMiss: "", MBrK17: "", MComp: "", MEq18: "", MEq12: "", MNoCls: "" }));
                
                            If(false, ClearCollect(colFlTmp, { RowGuid: "", RowNo: 0, SpId: 0, FL: "", Description: "", KksType: "", AssignedClass: "", Status: "", FirstIssue: "", FirstWarning: "", IssueCount: 0, WarningCount: 0, Pos: 0, FlBad: false, DescBad: false, Hint: "" }));
                
                            If(false, ClearCollect(colFlTrm, { RowGuid: "", AnyTrm: false, Ue: false }));
                
                            If(false, ClearCollect(colFlDupFl, { FL: "" }));
                
                            If(false, ClearCollect(colFlDet, { Column: "", Field: "", Editable: false, List: "", MaxLen: 0, Value: "", Issue: "" }));
                
                            If(false, ClearCollect(colFlDeleted, { RowGuid: "" }));
                
                            If(false, ClearCollect(colFlTabs, { Key: "", Label: "" }));
                
                            If(false, ClearCollect(colFlSp, { RowGuid: "", ID: 0 }));
                
                            If(false, ClearCollect(colFlAdmOld, { RowGuid: "", RowNo: 0, FL: "", Description: "", KksType: "", AssignedClass: "" }));
                
                            If(false, ClearCollect(colFlSaveErrors, { Where: "", Msg: "" }));
                
                            If(false, ClearCollect(colFlLoad, { RowGuid: "", RowNo: 0, SpId: 0, FL: "", Description: "", KksType: "", AssignedClass: "", Status: "", FirstIssue: "", FirstWarning: "", IssueCount: 0, WarningCount: 0, Json: "" }));
                
                            Set(varFlMe, Lower(User().Email));
                            Set(varFlRequestGuid, "");
                            Set(varFlRequestNo, "");
                            // Kladde / Indsendt - som i FunctionalLocationRequests.Status.
                            Set(varFlStatus, "");
                            Set(varFlViewOnly, false);
                            Set(varFlBadgeOn, false);
                            Set(varFlCanEdit, false);
                            Set(varFlNextRowNo, 1);
                            // Aktiv klassefane. ALL som i renderClassTabs.
                            Set(varFlTab, "ALL");
                            // Detaljeruden: raekkens RowGuid og den klasse, den blev aabnet i.
                            Set(varFlDetailRow, "");
                            Set(varFlDetailClass, "");
                            Set(varFlShowEmpty, false);
                            // Er der aendret noget siden sidste validering? Submit kraever false (FL68).
                            Set(varFlStale, false);
                            // Kun fejl ved gem/indsend - vist under Validation-tabellen (issue #77).
                            Set(varFlInfo, "");
                            Set(varFlPayload, "");
                            Set(varFlReq, Blank());
                            Set(varFlIdx, Blank());
                            Set(varFlMe, Lower(User().Email));
                            If(
                                !IsBlank(gblFlReqId) && varFlRequestGuid <> gblFlReqId,
                                Set(varFlRequestGuid, gblFlReqId);
                                Set(varFlReq, LookUp(FunctionalLocationRequests, RequestGuid = varFlRequestGuid));
                                // Linket peger paa noget, der ikke er her (andet miljoe, slettet): sig det,
                                // og slip GUID'en - ellers oprettede naeste gem et hoved med den fremmede.
                                If(
                                    IsBlank(varFlReq),
                                    Notify("Could not find the request behind this link. Opening a new request.",
                                        NotificationType.Warning);
                                    Set(varFlRequestGuid, ""),
                                    Set(varFlRequestNo, Coalesce(varFlReq.RequestNo, ""));
                                    Set(varFlStatus, Coalesce(varFlReq.Status.Value, "Kladde"));
                                    Set(varFlCanEdit, ((Lower(Coalesce(varFlReq.RequesterEmail, "")) = varFlMe && (varFlStatus = "Kladde")) || (IsAdmin && (varFlStatus = "Kladde" || varFlStatus = "AfventerInfo"))));
                                    Set(varFlViewOnly, !(Lower(Coalesce(gblFlMode, "")) = "edit" && varFlCanEdit));
                                    Clear(colFlDeleted);
                                    Set(varFlLoadStep, "Loading functional locations");
                                    ClearCollect(
                                        colFlLoad,
                                        ForAll(
                                            Filter(FunctionalLocationItems, RequestGuid = varFlRequestGuid) As I,
                                            {
                                                RowGuid: I.RowGuid, RowNo: I.RowNo, SpId: I.ID,
                                                FL: I.FunctionalLocation, Description: I.Description,
                                                KksType: I.KksType, AssignedClass: I.AssignedClass,
                                                Status: I.RowStatus.Value, FirstIssue: I.FirstIssue,
                                                IssueCount: I.IssueCount, Json: Coalesce(I.SpoolValuesJson, "[]")
                                            }
                                        )
                                    );
                                    ClearCollect(
                                        colFlRows,
                                        ForAll(
                                            Sort(colFlLoad, RowNo) As I,
                                            {
                                                RowGuid: I.RowGuid, RowNo: I.RowNo, SpId: I.SpId, FL: I.FL,
                                                Description: I.Description, KksType: I.KksType,
                                                AssignedClass: I.AssignedClass, Status: I.Status,
                                                FirstIssue: I.FirstIssue, FirstWarning: "",
                                                IssueCount: I.IssueCount, WarningCount: 0,
                                                Pos: 0, FlBad: false, DescBad: false, Hint: ""
                                            }
                                        )
                                    );
                                    ClearCollect(
                                        colFlVals,
                                        Ungroup(
                                            ForAll(
                                                colFlLoad As I,
                                                {
                                                    Vals: ForAll(
                                                        Table(ParseJSON(I.Json)) As J,
                                                        { RowGuid: I.RowGuid, Field: Text(J.Value.field), Value: Text(J.Value.value) }
                                                    )
                                                }
                                            ),
                                            Vals
                                        )
                                    );
                                    Set(varFlNextRowNo, Max(colFlRows, RowNo) + 1);
                                    // Beskederne gemmes ikke - de regnes. OnVisible koerer valideringen lige
                                    // efter (Select(btnFlVerify)), og indtil da kan der ikke indsendes (FL68).
                                    Set(varFlStale, true);
                                    Set(varFlInfo, "")
                                );
                                // Beskederne gemmes ikke - de regnes igen, automatisk (issue #77).
                                Select(btnFlVerify)
                            )
                        )
                    );
                
                    Set(varFlMe, Lower(User().Email));
                    If(CountRows(colFlRows) = 0, Collect(colFlRows, { RowGuid: Text(GUID()), RowNo: varFlNextRowNo, SpId: 0, FL: "", Description: "", KksType: "", AssignedClass: "", Status: "draft", FirstIssue: "", FirstWarning: "", IssueCount: 0, WarningCount: 0, Pos: 0, FlBad: false, DescBad: false, Hint: "" }); Set(varFlNextRowNo, varFlNextRowNo + 1)),
                    Set(varFlLoadFailed, true);
                    Set(varFlOpened, "")
                );
                
                // Klar - ventespinneren forsvinder.
                Set(varFlBadgeOn, StartsWith(Coalesce(varFlOpened, ""), "req:") || StartsWith(Coalesce(varFlOpened, ""), "edit:") || StartsWith(Coalesce(varFlOpened, ""), "link:"));
                Set(varFlLoading, false);
                Set(varFlLoadSlow, false);
                Set(gblNavigating, false);
                Set(gblNavTo, "")
