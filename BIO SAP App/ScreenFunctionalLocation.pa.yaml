Screens:
  ScreenFunctionalLocation:
    Properties:
      Fill: |-
          =C.'bg-app'
      OnVisible: |-
          =// Klargoeringen staar paa en skjult knap, saa Retry kan koere den igen
          // (BIO SAP App/build/build_screens.py, attach_open). Sloeret taendes
          // her med det samme, naar der tydeligvis skal klargoeres.
          If(IsBlank(varFlOpened) || If(gblNavTo = "Fl", "new:0", Coalesce(gblFlWant, varFlOpened)) <> varFlOpened,
              Set(varFlLoading, true)
          );
          Select(btnFlOpen)
    Children:
      - conFlRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderStyle: |-
                =BorderStyle.None
            DropShadow: |-
                =DropShadow.None
            Fill: |-
                =C.'bg-app'
            FillPortions: |-
                =0
            Height: |-
                =Parent.Height - If(LayoutRank >= 2, 0, 52)
            LayoutAlignItems: |-
                =LayoutAlignItems.Stretch
            LayoutDirection: |-
                =LayoutDirection.Vertical
            LayoutGap: |-
                =0
            LayoutMinWidth: |-
                =0
            LayoutOverflowX: |-
                =LayoutOverflow.Hide
            LayoutOverflowY: |-
                =LayoutOverflow.Hide
            Width: |-
                =Parent.Width - If(LayoutRank >= 2, 56, 0)
            X: |-
                =If(LayoutRank >= 2, 56, 0)
            Y: |-
                =If(LayoutRank >= 2, 0, 52)
          Children:
            - conFlHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderStyle: |-
                      =BorderStyle.None
                  DropShadow: |-
                      =DropShadow.None
                  Fill: |-
                      =C.'bg-app'
                  FillPortions: |-
                      =0
                  Height: |-
                      =25 + (0 + (Max((32), (0 + If(LayoutRank >= 2, 0 + (33), 0) + If(LayoutRank >= 2, 2 + (20), 0) + If(LayoutRank >= 2, 2 + (26), 0)), (36), (36), (36), (36), (36))) * 1 + 0)
                  LayoutAlignItems: |-
                      =LayoutAlignItems.Stretch
                  LayoutDirection: |-
                      =LayoutDirection.Vertical
                  LayoutGap: |-
                      =10
                  LayoutMinWidth: |-
                      =0
                  LayoutOverflowX: |-
                      =LayoutOverflow.Hide
                  LayoutOverflowY: |-
                      =LayoutOverflow.Hide
                  PaddingBottom: |-
                      =0
                  PaddingLeft: |-
                      =24
                  PaddingRight: |-
                      =34
                  PaddingTop: |-
                      =14
                  Width: |-
                      =Parent.Width
                Children:
                  - conFlBar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderStyle: |-
                            =BorderStyle.None
                        DropShadow: |-
                            =DropShadow.None
                        FillPortions: |-
                            =0
                        Height: |-
                            =0 + (Max((32), (0 + If(LayoutRank >= 2, 0 + (33), 0) + If(LayoutRank >= 2, 2 + (20), 0) + If(LayoutRank >= 2, 2 + (26), 0)), (36), (36), (36), (36), (36))) * 1 + 0
                        LayoutAlignItems: |-
                            =LayoutAlignItems.Center
                        LayoutDirection: |-
                            =LayoutDirection.Horizontal
                        LayoutGap: |-
                            =10
                        LayoutMinWidth: |-
                            =0
                        LayoutOverflowX: |-
                            =LayoutOverflow.Hide
                        LayoutOverflowY: |-
                            =LayoutOverflow.Hide
                        Width: |-
                            =Parent.Width
                      Children:
                        - imgFlTitleIcon:
                            Control: Image
                            Properties:
                              AccessibleLabel: |-
                                  ="Functional Location"
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              BorderStyle: |-
                                  =BorderStyle.None
                              BorderThickness: |-
                                  =0
                              Height: |-
                                  =32
                              Image: |-
                                  ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='" & C.'hex-domain-fl' & "' fill-opacity='0.12'/><g transform='translate(6 6)'><svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24'><g fill='none' stroke='" & C.'hex-domain-fl' & "' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M2.5 20.5h19 M4 20.5v-8l4 2.5v-2.5l4 2.5v-2.5l4 2.5V5h3v15.5 M7 17.5h2M11 17.5h2 M16.4 3c.7-.9 1.8-.9 2.5 0'/></g></svg></g></svg>")
                              ImagePosition: |-
                                  =ImagePosition.Fit
                              LayoutMinWidth: |-
                                  =32
                              OnSelect: |-
                                  =false
                              TabIndex: |-
                                  =0
                              Visible: |-
                                  =LayoutRank >= 2
                              Width: |-
                                  =32
                        - conFlBarLeft:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: |-
                                  =BorderStyle.None
                              DropShadow: |-
                                  =DropShadow.None
                              FillPortions: |-
                                  =0
                              Height: |-
                                  =0 + If(LayoutRank >= 2, 0 + (33), 0) + If(LayoutRank >= 2, 2 + (20), 0) + If(LayoutRank >= 2, 2 + (26), 0)
                              LayoutAlignItems: |-
                                  =LayoutAlignItems.Stretch
                              LayoutDirection: |-
                                  =LayoutDirection.Vertical
                              LayoutGap: |-
                                  =2
                              LayoutMinWidth: |-
                                  =0
                              LayoutOverflowX: |-
                                  =LayoutOverflow.Hide
                              LayoutOverflowY: |-
                                  =LayoutOverflow.Hide
                              Width: |-
                                  =Max(0, (((((App.Width - If(LayoutRank >= 2, 56, 0)))) - 24 - 34)) - (If(LayoutRank >= 2, (32) + 10, 0)) - (If(varFlViewOnly && varFlCanEdit, (If(LayoutRank < 2, 40, 96)) + 10, 0)) - (If(!IfError(varFlViewOnly, true) && !IsBlank(varFlRequestGuid), (If(LayoutRank < 2, 40, 106)) + 10, 0)) - ((If(LayoutRank < 2, 40, 135)) + 10) - ((106) + 10) - ((If(LayoutRank < 2, 70, 148)) + 10) - 2)
                            Children:
                              - txtFlTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: |-
                                        ="Functional Location - Spool"
                                    BorderStyle: |-
                                        =BorderStyle.None
                                    BorderThickness: |-
                                        =0
                                    Color: |-
                                        =C.'text-primary'
                                    Fill: |-
                                        =RGBA(0, 0, 0, 0)
                                    Font: |-
                                        =Font.'Segoe UI'
                                    FontWeight: |-
                                        =FontWeight.Semibold
                                    Height: |-
                                        =33
                                    PaddingBottom: |-
                                        =0
                                    PaddingLeft: |-
                                        =0
                                    PaddingRight: |-
                                        =0
                                    PaddingTop: |-
                                        =0
                                    Size: |-
                                        =22
                                    Text: |-
                                        ="Functional Location - Spool"
                                    Visible: |-
                                        =LayoutRank >= 2
                                    Wrap: |-
                                        =false
                              - txtFlSub:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: |-
                                        =Self.Text
                                    BorderStyle: |-
                                        =BorderStyle.None
                                    BorderThickness: |-
                                        =0
                                    Color: |-
                                        =C.'text-muted'
                                    Fill: |-
                                        =RGBA(0, 0, 0, 0)
                                    Font: |-
                                        =Font.'Segoe UI'
                                    Height: |-
                                        =20
                                    PaddingBottom: |-
                                        =0
                                    PaddingLeft: |-
                                        =0
                                    PaddingRight: |-
                                        =0
                                    PaddingTop: |-
                                        =0
                                    Size: |-
                                        =13
                                    Text: |-
                                        =If(IsBlank(varFlRequestNo), "Verify KKS codes, classes and spool fields - and pass the request on.", "Request " & varFlRequestNo & If(varFlStatus = "Indsendt", " - submitted and locked.", " - draft."))
                                    Visible: |-
                                        =LayoutRank >= 2
                                    Wrap: |-
                                        =false
                              - imgFlMode:
                                  Control: Image
                                  Properties:
                                    AccessibleLabel: |-
                                        =If(IfError(varFlViewOnly, false), "View mode - fields are locked", "Edit mode")
                                    AlignInContainer: |-
                                        =AlignInContainer.Start
                                    BorderStyle: |-
                                        =BorderStyle.None
                                    BorderThickness: |-
                                        =0
                                    Height: |-
                                        =26
                                    Image: |-
                                        =If(IfError(varFlBadgeOn, false), "data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='104' height='26' viewBox='0 0 104 26'><rect width='104' height='26' rx='13' fill='" & If(IfError(varFlViewOnly, false), C.'hex-state-info-bg', C.'hex-state-neutral-bg') & "'/>" & If(IfError(varFlViewOnly, false), "<g transform='translate(8 6) scale(0.583333)' fill='none' stroke='" & If(IfError(varFlViewOnly, false), C.'hex-state-info-fg', C.'hex-state-warn-fg') & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z M12 14.8a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6Z'/></g>", "<g transform='translate(8 6) scale(0.583333)' fill='none' stroke='" & If(IfError(varFlViewOnly, false), C.'hex-state-info-fg', C.'hex-state-warn-fg') & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 20h4.5L19.3 9.2a2 2 0 0 0 0-2.8l-1.7-1.7a2 2 0 0 0-2.8 0L4 15.5V20Z M13.5 6l4.5 4.5'/></g>") & "<text x='26' y='17.5' font-family='Segoe UI, sans-serif' font-size='12' font-weight='600' fill='" & If(IfError(varFlViewOnly, false), C.'hex-state-info-fg', C.'hex-state-warn-fg') & "'>" & If(IfError(varFlViewOnly, false), "View mode", "Edit mode") & "</text></svg>"), "")
                                    ImagePosition: |-
                                        =ImagePosition.Fit
                                    LayoutMinWidth: |-
                                        =104
                                    OnSelect: |-
                                        =false
                                    TabIndex: |-
                                        =0
                                    Visible: |-
                                        =LayoutRank >= 2
                                    Width: |-
                                        =104
                        - btnFlEdit:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Edit"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-default'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'text-primary'
                              DisplayMode: |-
                                  =If(varFlCanEdit, DisplayMode.Edit, DisplayMode.Disabled)
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Edit"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 96)
                              OnSelect: |-
                                  =Set(varFlViewOnly, false)
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Edit"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Visible: |-
                                  =varFlViewOnly && varFlCanEdit
                              Width: |-
                                  =If(LayoutRank < 2, 40, 96)
                        - btnFlDeleteRequest:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Delete this request"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-error'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'state-error-fg'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Delete"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 106)
                              OnSelect: |-
                                  =Set(varFlDeleteOpen, true)
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Delete"
                              Tooltip: |-
                                  ="Delete this draft request"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Visible: |-
                                  =!IfError(varFlViewOnly, true) && !IsBlank(varFlRequestGuid)
                              Width: |-
                                  =If(LayoutRank < 2, 40, 106)
                        - btnFlSaveDraft:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Save draft"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-default'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'text-primary'
                              DisplayMode: |-
                                  =If(varFlViewOnly || varFlStatus = "Indsendt" || CountRows(Filter(colFlRows, Status <> "draft")) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Save"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 135)
                              OnSelect: |-
                                  =Set(varFlSaving, true);
                                  Clear(colFlSaveErrors);
                                  // 0. Hovedet, som det staar i SharePoint nu: grundraekken i trin 1 og
                                  //    rettigheden i selve handlingen (tools/permissions.py).
                                  Set(varFlReqNow, If(!IsBlank(varFlRequestGuid), LookUp(FunctionalLocationRequests, RequestGuid = varFlRequestGuid)));
                                  If(
                                      !IsBlank(varFlReqNow) &&
                                      !((Lower(Coalesce(varFlReqNow.RequesterEmail, "")) = varFlMe && (varFlReqNow.Status.Value = "Kladde")) || (IsAdmin && (varFlReqNow.Status.Value = "Kladde" || varFlReqNow.Status.Value = "AfventerInfo"))),
                                      Collect(colFlSaveErrors, { Where: "Request", Msg: "This request can no longer be changed." })
                                  );
                                  If(IsBlank(varFlRequestGuid), Set(varFlRequestGuid, Text(GUID())));
                                  
                                  // 1. Hovedet. RequestNo er obligatorisk (Title) - GUID'en staar der, til
                                  //    nummeret kan dannes af listens eget ID. Ejeren bevares.
                                  If(
                                      CountRows(colFlSaveErrors) = 0,
                                      IfError(
                                          Set(
                                              varFlReq,
                                              Patch(
                                                  FunctionalLocationRequests,
                                                  Coalesce(varFlReqNow, Defaults(FunctionalLocationRequests)),
                                                  {
                                                      RequestNo: Coalesce(varFlRequestNo, varFlRequestGuid),
                                                      RequestGuid: varFlRequestGuid,
                                                      RequesterEmail: Coalesce(varFlReqNow.RequesterEmail, varFlMe),
                                                      RequesterName: Coalesce(varFlReqNow.RequesterName, User().FullName)
                                                  }
                                              )
                                          );
                                          true,
                                          Collect(colFlSaveErrors, { Where: "Header", Msg: FirstError.Message });
                                          false
                                      )
                                  );
                                  If(
                                      CountRows(colFlSaveErrors) = 0 && IsBlank(varFlRequestNo) && !IsBlank(varFlReq.ID),
                                      Set(varFlRequestNo, "FL-" & Text(varFlReq.ID, "000000"));
                                      IfError(
                                          Patch(FunctionalLocationRequests, varFlReq, { RequestNo: varFlRequestNo });
                                          true,
                                          Collect(colFlSaveErrors, { Where: "Request number", Msg: FirstError.Message });
                                          false
                                      )
                                  );
                                  
                                  If(
                                      CountRows(colFlSaveErrors) = 0,
                                  
                                      // 2. Hvilke raekker findes allerede? Paa RowGuid - klientnoeglen.
                                      //    En admin i en andens anmodning henter dem ogsaa med felter, til loggen.
                                      If(
                                          (!IsBlank(varFlReqNow) && !(Lower(Coalesce(varFlReqNow.RequesterEmail, "")) = varFlMe)),
                                          ClearCollect(
                                              colFlAdmOld,
                                              ForAll(Filter(FunctionalLocationItems, RequestGuid = varFlRequestGuid) As I,
                                                  { RowGuid: I.RowGuid, RowNo: I.RowNo, FL: I.FunctionalLocation, Description: I.Description,
                                                     KksType: I.KksType, AssignedClass: I.AssignedClass })
                                          ),
                                          Clear(colFlAdmOld)
                                      );
                                      ClearCollect(
                                          colFlSp,
                                          ForAll(Filter(FunctionalLocationItems, RequestGuid = varFlRequestGuid) As I, { RowGuid: I.RowGuid, ID: I.ID })
                                      );
                                      // IfError kraever, at vaerdien og fallbacken har SAMME type. Patch af
                                      // een raekke giver en record, Collect en tabel - og compile svarer
                                      // "Invalid argument type (Table). Expecting a Record value instead"
                                      // (issue #32, tre runder). Derfor slutter BEGGE grene af hver IfError
                                      // i gemmet i en skalar: '; true' og '; false'.
                                      IfError(
                                          Collect(FunctionalLocationItems, ForAll(Filter(colFlRows, Status <> "draft" && !(RowGuid in colFlSp.RowGuid)) As R, {
                                                  RowGuid: R.RowGuid,
                                                  RequestGuid: varFlRequestGuid,
                                                  RequestId: varFlReq.ID,
                                                  RowNo: R.RowNo,
                                                  FunctionalLocation: R.FL,
                                                  Description: R.Description,
                                                  KksType: R.KksType,
                                                  AssignedClass: R.AssignedClass,
                                                  RowStatus: { Value: R.Status },
                                                  FirstIssue: Left(Coalesce(R.FirstIssue, R.FirstWarning, ""), 255),
                                                  IssueCount: R.IssueCount,
                                                  TrmAssignment: Coalesce(LookUp(colFlVals, RowGuid = R.RowGuid && Field = "TRM ASSIGNMENT").Value, ""),
                                                  AbcIndic: Coalesce(LookUp(colFlVals, RowGuid = R.RowGuid && Field = "ABC INDIC.").Value, ""),
                                                  SafetyCriticalEquipment: Coalesce(LookUp(colFlVals, RowGuid = R.RowGuid && Field = "SAFETY CRITICAL EQUIPMENT").Value, ""),
                                                  RequesterEmail: Coalesce(varFlReq.RequesterEmail, varFlMe),
                                                  SpoolValuesJson: JSON(
                                                      ForAll(Sort(Filter(colFlVals, RowGuid = R.RowGuid), Field) As V,
                                                             { field: V.Field, value: V.Value }),
                                                      JSONFormat.Compact
                                                  )
                                              }));
                                          true,
                                          Collect(colFlSaveErrors, { Where: "New rows", Msg: FirstError.Message });
                                          false
                                      );
                                      IfError(
                                          With(
                                              { ex: Filter(FunctionalLocationItems, RequestGuid = varFlRequestGuid) },
                                              Patch(FunctionalLocationItems, ForAll(Filter(colFlRows, Status <> "draft" && RowGuid in colFlSp.RowGuid) As R, LookUp(ex, RowGuid = R.RowGuid)),
                                                    ForAll(Filter(colFlRows, Status <> "draft" && RowGuid in colFlSp.RowGuid) As R, {
                                                  RowGuid: R.RowGuid,
                                                  RequestGuid: varFlRequestGuid,
                                                  RequestId: varFlReq.ID,
                                                  RowNo: R.RowNo,
                                                  FunctionalLocation: R.FL,
                                                  Description: R.Description,
                                                  KksType: R.KksType,
                                                  AssignedClass: R.AssignedClass,
                                                  RowStatus: { Value: R.Status },
                                                  FirstIssue: Left(Coalesce(R.FirstIssue, R.FirstWarning, ""), 255),
                                                  IssueCount: R.IssueCount,
                                                  TrmAssignment: Coalesce(LookUp(colFlVals, RowGuid = R.RowGuid && Field = "TRM ASSIGNMENT").Value, ""),
                                                  AbcIndic: Coalesce(LookUp(colFlVals, RowGuid = R.RowGuid && Field = "ABC INDIC.").Value, ""),
                                                  SafetyCriticalEquipment: Coalesce(LookUp(colFlVals, RowGuid = R.RowGuid && Field = "SAFETY CRITICAL EQUIPMENT").Value, ""),
                                                  RequesterEmail: Coalesce(varFlReq.RequesterEmail, varFlMe),
                                                  SpoolValuesJson: JSON(
                                                      ForAll(Sort(Filter(colFlVals, RowGuid = R.RowGuid), Field) As V,
                                                             { field: V.Field, value: V.Value }),
                                                      JSONFormat.Compact
                                                  )
                                              }))
                                          );
                                          true,
                                          Collect(colFlSaveErrors, { Where: "Rows", Msg: FirstError.Message });
                                          false
                                      );
                                  
                                      // 3. Raekker, brugeren har slettet eller toemt (REVIEW.md D24). Her
                                      //    stod: alle raekker, appen ikke kender. Saa slettede den, der
                                      //    gemte sidst, de raekker en anden havde tilfoejet imens.
                                      IfError(
                                          With(
                                              { ex: Filter(FunctionalLocationItems, RequestGuid = varFlRequestGuid) },
                                              Remove(FunctionalLocationItems, Filter(ex, RowGuid in colFlDeleted.RowGuid ||
                                                                     RowGuid in Filter(colFlRows, Status = "draft").RowGuid))
                                          );
                                          true,
                                          Collect(colFlSaveErrors, { Where: "Deleted rows", Msg: FirstError.Message });
                                          false
                                      );
                                  
                                      // 4. Landingssiden.
                                      IfError(
                                      Set(varFlIdxNow, LookUp(MD_RequestIndex, RequestGuid = varFlRequestGuid));
                                      Set(
                                          varFlIdx,
                                          Patch(
                                              MD_RequestIndex,
                                              Coalesce(varFlIdxNow, Defaults(MD_RequestIndex)),
                                              {
                                                  RequestNo: varFlRequestNo,
                                                  Domain: { Value: "FunctionalLocation" },
                                                  Status: { Value: Coalesce(varFlIdxNow.Status.Value, "Kladde") },
                                                  StatusStep: Coalesce(varFlIdxNow.StatusStep, 1),
                                                  IsOpen: true,
                                                  RequestGuid: varFlRequestGuid,
                                                  RequesterEmail: Coalesce(varFlReq.RequesterEmail, varFlMe),
                                                  RequesterName: Coalesce(varFlReq.RequesterName, User().FullName),
                                                  ShortText: "Functional Location - Spool: " & CountRows(Filter(colFlRows, Status <> "draft")) & " row(s)",
                                                  Plant: Coalesce(Left(First(Sort(Filter(colFlRows, Status <> "draft"), RowNo)).FL, 3), ""),
                                                  ItemCount: CountRows(Filter(colFlRows, Status <> "draft")),
                                                  SourceItemId: varFlReq.ID,
                                                  AppUrl: "https://apps.powerapps.com/play/e/e0f8f822-d16a-e878-ba4e-fb42bc617e47/a/17f6f493-203d-40a1-9fe4-2c99b04b85a5?domain=functionallocation&reqid=" & varFlRequestGuid,
                                                  LastActionOn: Now(),
                                                  LastActionBy: varFlMe
                                              }
                                          )
                                      );
                                          true,
                                          Collect(colFlSaveErrors, { Where: "Landing page", Msg: FirstError.Message });
                                          false
                                      );
                                  
                                      // 5. Status SIDST - og kun naar alt andet lykkedes.
                                      If(
                                          CountRows(colFlSaveErrors) = 0,
                                          IfError(
                                              Patch(
                                                  FunctionalLocationRequests, varFlReq,
                                                  {
                                                      Status: { Value: Coalesce(varFlReqNow.Status.Value, "Kladde") },
                                                      RowCount: CountRows(Filter(colFlRows, Status <> "draft")),
                                                      ReadyCount: CountRows(Filter(colFlRows, Status = "valid" || Status = "warning")),
                                                      IssueCount: CountRows(Filter(colFlRows, Status = "invalid")),
                                                      WarningCount: CountRows(Filter(colFlRows, Status = "warning")),
                                                      IndexItemId: varFlIdx.ID
                                                  }
                                              );
                                              true,
                                              Collect(colFlSaveErrors, { Where: "Status", Msg: FirstError.Message });
                                              false
                                          )
                                      )
                                  );
                                  
                                  // Een samlet tilbagemelding - aldrig een Notify pr. raekke.
                                  If(
                                      CountRows(colFlSaveErrors) = 0,
                                      Set(varFlStatus, Coalesce(varFlReqNow.Status.Value, "Kladde"));
                                      If(
