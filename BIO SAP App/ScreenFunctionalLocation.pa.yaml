                                                      If(IsBlank(n), "Row " & O.RowNo & ": removed",
                                                      Concat(
                                                          Filter(
                                                              Table(
                                                              { f: "Functional location", a: Text(O.FL), b: Text(n.FL) },
                                                              { f: "Description", a: Text(O.Description), b: Text(n.Description) },
                                                              { f: "KKS type", a: Text(O.KksType), b: Text(n.KksType) },
                                                              { f: "Class", a: Text(O.AssignedClass), b: Text(n.AssignedClass) }
                                                              ),
                                                              Coalesce(a, "") <> Coalesce(b, "")
                                                          ),
                                                          "Row " & O.RowNo & " " & f & ": " & Coalesce(a, "(blank)") & " → " & Coalesce(b, "(blank)"),
                                                          "; "
