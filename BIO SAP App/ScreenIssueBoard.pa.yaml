                                        =Set(varIbBusy, true);
                                        Set(varIbRes, IfError('BioSap-IssueBoard-Submit'.Run(
                                            "reopen",
                                            JSON({ ticketId: varIbSelId, reason: "" })
                                        ), { ok: "no", message: FirstError.Message, ticketno: "", ticketid: "" }));
                                        If(
                                            varIbRes.ok = "yes",
                                            With(
                                                { r: LookUp(IB_Tickets, ID = varIbSelId) },
                                                If(
                                                    IsBlank(r),
                                                    RemoveIf(colIbAll, Id = varIbSelId);
                                                    Set(varIbDetailOn, false),
                                                    Set(varIbSel, { Id: r.ID, TicketNo: If(IsBlank(r.TicketNo), "ISS-" & Text(r.ID, "000000"), r.TicketNo), Title: Coalesce(r.Title, ""), Description: Coalesce(r.Description, ""), Steps: Coalesce(r.ReproSteps, ""), Expected: Coalesce(r.ExpectedResult, ""), Actual: Coalesce(r.ActualResult, ""), Application: Coalesce(r.Application, ""), Section: Coalesce(r.Section, ""), Other: Coalesce(r.OtherContext, ""), RelatedNo: Coalesce(r.RelatedRequestNo, ""), Severity: Coalesce(r.Severity.Value, ""), Priority: Coalesce(r.Priority.Value, ""), Status: Coalesce(r.Status.Value, "New"), Resolution: Coalesce(r.Resolution, ""), Assigned: Coalesce(r.AssignedToName, ""), CreatedOn: r.Created, UpdatedOn: Coalesce(r.LastActivityOn, r.Created), Archived: Coalesce(r.IsArchived, false), Reporter: Lower(Coalesce(r.ReporterEmail, "")), ReporterName: Coalesce(r.ReporterName, ""), AssignedEmail: Lower(Coalesce(r.AssignedToEmail, "")), PriRank: Switch(r.Priority.Value, "Urgent", 1, "High", 2, "Normal", 3, "Low", 4, 5), StatusRank: Switch(r.Status.Value, "New", 1, "Reopened", 2, "Triaged", 3, "In progress", 4, "Ready for retest", 5, "Closed", 6, 9) });
                                                    Set(varIbSelFullFor, varIbSelId);
                                                    If(varIbTab = "files",
                                                        Set(varIbFilesBusy, true);
                                                        Set(varIbFilesFailed, IfError(Set(varIbFiles, LookUp(IB_Tickets, ID = varIbSelId).Attachments); false, true));
                                                        Set(varIbFilesFor, varIbSelId);
                                                        Set(varIbFilesBusy, false)
                                                    , Set(varIbFilesFor, -1));
                                                    UpdateIf(colIbAll, Id = varIbSelId, varIbSel)
                                                )
                                            );
                                            Set(varIbActBusy, true);
                                            Set(varIbActFailed, IfError(ClearCollect(
                                                colIbActFresh,
                                                { Kind: "Reported", Actor: If(varIbSel.Reporter = varIbMe, "You", Upper(First(Split(varIbSel.Reporter, "@")).Value)), Role: "User", Body: "Reported the issue.", At: varIbSel.CreatedOn, Internal: false, IsSystem: true, File: "", SizeKb: 0, Initial: false },
                                                ForAll(Sort(Filter(IB_TicketComments, TicketId = varIbSelId), ID, SortOrder.Ascending) As r,
                                                    With({ k: Coalesce(r.EventType.Value, "Comment"), who: Lower(Coalesce(r.AuthorEmail, "")), role: Coalesce(r.AuthorRole.Value, ""), atSub: Coalesce(r.AtSubmission, false) },
                                                        { Kind: k,
                                                          Actor: If(role = "System", "Issue Board", who = varIbMe, "You", Upper(First(Split(who, "@")).Value)),
                                                          Role: Switch(role, "Admin", "Admin", "System", "System", "User"),
                                                          Body: If(k in ["StatusChange", "Closed", "Reopened"] && !IsBlank(r.NewStatus), "Status changed from " & Coalesce(r.PreviousStatus, "-") & " to " & r.NewStatus & If(IsBlank(r.Content), ".", ". " & r.Content),
                                                                k = "Attachment", If(atSub, "Attached ", "Added ") & Coalesce(r.FileName, "a file") & If(IsBlank(r.FileSizeKb), "", " (" & r.FileSizeKb & " KB)") & If(atSub, " with the report.", "."),
                                                                Coalesce(r.Content, "")),
                                                          At: Coalesce(r.EventOn, r.Created),
                                                          Internal: r.Visibility.Value = "Internal",
                                                          IsSystem: k <> "Comment",
                                                          File: Coalesce(r.FileName, ""),
                                                          SizeKb: Coalesce(r.FileSizeKb, 0),
                                                          Initial: atSub })))
                                            ; false, true));
                                            If(!varIbActFailed, ClearCollect(colIbActivity, colIbActFresh); Clear(colIbActFresh));
                                            Set(varIbActBusy, false);
                                            Set(varIbState, "open");
                                            Notify("The issue has been reopened. An administrator will look at it again.", NotificationType.Success),
                                            Notify("The issue could not be reopened. " & varIbRes.message, NotificationType.Error)
                                        );
                                        Set(varIbBusy, false)
