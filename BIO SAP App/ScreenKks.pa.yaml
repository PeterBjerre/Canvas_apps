          If(false, ClearCollect(colKksComponent, { L1: "", Code: "", Description: "", P2: "", P3: "" }));
          If(false, ClearCollect(colKksAggregateRaw, { Code: "", Description: "" }));
          If(false, ClearCollect(colKksComponentRaw, { Code: "", Description: "" }));
          If(false, ClearCollect(colKksFnAll, { Ord: 0, Section: "", Code: "", Description: "" }));
          If(false, ClearCollect(colKksFn1, { Ord: 0, Section: "", Code: "", Description: "" }));
          If(false, ClearCollect(colKksFn2, { Ord: 0, Section: "", Code: "", Description: "" }));
          If(false, ClearCollect(colKksFn3, { Ord: 0, Section: "", Code: "", Description: "" }));
          If(false, ClearCollect(colKksFn4, { Ord: 0, Section: "", Code: "", Description: "" }));
          If(false, ClearCollect(colKksFn5, { Ord: 0, Section: "", Code: "", Description: "" }));
          If(false, ClearCollect(colKksFn6, { Ord: 0, Section: "", Code: "", Description: "" }));
          If(false, ClearCollect(colKksFn7, { Ord: 0, Section: "", Code: "", Description: "" }));
          
          If(
              IsBlank(varKksKey),
              Set(varKksKey, "function");
              Set(varKksL1, "ALL");
              Set(varKksL2, "");
              Set(varKksL3, "");
              Set(varKksQuery, "");
              Set(varKksTyped, "");
              Set(varKksPending, "");
              Set(varKksDetailCode, "");
              Set(varKksDetailText, "");
              Set(varKksDetailOn, false);
              Set(varKksPick, 0);
              Set(varKksBusy, false)
          );
          // Noeglerne hentes EEN gang - se KKS App/build/kks_parts.py, load_fx().
          If(
              !varKksLoaded,
              Set(varKksLoading, true);
              Concurrent(
                  ClearCollect(colKksFn1, ForAll(Filter(MD_KksFunctionKey, SortNo >= 1 && SortNo <= 500) As r,
                      { Ord: r.SortNo, Section: r.Section, Code: r.Code, Description: r.Description })),
                  ClearCollect(colKksFn2, ForAll(Filter(MD_KksFunctionKey, SortNo >= 501 && SortNo <= 1000) As r,
                      { Ord: r.SortNo, Section: r.Section, Code: r.Code, Description: r.Description })),
                  ClearCollect(colKksFn3, ForAll(Filter(MD_KksFunctionKey, SortNo >= 1001 && SortNo <= 1500) As r,
                      { Ord: r.SortNo, Section: r.Section, Code: r.Code, Description: r.Description })),
                  ClearCollect(colKksFn4, ForAll(Filter(MD_KksFunctionKey, SortNo >= 1501 && SortNo <= 2000) As r,
                      { Ord: r.SortNo, Section: r.Section, Code: r.Code, Description: r.Description })),
                  ClearCollect(colKksFn5, ForAll(Filter(MD_KksFunctionKey, SortNo >= 2001 && SortNo <= 2500) As r,
                      { Ord: r.SortNo, Section: r.Section, Code: r.Code, Description: r.Description })),
                  ClearCollect(colKksFn6, ForAll(Filter(MD_KksFunctionKey, SortNo >= 2501 && SortNo <= 3000) As r,
                      { Ord: r.SortNo, Section: r.Section, Code: r.Code, Description: r.Description })),
                  ClearCollect(colKksFn7, ForAll(Filter(MD_KksFunctionKey, SortNo >= 3001) As r,
                      { Ord: r.SortNo, Section: r.Section, Code: r.Code, Description: r.Description })),
                  ClearCollect(colKksAggregateRaw, ForAll(Filter(MD_FLKey, KeyType = "Aggregate") As r,
                      { Code: r.KeyValue, Description: r.Description })),
                  ClearCollect(colKksComponentRaw, ForAll(Filter(MD_FLKey, KeyType = "Component") As r,
                      { Code: r.KeyValue, Description: r.Description }))
              );
              ClearCollect(colKksFnAll, colKksFn1, colKksFn2, colKksFn3, colKksFn4, colKksFn5, colKksFn6, colKksFn7);
              ClearCollect(
                  colKksFunction,
                  ForAll(Sort(colKksFnAll, Ord) As r,
                      { L1: r.Section, Code: r.Code, Description: r.Description,
                        P2: If(r.Section = "HOME" || Len(r.Code) < 2, "", Left(r.Code, 2)),
                        P3: If(r.Section = "HOME" || Len(r.Code) < 3, "", Left(r.Code, 3)) })
              );
              ClearCollect(
                  colKksAggregate,
                  SortByColumns(
                      ForAll(Filter(colKksAggregateRaw, !IsBlank(Description)) As r,
                          { L1: Left(r.Code, 1), Code: r.Code, Description: r.Description, P2: r.Code, P3: "" }),
                      "L1", SortOrder.Ascending, "Code", SortOrder.Ascending
                  )
              );
              ClearCollect(
                  colKksComponent,
                  SortByColumns(
                      ForAll(Filter(colKksComponentRaw, !IsBlank(Description)) As r,
                          { L1: If(StartsWith(r.Code, "-"), Mid(r.Code, 2, 1), Left(r.Code, 1)), Code: r.Code, Description: r.Description, P2: r.Code, P3: "" }),
                      "L1", SortOrder.Ascending, "Code", SortOrder.Ascending
                  )
              );
              Set(varKksLoaded, !IsEmpty(colKksFunction));
              Set(varKksLoading, false);
              Set(varKksTried, true)
          )
