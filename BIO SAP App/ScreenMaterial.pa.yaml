                                    RemoveIf(colMatAttachments, RowId = varMatDeleteId);
                                    If(varMatDetailsId = varMatDeleteId, Set(varMatDetailsId, Blank()));
                                    If(varMatDocsId = varMatDeleteId, Set(varMatDocsId, Blank()));
                                    If(varMatActiveRowId = varMatDeleteId,
                                        Set(varMatActiveRowId, Blank());
                                        Set(varMatRowStatus, "valid");
                                        Set(varMatValidated, false);
                                        Set(varMatFText, "");
                                        Set(varMatFPlant, "");
                                        Set(varMatFFunctionalLocation, "");
                                        Set(varMatFNoBomItem, false);
                                        Set(varMatFManufacturer, "");
                                        Set(varMatFModelNumber, "");
                                        Set(varMatFManufacturerPartNo, "");
                                        Set(varMatFSupplier, "");
                                        Set(varMatFSupplierPartNo, "");
                                        Set(varMatFDeliveringTime, Blank());
                                        Set(varMatFPrice, Blank());
                                        Set(varMatFPriceUnit, "");
                                        Set(varMatFStockUnit, "");
                                        Set(varMatFRecommendedStock, Blank());
                                        Set(varMatFStrategicPart, "");
                                        Set(varMatFWearPart, "");
                                        Set(varMatFLongText, "");
                                        Set(varMatFlQuery, ""); Set(varMatFlLast, ""); Set(varMatFlMsg, ""); Clear(colMatFl); Reset(cmbMatFl);
                                        Set(varMatInfo, "New row - fill in and save.")
                                    );
                                    ClearCollect(
                                        colMatRows,
                                        ForAll(
                                            SortByColumns(Filter(MaterialItems, RequesterEmail = varMatMe), "Created", SortOrder.Descending) As R,
                                            {
                                                RowId: R.ID,
                                                ItemKey: Coalesce(R.ItemKey, ""),
                                                RequestNo: Coalesce(R.RequestNo, ""),
                                                Status: Coalesce(R.RowStatus.Value, "valid"),
                                                FileCount: Coalesce(R.FileCount, 0),
                                                MaterialDescription: Coalesce(R.MaterialDescription, ""),
                                                Plant: Coalesce(R.Plant, ""),
                                                FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                NoBomItem: Coalesce(R.NoBomItem, false),
                                                Manufacturer: Coalesce(R.Manufacturer, ""),
                                                ModelNumber: Coalesce(R.ModelNumber, ""),
                                                ManufacturerPartNo: Coalesce(R.ManufacturerPartNo, ""),
                                                Supplier: Coalesce(R.Supplier, ""),
                                                SupplierPartNo: Coalesce(R.SupplierPartNo, ""),
                                                DeliveringTime: R.DeliveringTime,
                                                Price: R.Price,
                                                PriceUnit: Coalesce(R.PriceUnit, ""),
                                                StockUnit: Coalesce(R.StockUnit, ""),
                                                RecommendedStock: R.RecommendedStock,
                                                StrategicPart: Coalesce(R.StrategicPart, ""),
                                                WearPart: Coalesce(R.WearPart, ""),
                                                LongText: Coalesce(R.LongText, "")
                                            }
                                        )
                                    );
                                    Set(varMatInfo, "Row deleted. The documents remain in the library.");
                                    Notify("Row deleted. The documents remain in the library.", NotificationType.Success)
                                )
                            );
                            Set(varMatDeleteId, Blank());
                            Set(varMatSaving, false)
