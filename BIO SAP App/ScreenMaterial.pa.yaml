Screens:
  ScreenMaterial:
    Properties:
      Fill: |-
          =C.'bg-app'
      OnVisible: |-
          =// DEN SAMLEDE APP: klargoer skaermen, naar hubben eller et dyblink
          // beder om noget andet end det, den viser. Se BIO SAP App/build/
          // build_screens.py, open_block().
          With(
              { wantKey: Coalesce(
                  gblMatWant,
                  If(Lower(Param("domain")) = "material", "link:" & Param("reqid")),
                  "new"
              ) },
              If(
                  wantKey <> Coalesce(varMatOpened, ""),
                  Set(varMatLoading, true);
                  Set(varMatOpened, wantKey);
                  Set(
                      gblMatReqId,
                      If(StartsWith(wantKey, "req:"), Mid(wantKey, 5),
                         StartsWith(wantKey, "link:"), Mid(wantKey, 6), "")
                  );
                  ClearCollect(colMatRows, { RowId: 0, ItemKey: "", RequestNo: "", Status: "", FileCount: 0, MaterialDescription: "", Plant: "", FunctionalLocation: "", NoBomItem: false, Manufacturer: "", ModelNumber: "", ManufacturerPartNo: "", Supplier: "", SupplierPartNo: "", DeliveringTime: 0, Price: 0, PriceUnit: "", StockUnit: "", RecommendedStock: 0, StrategicPart: "", WearPart: "", LongText: "" });
                  Clear(colMatRows);
          
                  ClearCollect(colMatAttachments, { RowId: 0, FileName: "", FileUrl: "", Identifier: "", Selected: false });
                  Clear(colMatAttachments);
          
                  ClearCollect(colMatAttUp, { Name: "", Ok: false });
                  Clear(colMatAttUp);
          
                  ClearCollect(colMatFl, { Code: "", Description: "", Display: "", Maintainable: false, Level: "" });
                  Clear(colMatFl);
          
                  Set(varMatMe, Lower(User().Email));
                  Set(varMatRequestNo, "");
                  Set(varMatRequestGuid, "");
                  Set(varMatActiveRowId, Blank());
                  // Hvilken raekke detaljeruden viser. Blank = ruden er skjult.
                  Set(varMatDetailsId, Blank());
                  // Sletning sker bag en bekraeftelse: hvilken raekke, og om den er aaben.
                  Set(varMatDeleteId, Blank());
                  Set(varMatConfirmDelete, false);
                  // Hvilken raekke dokumentpopuppen viser. Blank = lukket.
                  Set(varMatDocsId, Blank());
                  Set(varMatRowStatus, "valid");
                  Set(varMatAttJson, "");
                  Set(varMatFlMsg, "");
                  // FL-vaelgeren (tools/fl_picker.py): soegeteksten, den sidste soegning,
                  // og om flowet koerer.
                  Set(varMatFlQuery, "");
                  Set(varMatFlLast, "");
                  Set(varMatFlBusy, false);
                  Set(varMatInfo, "");
                  // Listen: false = Compact, true = All columns (issue #67/#68).
                  Set(varMatAllCols, false);
          
                  // Er formularen blevet tjekket? Styrer om en kraevet feltkant maa vaere
                  // roed. false ved opstart: en tom formular, ingen har roert, skal ikke
                  // staa og lyse roedt. Saettes af Gem/Indsend - se domain_parts.REQUIRED.
                  Set(varMatValidated, false);
                  Set(varMatActiveRowId, Blank());
                  Set(varMatRowStatus, "valid");
                  Set(varMatValidated, false);
                  Set(varMatFText, "");
                  Set(varMatFPlant, "");
                  Set(varMatFFunctionalLocation, "");
                  Set(varMatFNoBomItem, false);
                  Set(varMatFManufacturer, "");
                  Set(varMatFModelNumber, "");
                  Set(varMatFManufacturerPartNo, "");
                  Set(varMatFSupplier, "");
                  Set(varMatFSupplierPartNo, "");
                  Set(varMatFDeliveringTime, Blank());
                  Set(varMatFPrice, Blank());
                  Set(varMatFPriceUnit, "");
                  Set(varMatFStockUnit, "");
                  Set(varMatFRecommendedStock, Blank());
                  Set(varMatFStrategicPart, "");
                  Set(varMatFWearPart, "");
                  Set(varMatFLongText, "");
                  Set(varMatFlQuery, ""); Set(varMatFlLast, ""); Set(varMatFlMsg, ""); Clear(colMatFl); Reset(cmbMatFl);
                  Set(varMatInfo, "New row - fill in and save.");
                  If(
                      !IsBlank(gblMatReqId) && varMatRequestGuid <> gblMatReqId,
                      Set(varMatRequestGuid, gblMatReqId);
                      Set(varMatIdx, LookUp(MD_RequestIndex, RequestGuid = varMatRequestGuid));
                      If(
                          IsBlank(varMatIdx),
                          Notify("Could not find the request behind this link. Rows you save start a new request.",
                              NotificationType.Warning);
                          Set(varMatRequestGuid, ""); Set(varMatRequestNo, ""),
                          varMatIdx.Status.Value = "Indsendt",
                          Notify("Request " & varMatIdx.RequestNo & " is already submitted. Rows you save start a new request.",
                              NotificationType.Information);
                          Set(varMatRequestGuid, ""); Set(varMatRequestNo, ""),
                          Set(varMatRequestNo, varMatIdx.RequestNo)
                      )
                  )
              )
          );
          
          Set(varMatMe, Lower(User().Email));
          ClearCollect(
              colMatRows,
              ForAll(
                  SortByColumns(Filter(MaterialItems, RequesterEmail = varMatMe), "Created", SortOrder.Descending) As R,
                  {
                      RowId: R.ID,
                      ItemKey: Coalesce(R.ItemKey, ""),
                      RequestNo: Coalesce(R.RequestNo, ""),
                      Status: Coalesce(R.RowStatus.Value, "valid"),
                      FileCount: Coalesce(R.FileCount, 0),
                      MaterialDescription: Coalesce(R.MaterialDescription, ""),
                      Plant: Coalesce(R.Plant, ""),
                      FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                      NoBomItem: Coalesce(R.NoBomItem, false),
                      Manufacturer: Coalesce(R.Manufacturer, ""),
                      ModelNumber: Coalesce(R.ModelNumber, ""),
                      ManufacturerPartNo: Coalesce(R.ManufacturerPartNo, ""),
                      Supplier: Coalesce(R.Supplier, ""),
                      SupplierPartNo: Coalesce(R.SupplierPartNo, ""),
                      DeliveringTime: R.DeliveringTime,
                      Price: R.Price,
                      PriceUnit: Coalesce(R.PriceUnit, ""),
                      StockUnit: Coalesce(R.StockUnit, ""),
                      RecommendedStock: R.RecommendedStock,
                      StrategicPart: Coalesce(R.StrategicPart, ""),
                      WearPart: Coalesce(R.WearPart, ""),
                      LongText: Coalesce(R.LongText, "")
                  }
              )
          );
          
          // Klar - ventespinneren forsvinder.
          Set(varMatLoading, false)
