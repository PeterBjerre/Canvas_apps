                                                            LastActionOn: Now(),
                                                            LastActionBy: varMatMe
                                                        }
                                                    )
                                                );
                                        
                                                // Foerste gang bliver indeksraekkens eget ID til nummeret
                                                If(
                                                    IsBlank(varMatRequestNo),
                                                    Set(varMatRequestNo, "MAT-" & Text(varMatIdx.ID, "000000"));
                                                    Patch(MD_RequestIndex, varMatIdx, { RequestNo: varMatRequestNo })
                                                );
                                        
                                                Patch(
                                                    MaterialItems,
                                                    ForAll(Filter(colMatRows, Status = "valid") As X, { ID: X.RowId }),
                                                    ForAll(
                                                        Filter(colMatRows, Status = "valid"),
                                                        {
                                                            RequestNo: varMatRequestNo,
                                                            RequestGuid: varMatRequestGuid,
                                                            RowStatus: { Value: "submitted" },
                                                            SubmittedOn: Now()
                                                        }
                                                    )
                                                );
                                        
                                                ClearCollect(
                                                    colMatRows,
                                                    ForAll(
                                                        Filter(MaterialItems, RequesterEmail = varMatMe) As R,
                                                        {
                                                            RowId: R.ID,
                                                            ItemKey: Coalesce(R.ItemKey, ""),
                                                            RequestNo: Coalesce(R.RequestNo, ""),
                                                            Status: Coalesce(R.RowStatus.Value, "valid"),
                                                            FileCount: Coalesce(R.FileCount, 0),
                                                            MaterialDescription: Coalesce(R.MaterialDescription, ""),
                                                            Plant: Coalesce(R.Plant, ""),
                                                            FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                            Manufacturer: Coalesce(R.Manufacturer, ""),
                                                            ModelNumber: Coalesce(R.ModelNumber, ""),
                                                            ManufacturerPartNo: Coalesce(R.ManufacturerPartNo, ""),
                                                            Supplier: Coalesce(R.Supplier, ""),
                                                            SupplierPartNo: Coalesce(R.SupplierPartNo, ""),
                                                            DeliveringTime: R.DeliveringTime,
                                                            Price: R.Price,
                                                            PriceUnit: Coalesce(R.PriceUnit, ""),
                                                            StockUnit: Coalesce(R.StockUnit, ""),
                                                            RecommendedStock: R.RecommendedStock,
                                                            StrategicPart: Coalesce(R.StrategicPart, ""),
                                                            WearPart: Coalesce(R.WearPart, ""),
                                                            LongText: Coalesce(R.LongText, "")
                                                        }
                                                    )
                                                );
                                        
                                                Set(varMatInfo, "Submitted: " & varMatRequestNo);
                                                Notify("Submitted as " & varMatRequestNo & " - see it on the landing page.", NotificationType.Success),
                                        
                                                Set(varMatInfo, "It failed: " & FirstError.Message);
