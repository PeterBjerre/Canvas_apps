                  - btnMatSubmitConfirm:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: |-
                            ="Submit"
                        Align: |-
                            =Align.Center
                        AlignInContainer: |-
                            =AlignInContainer.Center
                        BasePaletteColor: |-
                            =C.'color-brand-primary'
                        Color: |-
                            =C.'text-on-primary'
                        Font: |-
                            =Font.'Segoe UI'
                        FontWeight: |-
                            =FontWeight.Semibold
                        Height: |-
                            =36
                        Icon: |-
                            ="Send"
                        Layout: |-
                            =ButtonLayout.IconBefore
                        OnSelect: |-
                            =Set(varMatConfirmSubmit, false);
                            Set(varMatSaving, true);
                            If(
                                CountRows(Filter(colMatRows, Status = "valid")) = 0,
                                Notify("There are no completed rows to submit.", NotificationType.Warning),
                            
                                IfError(
                                    If(
                                        IsBlank(varMatRequestGuid),
                                        Set(varMatRequestGuid, Text(GUID()))
                                    );
                                    Set(
                                        varMatIdx,
                                        Patch(
                                            MD_RequestIndex,
                                            Coalesce(
                                                LookUp(MD_RequestIndex, RequestGuid = varMatRequestGuid),
                                                Defaults(MD_RequestIndex)
                                            ),
                                            {
                                                RequestNo: Coalesce(varMatRequestNo, varMatRequestGuid),
                                                Domain: { Value: "Material" },
                                                Status: { Value: "Indsendt" },
                                                StatusStep: 2,
                                                IsOpen: true,
                                                RequestGuid: varMatRequestGuid,
                                                RequesterEmail: varMatMe,
                                                RequesterName: User().FullName,
                                                ShortText: "Materials: " & CountRows(Filter(colMatRows, Status = "valid")) & " row(s)",
                                                Plant: First(Filter(colMatRows, Status = "valid")).Plant,
                                                ItemCount: CountRows(Filter(colMatRows, Status = "valid")),
                                                AppUrl: "https://apps.powerapps.com/play/e/e0f8f822-d16a-e878-ba4e-fb42bc617e47/a/d7762919-c716-4bd0-9abd-24bab436221f?reqid=" & varMatRequestGuid,
                                                LastActionOn: Now(),
                                                LastActionBy: varMatMe
                                            }
                                        )
                                    );
                            
                                    // Foerste gang bliver indeksraekkens eget ID til nummeret
                                    If(
                                        IsBlank(varMatRequestNo),
                                        Set(varMatRequestNo, "MAT-" & Text(varMatIdx.ID, "000000"));
                                        Patch(MD_RequestIndex, varMatIdx, { RequestNo: varMatRequestNo })
                                    );
                            
                                    Patch(
                                        MaterialItems,
                                        ForAll(Filter(colMatRows, Status = "valid") As X, { ID: X.RowId }),
                                        ForAll(
                                            Filter(colMatRows, Status = "valid"),
                                            {
                                                RequestNo: varMatRequestNo,
                                                RequestGuid: varMatRequestGuid,
                                                RowStatus: { Value: "submitted" },
                                                SubmittedOn: Now()
                                            }
                                        )
                                    );
                            
                                    ClearCollect(
                                        colMatRows,
                                        ForAll(
                                            SortByColumns(Filter(MaterialItems, RequesterEmail = varMatMe), "Created", SortOrder.Descending) As R,
                                            {
                                                RowId: R.ID,
                                                ItemKey: Coalesce(R.ItemKey, ""),
                                                RequestNo: Coalesce(R.RequestNo, ""),
                                                Status: Coalesce(R.RowStatus.Value, "valid"),
                                                FileCount: Coalesce(R.FileCount, 0),
                                                MaterialDescription: Coalesce(R.MaterialDescription, ""),
                                                Plant: Coalesce(R.Plant, ""),
                                                FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                NoBomItem: Coalesce(R.NoBomItem, false),
                                                Manufacturer: Coalesce(R.Manufacturer, ""),
                                                ModelNumber: Coalesce(R.ModelNumber, ""),
                                                ManufacturerPartNo: Coalesce(R.ManufacturerPartNo, ""),
                                                Supplier: Coalesce(R.Supplier, ""),
                                                SupplierPartNo: Coalesce(R.SupplierPartNo, ""),
                                                DeliveringTime: R.DeliveringTime,
                                                Price: R.Price,
                                                PriceUnit: Coalesce(R.PriceUnit, ""),
                                                StockUnit: Coalesce(R.StockUnit, ""),
                                                RecommendedStock: R.RecommendedStock,
                                                StrategicPart: Coalesce(R.StrategicPart, ""),
                                                WearPart: Coalesce(R.WearPart, ""),
                                                LongText: Coalesce(R.LongText, "")
                                            }
                                        )
                                    );
                            
                                    Set(varMatInfo, "Submitted: " & varMatRequestNo);
                                    Notify("Submitted as " & varMatRequestNo & " - see it on the landing page.", NotificationType.Success);
                                    Set(varMatRequestGuid, "");
                                    Set(varMatRequestNo, ""),
                            
                                    Set(varMatInfo, "Submit failed: " & FirstError.Message);
                                    Notify("Submit failed: " & FirstError.Message, NotificationType.Error)
                                )
                            );
                            Set(varMatSaving, false)
