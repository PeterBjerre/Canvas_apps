                                    ImagePosition: |-
                                        =ImagePosition.Fit
                                    LayoutMinWidth: |-
                                        =104
                                    OnSelect: |-
                                        =false
                                    TabIndex: |-
                                        =0
                                    Visible: |-
                                        =LayoutRank >= 2
                                    Width: |-
                                        =104
                        - btnMatEditRequest:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Edit this material request"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-default'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'text-primary'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Edit"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 96)
                              OnSelect: |-
                                  =Set(varMatViewOnly, false)
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Edit"
                              Tooltip: |-
                                  ="Edit this material request"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Visible: |-
                                  =IfError(varMatViewOnly && varMatCanEdit, false)
                              Width: |-
                                  =If(LayoutRank < 2, 40, 96)
                        - btnMatDeleteRequest:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Delete this material request"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-error'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'state-error-fg'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Delete"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 106)
                              OnSelect: |-
                                  =Set(varMatDeleteOpen, true)
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Delete"
                              Tooltip: |-
                                  ="Delete this draft material request"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Visible: |-
                                  =!IfError(varMatViewOnly, true) && !IsBlank(varMatRequestGuid)
                              Width: |-
                                  =If(LayoutRank < 2, 40, 106)
                        - btnMatSendDraft:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Save draft"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-default'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'text-primary'
                              DisplayMode: |-
                                  =If(varMatViewOnly || CountRows(Filter(colMatRows, Status <> "submitted")) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Icon: |-
                                  ="Save"
                              Layout: |-
                                  =If(LayoutRank < 2, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                              LayoutMinWidth: |-
                                  =If(LayoutRank < 2, 40, 135)
                              OnSelect: |-
                                  =Set(varMatSaving, true);
                                  If(
                                      CountRows(Filter(colMatRows, Status <> "submitted")) = 0,
                                      Notify("There are no rows to save.", NotificationType.Warning),
                                  
                                      Set(
                                          varMatIdx,
                                          If(!IsBlank(varMatRequestGuid), LookUp(MD_RequestIndex, RequestGuid = varMatRequestGuid))
                                      );
                                      If(
                                          !IsBlank(varMatIdx) &&
                                          !((Lower(Coalesce(varMatIdx.RequesterEmail, "")) = varMatMe && (varMatIdx.Status.Value = "Kladde")) || (IsAdmin && (varMatIdx.Status.Value = "Kladde" || varMatIdx.Status.Value = "AfventerInfo"))),
                                          Notify("This request can no longer be changed.", NotificationType.Warning),
                                  
                                      IfError(
                                          If(
                                              IsBlank(varMatRequestGuid),
                                              Set(varMatRequestGuid, Text(GUID()))
                                          );
                                          Set(varMatAdmFrom, Coalesce(varMatIdx.Status.Value, ""));
                                          Set(
                                              varMatIdx,
                                              Patch(
                                                  MD_RequestIndex,
                                                  Coalesce(varMatIdx, Defaults(MD_RequestIndex)),
                                                  {
                                                      RequestNo: Coalesce(varMatRequestNo, varMatRequestGuid),
                                                      Domain: { Value: "Material" },
                                                      Status: { Value: Coalesce(varMatIdx.Status.Value, "Kladde") },
                                                      StatusStep: Coalesce(varMatIdx.StatusStep, 1),
                                                      IsOpen: true,
                                                      RequestGuid: varMatRequestGuid,
                                                      RequesterEmail: Coalesce(varMatIdx.RequesterEmail, varMatMe),
                                                      RequesterName: Coalesce(varMatIdx.RequesterName, User().FullName),
                                                      ShortText: "Materials: " & CountRows(Filter(colMatRows, Status <> "submitted")) & " row(s)",
                                                      Plant: First(Filter(colMatRows, Status <> "submitted")).Plant,
                                                      ItemCount: CountRows(Filter(colMatRows, Status <> "submitted")),
                                                      AppUrl: "https://apps.powerapps.com/play/e/e0f8f822-d16a-e878-ba4e-fb42bc617e47/a/17f6f493-203d-40a1-9fe4-2c99b04b85a5?domain=material&reqid=" & varMatRequestGuid,
                                                      LastActionOn: Now(),
                                                      LastActionBy: varMatMe
                                                  }
                                              )
                                          );
                                  
                                          // Foerste gang bliver indeksraekkens eget ID til nummeret
                                          If(
                                              IsBlank(varMatRequestNo),
                                              Set(varMatRequestNo, "MAT-" & Text(varMatIdx.ID, "000000"));
                                              Patch(MD_RequestIndex, varMatIdx, { RequestNo: varMatRequestNo })
                                          );
                                  
                                          Patch(
                                              MaterialItems,
                                              ForAll(Filter(colMatRows, Status <> "submitted") As X, { ID: X.RowId }),
                                              ForAll(
                                                  Filter(colMatRows, Status <> "submitted"),
                                                  {
                                                      RequestNo: varMatRequestNo,
                                                      RequestGuid: varMatRequestGuid
                                                  }
                                              )
                                          );
                                  
                                          If(
                                              (!IsBlank(varMatRequestGuid) && !IsBlank(varMatIdx) && varMatIdx.RequestGuid = varMatRequestGuid && !(Lower(Coalesce(varMatIdx.RequesterEmail, "")) = varMatMe)),
                                              ClearCollect(
                                                  colMatRows,
                                                  ForAll(
                                                      SortByColumns(Filter(MaterialItems, RequestGuid = varMatRequestGuid), "Created", SortOrder.Descending) As R,
                                                      {
                                                          RowId: R.ID,
                                                          ItemKey: Coalesce(R.ItemKey, ""),
                                                          RequestNo: Coalesce(R.RequestNo, ""),
                                                          Status: Coalesce(R.RowStatus.Value, "valid"),
                                                          FileCount: Coalesce(R.FileCount, 0),
                                                          MaterialDescription: Coalesce(R.MaterialDescription, ""),
                                                          Plant: Coalesce(R.Plant, ""),
                                                          FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                          NoBomItem: Coalesce(R.NoBomItem, false),
                                                          Manufacturer: Coalesce(R.Manufacturer, ""),
                                                          ModelNumber: Coalesce(R.ModelNumber, ""),
                                                          ManufacturerPartNo: Coalesce(R.ManufacturerPartNo, ""),
                                                          Supplier: Coalesce(R.Supplier, ""),
                                                          SupplierPartNo: Coalesce(R.SupplierPartNo, ""),
                                                          DeliveringTime: R.DeliveringTime,
                                                          Price: R.Price,
                                                          PriceUnit: Coalesce(R.PriceUnit, ""),
                                                          StockUnit: Coalesce(R.StockUnit, ""),
                                                          RecommendedStock: R.RecommendedStock,
                                                          IsStockItem: Coalesce(R.IsStockItem, false),
                                                          MinStock: R.MinStock,
                                                          MaxStock: R.MaxStock,
                                                          StorageBin: Coalesce(R.StorageBin, ""),
                                                          StrategicPart: Coalesce(R.StrategicPart, ""),
                                                          WearPart: Coalesce(R.WearPart, ""),
                                                          Remarks: Coalesce(R.Remarks, ""),
                                                          MaintenanceOrderNo: Coalesce(R.MaintenanceOrderNo, ""),
                                                          ReplacesExisting: Coalesce(R.ReplacesExisting, false),
                                                          ReplacedMaterialNo: Coalesce(R.ReplacedMaterialNo, ""),
                                                          ObjectList: Coalesce(R.ObjectList, ""),
                                                          ObjectListJson: Coalesce(R.ObjectListJson, ""),
                                                          ApprovalRequired: Coalesce(R.ApprovalRequired, false),
                                                          CreatedMaterialNo: Coalesce(R.CreatedMaterialNo, ""),
                                                          RequesterName: Coalesce(R.RequesterName, ""),
                                                          RequesterEmail: Coalesce(R.RequesterEmail, ""),
                                                          SubmittedOn: R.SubmittedOn
                                                      }
                                                  )
                                              ),
                                              ClearCollect(
                                                  colMatRows,
                                                  ForAll(
                                                      SortByColumns(Filter(MaterialItems, RequesterEmail = varMatMe), "Created", SortOrder.Descending) As R,
                                                      {
                                                          RowId: R.ID,
                                                          ItemKey: Coalesce(R.ItemKey, ""),
                                                          RequestNo: Coalesce(R.RequestNo, ""),
                                                          Status: Coalesce(R.RowStatus.Value, "valid"),
                                                          FileCount: Coalesce(R.FileCount, 0),
                                                          MaterialDescription: Coalesce(R.MaterialDescription, ""),
                                                          Plant: Coalesce(R.Plant, ""),
                                                          FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                          NoBomItem: Coalesce(R.NoBomItem, false),
                                                          Manufacturer: Coalesce(R.Manufacturer, ""),
                                                          ModelNumber: Coalesce(R.ModelNumber, ""),
                                                          ManufacturerPartNo: Coalesce(R.ManufacturerPartNo, ""),
                                                          Supplier: Coalesce(R.Supplier, ""),
                                                          SupplierPartNo: Coalesce(R.SupplierPartNo, ""),
                                                          DeliveringTime: R.DeliveringTime,
                                                          Price: R.Price,
                                                          PriceUnit: Coalesce(R.PriceUnit, ""),
                                                          StockUnit: Coalesce(R.StockUnit, ""),
                                                          RecommendedStock: R.RecommendedStock,
                                                          IsStockItem: Coalesce(R.IsStockItem, false),
                                                          MinStock: R.MinStock,
                                                          MaxStock: R.MaxStock,
                                                          StorageBin: Coalesce(R.StorageBin, ""),
                                                          StrategicPart: Coalesce(R.StrategicPart, ""),
                                                          WearPart: Coalesce(R.WearPart, ""),
                                                          Remarks: Coalesce(R.Remarks, ""),
                                                          MaintenanceOrderNo: Coalesce(R.MaintenanceOrderNo, ""),
                                                          ReplacesExisting: Coalesce(R.ReplacesExisting, false),
