            LayoutDirection: |-
                =LayoutDirection.Vertical
            LayoutGap: |-
                =0
            LayoutMinWidth: |-
                =0
            LayoutOverflowX: |-
                =LayoutOverflow.Hide
            LayoutOverflowY: |-
                =LayoutOverflow.Hide
