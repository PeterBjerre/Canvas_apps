            - conMatAttActions:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderStyle: |-
                      =BorderStyle.None
                  DropShadow: |-
                      =DropShadow.None
                  FillPortions: |-
                      =0
                  Height: |-
                      =If(((Min(760, App.Width - 32)) - 36) >= (195) + (175) + (164) + 16, 36, (36) + 8 + (36) + 8 + (36))
                  LayoutAlignItems: |-
                      =If(((Min(760, App.Width - 32)) - 36) >= (195) + (175) + (164) + 16, LayoutAlignItems.Center, LayoutAlignItems.Stretch)
                  LayoutDirection: |-
                      =If(((Min(760, App.Width - 32)) - 36) >= (195) + (175) + (164) + 16, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: |-
                      =8
                  LayoutMinWidth: |-
                      =0
                  LayoutOverflowX: |-
                      =LayoutOverflow.Hide
                  LayoutOverflowY: |-
                      =LayoutOverflow.Hide
                  Width: |-
                      =Parent.Width
                Children:
                  - btnMatAttUpload:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: |-
                            ="Upload to SharePoint"
                        Align: |-
                            =Align.Center
                        AlignInContainer: |-
                            =AlignInContainer.Center
                        BasePaletteColor: |-
                            =C.'color-brand-primary'
                        Color: |-
                            =C.'text-on-primary'
                        DisplayMode: |-
                            =If(IsBlank(varMatDocsId), DisplayMode.Disabled, DisplayMode.Edit)
                        Font: |-
                            =Font.'Segoe UI'
                        FontWeight: |-
                            =FontWeight.Semibold
                        Height: |-
                            =36
                        Layout: |-
                            =ButtonLayout.TextOnly
                        LayoutMinWidth: |-
                            =If(((Min(760, App.Width - 32)) - 36) >= (195) + (175) + (164) + 16, 195, 0)
                        OnSelect: |-
                            =If(
                                IsBlank(LookUp(colMatRows, RowId = varMatDocsId).ItemKey),
                                Notify("Save the row first - the folder is named after the row key.", NotificationType.Warning),
                            
                                If(
                                    CountRows(attMatPicker.Attachments) = 0,
                                    Notify("Choose one or more files first.", NotificationType.Warning),
                            
                                    ClearCollect(
                                        colMatAttUp,
                                        ForAll(
                                            attMatPicker.Attachments As F,
                                            {
                                                Name: F.Name,
                                                Ok: IfError(
                                                    Lower(
                                                        Text(
                                                            'BioSap-TaskListAttachment'.Run(
                                                                LookUp(colMatRows, RowId = varMatDocsId).ItemKey,
                                                                { file: { contentBytes: F.Value, name: F.Name } }
                                                            ).flowrunsuccess
                                                        )
                                                    ) = "true",
                                                    false
                                                )
                                            }
                                        )
                                    );
                                    Reset(attMatPicker);
                            
                                    Set(
                                        varMatAttJson,
                                        'BioSap-GetSubmittedAttachments'.Run("TaskListDocuments/" & LookUp(colMatRows, RowId = varMatDocsId).ItemKey).files
                                    );
                                    RemoveIf(colMatAttachments, RowId = varMatDocsId);
                                    Collect(
                                        colMatAttachments,
                                        ForAll(
                                            ParseJSON(Coalesce(varMatAttJson, "[]")) As J,
                                            {
                                                RowId: varMatDocsId,
                                                FileName: Text(J.Name),
                                                FileUrl: Text(J.Link),
                                                Identifier: Text(J.Identifier),
                                                Selected: false
                                            }
                                        )
                                    );
                                    With(
                                        { n: CountRows(Filter(colMatAttachments, RowId = varMatDocsId)) },
                                        Patch(
                                            MaterialItems,
                                            LookUp(MaterialItems, ID = varMatDocsId),
                                            { FileCount: n }
                                        );
                                        UpdateIf(
                                            colMatRows,
                                            RowId = varMatDocsId,
                                            { FileCount: n }
                                        )
                                    );
                            
                                    If(
                                        CountRows(Filter(colMatAttUp, Ok = false)) > 0,
                                        Notify(
                                            "SharePoint refused: " &
                                            Concat(Filter(colMatAttUp, Ok = false), Name, ", "),
                                            NotificationType.Error
