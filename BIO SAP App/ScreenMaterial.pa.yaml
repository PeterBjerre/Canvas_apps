            OnSelect: |-
                =IfError(
                    // Har en sletning roert det, skaermen viser? (tools/request_delete.py)
                    Set(varMatStaleNow, Coalesce(gblMatStale, false));
                    If(
                        varMatStaleNow,
                        Set(gblMatStale, false);
                        If(
                            !IsBlank(varMatRequestGuid) && IsBlank(LookUp(MD_RequestIndex, RequestGuid = varMatRequestGuid)),
                            Set(gblMatWant, Blank());
                            Set(varMatOpened, "")
                        )
                    );
                
                    // DEN SAMLEDE APP: klargoer skaermen, naar hubben eller et dyblink
                    // beder om noget andet end det, den viser. Se BIO SAP App/build/
                    // build_screens.py, open_block().
                    With(
                        { wantKey: If(
                            gblNavTo = "Mat",
                            "new:0",
                            Coalesce(
                            gblMatWant,
                            If(Lower(Param("domain")) = "material", "link:" & Param("reqid")),
                            "new"
                        )
                        ) },
                        If(
                            wantKey <> Coalesce(varMatOpened, ""),
                            Set(varMatLoading, true);
                            Set(varMatOpened, wantKey);
                            Set(
                                gblMatReqId,
                                If(StartsWith(wantKey, "req:"), Mid(wantKey, 5),
                                   StartsWith(wantKey, "edit:"), Mid(wantKey, 6),
                                   StartsWith(wantKey, "link:"), Mid(wantKey, 6), "")
                            );
                            Set(gblMatMode, If(StartsWith(wantKey, "edit:") || (StartsWith(wantKey, "link:") && Lower(Coalesce(Param("mode"), "")) = "edit"), "edit", "view"));
                            // Live status (issue #92): the first step is the request itself.
                            Set(varMatLoadFailed, false);
                            Set(varMatLoadSlow, false);
                            Set(varMatLoadStep, If(IsBlank(gblMatReqId), "Setting up a new request", "Finding the request"));
