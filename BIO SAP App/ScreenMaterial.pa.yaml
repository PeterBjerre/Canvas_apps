                            If(false, ClearCollect(colMatAttachments, { RowId: 0, FileName: "", FileUrl: "", Identifier: "", Selected: false }));
                
                            If(false, ClearCollect(colMatAttUp, { Name: "", Ok: false }));
                
                            If(false, ClearCollect(colMatFl, { Code: "", Description: "", Display: "", Maintainable: false, Level: "" }));
                
                            If(false, ClearCollect(colMatObjects, { Code: "", Description: "" }));
                
                            Set(varMatMe, Lower(User().Email));
                            Set(varMatRequestNo, "");
                            Set(varMatRequestGuid, "");
                            Set(varMatViewOnly, false);
                            Set(varMatBadgeOn, false);
                            Set(varMatCanEdit, false);
                            // Hvilken raekke detaljeruden viser. Blank = ruden er skjult.
                            Set(varMatDetailsId, Blank());
                            // Sletning sker bag en bekraeftelse: hvilken raekke, og om den er aaben.
                            Set(varMatDeleteId, Blank());
                            Set(varMatConfirmDelete, false);
                            // Hvilken raekke dokumentpopuppen viser. Blank = lukket.
                            Set(varMatDocsId, Blank());
                            Set(varMatAttJson, "");
                            Set(varMatFlMsg, "");
                            Set(varMatFlBusy, false);
                
                            Set(varMatExtraOpen, false);
                            Set(varMatDetCreatedNo, "");
                            Set(varMatActiveRowId, Blank());
                            Set(varMatRowStatus, "valid");
                            Set(varMatValidated, false);
                            Set(varMatFText, "");
                            Set(varMatFPlant, "");
                            Set(varMatFFunctionalLocation, "");
                            Set(varMatFNoBomItem, false);
                            Set(varMatFManufacturer, "");
                            Set(varMatFModelNumber, "");
                            Set(varMatFManufacturerPartNo, "");
                            Set(varMatFSupplier, "");
                            Set(varMatFSupplierPartNo, "");
                            Set(varMatFDeliveringTime, Blank());
                            Set(varMatFPrice, Blank());
                            Set(varMatFPriceUnit, "");
                            Set(varMatFStockUnit, "");
                            Set(varMatFRecommendedStock, Blank());
                            Set(varMatFIsStockItem, false);
                            Set(varMatFMinStock, Blank());
                            Set(varMatFMaxStock, Blank());
                            Set(varMatFStorageBin, "X");
                            Set(varMatFStrategicPart, "");
                            Set(varMatFWearPart, "");
                            Set(varMatFRemarks, "");
                            Set(varMatFMaintenanceOrderNo, "");
                            Set(varMatFReplacesExisting, false);
                            Set(varMatFReplacedMaterialNo, "");
                            Set(varMatFlQuery, ""); Set(varMatFlLast, ""); Set(varMatFlMsg, ""); Clear(colMatFl); Reset(cmbMatFl);
                            Clear(colMatObjects);
                            Set(varMatInfo, "");
                            If(
                                !IsBlank(gblMatReqId) && varMatRequestGuid <> gblMatReqId,
                                Set(varMatRequestGuid, gblMatReqId);
                                Set(varMatIdx, LookUp(MD_RequestIndex, RequestGuid = varMatRequestGuid));
                                If(
                                    IsBlank(varMatIdx),
                                    Notify("Could not find the request behind this link. Rows you save start a new request.",
                                        NotificationType.Warning);
