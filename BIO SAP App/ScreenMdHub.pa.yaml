              ClearCollect(colMdScope, ForAll(If(
                  varMdView = "mine",
                  If(
                      varMdStatusMode = "open", Filter('MD_RequestIndex', RequesterEmail = varMdMe, IsOpen = true),
                      varMdStatusMode = "done", Filter('MD_RequestIndex', RequesterEmail = varMdMe, IsOpen = false),
                      Filter('MD_RequestIndex', RequesterEmail = varMdMe)
