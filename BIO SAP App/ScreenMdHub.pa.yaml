                  - btnMdDelConfirm:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: |-
                            ="Delete"
                        Align: |-
                            =Align.Center
                        AlignInContainer: |-
                            =AlignInContainer.Center
                        BasePaletteColor: |-
                            =C.'color-brand-primary'
                        Color: |-
                            =C.'text-on-primary'
                        Font: |-
                            =Font.'Segoe UI'
                        FontWeight: |-
                            =FontWeight.Semibold
                        Height: |-
                            =36
                        Icon: |-
                            ="Delete"
                        Layout: |-
                            =ButtonLayout.IconBefore
                        OnSelect: |-
                            =Set(varMdDeleteOpen, false);
                            Set(varMdDelIdx, LookUp('MD_RequestIndex', ID = varMdDelItem.ID));
                            If(
                                IsBlank(varMdDelIdx),
                                Notify("This request no longer exists.", NotificationType.Warning);
                                RemoveIf(colMdScope, Id = varMdDelItem.ID),
                                !((Lower(Coalesce(varMdDelIdx.RequesterEmail, "")) = varMdMe && (varMdDelIdx.Status.Value = "Kladde")) || (IsAdmin && (varMdDelIdx.Status.Value = "Kladde" || varMdDelIdx.Status.Value = "AfventerInfo"))),
                                If(IsAdmin, Notify("Only drafts and requests awaiting info can be deleted.", NotificationType.Warning), Notify("Only drafts can be deleted.", NotificationType.Warning)),
                                Set(varMdDelGuid, varMdDelIdx.RequestGuid);
                                Set(varMdDelSp, varMdDelIdx.SourceItemId);
                                Set(varMdDelKey, varMdDelIdx.RequestNo);
                                Set(varMdDelDomain, varMdDelIdx.Domain.Value);
                                Switch(
                                    varMdDelDomain,
                                    "FunctionalLocation",
                                        Remove(FunctionalLocationItems, Filter(FunctionalLocationItems, RequestGuid = varMdDelGuid));
                                        If(
                                            !IsEmpty(Errors(FunctionalLocationItems)),
                                            Notify("The request could not be deleted: " & First(Errors(FunctionalLocationItems)).Message, NotificationType.Error),
                                            Remove(FunctionalLocationRequests, Filter(FunctionalLocationRequests, RequestGuid = varMdDelGuid));
                                            If(
                                                !IsEmpty(Errors(FunctionalLocationRequests)),
                                                Notify("The request could not be deleted: " & First(Errors(FunctionalLocationRequests)).Message, NotificationType.Error),
                                                Remove(MD_RequestIndex, Filter(MD_RequestIndex, RequestGuid = varMdDelGuid));
                                                If(
                                                    !IsEmpty(Errors(MD_RequestIndex)),
                                                    Notify("The request could not be deleted: " & First(Errors(MD_RequestIndex)).Message, NotificationType.Error),
                                                    If(
                                                        (IsAdmin && !(Lower(Coalesce(varMdDelIdx.RequesterEmail, "")) = varMdMe)),
                                                        IfError(
                                                            Patch(MD_ApprovalLog, Defaults(MD_ApprovalLog), {
                                                                Title: varMdDelKey,
                                                                RequestGuid: varMdDelGuid,
                                                                Stage: "Admin",
                                                                Decision: "AdminDelete",
                                                                Detail: Left("Request deleted (" & Coalesce(LookUp(RequestStatusLabels, Key = varMdDelIdx.Status.Value, Label), varMdDelIdx.Status.Value) & ", owner " & varMdDelIdx.RequesterEmail & ")", 255),
                                                                Comment: "Request deleted (" & Coalesce(LookUp(RequestStatusLabels, Key = varMdDelIdx.Status.Value, Label), varMdDelIdx.Status.Value) & ", owner " & varMdDelIdx.RequesterEmail & ")",
                                                                DecidedByEmail: Lower(User().Email),
                                                                DecidedOn: Now()
                                                            });
                                                            true,
                                                            Notify("The change was saved, but the admin log entry failed: " & FirstError.Message, NotificationType.Warning);
                                                            false
                                                        )
                                                    );
                                                    RemoveIf(colMdScope, Id = varMdDelIdx.ID);
                                                    Switch(
                                                        varMdDelDomain,
                                                        "FunctionalLocation", Set(gblFlStale, true),
                                                        "MaintenancePlan", Set(gblVhpStale, true),
                                                        "Equipment", Set(gblEqStale, true),
                                                        "Material", Set(gblMatStale, true)
                                                    );
                                                    Notify("Request deleted.", NotificationType.Success)
                                                )
