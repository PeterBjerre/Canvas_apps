      - conVhtRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderStyle: |-
                =BorderStyle.None
            DropShadow: |-
                =DropShadow.None
            Fill: |-
                =C.'bg-app'
            FillPortions: |-
                =0
            Height: |-
                =Parent.Height
            LayoutAlignItems: |-
                =LayoutAlignItems.Stretch
            LayoutDirection: |-
                =LayoutDirection.Vertical
            LayoutGap: |-
                =0
            LayoutMinWidth: |-
                =0
            LayoutOverflowX: |-
                =LayoutOverflow.Hide
            LayoutOverflowY: |-
                =LayoutOverflow.Hide
