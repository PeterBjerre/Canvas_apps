      - btnVhpSendEmail:
          Control: ModernButton
          Properties:
            AccessibleLabel: |-
                ="Send as email"
            Align: |-
                =Align.Center
            AlignInContainer: |-
                =AlignInContainer.Center
            BasePaletteColor: |-
                =C.'color-brand-primary'
            Color: |-
                =C.'text-on-primary'
            DisplayMode: |-
                =If(varVhpPlanCommitted, DisplayMode.Edit, DisplayMode.Disabled)
            Font: |-
                =Font.'Segoe UI'
            FontWeight: |-
                =FontWeight.Semibold
            Height: |-
                =44
            Layout: |-
                =ButtonLayout.TextOnly
            OnSelect: |-
                =Launch(
                    "mailto:sapvedligehold@orsted.com" &
                    "?subject=" & EncodeUrl("VH-plan " & varVhpPlan.Plant & " " & varVhpPlan.PlanText & " (" & Text(Today(), "dd-mm-yyyy") & ")") &
                    "&body=" & EncodeUrl(
                        "Hej SAP vedligehold," & Char(10) & Char(10) &
                        "Maintenance plan ready for creation in SAP:" & Char(10) &
                        "Plant: " & varVhpPlan.Plant & Char(10) &
                        "Plan text: " & varVhpPlan.PlanText & Char(10) &
                        "Status: " & varVhpPlan.Status & Char(10) &
                        "Plan type: " & If(varVhpPlan.PlanType = "Strategy", "Strategiplan (IP42)", "Single cycle (IP41)") & Char(10) &
                        If(
                            varVhpPlan.PlanType = "Strategy",
                            "Strategy: " & varVhpPlan.Strategy & Char(10) &
                            "Packages: " & Concat(Sort(Filter(colVhpStrategyPackages, StrategyKey = varVhpPlan.Strategy), PackageNo), ShortCode & " (" & Text(CycleLength) & " " & CycleUnit & ")", ", ") & Char(10),
                            "Cycle: " & Text(varVhpPlan.Cycle) & " " & varVhpPlan.Unit & Char(10)
                        ) &
                        "Items: " & Text(CountRows(colVhpItems)) & " (" & Text(CountRows(Filter(colVhpItems, Status = "valid"))) & " valid, " & Text(CountRows(Filter(colVhpItems, Status = "invalid"))) & " invalid)" & Char(10) &
                        "Operations: " & Text(CountRows(colVhpOperations)) & Char(10) & Char(10) &
                        Concat(
                            FirstN(Sort(colVhpItems, ItemId), 15),
                            "- " & If(IsBlank(ShortText), "Item " & Text(ItemId), ShortText) & " | FL " & Coalesce(FunctionalLocation, "-") & " | " & Upper(Status),
                            Char(10)
                        ) & Char(10) & Char(10) &
                        If(
                            varVhpPlan.PlanType = "Strategy",
                            "Pakkeallokering pr. operation:" & Char(10) &
                            Concat(
                                FirstN(Sort(colVhpOperations, ItemId), 40),
                                "  Item " & Text(ItemId) & " op " & OperationNo & ": " &
                                With(
                                    { k: Coalesce(PackagesKey, ";") },
                                    If(
                                        Len(k) <= 1, "(no package)",
                                        Concat(Sort(Filter(colVhpStrategyPackages As P, P.StrategyKey = varVhpPlan.Strategy && ";" & Text(P.PackageNo) & ";" in k), PackageNo), ShortCode, ", ")
                                    )
                                ),
                                Char(10)
                            ) & Char(10) & Char(10),
                            ""
                        ) &
                        "Sent from the VH-plan app on " & Text(Now(), "dd-mm-yyyy hh:mm")
                    )
                );
                Set(varVhpRuntimeInfo, "Email draft prepared: " & Text(CountRows(colVhpItems)) & " item(s).")
            RadiusBottomLeft: |-
                =22
            RadiusBottomRight: |-
                =22
            RadiusTopLeft: |-
                =22
            RadiusTopRight: |-
                =22
            Size: |-
                =14
            Text: |-
