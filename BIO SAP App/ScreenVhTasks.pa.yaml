Screens:
  ScreenVhTasks:
    Properties:
      Fill: |-
          =C.'bg-app'
      OnVisible: |-
          =// Task list-vaelgeren skal vise det AKTIVE items liste - det
          // kan vaere skiftet paa skaerm 1. Se build_vhplan().
          Reset(drpVhpItemTasklist)
