                        LayoutGap: |-
                            =10
                        LayoutMinWidth: |-
                            =0
                        LayoutOverflowX: |-
                            =LayoutOverflow.Hide
                        LayoutOverflowY: |-
                            =LayoutOverflow.Hide
                        Width: |-
                            =Parent.Width
