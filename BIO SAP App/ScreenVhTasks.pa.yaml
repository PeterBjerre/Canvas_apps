                                                Font: |-
                                                    =Font.'Segoe UI'
                                                FontWeight: |-
                                                    =FontWeight.Semibold
                                                Height: |-
                                                    =26
                                                PaddingBottom: |-
                                                    =0
                                                PaddingLeft: |-
                                                    =8
                                                PaddingRight: |-
                                                    =8
                                                PaddingTop: |-
                                                    =0
                                                RadiusBottomLeft: |-
                                                    =14
                                                RadiusBottomRight: |-
                                                    =14
                                                RadiusTopLeft: |-
                                                    =14
                                                RadiusTopRight: |-
                                                    =14
                                                Size: |-
                                                    =12
                                                Text: |-
                                                    ="1. Plan"
                                                Width: |-
                                                    =118
                                                Wrap: |-
                                                    =false
                                          - txtVhtStep2:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                    ="2. Item"
                                                Align: |-
                                                    =Align.Center
                                                AlignInContainer: |-
                                                    =AlignInContainer.Center
                                                BorderStyle: |-
                                                    =BorderStyle.None
                                                BorderThickness: |-
                                                    =0
                                                Color: |-
                                                    =If(varVhpPlanCommitted, C.'text-on-primary', C.'text-muted')
                                                Fill: |-
                                                    =If(varVhpPlanCommitted, C.'color-brand-primary', C.'state-neutral-bg')
                                                Font: |-
                                                    =Font.'Segoe UI'
                                                FontWeight: |-
                                                    =FontWeight.Semibold
                                                Height: |-
                                                    =26
                                                PaddingBottom: |-
                                                    =0
                                                PaddingLeft: |-
                                                    =8
                                                PaddingRight: |-
                                                    =8
                                                PaddingTop: |-
                                                    =0
                                                RadiusBottomLeft: |-
                                                    =14
                                                RadiusBottomRight: |-
                                                    =14
                                                RadiusTopLeft: |-
                                                    =14
                                                RadiusTopRight: |-
                                                    =14
                                                Size: |-
                                                    =12
                                                Text: |-
                                                    ="2. Item"
                                                Width: |-
                                                    =118
                                                Wrap: |-
                                                    =false
                                          - txtVhtStep3:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                    ="3. Tasklist"
                                                Align: |-
                                                    =Align.Center
                                                AlignInContainer: |-
                                                    =AlignInContainer.Center
                                                BorderStyle: |-
                                                    =BorderStyle.None
                                                BorderThickness: |-
                                                    =0
                                                Color: |-
                                                    =If(varVhpPlanCommitted && CountRows(colVhpItems) > 0, C.'text-on-primary', C.'text-muted')
                                                Fill: |-
                                                    =If(varVhpPlanCommitted && CountRows(colVhpItems) > 0, C.'color-brand-primary', C.'state-neutral-bg')
                                                Font: |-
                                                    =Font.'Segoe UI'
                                                FontWeight: |-
                                                    =FontWeight.Semibold
                                                Height: |-
                                                    =26
                                                PaddingBottom: |-
                                                    =0
                                                PaddingLeft: |-
                                                    =8
                                                PaddingRight: |-
                                                    =8
                                                PaddingTop: |-
                                                    =0
                                                RadiusBottomLeft: |-
                                                    =14
                                                RadiusBottomRight: |-
                                                    =14
                                                RadiusTopLeft: |-
                                                    =14
                                                RadiusTopRight: |-
                                                    =14
                                                Size: |-
                                                    =12
                                                Text: |-
                                                    ="3. Tasklist"
                                                Width: |-
                                                    =118
                                                Wrap: |-
                                                    =false
                                          - txtVhtStep4:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                    =If(varVhpPlan.PlanType = "Strategy", "4. Packages", "4. Operations")
                                                Align: |-
                                                    =Align.Center
                                                AlignInContainer: |-
                                                    =AlignInContainer.Center
                                                BorderStyle: |-
                                                    =BorderStyle.None
                                                BorderThickness: |-
                                                    =0
                                                Color: |-
                                                    =If(varVhpPlanCommitted && !IsBlank(LookUp(colVhpItems, ItemId = varVhpActiveItemId, TasklistKey)), C.'text-on-primary', C.'text-muted')
                                                Fill: |-
                                                    =If(varVhpPlanCommitted && !IsBlank(LookUp(colVhpItems, ItemId = varVhpActiveItemId, TasklistKey)), C.'color-brand-primary', C.'state-neutral-bg')
                                                Font: |-
                                                    =Font.'Segoe UI'
                                                FontWeight: |-
                                                    =FontWeight.Semibold
                                                Height: |-
                                                    =26
                                                PaddingBottom: |-
                                                    =0
                                                PaddingLeft: |-
                                                    =8
                                                PaddingRight: |-
                                                    =8
                                                PaddingTop: |-
                                                    =0
                                                RadiusBottomLeft: |-
                                                    =14
                                                RadiusBottomRight: |-
                                                    =14
                                                RadiusTopLeft: |-
                                                    =14
                                                RadiusTopRight: |-
                                                    =14
                                                Size: |-
                                                    =12
                                                Text: |-
                                                    =If(varVhpPlan.PlanType = "Strategy", "4. Packages", "4. Operations")
                                                Width: |-
                                                    =118
                                                Wrap: |-
                                                    =false
                                          - txtVhtStep5:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: |-
                                                    ="5. Dispatch"
                                                Align: |-
                                                    =Align.Center
                                                AlignInContainer: |-
                                                    =AlignInContainer.Center
                                                BorderStyle: |-
                                                    =BorderStyle.None
                                                BorderThickness: |-
                                                    =0
                                                Color: |-
                                                    =If(varVhpPlanCommitted && CountRows(colVhpOperations) > 0, C.'text-on-primary', C.'text-muted')
                                                Fill: |-
                                                    =If(varVhpPlanCommitted && CountRows(colVhpOperations) > 0, C.'color-brand-primary', C.'state-neutral-bg')
                                                Font: |-
                                                    =Font.'Segoe UI'
                                                FontWeight: |-
                                                    =FontWeight.Semibold
                                                Height: |-
                                                    =26
                                                PaddingBottom: |-
                                                    =0
                                                PaddingLeft: |-
                                                    =8
                                                PaddingRight: |-
                                                    =8
                                                PaddingTop: |-
                                                    =0
                                                RadiusBottomLeft: |-
                                                    =14
                                                RadiusBottomRight: |-
                                                    =14
                                                RadiusTopLeft: |-
                                                    =14
                                                RadiusTopRight: |-
                                                    =14
                                                Size: |-
                                                    =12
                                                Text: |-
                                                    ="5. Dispatch"
                                                Width: |-
                                                    =118
                                                Wrap: |-
                                                    =false
                                    - txtVhtSub:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: |-
                                              ="Maintenance plans for SAP PM"
                                          BorderStyle: |-
                                              =BorderStyle.None
                                          BorderThickness: |-
                                              =0
                                          Color: |-
                                              =C.'text-muted'
                                          Fill: |-
                                              =RGBA(0, 0, 0, 0)
                                          Font: |-
                                              =Font.'Segoe UI'
                                          Height: |-
                                              =26
                                          PaddingBottom: |-
                                              =0
                                          PaddingLeft: |-
                                              =0
                                          PaddingRight: |-
                                              =0
                                          PaddingTop: |-
                                              =0
                                          Size: |-
                                              =13
                                          Text: |-
                                              ="Maintenance plans for SAP PM"
                                          Visible: |-
                                              =!(((App.Width - 120) - (110 + 10) - (If(LayoutRank >= 2, 130 + 10, 0)) - (150 + 10) - 2) >= 622)
                                          Wrap: |-
                                              =false
                        - btnVhtValidate:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Validate"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              BasePaletteColor: |-
                                  =C.'color-brand-primary'
                              Color: |-
                                  =C.'text-on-primary'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Layout: |-
                                  =ButtonLayout.TextOnly
                              LayoutMinWidth: |-
                                  =110
                              OnSelect: |-
                                  =Set(varVhpPlanValidated, true);
                                  Set(varVhpItemValidated, true);
                                  With(
                                      { isStrat: varVhpPlan.PlanType = "Strategy" },
                                      With(
                                          {
                                              itemErr:
                                                  Concat(
                                                      Filter(
                                                          colVhpItems,
                                                          IsBlank(ShortText) || IsBlank(MainWorkCenter) || IsBlank(ActivityType) || IsBlank(FunctionalLocation)
                                                      ),
                                                      "Item " & Text(ItemId) & " (" & Coalesce(ShortText, "no short text") & "): missing required fields.",
                                                      Char(10)
                                                  ),
                                              s1:
                                                  If(isStrat && IsBlank(varVhpPlan.Strategy),
                                                      "S1: A strategy must be chosen on a strategy plan.", ""),
                                              s3:
                                                  If(isStrat,
                                                      Concat(
                                                          Filter(colVhpItems, IsBlank(TasklistKey)),
                                                          "S3: Item " & Text(ItemId) & " has no task list - the package allocation belongs to the task list.",
                                                          Char(10)
                                                      ), ""),
                                              s4:
                                                  If(isStrat,
                                                      Concat(
                                                          Filter(colVhpOperations, Len(Coalesce(PackagesKey, ";")) <= 1),
                                                          "S4: Item " & Text(ItemId) & " operation " & OperationNo &
                                                          " has no package and would never be carried out.",
                                                          Char(10)
                                                      ), ""),
                                              s5:
                                                  If(isStrat,
                                                      Concat(
                                                          Filter(
                                                              colVhpStrategyPackages As P,
                                                              P.StrategyKey = varVhpPlan.Strategy &&
                                                              CountRows(Filter(colVhpOperations, ";" & Text(P.PackageNo) & ";" in Coalesce(PackagesKey, ";"))) = 0
                                                          ),
                                                          "S5: Package " & ShortCode & " (" & Text(CycleLength) & " " & CycleUnit &
                                                          ") has no operations - the plan would call an empty order.",
                                                          Char(10)
                                                      ), "")
                                  ,
                                              r1:
                                                  If(
                                                      !IsBlank(varVhpPlan.Plant) && !IsBlank(varVhpPlan.PlanText) &&
                                                          !StartsWith(Upper(varVhpPlan.PlanText), Upper(varVhpPlan.Plant)),
                                                      "R1: Plan Text should start with the plant code " & varVhpPlan.Plant &
                                                          " - otherwise the plan cannot be found without searching by plant.", ""),
                                              r2:
                                                  With(
                                                      { n: CountRows(Filter(colVhpItems, StartsWith(ActivityType, "110") || StartsWith(ActivityType, "115"))) },
                                                      If(
                                                          n > 0 && IsBlank(varVhpPlan.SortField),
                                                          "R2: Sort Field is required: " & Text(n) &
                                                              " item(s) have activity type 110 or 115.", "")),
                                              r4:
                                                  With(
                                                      { n: CountRows(Filter(colVhpItems, !IsBlank(Revision))) },
                                                      If(
                                                          n > 0 && (varVhpPlan.FirstCallDay <> 1 || varVhpPlan.FirstCallMonth <> 1),
                                                          "R4: " & Text(n) & " item(s) are marked as outage work. " &
                                                              "First call must be 01/01, otherwise the task misses the outage.", "")),
                                              r5:
                                                  With(
                                                      { m: LookUp(colVhpCallHorizonOptions, Value = varVhpPlan.CallHorizon) },
                                                      If(
                                                          !IsBlank(varVhpPlan.CallHorizon) && m.SchedPeriod < 2,
                                                          "R5: Scheduling period must be at least 2 years because of " &
                                                              "the cost simulation in the BI report.", ""))
                                          },
                                          Set(
                                              varVhpLastValidationErrors,
                                              Concat(
                                                  Filter(
                                                      Table(
                                                          { t: itemErr }, { t: s1 }, { t: s3 }, { t: s4 }, { t: s5 },
                                                          { t: r1 }, { t: r2 }, { t: r4 }, { t: r5 }
                                                      ),
                                                      !IsBlank(t)
                                                  ),
                                                  t, Char(10)
                                              )
                                          )
                                      )
                                  );
                                  Set(
                                      varVhpRuntimeInfo,
                                      "Validated: " & Text(CountRows(colVhpItems)) & " item(s), " &
                                      Text(CountRows(colVhpOperations)) & " operation line(s), " &
                                      Text(CountRows(Filter(colVhpItems, Status = "invalid"))) & " invalid item(s)." &
                                      If(IsBlank(varVhpLastValidationErrors), " No validation issues.", " See validation report.")
                                  )
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Validate"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Width: |-
                                  =110
                        - btnVhtExport:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Export JSON"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-default'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'text-primary'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Layout: |-
                                  =ButtonLayout.TextOnly
                              LayoutMinWidth: |-
                                  =130
                              OnSelect: |-
                                  =Set(
                                      varVhpExportJson,
                                      JSON(
                                          {
                                              plant: varVhpPlan.Plant,
                                              planType: varVhpPlan.PlanType,
                                              strategy: varVhpPlan.Strategy,
                                              planText: varVhpPlan.PlanText,
                                              cycle: varVhpPlan.Cycle,
                                              unit: varVhpPlan.Unit,
                                              packages:
                                                  ForAll(
                                                      Sort(Filter(colVhpStrategyPackages, StrategyKey = varVhpPlan.Strategy), PackageNo),
                                                      { packageNo: PackageNo, shortCode: ShortCode, cycleLength: CycleLength,
                                                        cycleUnit: CycleUnit, hierarchy: Hierarchy }
                                                  ),
                                              items:
                                                  ForAll(
                                                      Sort(colVhpItems, ItemId) As I,
                                                      {
                                                          itemId: I.ItemId, shortText: I.ShortText,
                                                          functionalLocation: I.FunctionalLocation,
                                                          mainWorkCenter: I.MainWorkCenter, activityType: I.ActivityType,
                                                          tasklistKey: I.TasklistKey, status: I.Status,
                                                          operations:
                                                              ForAll(
                                                                  Sort(Filter(colVhpOperations, ItemId = I.ItemId), Value(OperationNo)) As OP,
                                                                  {
                                                                      operationNo: OP.OperationNo,
                                                                      shortText: OP.OperationShortText,
                                                                      work: OP.WorkHours, duration: OP.DurationHours,
                                                                      mainWorkCenter: OP.MainWorkCenter, vendor: OP.Vendor,
                                                                      packages:
                                                                          ForAll(
                                                                              Sort(
                                                                                  Filter(
                                                                                      colVhpStrategyPackages As P,
                                                                                      P.StrategyKey = varVhpPlan.Strategy &&
                                                                                      ";" & Text(P.PackageNo) & ";" in Coalesce(OP.PackagesKey, ";")
                                                                                  ),
                                                                                  PackageNo
                                                                              ),
                                                                              { packageNo: PackageNo }
                                                                          )
                                                                  }
                                                              )
                                                      }
                                                  )
                                          },
                                          JSONFormat.IndentFour
                                      )
                                  );
                                  Set(varVhpRuntimeInfo, "JSON exported: " & Text(CountRows(colVhpItems)) & " item(s), " & Text(Len(varVhpExportJson)) & " characters.")
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Export JSON"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Visible: |-
                                  =LayoutRank >= 2
                              Width: |-
                                  =130
                        - btnVhtToPlan:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Back to the plan and its items"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              Appearance: |-
                                  =ButtonAppearance.Outline
                              BorderColor: |-
                                  =C.'border-default'
                              BorderThickness: |-
                                  =1
                              Color: |-
                                  =C.'text-primary'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Layout: |-
                                  =ButtonLayout.TextOnly
                              LayoutMinWidth: |-
                                  =150
                              OnSelect: |-
                                  =Navigate(ScreenVhPlan, ScreenTransition.None)
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
                                  =10
                              RadiusTopLeft: |-
                                  =10
                              RadiusTopRight: |-
                                  =10
                              Size: |-
                                  =14
                              Text: |-
                                  ="Plan and items"
                              VerticalAlign: |-
                                  =VerticalAlign.Middle
                              Width: |-
                                  =150
