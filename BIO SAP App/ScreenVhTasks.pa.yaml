                                      varVhpSaving, "Gemmer ...",
                                      IsBlank(varVhpPlanKey),
                                          "Not saved yet. Save as draft so you can come back to it.",
                                      "Saved as " & varVhpPlanKey & ". The next save overwrites items and " &
                                          "operations on the same plan."
                                  )
                              Wrap: |-
                                  =true
                        - conVhtSaveActions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: |-
                                  =BorderStyle.None
                              DropShadow: |-
                                  =DropShadow.None
                              FillPortions: |-
                                  =0
                              Height: |-
                                  =36
                              LayoutAlignItems: |-
                                  =LayoutAlignItems.Center
                              LayoutDirection: |-
                                  =LayoutDirection.Horizontal
                              LayoutGap: |-
                                  =8
                              LayoutMinWidth: |-
                                  =0
                              LayoutOverflowX: |-
                                  =LayoutOverflow.Hide
                              LayoutOverflowY: |-
                                  =LayoutOverflow.Hide
                              Width: |-
                                  =Parent.Width
                            Children:
                              - btnVhtSaveDraft:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: |-
                                        ="Save draft"
                                    Align: |-
                                        =Align.Center
                                    AlignInContainer: |-
                                        =AlignInContainer.Center
                                    Appearance: |-
                                        =ButtonAppearance.Outline
                                    BorderColor: |-
                                        =C.'border-default'
                                    BorderThickness: |-
                                        =1
                                    Color: |-
                                        =C.'text-primary'
                                    DisplayMode: |-
                                        =If(
                                            varVhpSaving || !varVhpPlanCommitted || CountRows(Filter(colVhpItems, !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation))) = 0,
                                            DisplayMode.Disabled,
                                            DisplayMode.Edit
                                        )
                                    Font: |-
                                        =Font.'Segoe UI'
                                    FontWeight: |-
                                        =FontWeight.Semibold
                                    Height: |-
                                        =36
                                    Layout: |-
                                        =ButtonLayout.TextOnly
                                    LayoutMinWidth: |-
                                        =0
                                    OnSelect: |-
                                        =If(
                                            !varVhpPlanCommitted || CountRows(Filter(colVhpItems, !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation))) = 0,
                                            Notify("Create the plan and at least one item first.", NotificationType.Warning),
                                        
                                            Set(varVhpSaving, true);
                                            IfError(
                                                With(
                                                    {
                                                        planOff: With(
                                            { r: First(Sort(MaintenancePlans, ID, SortOrder.Descending)) },
                                            If(
                                                IsBlank(r.ID), 0,
                                                IsNumeric(Mid(r.PlanID, 3)),
                                                r.ID - Value(Mid(r.PlanID, 3)),
                                                Blank()
                                            )
                                        ),
                                                        itemOff: With(
                                            { r: First(Sort(MaintenanceItems, ID, SortOrder.Descending)) },
                                            If(
                                                IsBlank(r.ID), 0,
                                                IsNumeric(Mid(r.ItemID, 3)),
                                                r.ID - Value(Mid(r.ItemID, 3)),
                                                Blank()
                                            )
                                        ),
                                                        taskOff: With(
                                            { r: First(Sort(TaskListMain, ID, SortOrder.Descending)) },
                                            If(
                                                IsBlank(r.ID), 0,
                                                IsNumeric(Mid(r.TaskItemID, 3)),
                                                r.ID - Value(Mid(r.TaskItemID, 3)),
                                                Blank()
                                            )
                                        )
                                                    },
                                                    If(
                                                        IsBlank(planOff) || IsBlank(itemOff) || IsBlank(taskOff),
                                                        Notify(
                                                            "Cannot derive the keys from the existing rows. " &
                                                                "Gemning afbrudt - kontakt SAP masterdata.",
                                                            NotificationType.Error
                                                        );
                                                        Set(varVhpSaving, false),
                                        
                                                        Set(varVhpRequestGuid, Coalesce(varVhpRequestGuid, Text(GUID())));
                                        
                                                        // --- 1. planhovedet ---------------------------------
                                                        With(
                                                            {
                                                                planRec: Patch(
                                                                    MaintenancePlans,
                                                                    If(varVhpPlanSpId > 0, LookUp(MaintenancePlans, ID = varVhpPlanSpId),
                                                                        Defaults(MaintenancePlans)),
                                                                    {
                                                    Title: varVhpPlan.PlanText,
                                                    Status: { Value: "Draft" },
                                                    PlantsInitial: { Value: varVhpPlan.Plant },
                                                    Cycle: varVhpPlan.Cycle,
                                                    Unit: { Value: varVhpPlan.Unit },
                                                    PlannedDate: Date(
                                                        varVhpPlan.FirstCallYear, varVhpPlan.FirstCallMonth, varVhpPlan.FirstCallDay
                                                    ),
                                                    StrategyKey: varVhpPlan.Strategy,
                                                    SchedulingPeriod: LookUp(
                                                        colVhpCallHorizonOptions, Value = varVhpPlan.CallHorizon
                                                    ).SchedPeriod,
                                                    SortField: With(
                                                        { sf: LookUp(SortFieldList, Title = varVhpPlan.SortField) },
                                                        If(IsBlank(sf.ID), Blank(), { Id: sf.ID, Value: sf.Title })
                                                    )
                                                }
                                                                )
                                                            },
                                                            With(
                                                                {
                                                                    planId: planRec.ID,
                                                                    planKey: Coalesce(planRec.PlanID, "MP" & Text(planRec.ID - planOff, "0000"))
                                                                },
                                                                Patch(MaintenancePlans, planRec, { PlanID: planKey });
                                                                Set(varVhpPlanSpId, planId);
                                                                Set(varVhpPlanKey, planKey);
                                        
                                                                // --- 2. ryd det gamle -----------------------
                                                                // Ved gensave er det enklere og sikrere at
                                                                // skrive linjerne forfra end at finde ud af
                                                                // hvilke der er tilfoejet, aendret og slettet.
                                                                Remove(MD_TasklistMaterial,
                                                                    Filter(MD_TasklistMaterial, PlanKey = varVhpPlanKey));
                                                                Remove(MD_TasklistAttachment,
                                                                    Filter(MD_TasklistAttachment, PlanKey = varVhpPlanKey));
                                                                Remove(TaskListMain,
                                                                    Filter(TaskListMain, MaintenancePlanID.Id = varVhpPlanSpId));
                                                                Remove(MaintenanceItems,
                                                                    Filter(MaintenanceItems, MaintenancePlanNo.Id = varVhpPlanSpId));
                                        
                                                                // --- 3. items ------------------------------
                                                                With(
                                                                    { srcItems: Filter(
                                                                        colVhpItems,
                                                                        !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation)
                                                                    ) },
                                                                    If(
                                                                        CountRows(srcItems) = 0,
                                                                        Clear(colVhpSavedItems),
                                        
                                                                        With(
                                                                            {
                                                                                itemRecs: Patch(
                                                                                    MaintenanceItems,
                                                                                    ForAll(srcItems, Defaults(MaintenanceItems)),
                                                                                    ForAll(srcItems As IT, {
                                                                                        Title: IT.ShortText,
                                                                                        Status: { Value: Coalesce(varVhpPlan.Status, "New") },
                                                                                        MaintenancePlanNo: { Id: planId, Value: planKey },
                                                                                        ItemDescription: Coalesce(IT.LongText, IT.ShortText),
                                                                                        FunctionalLocation: IT.FunctionalLocation,
                                                                                        ObjectList: IT.ObjectList,
                                                                                        Priority: { Value: "Yellow (default)" },
                                                                                        OrstedResponsible: {
                                                                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                                                            Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                                                            DisplayName: User().FullName,
                                                                                            Email: User().Email,
                                                                                            Department: "",
                                                                                            JobTitle: "",
                                                                                            Picture: ""
                                                                                        },
                                                                                        OrstedResponsibleEmail: Lower(User().Email),
                                                                                        InitialOrstedResponsible: IT.Initials,
                                                                                        MaintenanceActivityType: With(
                                                                                            { a: LookUp(colVhpActivityTypeOptions, Value = IT.ActivityType) },
                                                                                            If(IsBlank(a.Id), Blank(), { Id: a.Id, Value: a.Value })
                                                                                        ),
                                                                                        MainWorkCenter: With(
                                                                                            { w: LookUp(colVhpMainWorkCenters, Value = IT.MainWorkCenter) },
                                                                                            If(IsBlank(w.Id), Blank(), { Id: w.Id, Value: w.Value })
                                                                                        )
                                                                                    })
                                                                                )
                                                                            },
                                                                            ClearCollect(
                                                                                colVhpSavedItems,
                                                                                ForAll(
                                                                                    Sequence(CountRows(itemRecs)) As N,
                                                                                    {
                                                                                        LocalId: Index(srcItems, N.Value).ItemId,
                                                                                        SpId: Index(itemRecs, N.Value).ID,
                                                                                        ItemKey: "MI" & Text(Index(itemRecs, N.Value).ID - itemOff, "0000")
                                                                                    }
                                                                                )
                                                                            );
                                                                            Patch(
                                                                                MaintenanceItems,
                                                                                itemRecs,
                                                                                ForAll(colVhpSavedItems As S, { ItemID: S.ItemKey })
                                                                            )
                                                                        )
                                                                    )
                                                                );
                                        
                                                                // --- 4. operationer ------------------------
                                                                With(
                                                                    {
                                                                        srcOps: Filter(
                                                                            colVhpOperations As OP,
                                                                            !IsBlank(LookUp(colVhpSavedItems, LocalId = OP.ItemId).SpId)
                                                                        )
                                                                    },
                                                                    If(
                                                                        CountRows(srcOps) = 0,
                                                                        Clear(colVhpSavedOps),
                                        
                                                                        With(
                                                                            {
                                                                                opRecs: Patch(
                                                                                    TaskListMain,
                                                                                    ForAll(srcOps, Defaults(TaskListMain)),
                                                                                    ForAll(srcOps As OP, {
                                                                                        Title: LookUp(colVhpSavedItems, LocalId = OP.ItemId).ItemKey & " - " & OP.OperationShortText,
                                                                                        OperationShortText: OP.OperationShortText,
                                                                                        OperationNo: Value(OP.OperationNo),
                                                                                        PackagesKey: OP.PackagesKey,
                                                                                        Work: OP.WorkHours,
                                                                                        Num: OP.Persons,
                                                                                        Duration: OP.DurationHours,
                                                                                        WorkCtr: OP.MainWorkCenter,
                                                                                        Ctrl: OP.ControlKey,
                                                                                        Vendor: OP.Vendor,
                                                                                        Price: OP.Cost,
                                                                                        Currency: OP.Currency,
                                                                                        CostElem: OP.CostElement,
                                                                                        MaterialGroup: OP.MaterialGroup,
                                                                                        LongText: OP.LongText,
                                                                                        PlantInitial: varVhpPlan.Plant,
                                                                                        MaintenanceItemNo: { Id: LookUp(colVhpSavedItems, LocalId = OP.ItemId).SpId, Value: LookUp(colVhpSavedItems, LocalId = OP.ItemId).ItemKey },
                                                                                        MaintenancePlanID: { Id: planId, Value: planKey }
                                                                                    })
                                                                                )
                                                                            },
                                                                            ClearCollect(
                                                                                colVhpSavedOps,
                                                                                ForAll(
                                                                                    Sequence(CountRows(opRecs)) As N,
                                                                                    {
                                                                                        LocalItemId: Index(srcOps, N.Value).ItemId,
                                                                                        OperationNo: Index(srcOps, N.Value).OperationNo,
                                                                                        SpId: Index(opRecs, N.Value).ID,
                                                                                        TaskKey: "TI" & Text(Index(opRecs, N.Value).ID - taskOff, "0000")
                                                                                    }
                                                                                )
                                                                            );
                                                                            Patch(
                                                                                TaskListMain,
                                                                                opRecs,
                                                                                ForAll(colVhpSavedOps As S, { TaskItemID: S.TaskKey })
                                                                            )
                                                                        )
                                                                    )
                                                                );
                                        
                                                                // --- 5. materialer -------------------------
                                                                // Peger paa operationens TaskItemID, ikke paa
                                                                // itemet. Et materiale hoerer til EEN
                                                                // operation - det er den relation SAP har.
                                                                With(
                                                                    { srcMats: Filter(colVhpMaterials As MT, !IsBlank(MT.MaterialNo)) },
                                                                    If(
                                                                        CountRows(srcMats) > 0,
                                                                        Patch(
                                                                            MD_TasklistMaterial,
                                                                            ForAll(srcMats, Defaults(MD_TasklistMaterial)),
                                                                            ForAll(
                                                                                srcMats As MT,
                                                                                {
                                                                                    MaterialNo: MT.MaterialNo,
                                                                                    PlanKey: planKey,
                                                                                    ItemKey: LookUp(
                                                                                        colVhpSavedItems, LocalId = MT.ItemId
                                                                                    ).ItemKey,
                                                                                    TaskItemID: LookUp(
                                                                                        colVhpSavedOps,
                                                                                        LocalItemId = MT.ItemId && OperationNo = MT.OperationNo
                                                                                    ).TaskKey,
                                                                                    OperationNo: MT.OperationNo,
                                                                                    Quantity: MT.Quantity,
                                                                                    MaterialText: MT.Description,
                                                                                    Unit: MT.Unit,
                                                                                    LineId: MT.LineId
                                                                                }
                                                                            )
                                                                        )
                                                                    )
                                                                );
                                        
                                                                // --- 6. dokumenter -------------------------
                                                                // OperationsKey er ';0010;0020;'. Tom (';')
                                                                // betyder hele itemet.
                                                                //
                                                                // UploadStatus skrives som Pending.
                                                                //
                                                                // Her stod, at FLOWET retter den bagefter. Det
                                                                // goer det ikke: BioSap-TaskListAttachment
                                                                // bestaar af eet CreateFile og et svar, og
                                                                // roerer aldrig denne liste. Raekken bliver
                                                                // staaende som Pending, indtil appen selv
                                                                // retter den - den kender flowets svar.
                                                                // Se docs/18-materialer-og-attachments.md.
                                                                With(
                                                                    { srcAtt: Filter(colVhpAttachments As AT, !IsBlank(AT.FileName)) },
                                                                    If(
                                                                        CountRows(srcAtt) > 0,
                                                                        Patch(
                                                                            MD_TasklistAttachment,
                                                                            ForAll(srcAtt, Defaults(MD_TasklistAttachment)),
                                                                            ForAll(
                                                                                srcAtt As AT,
                                                                                {
                                                                                    FileName: AT.FileName,
                                                                                    PlanKey: planKey,
                                                                                    ItemKey: LookUp(
                                                                                        colVhpSavedItems, LocalId = AT.ItemId
                                                                                    ).ItemKey,
                                                                                    OperationsKey: Coalesce(AT.OperationsKey, ";"),
                                                                                    FileSize: AT.FileSize,
                                                                                    FileUrl: AT.FileUrl,
                                                                                    UploadStatus: {
                                                                                        Value: Coalesce(AT.Status, "Pending")
                                                                                    }
                                                                                }
                                                                            )
                                                                        )
                                                                    )
                                                                );
                                        
                                                                // --- 7. opsummering til landingssiden ------
                                                                // Hubben laeser KUN denne raekke. Den skal
                                                                // skrives hver gang status aendrer sig,
                                                                // ellers viser oversigten noget forkert.
                                                                Patch(
                                                                    MD_RequestIndex,
                                                                    Coalesce(
                                                                        LookUp(MD_RequestIndex, RequestGuid = varVhpRequestGuid),
                                                                        Defaults(MD_RequestIndex)
                                                                    ),
                                                                    {
                                                        RequestNo: planKey,
                                                        Domain: { Value: "MaintenancePlan" },
                                                        Status: { Value: "Kladde" },
                                                        StatusStep: 1,
                                                        IsOpen: true,
                                                        RequestGuid: varVhpRequestGuid,
                                                        RequesterEmail: Lower(User().Email),
                                                        RequesterName: User().FullName,
                                                        ShortText: varVhpPlan.PlanText,
                                                        Plant: varVhpPlan.Plant,
                                                        ItemCount: CountRows(Filter(colVhpItems, !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation))),
                                                        SourceItemId: planId,
                                                        AppUrl: "https://apps.powerapps.com/play/e/e0f8f822-d16a-e878-ba4e-fb42bc617e47/a/11fa8d90-868a-45a4-ba23-28f2cf0671a2",
                                                        LastActionOn: Now(),
                                                        LastActionBy: Lower(User().Email)
                                                    }
                                                                );
                                        
                                                                Set(varVhpSaving, false);
                                                                Set(
                                                                    varVhpRuntimeInfo,
                                                                    planKey & " saved: " & Text(CountRows(colVhpItems)) &
                                                                        " item(s) and " & Text(CountRows(colVhpOperations)) &
                                                                        " operation(s)."
                                                                );
                                                                Notify(planKey & " saved.", NotificationType.Success)
                                                            )
                                                        )
                                                    )
                                                ),
                                        
                                                Set(varVhpSaving, false);
                                                Set(varVhpRuntimeInfo, "Save failed: " & FirstError.Message);
                                                Notify("Save failed: " & FirstError.Message, NotificationType.Error)
                                            )
                                        )
                                    RadiusBottomLeft: |-
                                        =10
                                    RadiusBottomRight: |-
                                        =10
                                    RadiusTopLeft: |-
                                        =10
                                    RadiusTopRight: |-
                                        =10
                                    Size: |-
                                        =14
                                    Text: |-
                                        ="Save draft"
                                    VerticalAlign: |-
                                        =VerticalAlign.Middle
                                    Width: |-
                                        =(((App.Width - 120) - 36) - 8) / 2
                              - btnVhtSubmit:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: |-
                                        ="Submit"
                                    Align: |-
                                        =Align.Center
                                    AlignInContainer: |-
                                        =AlignInContainer.Center
                                    BasePaletteColor: |-
                                        =C.'color-brand-primary'
                                    Color: |-
                                        =C.'text-on-primary'
                                    DisplayMode: |-
                                        =If(
                                            varVhpSaving || !varVhpPlanCommitted || CountRows(Filter(colVhpItems, !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation))) = 0,
                                            DisplayMode.Disabled,
                                            DisplayMode.Edit
                                        )
                                    Font: |-
                                        =Font.'Segoe UI'
                                    FontWeight: |-
                                        =FontWeight.Semibold
                                    Height: |-
                                        =36
                                    Layout: |-
                                        =ButtonLayout.TextOnly
                                    LayoutMinWidth: |-
                                        =0
                                    OnSelect: |-
                                        =If(
                                            !varVhpPlanCommitted || CountRows(Filter(colVhpItems, !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation))) = 0,
                                            Notify("Create the plan and at least one item first.", NotificationType.Warning),
                                        
                                            Set(varVhpSaving, true);
                                            IfError(
                                                With(
                                                    {
                                                        planOff: With(
                                            { r: First(Sort(MaintenancePlans, ID, SortOrder.Descending)) },
                                            If(
                                                IsBlank(r.ID), 0,
                                                IsNumeric(Mid(r.PlanID, 3)),
                                                r.ID - Value(Mid(r.PlanID, 3)),
                                                Blank()
                                            )
                                        ),
                                                        itemOff: With(
                                            { r: First(Sort(MaintenanceItems, ID, SortOrder.Descending)) },
                                            If(
                                                IsBlank(r.ID), 0,
                                                IsNumeric(Mid(r.ItemID, 3)),
                                                r.ID - Value(Mid(r.ItemID, 3)),
                                                Blank()
                                            )
                                        ),
                                                        taskOff: With(
                                            { r: First(Sort(TaskListMain, ID, SortOrder.Descending)) },
                                            If(
                                                IsBlank(r.ID), 0,
                                                IsNumeric(Mid(r.TaskItemID, 3)),
                                                r.ID - Value(Mid(r.TaskItemID, 3)),
                                                Blank()
                                            )
                                        )
                                                    },
                                                    If(
                                                        IsBlank(planOff) || IsBlank(itemOff) || IsBlank(taskOff),
                                                        Notify(
                                                            "Cannot derive the keys from the existing rows. " &
                                                                "Gemning afbrudt - kontakt SAP masterdata.",
                                                            NotificationType.Error
                                                        );
                                                        Set(varVhpSaving, false),
                                        
                                                        Set(varVhpRequestGuid, Coalesce(varVhpRequestGuid, Text(GUID())));
                                        
                                                        // --- 1. planhovedet ---------------------------------
                                                        With(
                                                            {
                                                                planRec: Patch(
                                                                    MaintenancePlans,
                                                                    If(varVhpPlanSpId > 0, LookUp(MaintenancePlans, ID = varVhpPlanSpId),
                                                                        Defaults(MaintenancePlans)),
                                                                    {
                                                    Title: varVhpPlan.PlanText,
                                                    Status: { Value: "In Progress" },
                                                    PlantsInitial: { Value: varVhpPlan.Plant },
                                                    Cycle: varVhpPlan.Cycle,
                                                    Unit: { Value: varVhpPlan.Unit },
                                                    PlannedDate: Date(
                                                        varVhpPlan.FirstCallYear, varVhpPlan.FirstCallMonth, varVhpPlan.FirstCallDay
                                                    ),
                                                    StrategyKey: varVhpPlan.Strategy,
                                                    SchedulingPeriod: LookUp(
                                                        colVhpCallHorizonOptions, Value = varVhpPlan.CallHorizon
                                                    ).SchedPeriod,
                                                    SortField: With(
                                                        { sf: LookUp(SortFieldList, Title = varVhpPlan.SortField) },
                                                        If(IsBlank(sf.ID), Blank(), { Id: sf.ID, Value: sf.Title })
                                                    )
                                                }
                                                                )
                                                            },
                                                            With(
                                                                {
                                                                    planId: planRec.ID,
                                                                    planKey: Coalesce(planRec.PlanID, "MP" & Text(planRec.ID - planOff, "0000"))
                                                                },
                                                                Patch(MaintenancePlans, planRec, { PlanID: planKey });
                                                                Set(varVhpPlanSpId, planId);
                                                                Set(varVhpPlanKey, planKey);
                                        
                                                                // --- 2. ryd det gamle -----------------------
                                                                // Ved gensave er det enklere og sikrere at
                                                                // skrive linjerne forfra end at finde ud af
                                                                // hvilke der er tilfoejet, aendret og slettet.
                                                                Remove(MD_TasklistMaterial,
                                                                    Filter(MD_TasklistMaterial, PlanKey = varVhpPlanKey));
                                                                Remove(MD_TasklistAttachment,
                                                                    Filter(MD_TasklistAttachment, PlanKey = varVhpPlanKey));
                                                                Remove(TaskListMain,
                                                                    Filter(TaskListMain, MaintenancePlanID.Id = varVhpPlanSpId));
                                                                Remove(MaintenanceItems,
                                                                    Filter(MaintenanceItems, MaintenancePlanNo.Id = varVhpPlanSpId));
                                        
                                                                // --- 3. items ------------------------------
                                                                With(
                                                                    { srcItems: Filter(
                                                                        colVhpItems,
                                                                        !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation)
                                                                    ) },
                                                                    If(
                                                                        CountRows(srcItems) = 0,
                                                                        Clear(colVhpSavedItems),
                                        
                                                                        With(
                                                                            {
                                                                                itemRecs: Patch(
                                                                                    MaintenanceItems,
                                                                                    ForAll(srcItems, Defaults(MaintenanceItems)),
                                                                                    ForAll(srcItems As IT, {
                                                                                        Title: IT.ShortText,
                                                                                        Status: { Value: Coalesce(varVhpPlan.Status, "New") },
                                                                                        MaintenancePlanNo: { Id: planId, Value: planKey },
                                                                                        ItemDescription: Coalesce(IT.LongText, IT.ShortText),
                                                                                        FunctionalLocation: IT.FunctionalLocation,
                                                                                        ObjectList: IT.ObjectList,
                                                                                        Priority: { Value: "Yellow (default)" },
                                                                                        OrstedResponsible: {
                                                                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                                                            Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                                                            DisplayName: User().FullName,
                                                                                            Email: User().Email,
                                                                                            Department: "",
                                                                                            JobTitle: "",
                                                                                            Picture: ""
                                                                                        },
                                                                                        OrstedResponsibleEmail: Lower(User().Email),
                                                                                        InitialOrstedResponsible: IT.Initials,
                                                                                        MaintenanceActivityType: With(
                                                                                            { a: LookUp(colVhpActivityTypeOptions, Value = IT.ActivityType) },
                                                                                            If(IsBlank(a.Id), Blank(), { Id: a.Id, Value: a.Value })
                                                                                        ),
                                                                                        MainWorkCenter: With(
                                                                                            { w: LookUp(colVhpMainWorkCenters, Value = IT.MainWorkCenter) },
                                                                                            If(IsBlank(w.Id), Blank(), { Id: w.Id, Value: w.Value })
                                                                                        )
                                                                                    })
                                                                                )
                                                                            },
                                                                            ClearCollect(
                                                                                colVhpSavedItems,
                                                                                ForAll(
                                                                                    Sequence(CountRows(itemRecs)) As N,
                                                                                    {
                                                                                        LocalId: Index(srcItems, N.Value).ItemId,
                                                                                        SpId: Index(itemRecs, N.Value).ID,
                                                                                        ItemKey: "MI" & Text(Index(itemRecs, N.Value).ID - itemOff, "0000")
                                                                                    }
                                                                                )
                                                                            );
                                                                            Patch(
                                                                                MaintenanceItems,
                                                                                itemRecs,
                                                                                ForAll(colVhpSavedItems As S, { ItemID: S.ItemKey })
                                                                            )
                                                                        )
                                                                    )
                                                                );
                                        
                                                                // --- 4. operationer ------------------------
                                                                With(
                                                                    {
                                                                        srcOps: Filter(
                                                                            colVhpOperations As OP,
                                                                            !IsBlank(LookUp(colVhpSavedItems, LocalId = OP.ItemId).SpId)
                                                                        )
                                                                    },
                                                                    If(
                                                                        CountRows(srcOps) = 0,
                                                                        Clear(colVhpSavedOps),
                                        
                                                                        With(
                                                                            {
                                                                                opRecs: Patch(
                                                                                    TaskListMain,
                                                                                    ForAll(srcOps, Defaults(TaskListMain)),
                                                                                    ForAll(srcOps As OP, {
                                                                                        Title: LookUp(colVhpSavedItems, LocalId = OP.ItemId).ItemKey & " - " & OP.OperationShortText,
                                                                                        OperationShortText: OP.OperationShortText,
                                                                                        OperationNo: Value(OP.OperationNo),
                                                                                        PackagesKey: OP.PackagesKey,
                                                                                        Work: OP.WorkHours,
                                                                                        Num: OP.Persons,
                                                                                        Duration: OP.DurationHours,
                                                                                        WorkCtr: OP.MainWorkCenter,
                                                                                        Ctrl: OP.ControlKey,
                                                                                        Vendor: OP.Vendor,
                                                                                        Price: OP.Cost,
                                                                                        Currency: OP.Currency,
                                                                                        CostElem: OP.CostElement,
                                                                                        MaterialGroup: OP.MaterialGroup,
                                                                                        LongText: OP.LongText,
                                                                                        PlantInitial: varVhpPlan.Plant,
                                                                                        MaintenanceItemNo: { Id: LookUp(colVhpSavedItems, LocalId = OP.ItemId).SpId, Value: LookUp(colVhpSavedItems, LocalId = OP.ItemId).ItemKey },
                                                                                        MaintenancePlanID: { Id: planId, Value: planKey }
                                                                                    })
                                                                                )
                                                                            },
                                                                            ClearCollect(
                                                                                colVhpSavedOps,
                                                                                ForAll(
                                                                                    Sequence(CountRows(opRecs)) As N,
                                                                                    {
                                                                                        LocalItemId: Index(srcOps, N.Value).ItemId,
                                                                                        OperationNo: Index(srcOps, N.Value).OperationNo,
                                                                                        SpId: Index(opRecs, N.Value).ID,
                                                                                        TaskKey: "TI" & Text(Index(opRecs, N.Value).ID - taskOff, "0000")
                                                                                    }
                                                                                )
                                                                            );
                                                                            Patch(
                                                                                TaskListMain,
                                                                                opRecs,
                                                                                ForAll(colVhpSavedOps As S, { TaskItemID: S.TaskKey })
                                                                            )
                                                                        )
                                                                    )
                                                                );
                                        
                                                                // --- 5. materialer -------------------------
                                                                // Peger paa operationens TaskItemID, ikke paa
                                                                // itemet. Et materiale hoerer til EEN
                                                                // operation - det er den relation SAP har.
                                                                With(
                                                                    { srcMats: Filter(colVhpMaterials As MT, !IsBlank(MT.MaterialNo)) },
                                                                    If(
                                                                        CountRows(srcMats) > 0,
                                                                        Patch(
                                                                            MD_TasklistMaterial,
                                                                            ForAll(srcMats, Defaults(MD_TasklistMaterial)),
                                                                            ForAll(
                                                                                srcMats As MT,
                                                                                {
                                                                                    MaterialNo: MT.MaterialNo,
                                                                                    PlanKey: planKey,
                                                                                    ItemKey: LookUp(
                                                                                        colVhpSavedItems, LocalId = MT.ItemId
                                                                                    ).ItemKey,
                                                                                    TaskItemID: LookUp(
                                                                                        colVhpSavedOps,
                                                                                        LocalItemId = MT.ItemId && OperationNo = MT.OperationNo
                                                                                    ).TaskKey,
                                                                                    OperationNo: MT.OperationNo,
                                                                                    Quantity: MT.Quantity,
                                                                                    MaterialText: MT.Description,
                                                                                    Unit: MT.Unit,
                                                                                    LineId: MT.LineId
                                                                                }
                                                                            )
                                                                        )
                                                                    )
                                                                );
                                        
                                                                // --- 6. dokumenter -------------------------
                                                                // OperationsKey er ';0010;0020;'. Tom (';')
                                                                // betyder hele itemet.
                                                                //
                                                                // UploadStatus skrives som Pending.
                                                                //
                                                                // Her stod, at FLOWET retter den bagefter. Det
                                                                // goer det ikke: BioSap-TaskListAttachment
                                                                // bestaar af eet CreateFile og et svar, og
                                                                // roerer aldrig denne liste. Raekken bliver
                                                                // staaende som Pending, indtil appen selv
                                                                // retter den - den kender flowets svar.
                                                                // Se docs/18-materialer-og-attachments.md.
                                                                With(
                                                                    { srcAtt: Filter(colVhpAttachments As AT, !IsBlank(AT.FileName)) },
                                                                    If(
                                                                        CountRows(srcAtt) > 0,
                                                                        Patch(
                                                                            MD_TasklistAttachment,
                                                                            ForAll(srcAtt, Defaults(MD_TasklistAttachment)),
                                                                            ForAll(
                                                                                srcAtt As AT,
                                                                                {
                                                                                    FileName: AT.FileName,
                                                                                    PlanKey: planKey,
                                                                                    ItemKey: LookUp(
                                                                                        colVhpSavedItems, LocalId = AT.ItemId
                                                                                    ).ItemKey,
                                                                                    OperationsKey: Coalesce(AT.OperationsKey, ";"),
                                                                                    FileSize: AT.FileSize,
                                                                                    FileUrl: AT.FileUrl,
                                                                                    UploadStatus: {
                                                                                        Value: Coalesce(AT.Status, "Pending")
                                                                                    }
                                                                                }
                                                                            )
                                                                        )
                                                                    )
                                                                );
                                        
                                                                // --- 7. opsummering til landingssiden ------
                                                                // Hubben laeser KUN denne raekke. Den skal
                                                                // skrives hver gang status aendrer sig,
                                                                // ellers viser oversigten noget forkert.
                                                                Patch(
                                                                    MD_RequestIndex,
                                                                    Coalesce(
                                                                        LookUp(MD_RequestIndex, RequestGuid = varVhpRequestGuid),
                                                                        Defaults(MD_RequestIndex)
                                                                    ),
                                                                    {
                                                        RequestNo: planKey,
                                                        Domain: { Value: "MaintenancePlan" },
                                                        Status: { Value: "Indsendt" },
                                                        StatusStep: 2,
                                                        IsOpen: true,
                                                        RequestGuid: varVhpRequestGuid,
                                                        RequesterEmail: Lower(User().Email),
                                                        RequesterName: User().FullName,
                                                        ShortText: varVhpPlan.PlanText,
                                                        Plant: varVhpPlan.Plant,
                                                        ItemCount: CountRows(Filter(colVhpItems, !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation))),
                                                        SourceItemId: planId,
                                                        AppUrl: "https://apps.powerapps.com/play/e/e0f8f822-d16a-e878-ba4e-fb42bc617e47/a/11fa8d90-868a-45a4-ba23-28f2cf0671a2",
                                                        LastActionOn: Now(),
                                                        LastActionBy: Lower(User().Email)
                                                    }
                                                                );
                                        
                                                                Set(varVhpSaving, false);
                                                                Set(
                                                                    varVhpRuntimeInfo,
                                                                    planKey & " submitted: " & Text(CountRows(colVhpItems)) &
                                                                        " item(s) and " & Text(CountRows(colVhpOperations)) &
                                                                        " operation(s)."
                                                                );
                                                                Notify(planKey & " submitted.", NotificationType.Success)
                                                            )
                                                        )
                                                    )
                                                ),
                                        
                                                Set(varVhpSaving, false);
                                                Set(varVhpRuntimeInfo, "Save failed: " & FirstError.Message);
                                                Notify("Save failed: " & FirstError.Message, NotificationType.Error)
                                            )
                                        )
