App:
  Properties:
    Formulas: |
      =// Vaerkerne. Eneste opslagsliste appen laeser, og den laeses foerst,
      // naar dropdownen aabnes.
      colDomPlants = Sort(ForAll(PlantList As R, { Value: R.Title }), Value);
    OnStart: |
      =ClearCollect(colDomItems, { LocalId: 0, SpId: 0, ItemKey: "", ItemText: "", ChangeType: "", EquipmentNo: "", EquipmentCategory: "", TechObjectType: "", InventoryNo: "", SerialNumber: "", ManufacturerName: "", ManufPartNo: "", ManufSerialNo: "", ManufCountry: "", ConstructionYear: 0, ConstructionMonth: 0, SizeDimension: "", Weight: 0, WeightUnit: "", StartUpDate: "", AcquisitionValue: 0, Currency: "", MaintPlant: "", Location: "", Room: "", PlantSection: "", WorkCenter: "", ABCIndicator: "", SortField: "", PlanningPlant: "", PlannerGroup: "", MainWorkCenter: "", CatalogProfile: "", BusinessArea: "", CostCenter: "", CompanyCode: "", WBSElement: "", FunctionalLocation: "", SuperiorEquipment: "", PositionInFl: "" });
      Clear(colDomItems);

      ClearCollect(colDomAttachments, { LocalId: 0, FileName: "", FileUrl: "", Identifier: "", Selected: false });
      Clear(colDomAttachments);

      ClearCollect(colDomAttUp, { Name: "", Ok: false });
      Clear(colDomAttUp);

      ClearCollect(colDomSaved, { LocalId: 0, SpId: 0, ItemKey: "" });
      Clear(colDomSaved);

      Set(varDomMe, Lower(User().Email));
      Set(varDomStatus, "Kladde");
      Set(varDomReqId, 0);
      Set(varDomRequestNo, "");
      Set(varDomGuid, GUID());
      Set(varDomShortText, "");
      Set(varDomPlant, "");
      Set(varDomActiveItemId, Blank());
      Set(varDomNextLocalId, 0);
      Set(varDomAttJson, "");
      Set(varDomPlayUrl, "https://apps.powerapps.com/play/e/e0f8f822-d16a-e878-ba4e-fb42bc617e47/a/24bf3bbc-601f-480d-a8fe-7cd3180906d1");

      // Aabnet fra landingssiden med ?reqid=<guid>. Den ENESTE datahentning
      // i OnStart, og den koerer kun i det tilfaelde.
      If(
          !IsBlank(Param("reqid")),
          With(
              { hdr: LookUp(EquipmentRequests, RequestGuid = Param("reqid")) },
              If(
                  !IsBlank(hdr),
                  Set(varDomReqId, hdr.ID);
                  Set(varDomRequestNo, hdr.RequestNo);
                  Set(varDomGuid, hdr.RequestGuid);
                  Set(varDomStatus, hdr.Status.Value);
                  Set(varDomShortText, hdr.ShortText);
                  Set(varDomPlant, hdr.Plant);
                  ClearCollect(
                      colDomItems,
                      ForAll(
                          Filter(EquipmentItems, RequestNo = hdr.RequestNo) As R,
                          {
                              LocalId: R.LineId,
                              SpId: R.ID,
                              ItemKey: R.ItemKey,
                              ItemText: R.EquipmentText,
                              ChangeType: Coalesce(R.ChangeType.Value, ""),
                              EquipmentNo: Coalesce(R.EquipmentNo, ""),
                              EquipmentCategory: Coalesce(R.EquipmentCategory.Value, ""),
                              TechObjectType: Coalesce(R.TechObjectType, ""),
                              InventoryNo: Coalesce(R.InventoryNo, ""),
                              SerialNumber: Coalesce(R.SerialNumber, ""),
                              ManufacturerName: Coalesce(R.ManufacturerName, ""),
                              ManufPartNo: Coalesce(R.ManufPartNo, ""),
                              ManufSerialNo: Coalesce(R.ManufSerialNo, ""),
                              ManufCountry: Coalesce(R.ManufCountry, ""),
                              ConstructionYear: Coalesce(R.ConstructionYear, 0),
                              ConstructionMonth: Coalesce(R.ConstructionMonth, 0),
                              SizeDimension: Coalesce(R.SizeDimension, ""),
                              Weight: Coalesce(R.Weight, 0),
                              WeightUnit: Coalesce(R.WeightUnit, ""),
                              StartUpDate: If(IsBlank(R.StartUpDate), "", Text(R.StartUpDate, "yyyy-mm-dd")),
                              AcquisitionValue: Coalesce(R.AcquisitionValue, 0),
                              Currency: Coalesce(R.Currency, ""),
                              MaintPlant: Coalesce(R.MaintPlant, ""),
                              Location: Coalesce(R.Location, ""),
                              Room: Coalesce(R.Room, ""),
                              PlantSection: Coalesce(R.PlantSection, ""),
                              WorkCenter: Coalesce(R.WorkCenter, ""),
                              ABCIndicator: Coalesce(R.ABCIndicator.Value, ""),
                              SortField: Coalesce(R.SortField, ""),
                              PlanningPlant: Coalesce(R.PlanningPlant, ""),
                              PlannerGroup: Coalesce(R.PlannerGroup, ""),
                              MainWorkCenter: Coalesce(R.MainWorkCenter, ""),
                              CatalogProfile: Coalesce(R.CatalogProfile, ""),
                              BusinessArea: Coalesce(R.BusinessArea, ""),
                              CostCenter: Coalesce(R.CostCenter, ""),
                              CompanyCode: Coalesce(R.CompanyCode, ""),
                              WBSElement: Coalesce(R.WBSElement, ""),
                              FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                              SuperiorEquipment: Coalesce(R.SuperiorEquipment, ""),
                              PositionInFl: Coalesce(R.PositionInFl, "")
                          }
                      )
                  );
                  Set(varDomNextLocalId, Coalesce(Max(colDomItems, LocalId), 0))
              )
          )
      )
    StartScreen: |-
        =ScreenEquipment
    Theme: |-
        =PowerAppsTheme
