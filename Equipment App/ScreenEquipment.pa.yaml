                        Icon: |-
                            ="Send"
                        Layout: |-
                            =ButtonLayout.IconBefore
                        OnSelect: |-
                            =Set(varDomConfirmSubmit, false);
                            Set(varDomSaving, true);
                            If(
                                CountRows(Filter(colDomRows, Status = "valid")) = 0,
                                Notify("There are no completed rows to submit.", NotificationType.Warning),
                            
                                IfError(
                                    If(
                                        IsBlank(varDomRequestGuid),
                                        Set(varDomRequestGuid, Text(GUID()))
                                    );
                                    Set(
                                        varDomIdx,
                                        Patch(
                                            MD_RequestIndex,
                                            Coalesce(
                                                LookUp(MD_RequestIndex, RequestGuid = varDomRequestGuid),
                                                Defaults(MD_RequestIndex)
                                            ),
                                            {
                                                RequestNo: Coalesce(varDomRequestNo, varDomRequestGuid),
                                                Domain: { Value: "Equipment" },
                                                Status: { Value: "Indsendt" },
                                                StatusStep: 2,
                                                IsOpen: true,
                                                RequesterEmail: varDomMe,
                                                RequesterName: User().FullName,
                                                ShortText: "Equipment: " & CountRows(Filter(colDomRows, Status = "valid")) & " row(s)",
                                                Plant: First(Filter(colDomRows, Status = "valid")).Plant,
                                                ItemCount: CountRows(Filter(colDomRows, Status = "valid")),
                                                RequestGuid: varDomRequestGuid,
                                                AppUrl: "https://apps.powerapps.com/play/e/e0f8f822-d16a-e878-ba4e-fb42bc617e47/a/24bf3bbc-601f-480d-a8fe-7cd3180906d1?reqid=" & varDomRequestGuid,
                                                LastActionOn: Now(),
                                                LastActionBy: varDomMe
                                            }
                                        )
                                    );
                            
                                    // Foerste gang bliver indeksraekkens eget ID til nummeret
                                    If(
                                        IsBlank(varDomRequestNo),
                                        Set(varDomRequestNo, "EQ-" & Text(varDomIdx.ID, "000000"));
                                        Patch(MD_RequestIndex, varDomIdx, { RequestNo: varDomRequestNo })
                                    );
                            
                                    Patch(
                                        EquipmentItems,
                                        ForAll(Filter(colDomRows, Status = "valid") As X, { ID: X.RowId }),
                                        ForAll(
                                            Filter(colDomRows, Status = "valid"),
                                            {
                                                RequestNo: varDomRequestNo,
                                                RequestGuid: varDomRequestGuid,
                                                RowStatus: { Value: "submitted" },
                                                SubmittedOn: Now()
                                            }
                                        )
                                    );
                            
                                    ClearCollect(
                                        colDomRows,
                                        ForAll(
                                            Filter(EquipmentItems, RequesterEmail = varDomMe) As R,
                                            {
                                                RowId: R.ID,
                                                ItemKey: Coalesce(R.ItemKey, ""),
                                                RequestNo: Coalesce(R.RequestNo, ""),
                                                Status: Coalesce(R.RowStatus.Value, "valid"),
                                                FileCount: Coalesce(R.FileCount, 0),
                                                Description: Coalesce(R.Description, ""),
                                                Plant: Coalesce(R.Plant, ""),
                                                RequestType: Coalesce(R.RequestType, ""),
                                                EquipmentNumber: Coalesce(R.EquipmentNumber, ""),
                                                EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                                Manufacturer: Coalesce(R.Manufacturer, ""),
                                                TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                                SerialNumber: Coalesce(R.SerialNumber, ""),
                                                FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                                FunctionalLocation1: Coalesce(R.FunctionalLocation1, ""),
                                                FunctionalLocation2: Coalesce(R.FunctionalLocation2, ""),
                                                ClassData: Coalesce(R.ClassData, ""),
                                                RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                                Placement: Coalesce(R.Placement, ""),
                                                WarrantyStart: R.WarrantyStart,
                                                WarrantyEnd: R.WarrantyEnd
                                            }
                                        )
                                    );
                            
                                    Set(varDomInfo, "Submitted: " & varDomRequestNo);
                                    Notify("Submitted as " & varDomRequestNo & " - see it on the landing page.", NotificationType.Success),
                            
                                    Set(varDomInfo, "It failed: " & FirstError.Message);
                                    Notify("It failed: " & FirstError.Message, NotificationType.Error)
                                )
                            );
                            Set(varDomSaving, false)
                        RadiusBottomLeft: |-
                            =10
                        RadiusBottomRight: |-
                            =10
                        RadiusTopLeft: |-
                            =10
                        RadiusTopRight: |-
                            =10
                        Size: |-
                            =14
                        Text: |-
                            ="Submit"
                        VerticalAlign: |-
                            =VerticalAlign.Middle
                        Width: |-
                            =106
