                                  Set(varDomFWarrantyStart, ThisItem.WarrantyStart);
                                  Set(varDomFWarrantyEnd, ThisItem.WarrantyEnd);
                                  Set(varDomFLongText, ThisItem.LongText);
                                  If(
                                      ThisItem.FileCount > 0 &&
                                      CountRows(Filter(colDomAttachments, RowId = ThisItem.RowId)) = 0,
                                      Set(
                                          varDomAttJson,
                                          'BioSap-GetSubmittedAttachments'.Run("TaskListDocuments/" & LookUp(colDomRows, RowId = varDomActiveRowId).ItemKey).files
                                      );
                                      RemoveIf(colDomAttachments, RowId = varDomActiveRowId);
                                      Collect(
                                          colDomAttachments,
                                          ForAll(
                                              ParseJSON(Coalesce(varDomAttJson, "[]")) As J,
                                              {
                                                  RowId: varDomActiveRowId,
                                                  FileName: Text(J.Name),
                                                  FileUrl: Text(J.Link),
                                                  Identifier: Text(J.Identifier),
                                                  Selected: false
                                              }
                                          )
                                      );
                                      With(
                                          { n: CountRows(Filter(colDomAttachments, RowId = varDomActiveRowId)) },
                                          Patch(
                                              EquipmentItems,
                                              LookUp(EquipmentItems, ID = varDomActiveRowId),
                                              { FileCount: n }
                                          );
                                          UpdateIf(
                                              colDomRows,
                                              RowId = varDomActiveRowId,
                                              { FileCount: n }
                                          )
                                      )
                                  )
