                Children:
                  - btnDomAttUpload:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: |-
                            ="Upload to SharePoint"
                        Align: |-
                            =Align.Center
                        AlignInContainer: |-
                            =AlignInContainer.Center
                        BasePaletteColor: |-
                            =C.'color-brand-primary'
                        Color: |-
                            =C.'text-on-primary'
                        DisplayMode: |-
                            =If(IsBlank(varDomDocsId), DisplayMode.Disabled, DisplayMode.Edit)
                        Font: |-
                            =Font.'Segoe UI'
                        FontWeight: |-
                            =FontWeight.Semibold
                        Height: |-
                            =36
                        Layout: |-
                            =ButtonLayout.TextOnly
                        LayoutMinWidth: |-
                            =0
                        OnSelect: |-
                            =If(
                                IsBlank(LookUp(colDomRows, RowId = varDomDocsId).ItemKey),
                                Notify("Save the row first - the folder is named after the row key.", NotificationType.Warning),
                            
                                If(
                                    CountRows(attDomPicker.Attachments) = 0,
                                    Notify("Choose one or more files first.", NotificationType.Warning),
                            
                                    ClearCollect(
                                        colDomAttUp,
                                        ForAll(
                                            attDomPicker.Attachments As F,
                                            {
                                                Name: F.Name,
                                                Ok: IfError(
                                                    Lower(
                                                        Text(
                                                            'BioSap-TaskListAttachment'.Run(
                                                                LookUp(colDomRows, RowId = varDomDocsId).ItemKey,
                                                                { file: { contentBytes: F.Value, name: F.Name } }
                                                            ).flowrunsuccess
                                                        )
                                                    ) = "true",
                                                    false
                                                )
                                            }
                                        )
                                    );
                                    Reset(attDomPicker);
                            
                                    Set(
                                        varDomAttJson,
                                        'BioSap-GetSubmittedAttachments'.Run("TaskListDocuments/" & LookUp(colDomRows, RowId = varDomDocsId).ItemKey).files
                                    );
                                    RemoveIf(colDomAttachments, RowId = varDomDocsId);
                                    Collect(
                                        colDomAttachments,
                                        ForAll(
                                            ParseJSON(Coalesce(varDomAttJson, "[]")) As J,
                                            {
                                                RowId: varDomDocsId,
                                                FileName: Text(J.Name),
                                                FileUrl: Text(J.Link),
                                                Identifier: Text(J.Identifier),
                                                Selected: false
                                            }
                                        )
                                    );
                                    With(
                                        { n: CountRows(Filter(colDomAttachments, RowId = varDomDocsId)) },
                                        Patch(
                                            EquipmentItems,
                                            LookUp(EquipmentItems, ID = varDomDocsId),
                                            { FileCount: n }
                                        );
                                        UpdateIf(
                                            colDomRows,
                                            RowId = varDomDocsId,
                                            { FileCount: n }
                                        )
                                    );
                            
                                    If(
                                        CountRows(Filter(colDomAttUp, Ok = false)) > 0,
                                        Notify(
                                            "SharePoint refused: " &
                                            Concat(Filter(colDomAttUp, Ok = false), Name, ", "),
                                            NotificationType.Error
                                        ),
                                        Notify("Document(s) uploaded.", NotificationType.Success)
                                    )
                                )
                            )
