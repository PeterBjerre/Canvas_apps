      Set(varFlStale, false);
      Set(varFlInfo, "Ready.");
      Set(varFlExportJson, "");
      Set(varFlExportOpen, false);
      Set(varFlPayload, "");
      Set(varFlReq, Blank());
      Set(varFlIdx, Blank())
