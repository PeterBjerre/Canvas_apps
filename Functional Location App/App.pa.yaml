      Clear(colFlTrm);

      ClearCollect(colFlTabs, { Key: "", Label: "" });
      Clear(colFlTabs);

      ClearCollect(colFlSp, { RowGuid: "", ID: 0 });
      Clear(colFlSp);

      ClearCollect(colFlSaveErrors, { Where: "", Msg: "" });
      Clear(colFlSaveErrors);

      ClearCollect(colFlLoad, { RowGuid: "", RowNo: 0, SpId: 0, FL: "", Description: "", KksType: "", AssignedClass: "", Status: "", FirstIssue: "", FirstWarning: "", IssueCount: 0, WarningCount: 0, Json: "" });
      Clear(colFlLoad);

      ClearCollect(colAppPrefs, { Dark: false });
      Clear(colAppPrefs);

      // TEMAVALGET. Skal staa foerst: alt hvad skaermen tegner, laeser C,
      // og C laeser darkModeEnabled.
      //
      // IfError fordi SaveData/LoadData ikke findes i Studio. Uden den
      // stopper hele OnStart, hver gang nogen trykker Preview.
      IfError(LoadData(colAppPrefs, "prefs", true), Blank());
      Set(
          darkModeEnabled,
          Coalesce(
              If(Lower(Param("theme")) = "dark", true,
                 Lower(Param("theme")) = "light", false),
              First(colAppPrefs).Dark,
              false
          )
      );

      Set(varFlMe, Lower(User().Email));
      Set(varFlRequestGuid, "");
      Set(varFlRequestNo, "");
      // Kladde / Indsendt - som i FunctionalLocationRequests.Status.
      Set(varFlStatus, "");
      Set(varFlNextRowNo, 1);
      // Aktiv klassefane. "ALL" som i renderClassTabs.
      Set(varFlTab, "ALL");
      // Detaljeruden: raekkens RowGuid og den klasse, den blev aabnet i.
      Set(varFlDetailRow, "");
      Set(varFlDetailClass, "");
      Set(varFlShowEmpty, false);
