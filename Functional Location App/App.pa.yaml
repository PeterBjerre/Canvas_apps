      Clear(colFlIssues);

      ClearCollect(colFlIssuesRaw, { RowGuid: "", Ord: 0, Sev: "", Code: "", Field: "", Short: "", Msg: "" });
      Clear(colFlIssuesRaw);

      ClearCollect(colFlCalc, { RowGuid: "", RowNo: 0, SpId: 0, FL: "", Description: "", IsBlankRow: false, KksType: "", SynIssue: "", Legacy: false, K12: "", K17: "", Cls: "", SpoolCls: "", MFlReq: "", MDup: "", MDescReq: "", MDescLen: "", MKks: "", MRules: "", MPlant: "", MFunc: "", MU: "", MBrMiss: "", MBrK17: "", MComp: "", MEq18: "", MEq12: "", MNoCls: "" });
