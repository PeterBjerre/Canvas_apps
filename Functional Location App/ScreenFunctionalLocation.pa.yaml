Screens:
  ScreenFunctionalLocation:
    Properties:
      Fill: |-
          =C.'bg-app'
      OnVisible: |-
          =Set(varFlMe, Lower(User().Email));
          If(
              !IsBlank(Param("reqid")) && varFlRequestGuid <> Param("reqid"),
              Set(varFlRequestGuid, Param("reqid"));
              Set(varFlReq, LookUp(FunctionalLocationRequests, RequestGuid = varFlRequestGuid));
              Set(varFlRequestNo, Coalesce(varFlReq.RequestNo, ""));
              Set(varFlStatus, Coalesce(varFlReq.Status.Value, "Kladde"));
              ClearCollect(
                  colFlLoad,
                  ForAll(
                      Filter(FunctionalLocationItems, RequestGuid = varFlRequestGuid) As I,
                      {
                          RowGuid: I.RowGuid, RowNo: I.RowNo, SpId: I.ID,
                          FL: I.FunctionalLocation, Description: I.Description,
                          KksType: I.KksType, AssignedClass: I.AssignedClass,
                          Status: I.RowStatus.Value, FirstIssue: I.FirstIssue,
                          IssueCount: I.IssueCount, Json: Coalesce(I.SpoolValuesJson, "[]")
                      }
                  )
              );
              ClearCollect(
                  colFlRows,
                  ForAll(
                      Sort(colFlLoad, RowNo) As I,
                      {
                          RowGuid: I.RowGuid, RowNo: I.RowNo, SpId: I.SpId, FL: I.FL,
                          Description: I.Description, KksType: I.KksType,
                          AssignedClass: I.AssignedClass, Status: I.Status,
                          FirstIssue: I.FirstIssue, FirstWarning: "",
                          IssueCount: I.IssueCount, WarningCount: 0
                      }
                  )
              );
              ClearCollect(
                  colFlVals,
                  Ungroup(
                      ForAll(
                          colFlLoad As I,
                          {
                              Vals: ForAll(
                                  Table(ParseJSON(I.Json)) As J,
                                  { RowGuid: I.RowGuid, Field: Text(J.Value.field), Value: Text(J.Value.value) }
                              )
                          }
                      ),
                      Vals
                  )
              );
              Set(varFlNextRowNo, Max(colFlRows, RowNo) + 1);
              // Beskederne gemmes ikke - de regnes. Verify skal koeres, foer der kan
              // indsendes (FL68).
              Set(varFlStale, true);
              Set(varFlInfo, "Loaded " & varFlRequestNo & " - press Verify to check the rows again.")
          );
          If(CountRows(colFlRows) = 0, Collect(colFlRows, { RowGuid: Text(GUID()), RowNo: varFlNextRowNo, SpId: 0, FL: "", Description: "", KksType: "", AssignedClass: "", Status: "draft", FirstIssue: "", FirstWarning: "", IssueCount: 0, WarningCount: 0 }); Set(varFlNextRowNo, varFlNextRowNo + 1))
    Children:
      - conFlRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderStyle: |-
                =BorderStyle.None
            DropShadow: |-
                =DropShadow.None
            Fill: |-
                =C.'bg-app'
            FillPortions: |-
                =0
            Height: |-
                =Parent.Height
            LayoutAlignItems: |-
                =LayoutAlignItems.Stretch
            LayoutDirection: |-
                =LayoutDirection.Vertical
            LayoutGap: |-
                =0
            LayoutMinWidth: |-
                =0
            LayoutOverflowX: |-
                =LayoutOverflow.Hide
            LayoutOverflowY: |-
                =LayoutOverflow.Hide
            Width: |-
                =Parent.Width
          Children:
            - conFlHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderStyle: |-
                      =BorderStyle.None
                  DropShadow: |-
                      =DropShadow.None
                  Fill: |-
                      =C.'bg-app'
                  FillPortions: |-
                      =0
                  Height: |-
                      =25 + (0 + (Max((55), (22), (36), (36), (36), (36))) * 1 + 0)
                  LayoutAlignItems: |-
                      =LayoutAlignItems.Stretch
                  LayoutDirection: |-
                      =LayoutDirection.Vertical
                  LayoutGap: |-
                      =10
                  LayoutMinWidth: |-
                      =0
                  LayoutOverflowX: |-
                      =LayoutOverflow.Hide
                  LayoutOverflowY: |-
                      =LayoutOverflow.Hide
                  PaddingBottom: |-
                      =0
                  PaddingLeft: |-
                      =24
                  PaddingRight: |-
                      =34
                  PaddingTop: |-
                      =14
                  Width: |-
                      =Parent.Width
                Children:
                  - conFlBar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderStyle: |-
                            =BorderStyle.None
                        DropShadow: |-
                            =DropShadow.None
                        FillPortions: |-
                            =0
                        Height: |-
                            =0 + (Max((55), (22), (36), (36), (36), (36))) * 1 + 0
                        LayoutAlignItems: |-
                            =LayoutAlignItems.Center
                        LayoutDirection: |-
                            =LayoutDirection.Horizontal
                        LayoutGap: |-
                            =10
                        LayoutMinWidth: |-
                            =0
                        LayoutOverflowX: |-
                            =LayoutOverflow.Hide
                        LayoutOverflowY: |-
                            =LayoutOverflow.Hide
                        Width: |-
                            =Parent.Width
                      Children:
                        - conFlBarLeft:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: |-
                                  =BorderStyle.None
                              DropShadow: |-
                                  =DropShadow.None
                              FillPortions: |-
                                  =0
                              Height: |-
                                  =55
                              LayoutAlignItems: |-
                                  =LayoutAlignItems.Stretch
                              LayoutDirection: |-
                                  =LayoutDirection.Vertical
                              LayoutGap: |-
                                  =2
                              LayoutMinWidth: |-
                                  =0
                              LayoutOverflowX: |-
                                  =LayoutOverflow.Hide
                              LayoutOverflowY: |-
                                  =LayoutOverflow.Hide
                              Width: |-
                                  =Max(0, ((((App.Width)) - 24 - 34)) - (If(LayoutRank >= 3, (220) + 10, 0)) - ((100) + 10) - ((120) + 10) - ((78) + 10) - ((120) + 10) - 2)
                            Children:
                              - txtFlTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: |-
                                        ="Functional Location - Spool"
                                    BorderStyle: |-
                                        =BorderStyle.None
                                    BorderThickness: |-
                                        =0
                                    Color: |-
                                        =C.'text-primary'
                                    Fill: |-
                                        =RGBA(0, 0, 0, 0)
                                    Font: |-
                                        =Font.'Segoe UI'
                                    FontWeight: |-
                                        =FontWeight.Semibold
                                    Height: |-
                                        =33
                                    PaddingBottom: |-
                                        =0
                                    PaddingLeft: |-
                                        =0
                                    PaddingRight: |-
                                        =0
                                    PaddingTop: |-
                                        =0
                                    Size: |-
                                        =22
                                    Text: |-
                                        ="Functional Location - Spool"
                                    Wrap: |-
                                        =false
                              - txtFlSub:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: |-
                                        ="Verify KKS codes, classes and spool fields - and pass the request on."
                                    BorderStyle: |-
                                        =BorderStyle.None
                                    BorderThickness: |-
                                        =0
                                    Color: |-
                                        =C.'text-muted'
                                    Fill: |-
                                        =RGBA(0, 0, 0, 0)
                                    Font: |-
                                        =Font.'Segoe UI'
                                    Height: |-
                                        =20
                                    PaddingBottom: |-
                                        =0
                                    PaddingLeft: |-
                                        =0
                                    PaddingRight: |-
                                        =0
                                    PaddingTop: |-
                                        =0
                                    Size: |-
                                        =13
                                    Text: |-
                                        ="Verify KKS codes, classes and spool fields - and pass the request on."
                                    Wrap: |-
                                        =false
                        - txtFlCount:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: |-
                                  ="Rows: " & CountRows(colFlRows) & "  Ready: " & CountRows(Filter(colFlRows, Status = "valid" || Status = "warning")) & "  Issues: " & CountRows(Filter(colFlRows, Status = "invalid"))
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              BorderStyle: |-
                                  =BorderStyle.None
                              BorderThickness: |-
                                  =0
                              Color: |-
                                  =C.'text-muted'
                              Fill: |-
                                  =C.'state-neutral-bg'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =22
                              LayoutMinWidth: |-
                                  =220
                              PaddingBottom: |-
                                  =0
                              PaddingLeft: |-
                                  =10
                              PaddingRight: |-
                                  =10
                              PaddingTop: |-
                                  =0
                              RadiusBottomLeft: |-
                                  =12
                              RadiusBottomRight: |-
                                  =12
                              RadiusTopLeft: |-
                                  =12
                              RadiusTopRight: |-
                                  =12
                              Size: |-
                                  =11
                              Text: |-
                                  ="Rows: " & CountRows(colFlRows) & "  Ready: " & CountRows(Filter(colFlRows, Status = "valid" || Status = "warning")) & "  Issues: " & CountRows(Filter(colFlRows, Status = "invalid"))
                              Visible: |-
                                  =LayoutRank >= 3
                              Width: |-
                                  =220
                              Wrap: |-
                                  =false
                        - btnFlVerify:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: |-
                                  ="Verify"
                              Align: |-
                                  =Align.Center
                              AlignInContainer: |-
                                  =AlignInContainer.Center
                              BasePaletteColor: |-
                                  =C.'color-brand-primary'
                              Color: |-
                                  =C.'text-on-primary'
                              Font: |-
                                  =Font.'Segoe UI'
                              FontWeight: |-
                                  =FontWeight.Semibold
                              Height: |-
                                  =36
                              Layout: |-
                                  =ButtonLayout.TextOnly
                              LayoutMinWidth: |-
                                  =100
                              OnSelect: |-
                                  =// B. Syntaks, klasse og raekkebeskeder (FL4-FL24)
                                  ClearCollect(
                                      colFlCalc,
                                      ForAll(
                                          colFlRows As R,
                                          With(
                                              { fl: R.FL, d: Trim(R.Description) },
                                              With(
                                                  {
                                                      k0: Left(fl, 3), k7: Mid(fl, 7, 3), k12: Mid(fl, 12, 2),
                                                      k17: Mid(fl, 17, 2), k18: Mid(fl, 18, 2),
                                                      blankRow: IsBlank(fl) && IsBlank(d),
                                                      // FL8-FL10: syntaksen
                                                      ok: (IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}[A-Z]{2}[0-9]{3}[A-Z]$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}[A-Z]{2}[0-9]{3}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s]U[A-Z]{2}[0-9]{2}UE[0-9]{3}(FP|FD|FG|FH)$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s]U[A-Z]{2}[0-9]{2}UF[0-9]{3}[DGH]$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}[A-Z]{2}[0-9]{3}[A-Z\s][\-A-Z]{2}[0-9]{2}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}\s{5}[A-Za-z0-9_\s][\-A-Z]{2}[0-9]{2}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2,3}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{1,3}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{4}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}\s{1}[0-9]{4}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}\s{3}[0-9]{4}$")),
                                                      kv: (IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}\s{1}[0-9]{4}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}\s{3}[0-9]{4}$")),
                                                      ka: (IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{4}$"))
                                                  },
                                                  With(
                                                      {
                                                          legacy: !IsBlank(fl) && !ok && IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}[A-Z]{2}[0-9]{3}[A-Z\s][\-A-Z]{2}[0-9]{1,3}$"),
                                                          synKab: ok && (kv || ka),
                                                          live: !IsBlank(fl) && !blankRow && nfFlRulesLoaded,
                                                          agg: LookUp(nfFlAggregate, Key = k12),
                                                          comp: LookUp(nfFlComponent, Key = k18),
                                                          br: k12 = "UE" || k12 = "UF"
                                                      },
                                                      With(
                                                          {
                                                              // FL16-FL22: klassebestemmelsen (fl-rule-engine.js:138-235)
                                                              p18: live && !synKab && Len(k18) = 2,
                                                              p12: live && !synKab && Len(k18) <> 2,
                                                              isMkp: (IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}[A-Z]{2}[0-9]{3}(FD|FG|FH|FW|FC)$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}[0-9]{2}[A-Z]{2}[0-9]{3}FP$")),
                                                              isShort: (IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{2}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{1}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2,3}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-Z]{3}$") || IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][C-Z][A-Z]{2}[0-9]{2}$")),
                                                              isElf: IsMatch(fl, "^[A-Z]{3}[0-9]{2}[0-9\s][A-B][A-Z]{2}[0-9]{2}$")
                                                          },
                                                          With(
                                                              {
                                                                  MFlReq: If(!blankRow && IsBlank(fl), "FL required.", ""),
                                                                  MDup: If(!blankRow && !IsBlank(fl) && CountRows(Filter(colFlRows As X, X.FL = fl)) > 1, "Duplicate FL.", ""),
                                                                  MDescReq: If(!blankRow && IsBlank(d), "Description required before Ready for SAP.", ""),
                                                                  MDescLen: If(!blankRow && Len(d) > 40, "Description > 40.", ""),
                                                                  MKks: If(!blankRow && !IsBlank(fl) && !ok && !legacy, "KKS invalid.", ""),
                                                                  MRules: If(!blankRow && !IsBlank(fl) && !nfFlRulesLoaded, "Rules data missing.", ""),
                                                                  MPlant: If(live && !(k0 in nfFlPlants.Key), "Plant key invalid.", ""),
                                                                  MFunc: If(live && nfFlHasFunctionKeys && !(!("0" in k7) && ("0" & k7 & "0") exactin nfFlFunctionKeys), "Function key invalid.", ""),
                                                                  MU: If(live && br && Left(k7, 1) <> "U", "UF/UE requires U function key.", ""),
                                                                  MBrMiss: If(live && br && IsBlank(LookUp(nfFlBr18, Key12 = k12)), "BR18 rules missing for " & k12 & ".", ""),
                                                                  MBrK17: If(live && br && !IsBlank(LookUp(nfFlBr18, Key12 = k12)) && IsBlank(LookUp(nfFlBr18, Key12 = k12 && Key17 = k17)), "BR18 key17 invalid for " & k12 & ".", ""),
                                                                  MComp: If(p18 && IsBlank(comp), "Component key invalid.", ""),
                                                                  MEq18: If(p18 && IsBlank(agg), "Equipment key invalid.", ""),
                                                                  MEq12: If(p12 && IsBlank(agg) && isMkp, "Equipment key invalid.", ""),
                                                                  MNoCls: If(p12 && IsBlank(agg) && !isMkp && !isShort && !isElf, "Class not determined.", ""),
                                                                  cls: If(
                                                                      !live, "",
                                                                      synKab, "KAB",
                                                                      p18, If(!IsBlank(comp) && !IsBlank(agg), comp.Cls, ""),
                                                                      !IsBlank(agg), agg.Cls,
                                                                      isMkp, "",
                                                                      isShort, "NO CLASS",
                                                                      isElf, "ELF",
                                                                      ""
                                                                  )
                                                              },
                                                              With(
                                                                  {
                                                                      // FL23: ingen klasse og ingen fejl -> NO CLASS
                                                                      cls2: If(blankRow, "", IsBlank(cls) && (If(IsBlank(MFlReq), 0, 1) + If(IsBlank(MDup), 0, 1) + If(IsBlank(MDescReq), 0, 1) + If(IsBlank(MDescLen), 0, 1) + If(IsBlank(MKks), 0, 1) + If(IsBlank(MRules), 0, 1) + If(IsBlank(MPlant), 0, 1) + If(IsBlank(MFunc), 0, 1) + If(IsBlank(MU), 0, 1) + If(IsBlank(MBrMiss), 0, 1) + If(IsBlank(MBrK17), 0, 1) + If(IsBlank(MComp), 0, 1) + If(IsBlank(MEq18), 0, 1) + If(IsBlank(MEq12), 0, 1) + If(IsBlank(MNoCls), 0, 1)) = 0, "NO CLASS", cls)
                                                                  },
                                                                  {
                                                                      RowGuid: R.RowGuid, RowNo: R.RowNo, SpId: R.SpId,
                                                                      FL: fl, Description: d, IsBlankRow: blankRow,
                                                                      KksType: If(blankRow || IsBlank(fl), "", ok, If(kv, "KKSKV", ka, "KKSKA", "KKS"), legacy, "KKS", ""),
                                                                      SynIssue: If(!IsBlank(fl) && !ok && !legacy, "KKS invalid.", ""),
                                                                      Legacy: !blankRow && legacy,
                                                                      K12: k12, K17: k17,
                                                                      Cls: cls2,
                                                                      SpoolCls: Coalesce(cls2, "NO CLASS"),
                                                                      MFlReq: MFlReq, MDup: MDup, MDescReq: MDescReq, MDescLen: MDescLen, MKks: MKks, MRules: MRules, MPlant: MPlant, MFunc: MFunc, MU: MU, MBrMiss: MBrMiss, MBrK17: MBrK17, MComp: MComp, MEq18: MEq18, MEq12: MEq12, MNoCls: MNoCls
                                                                  }
                                                              )
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                  );
                                  
                                  // C. Meddelelsestabellen - raekke + spool (FL30-FL53)
                                  ClearCollect(
                                      colFlIssuesRaw,
                                      ForAll(Filter(colFlCalc, !IsBlank(MFlReq)) As R,
                                          { RowGuid: R.RowGuid, Ord: 1, Sev: "Error", Code: "FL4", Field: "FUNCTIONAL LOCATION", Short: R.MFlReq, Msg: R.MFlReq }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MDup)) As R,
                                          { RowGuid: R.RowGuid, Ord: 2, Sev: "Error", Code: "FL5", Field: "FUNCTIONAL LOCATION", Short: R.MDup, Msg: R.MDup }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MDescReq)) As R,
                                          { RowGuid: R.RowGuid, Ord: 3, Sev: "Error", Code: "FL6", Field: "DESCRIPTION", Short: R.MDescReq, Msg: R.MDescReq }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MDescLen)) As R,
                                          { RowGuid: R.RowGuid, Ord: 4, Sev: "Error", Code: "FL7", Field: "DESCRIPTION", Short: R.MDescLen, Msg: R.MDescLen }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MKks)) As R,
                                          { RowGuid: R.RowGuid, Ord: 5, Sev: "Error", Code: "FL10", Field: "FUNCTIONAL LOCATION", Short: R.MKks, Msg: R.MKks }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MRules)) As R,
                                          { RowGuid: R.RowGuid, Ord: 6, Sev: "Error", Code: "FL24", Field: "FUNCTIONAL LOCATION", Short: R.MRules, Msg: R.MRules }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MPlant)) As R,
                                          { RowGuid: R.RowGuid, Ord: 7, Sev: "Error", Code: "FL11", Field: "FUNCTIONAL LOCATION", Short: R.MPlant, Msg: R.MPlant }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MFunc)) As R,
                                          { RowGuid: R.RowGuid, Ord: 8, Sev: "Error", Code: "FL12", Field: "FUNCTIONAL LOCATION", Short: R.MFunc, Msg: R.MFunc }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MU)) As R,
                                          { RowGuid: R.RowGuid, Ord: 9, Sev: "Error", Code: "FL13", Field: "FUNCTIONAL LOCATION", Short: R.MU, Msg: R.MU }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MBrMiss)) As R,
                                          { RowGuid: R.RowGuid, Ord: 10, Sev: "Error", Code: "FL14", Field: "FUNCTIONAL LOCATION", Short: R.MBrMiss, Msg: R.MBrMiss }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MBrK17)) As R,
                                          { RowGuid: R.RowGuid, Ord: 11, Sev: "Error", Code: "FL15", Field: "FUNCTIONAL LOCATION", Short: R.MBrK17, Msg: R.MBrK17 }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MComp)) As R,
                                          { RowGuid: R.RowGuid, Ord: 12, Sev: "Error", Code: "FL17", Field: "FUNCTIONAL LOCATION", Short: R.MComp, Msg: R.MComp }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MEq18)) As R,
                                          { RowGuid: R.RowGuid, Ord: 13, Sev: "Error", Code: "FL17", Field: "FUNCTIONAL LOCATION", Short: R.MEq18, Msg: R.MEq18 }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MEq12)) As R,
                                          { RowGuid: R.RowGuid, Ord: 14, Sev: "Error", Code: "FL19", Field: "FUNCTIONAL LOCATION", Short: R.MEq12, Msg: R.MEq12 }),
                                      ForAll(Filter(colFlCalc, !IsBlank(MNoCls)) As R,
                                          { RowGuid: R.RowGuid, Ord: 15, Sev: "Error", Code: "FL22", Field: "FUNCTIONAL LOCATION", Short: R.MNoCls, Msg: R.MNoCls }),
                                      ForAll(Filter(colFlCalc, Legacy) As R,
                                          { RowGuid: R.RowGuid, Ord: 50, Sev: "Warning", Code: "FL9", Field: "FUNCTIONAL LOCATION", Short: "Legacy format.", Msg: "Legacy format." }),
                                      DropColumns(
                                          Ungroup(
                                              ForAll(
                                                  Filter(colFlCalc, !IsBlankRow) As R,
                                                  {
                                                      Items: Filter(
                                                          ForAll(
                                                              With({ sc: R.SpoolCls }, Filter(nfFlPlan, Cls = sc && Ord > 0)) As P,
                                                              With(
                                                                  { v: Trim(Switch(P.Field,
                                          "STRINDICATOR", R.KksType,
                                          "STR. INDICATOR", R.KksType,
                                          "FUNCTIONAL LOCATION", R.FL,
                                          "DESCRIPTION", R.Description,
                                          "LONG TEXT", Coalesce(LookUp(colFlVals, RowGuid = R.RowGuid && Field = P.Field).Value, R.Description),
                                          Coalesce(LookUp(colFlVals, RowGuid = R.RowGuid && Field = P.Field).Value, ""))), lid: P.List },
                                                                  {
                                                                      RowGuid: R.RowGuid,
                                                                      Ord: 100 + P.Ord,
                                                                      Sev: "Error",
                                                                      Code: P.Rule,
                                                                      Field: P.Field,
                                                                      Short: If(P.Chk = "KKS", R.SynIssue, P.Msg),
                                                                      Msg: P.Label & ": " & If(P.Chk = "KKS", R.SynIssue, P.Msg),
                                                                      Bad: Switch(P.Chk,
                                          "MAX", !IsBlank(v) && Len(v) > P.Num,
                                          "DROP", !IsBlank(v) && CountRows(Filter(Split(v, "|") As T, !IsBlank(Trim(T.Value)) && !(Upper(Trim(T.Value)) in Filter(nfFlLists, List = lid).UValue))) > 0,
                                          "ALLOW", !IsBlank(v) && CountRows(Filter(Split(v, "|") As T, !IsBlank(Trim(T.Value)) && !(Upper(Trim(T.Value)) in Filter(nfFlLists, List = lid).UValue))) > 0,
                                          "REQ", IsBlank(v),
                                          "RGX", !IsBlank(v) && Switch(lid, "NUMSIGN", !IsMatch(v, "^[0-9.,/+\-]*$"), "NUMCOMMA", !IsMatch(v, "^[0-9,]*$"), "NUMDOT", !IsMatch(v, "^[0-9.,]*$"), false),
                                          "DATE", !IsBlank(v) && With(
                                          { c8: IsMatch(v, "[0-9]{8}"), dt: IsMatch(v, "[0-9]{2}\.[0-9]{2}\.[0-9]{4}") },
                                          If(
                                              !c8 && !dt, true,
                                              With(
                                                  {
                                                      y: Value(If(c8, Left(v, 4), Right(v, 4))),
                                                      m: Value(Mid(v, If(c8, 5, 4), 2)),
                                                      dd: Value(If(c8, Right(v, 2), Left(v, 2)))
                                                  },
                                                  !(y >= 100 && m >= 1 && m <= 12 && dd >= 1 &&
                                                    dd <= Switch(m, 2, If(Mod(y, 4) = 0 && (Mod(y, 100) <> 0 || Mod(y, 400) = 0), 29, 28),
                                                                 4, 30, 6, 30, 9, 30, 11, 30, 31))
                                              )
                                          )
                                      ),
                                          "UE", R.K12 = "UE" && IsBlank(v),
                                          "UEFP", R.K12 = "UE" && R.K17 = "FP" && IsBlank(v),
                                          "KKS", !IsBlank(R.FL) && !IsBlank(R.SynIssue),
                                          false)
                                                                  }
                                                              )
                                                          ),
                                                          Bad
                                                      )
                                                  }
                                              ),
                                              Items
                                          ),
                                          Bad
                                      )
                                  );
                                  
                                  // D. Samme besked een gang (FL55)
                                  ClearCollect(
                                      colFlIssues,
                                      ForAll(
                                          GroupBy(colFlIssuesRaw, RowGuid, Sev, Msg, Grp) As G,
                                          With(
                                              { f: First(Sort(G.Grp, Ord)) },
                                              { RowGuid: G.RowGuid, Sev: G.Sev, Msg: G.Msg, Ord: f.Ord, Code: f.Code,
                                                Field: f.Field, Short: f.Short }
                                          )
                                      )
                                  );
                                  
                                  // E. Status og foerste besked (FL25, FL26)
                                  ClearCollect(
                                      colFlTmp,
                                      ForAll(
                                          colFlCalc As R,
                                          With(
                                              {
                                                  errs: Sort(Filter(colFlIssues, RowGuid = R.RowGuid && Sev = "Error"), Ord),
                                                  warns: Sort(Filter(colFlIssues, RowGuid = R.RowGuid && Sev = "Warning"), Ord)
                                              },
                                              {
                                                  RowGuid: R.RowGuid, RowNo: R.RowNo, SpId: R.SpId,
                                                  FL: R.FL, Description: R.Description,
                                                  KksType: R.KksType, AssignedClass: R.Cls,
                                                  Status: If(R.IsBlankRow, "draft", CountRows(errs) > 0, "invalid",
                                                             CountRows(warns) > 0, "warning", "valid"),
                                                  FirstIssue: Coalesce(First(errs).Msg, ""),
                                                  FirstWarning: Coalesce(First(warns).Msg, ""),
                                                  IssueCount: CountRows(errs),
                                                  WarningCount: CountRows(warns)
                                              }
                                          )
                                      )
                                  );
                                  ClearCollect(colFlRows, colFlTmp);
                                  
                                  // F. TRM og ABC (FL48, FL49)
                                  ClearCollect(
                                      colFlTrm,
                                      ForAll(
                                          Filter(colFlCalc, !IsBlankRow && SpoolCls in nfFlTrmClasses.Cls) As R,
                                          {
                                              RowGuid: R.RowGuid,
                                              AnyTrm: CountRows(Filter(colFlVals, RowGuid = R.RowGuid && Field in ["EX-MARKING", "SAFETY CRITICAL EQUIPMENT", "FIRE CLASSIFICATION", "FIRE SEALING TYPE", "FIRE SEALING PRODUCT"] && !IsBlank(Trim(Value)))) > 0,
                                              Ue: R.SpoolCls = "MKP" && R.K12 = "UE"
                                          }
                                      )
                                  );
                                  RemoveIf(colFlVals, Field = "TRM ASSIGNMENT" && RowGuid in colFlTrm.RowGuid);
                                  RemoveIf(colFlVals, Field = "ABC INDIC." && RowGuid in Filter(colFlTrm, AnyTrm).RowGuid);
                                  Collect(colFlVals, ForAll(Filter(colFlTrm, AnyTrm || Ue) As T, { RowGuid: T.RowGuid, Field: "TRM ASSIGNMENT", Value: "X" }));
                                  Collect(colFlVals, ForAll(Filter(colFlTrm, AnyTrm) As T, { RowGuid: T.RowGuid, Field: "ABC INDIC.", Value: "A" }));
                                  
                                  // G. Klassefanerne (FL28)
                                  ClearCollect(
                                      colFlTabs,
                                      { Key: "ALL", Label: "ALL (" & CountRows(Filter(colFlRows, Status <> "draft" && !IsBlank(AssignedClass))) & ")" },
                                      ForAll(
                                          Sort(Distinct(Filter(colFlRows, Status <> "draft" && !IsBlank(AssignedClass)), AssignedClass), Value) As K,
                                          { Key: K.Value, Label: K.Value & " (" & CountRows(Filter(Filter(colFlRows, Status <> "draft" && !IsBlank(AssignedClass)), AssignedClass = K.Value)) & ")" }
                                      )
                                  );
                                  If(varFlTab <> "ALL" && IsBlank(LookUp(colFlTabs, Key = varFlTab)), Set(varFlTab, "ALL"));
                                  
                                  // H. Faerdig. varFlStale styrer Submit (FL68).
                                  Set(varFlStale, false);
                                  Set(varFlInfo, If(CountRows(Filter(colFlRows, Status <> "draft")) = 0, "No rows to verify.", "Done."))
                              RadiusBottomLeft: |-
                                  =10
                              RadiusBottomRight: |-
