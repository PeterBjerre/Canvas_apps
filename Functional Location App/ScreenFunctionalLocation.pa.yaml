                        - htmFlStructure:
                            Control: HtmlViewer
                            Properties:
                              Fill: |-
                                  =RGBA(0, 0, 0, 0)
                              Height: |-
                                  =Min(40 + 26 * (CountRows(Filter(colFlRows, Status <> "draft" && !IsBlank(FL))) + CountRows(Distinct(Filter(colFlRows, Status <> "draft" && !IsBlank(FL)), Left(FL, 3)))), 600)
                              HtmlText: |-
                                  ="<div style='font-family:Segoe UI;font-size:13px;color:" & C.'hex-text-primary' & "'>" &
                                  "<table style='border-collapse:collapse;width:100%'><tr><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>Plant</th><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>Unit</th><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>Function key</th><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>No.</th><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>Aggregate</th><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>Pos. 14-16</th><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>Pos. 17-21</th><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>Class</th><th style='text-align:left;padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-muted' & "'>Status</th></tr>" &
                                  Concat(
                                      Sort(Distinct(Filter(colFlRows, Status <> "draft" && !IsBlank(FL)), Left(FL, 3)), Value) As P,
                                      "<tr><td colspan='9' style='padding:8px 0 2px 0;font-weight:700;color:" & C.'hex-text-primary' & "'>" & Substitute(Substitute(Substitute(P.Value, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                      Concat(
                                          Sort(Filter(Filter(colFlRows, Status <> "draft" && !IsBlank(FL)), Left(FL, 3) = P.Value), FL) As R,
                                          "<tr>" & "<td style='padding:3px 10px 3px 0;color:" & C.'hex-text-primary' & "'>" & "" & "</td>" & "<td style='padding:3px 10px 3px 0;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(Substitute(Mid(R.FL, 4, 3), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" & "<td style='padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-primary' & "'>" & Substitute(Substitute(Substitute(Mid(R.FL, 7, 3), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" & "<td style='padding:3px 10px 3px 0;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(Substitute(Mid(R.FL, 10, 2), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" & "<td style='padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-primary' & "'>" & Substitute(Substitute(Substitute(Mid(R.FL, 12, 2), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" & "<td style='padding:3px 10px 3px 0;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(Substitute(Mid(R.FL, 14, 3), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" & "<td style='padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-primary' & "'>" & Substitute(Substitute(Substitute(Mid(R.FL, 17, 5), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" & "<td style='padding:3px 10px 3px 0;font-weight:600;color:" & C.'hex-text-primary' & "'>" & Substitute(Substitute(Substitute(Coalesce(R.AssignedClass, "-"), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td>" & "<td style='padding:3px 10px 3px 0;color:" & C.'hex-text-primary' & "'>" & Switch(R.Status, "valid", "&#10004; Ready", "warning", "&#9888; Warning", "&#10006; Error") & "</td>" & "</tr>"
                                      )
                                  ) &
                                  "</table></div>"
                              PaddingBottom: |-
                                  =0
                              PaddingLeft: |-
                                  =0
