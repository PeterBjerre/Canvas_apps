                                  =If(varFlStatus = "Indsendt", "Request " & varFlRequestNo & " is submitted and locked.",
                                     varFlStale, "Press Verify before you submit - something changed since the last check.",
                                     CountRows(Filter(colFlRows, Status = "invalid")) > 0, "Submit is blocked: " & CountRows(Filter(colFlRows, Status = "invalid")) & " row(s) have errors.",
                                     CountRows(Filter(colFlRows, Status = "valid" || Status = "warning")) = 0, "There are no rows ready for SAP.",
                                     "Ready to submit " & CountRows(Filter(colFlRows, Status = "valid" || Status = "warning")) & " row(s).")
                              Wrap: |-
