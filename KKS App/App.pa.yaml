      // LAYOUTTOKENS. Genereret af tools/layout_tokens.py - ret ikke her.
      //
      // LayoutContext er den, man kan LAESE. LayoutRank er den, man kan
      // SAMMENLIGNE med: "desktop eller bredere" er LayoutRank >= 3.
      // Braekpunkterne staar eet sted for alle apps.
      LayoutContext = If(
          App.Width >= 1600, "Wide",
          App.Width >= 1024, "Desktop",
          App.Width >= 720, "Tablet",
          "Mobile"
      );

      LayoutRank = If(
          App.Width >= 1600, 4,
          App.Width >= 1024, 3,
          App.Width >= 720, 2,
          1
      );

      // KKS-opslaget (KKS App/build/kks_parts.py). Samlingerne hentes i
      // skaermens OnVisible; alt herunder regnes i hukommelsen.
      // varKksLoaded staar med for at tvinge en genberegning, naar noeglerne er hentet.
      colKksScope = With({ready: varKksLoaded}, Switch(varKksKey, "aggregate", colKksAggregate, "component", colKksComponent, colKksFunction));
      KksHasL3 = varKksKey = "function";
      colKksBase = If(varKksL1 = "ALL", colKksScope, Filter(colKksScope, L1 = varKksL1));
      colKksBaseQ = If(IsBlank(varKksQuery), colKksBase, Filter(colKksBase, varKksQuery in Code || varKksQuery in Description));
      // Bogstaverne (issue #164): kun de bogstaver, der har mindst een gruppe
      // (niveau 2) i den valgte noegletype - regnet af samme betingelse som
      // colKksL2Keys, i hukommelsen, pr. type. Et bogstav uden grupper (fx
      // funktionsnoeglen D, der ikke bruges, eller komponentnoeglen -A) vises
      // ikke; raekken findes stadig i ALL og i soegningen.
      colKksL1Keys = Sort(Distinct(Filter(colKksScope, L1 <> "HOME" && Len(P2) = 2 && StartsWith(P2, L1)), L1), Value);
      colKksL2Keys = Sort(Distinct(Filter(colKksBaseQ, varKksL1 <> "ALL" && Len(P2) = 2 && StartsWith(P2, varKksL1)), P2), Value);
      colKksL2Rows = If(IsBlank(varKksL2), colKksBaseQ, Filter(colKksBaseQ, P2 = varKksL2));
      colKksL3Keys = Sort(Distinct(Filter(colKksL2Rows, KksHasL3 && !IsBlank(varKksL2) && Len(P3) = 3 && StartsWith(P3, varKksL2)), P3), Value);
      colKksL3Rows = If(!KksHasL3 || IsBlank(varKksL3), colKksL2Rows, Filter(colKksL2Rows, P3 = varKksL3));
      colKksResults = If(varKksL1 = "ALL" && IsBlank(varKksQuery) && KksHasL3, Filter(colKksScope, L1 = "HOME"), colKksL3Rows);
      KksNote2 = If(varKksL1 = "ALL", "Pick a letter to see its groups.", CountRows(colKksL2Keys) = 0, If(IsBlank(varKksQuery), "No groups under this letter.", "No groups match the search."), "");
      KksNote3 = If(!KksHasL3, "", varKksL1 = "ALL", "Pick a letter to see its subgroups.", IsBlank(varKksL2), "Pick a group to see its subgroups.", CountRows(colKksL3Keys) = 0, If(IsBlank(varKksQuery), "No subgroups under this group.", "No subgroups match the search."), "");
      KksHeadL1 = If(varKksL1 = "ALL", "", Coalesce(LookUp(colKksScope, L1 = "HOME" && Upper(Code) = varKksL1, Description), LookUp(colKksBase, Upper(Code) = varKksL1, Description), LookUp(colKksBase, Len(P2) = 2 && Upper(Code) = P2 && StartsWith(P2, varKksL1), Description), ""));
      KksHeadL2 = If(IsBlank(varKksL2), "", Coalesce(LookUp(colKksScope, Upper(Code) = varKksL2, Description), ""));
      KksHeadL3 = If(IsBlank(varKksL3), "", Coalesce(LookUp(colKksScope, Upper(Code) = varKksL3, Description), ""));
      KksTitle = If(varKksL1 = "ALL", "All sections" & If(IsBlank(varKksQuery), "", " - search results"), varKksL1 & If(IsBlank(varKksL2) && IsBlank(varKksL3) && !IsBlank(KksHeadL1), " - " & Upper(Left(Lower(KksHeadL1), 1)) & Mid(Lower(KksHeadL1), 2), "") & If(IsBlank(varKksL2), "", " / " & varKksL2 & If(IsBlank(varKksL3) && !IsBlank(KksHeadL2), " - " & Upper(Left(Lower(KksHeadL2), 1)) & Mid(Lower(KksHeadL2), 2), "")) & If(IsBlank(varKksL3), "", " / " & varKksL3 & If(!IsBlank(KksHeadL3), " - " & Upper(Left(Lower(KksHeadL3), 1)) & Mid(Lower(KksHeadL3), 2), "")) & If(IsBlank(varKksQuery), "", " - search results"));
    OnError: |
      =Trace(
          "Unhandled error",
          TraceSeverity.Error,
          { Message: FirstError.Message, Source: FirstError.Source, Observed: FirstError.Observed }
      );
      Notify("Something went wrong: " & FirstError.Message, NotificationType.Error)
    OnStart: |
      =ClearCollect(colAppPrefs, { Dark: false });
      Clear(colAppPrefs);
      If(false, ClearCollect(colKksFunction, { L1: "", Code: "", Description: "", P2: "", P3: "" }));
      If(false, ClearCollect(colKksAggregate, { L1: "", Code: "", Description: "", P2: "", P3: "" }));
      If(false, ClearCollect(colKksComponent, { L1: "", Code: "", Description: "", P2: "", P3: "" }));
      If(false, ClearCollect(colKksAggregateRaw, { Code: "", Description: "" }));
      If(false, ClearCollect(colKksComponentRaw, { Code: "", Description: "" }));
      If(false, ClearCollect(colKksFnAll, { Ord: 0, Section: "", Code: "", Description: "" }));
      If(false, ClearCollect(colKksFn1, { Ord: 0, Section: "", Code: "", Description: "" }));
      If(false, ClearCollect(colKksFn2, { Ord: 0, Section: "", Code: "", Description: "" }));
      If(false, ClearCollect(colKksFn3, { Ord: 0, Section: "", Code: "", Description: "" }));
      If(false, ClearCollect(colKksFn4, { Ord: 0, Section: "", Code: "", Description: "" }));
      If(false, ClearCollect(colKksFn5, { Ord: 0, Section: "", Code: "", Description: "" }));
      If(false, ClearCollect(colKksFn6, { Ord: 0, Section: "", Code: "", Description: "" }));
      If(false, ClearCollect(colKksFn7, { Ord: 0, Section: "", Code: "", Description: "" }));

      // TEMAVALGET. Skal staa foerst: alt hvad skaermen tegner, laeser C,
      // og C laeser darkModeEnabled.
      //
      // IfError fordi SaveData/LoadData ikke findes i Studio. Uden den
      // stopper hele OnStart, hver gang nogen trykker Preview.
      IfError(LoadData(colAppPrefs, "prefs", true), Blank());
      Set(
          darkModeEnabled,
          Coalesce(
              If(Lower(Param("theme")) = "dark", true,
                 Lower(Param("theme")) = "light", false),
              First(colAppPrefs).Dark,
              false
          )
      );
    StartScreen: |-
        =ScreenKks
    Theme: |-
        =PowerAppsTheme
