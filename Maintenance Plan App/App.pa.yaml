      With({ c2: If(w2 = 0, x2, x2 + w2 + 8) },
      With({ x3: If(w3 > 0 && c2 > 0 && c2 + w3 > mw, 0, c2), r3: r2 + If(w3 > 0 && c2 > 0 && c2 + w3 > mw, 1, 0) },
