      With({ c5: If(w5 = 0, x5, x5 + w5 + 8) },
      With({ x6: If(w6 > 0 && c5 > 0 && c5 + w6 > mw, 0, c5), r6: r5 + If(w6 > 0 && c5 > 0 && c5 + w6 > mw, 1, 0) },
      With({ c6: If(w6 = 0, x6, x6 + w6 + 8) },
      With({ x7: If(w7 > 0 && c6 > 0 && c6 + w7 > mw, 0, c6), r7: r6 + If(w7 > 0 && c6 > 0 && c6 + w7 > mw, 1, 0) },
      With({ c7: If(w7 = 0, x7, x7 + w7 + 8) },
      With({ x8: If(w8 > 0 && c7 > 0 && c7 + w8 > mw, 0, c7), r8: r7 + If(w8 > 0 && c7 > 0 && c7 + w8 > mw, 1, 0) },
      With({ c8: If(w8 = 0, x8, x8 + w8 + 8) },
      With({ ww: Max(If(w1 = 0, 0, x1 + w1), If(w2 = 0, 0, x2 + w2), If(w3 = 0, 0, x3 + w3), If(w4 = 0, 0, x4 + w4), If(w5 = 0, 0, x5 + w5), If(w6 = 0, 0, x6 + w6), If(w7 = 0, 0, x7 + w7), If(w8 = 0, 0, x8 + w8), 1), hh: If(w1 > 0 || w2 > 0 || w3 > 0 || w4 > 0 || w5 > 0 || w6 > 0 || w7 > 0 || w8 > 0, r8 * 36 + 32, 0) },
      {
