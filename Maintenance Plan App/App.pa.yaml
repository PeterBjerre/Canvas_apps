App:
  Properties:
    Formulas: |
      =// DESIGNTOKENS. Genereret af tools/design_tokens.py - ret ikke her.
      //
      // Hver farve i appen staar som C.'et-navn'. Moerk tilstand er ikke
      // en funktion; den er den anden gren af den her If.
      C = If(
          // LYS TILSTAND
          !darkModeEnabled,
          {
              'color-brand-primary': RGBA(0, 103, 174, 1),
              'color-brand-primary-hover': RGBA(0, 122, 204, 1),
              'color-brand-primary-soft': RGBA(198, 224, 249, 1),
              'bg-app': RGBA(237, 241, 247, 1),
              'bg-surface': RGBA(255, 255, 255, 1),
              'bg-card': RGBA(250, 251, 253, 1),
              'bg-muted': RGBA(240, 243, 248, 1),
              'text-primary': RGBA(26, 34, 49, 1),
              'text-muted': RGBA(89, 102, 122, 1),
              'text-on-primary': RGBA(255, 255, 255, 1),
              'text-on-domain': RGBA(255, 255, 255, 1),
              'border-default': RGBA(215, 222, 232, 1),
              'border-subtle': RGBA(228, 233, 241, 1),
              'input-bg': RGBA(255, 255, 255, 1),
              'input-bg-disabled': RGBA(240, 243, 248, 1),
              'input-fg': RGBA(26, 34, 49, 1),
              'flyout-bg': RGBA(255, 255, 255, 1),
              'border-ok': RGBA(19, 120, 87, 1),
              'border-error': RGBA(179, 50, 60, 1),
              'state-ok-fg': RGBA(19, 120, 87, 1),
              'state-ok-bg': RGBA(232, 245, 238, 1),
              'state-warn-fg': RGBA(138, 90, 0, 1),
              'state-warn-bg': RGBA(253, 243, 226, 1),
              'state-error-fg': RGBA(179, 50, 60, 1),
              'state-error-bg': RGBA(253, 236, 236, 1),
              'state-info-fg': RGBA(0, 83, 140, 1),
              'state-info-bg': RGBA(222, 240, 252, 1),
              'state-neutral-fg': RGBA(89, 102, 122, 1),
              'state-neutral-bg': RGBA(228, 233, 241, 1),
              'state-violet-fg': RGBA(91, 33, 182, 1),
              'state-violet-bg': RGBA(241, 236, 252, 1),
              'state-lime-fg': RGBA(63, 98, 18, 1),
              'state-lime-bg': RGBA(238, 246, 220, 1),
              'state-rose-fg': RGBA(190, 24, 93, 1),
              'state-rose-bg': RGBA(252, 231, 243, 1),
              'bg-modal': RGBA(255, 255, 255, 0.98),
              'overlay': RGBA(15, 23, 42, 0.35),
              'row-hover': RGBA(0, 95, 184, 0.06),
              'row-pressed': RGBA(0, 95, 184, 0.12),
              'domain-fl': RGBA(0, 95, 184, 1),
              'domain-eq': RGBA(0, 128, 128, 1),
              'domain-mp': RGBA(90, 120, 10, 1),
              'domain-mat': RGBA(180, 83, 9, 1),
              'domain-vhp': RGBA(147, 51, 234, 1),
              'domain-fl-soft': RGBA(230, 239, 247, 1),
              'domain-eq-soft': RGBA(230, 241, 243, 1),
              'domain-mp-soft': RGBA(237, 241, 234, 1),
              'domain-mat-soft': RGBA(244, 238, 233, 1),
              'domain-vhp-soft': RGBA(242, 235, 251, 1),
              'hex-text-primary': "#1A2231",
              'hex-text-muted': "#59667A",
              'hex-state-neutral-bg': "#E4E9F1",
              'hex-bg-surface': "#FFFFFF",
              'hex-bg-app': "#EDF1F7",
              'hex-state-warn-fg': "#8A5A00",
              'hex-border-default': "#D7DEE8",
              'hex-state-info-fg': "#00538C",
              'hex-state-info-bg': "#DEF0FC",
              'hex-color-brand-primary': "#0067AE",
              'hex-text-on-primary': "#FFFFFF",
              'hex-state-ok-fg': "#137857",
              'hex-domain-fl': "#005FB8",
              'hex-domain-eq': "#008080",
              'hex-domain-mp': "#5A780A",
              'hex-domain-mat': "#B45309",
              'hex-domain-vhp': "#9333EA",
              'hex-state-error-fg': "#B3323C",
              'hex-state-neutral-fg': "#59667A",
              'hex-state-violet-fg': "#5B21B6",
              'hex-state-lime-fg': "#3F6212",
              'hex-state-rose-fg': "#BE185D",
              'hex-border-subtle': "#E4E9F1",
              'hex-bg-muted': "#F0F3F8"
          },
          // MOERK TILSTAND
          {
              'color-brand-primary': RGBA(37, 99, 235, 1),
              'color-brand-primary-hover': RGBA(29, 78, 216, 1),
              'color-brand-primary-soft': RGBA(30, 58, 138, 1),
              'bg-app': RGBA(12, 15, 23, 1),
              'bg-surface': RGBA(15, 23, 42, 1),
              'bg-card': RGBA(15, 23, 42, 1),
              'bg-muted': RGBA(30, 41, 59, 1),
              'text-primary': RGBA(229, 231, 235, 1),
              'text-muted': RGBA(148, 163, 184, 1),
              'text-on-primary': RGBA(255, 255, 255, 1),
              'text-on-domain': RGBA(2, 6, 23, 1),
              'border-default': RGBA(100, 116, 139, 1),
              'border-subtle': RGBA(51, 65, 85, 1),
              'input-bg': RGBA(0, 0, 0, 1),
              'input-bg-disabled': RGBA(30, 41, 59, 1),
              'input-fg': RGBA(113, 118, 127, 1),
              'flyout-bg': RGBA(255, 255, 255, 1),
              'border-ok': RGBA(5, 150, 105, 1),
              'border-error': RGBA(239, 68, 68, 1),
              'state-ok-fg': RGBA(52, 211, 153, 1),
              'state-ok-bg': RGBA(6, 46, 37, 1),
              'state-warn-fg': RGBA(251, 191, 36, 1),
              'state-warn-bg': RGBA(59, 38, 6, 1),
              'state-error-fg': RGBA(248, 113, 113, 1),
              'state-error-bg': RGBA(69, 19, 24, 1),
              'state-info-fg': RGBA(96, 165, 250, 1),
              'state-info-bg': RGBA(23, 37, 70, 1),
              'state-neutral-fg': RGBA(148, 163, 184, 1),
              'state-neutral-bg': RGBA(30, 41, 59, 1),
              'state-violet-fg': RGBA(196, 181, 253, 1),
              'state-violet-bg': RGBA(45, 27, 80, 1),
              'state-lime-fg': RGBA(190, 242, 100, 1),
              'state-lime-bg': RGBA(38, 50, 14, 1),
              'state-rose-fg': RGBA(249, 168, 212, 1),
              'state-rose-bg': RGBA(74, 17, 45, 1),
              'bg-modal': RGBA(15, 23, 42, 0.98),
              'overlay': RGBA(2, 6, 23, 0.72),
              'row-hover': RGBA(148, 197, 255, 0.08),
              'row-pressed': RGBA(148, 197, 255, 0.16),
              'domain-fl': RGBA(125, 180, 255, 1),
              'domain-eq': RGBA(45, 212, 191, 1),
              'domain-mp': RGBA(163, 230, 53, 1),
              'domain-mat': RGBA(251, 146, 60, 1),
              'domain-vhp': RGBA(232, 121, 249, 1),
              'domain-fl-soft': RGBA(33, 48, 76, 1),
              'domain-eq-soft': RGBA(20, 53, 66, 1),
              'domain-mp-soft': RGBA(39, 56, 44, 1),
              'domain-mat-soft': RGBA(53, 43, 45, 1),
              'domain-vhp-soft': RGBA(50, 39, 75, 1),
              'hex-text-primary': "#E5E7EB",
              'hex-text-muted': "#94A3B8",
              'hex-state-neutral-bg': "#1E293B",
              'hex-bg-surface': "#0F172A",
              'hex-bg-app': "#0C0F17",
              'hex-state-warn-fg': "#FBBF24",
              'hex-border-default': "#64748B",
              'hex-state-info-fg': "#60A5FA",
              'hex-state-info-bg': "#172546",
              'hex-color-brand-primary': "#2563EB",
              'hex-text-on-primary': "#FFFFFF",
              'hex-state-ok-fg': "#34D399",
              'hex-domain-fl': "#7DB4FF",
              'hex-domain-eq': "#2DD4BF",
              'hex-domain-mp': "#A3E635",
              'hex-domain-mat': "#FB923C",
              'hex-domain-vhp': "#E879F9",
              'hex-state-error-fg': "#F87171",
              'hex-state-neutral-fg': "#94A3B8",
              'hex-state-violet-fg': "#C4B5FD",
              'hex-state-lime-fg': "#BEF264",
              'hex-state-rose-fg': "#F9A8D4",
              'hex-border-subtle': "#334155",
              'hex-bg-muted': "#1E293B"
          }
      );

      // LAYOUTTOKENS. Genereret af tools/layout_tokens.py - ret ikke her.
      //
      // LayoutContext er den, man kan LAESE. LayoutRank er den, man kan
      // SAMMENLIGNE med: "desktop eller bredere" er LayoutRank >= 3.
      // Braekpunkterne staar eet sted for alle apps.
      LayoutContext = If(
          App.Width >= 1600, "Wide",
          App.Width >= 1024, "Desktop",
          App.Width >= 720, "Tablet",
          "Mobile"
      );

      LayoutRank = If(
          App.Width >= 1600, 4,
          App.Width >= 1024, 3,
          App.Width >= 720, 2,
          1
      );

      // ADMIN. Genereret af tools/permissions.py - ret ikke her.
      // Een delegerbar LookUp i admin-listen, laest dovent og kun een gang.
      IsAdmin = !IsBlank(LookUp(UserAndGroups, Title = "Admin" && Member = Lower(User().Email)));

      // Hjaelpetekster. En manglende raekke = ingen tekst, ikke en fejl.
      colVhpHelp = ForAll(Filter(MD_HelpText, AppArea.Value = "MaintenancePlan") As R, { Key: R.HelpKey, Kind: R.Kind.Value, Heading: Coalesce(R.Heading, ""), Body: Coalesce(R.Body, ""), Ord: Coalesce(R.SortOrder, 0) });

      colVhpPlantCodes = Sort(ForAll(PlantList As R, { Value: R.Title }), Value);

      colVhpSortFieldOptions = Sort(ForAll(SortFieldList As R, { Id: R.ID, Value: R.Title }), Value);

      colVhpActivityTypeOptions = Sort(ForAll(MaintenanceActivityTypeList As R, { Id: R.ID, Value: R.Title }), Value);

      colVhpPlanStatusOptions = Choices(MaintenanceItems.Status);

      colVhpUnitOptions = Choices(MaintenancePlans.Unit);

      colVhpRevisionOptions = Choices(MaintenanceItems.RevisionMark);

      // Non Flow User Status: valgene fra SharePoint, vist som kode - beskrivelse.
      colVhpNonFlowStatusOptions = With(
          { ch: Choices(MaintenanceItems.NonFlowUserStatus) },
          ForAll(
              Sequence(CountRows(ch) + 1),
              If(
                  Value = 1,
                  { Value: "", Display: "(none)" },
                  With(
                      { c: Index(ch, Value - 1).Value },
                      {
                          Value: c,
                          Display: c & With(
                              { d: Switch(c, "INCD", "Create Synergy Incident Q-Case", "ZBUN", "Bundling", "ZMOC", "Create Synergy MoC Action Plan", "WADO", "Ope Waiting for documentation", "ZBOW", "Bowtie", "OPHO", "Operation on Hold", "UNEX", "Work Under Execution", "OFIX", "Operation Fixed", "REWO", "Maintenance Rework", Blank()) },
                              If(IsBlank(d), "", " - " & d)
                          )
                      }
                  )
              )
          )
      );

      // Alle arbejdscentre med deres vaerk. Afgraenses i kontrollen.
      colVhpMainWorkCenters = ForAll(MainWorkCenters As R, { Id: R.ID, Value: Trim(R.Title), Plant: Trim(R.'Plant Key') });

      colVhpStrategies = Sort(ForAll(MD_Strategy As R, { Key: R.StrategyKey, Name: R.StrategyName, SchedIndicator: R.SchedulingIndicator.Value, Hierarchical: R.Hierarchical.Value, PackagesLoaded: R.PackagesLoaded, Display: R.StrategyKey & " - " & R.StrategyName & If(R.PackagesLoaded, "", "   (packages missing)") }), Key);

      colVhpStrategyOptions = Sort(ForAll(MD_Strategy As R, { Key: R.StrategyKey, Value: R.StrategyKey & " - " & R.StrategyName & If(R.PackagesLoaded, "", "   (packages missing)") }), Key);

      colVhpStrategyPackages = ForAll(MD_StrategyPackage As R, { StrategyKey: R.StrategyKey, PackageNo: R.PackageNo, ShortCode: R.ShortCode, CycleLength: R.CycleLength, CycleUnit: R.CycleUnit.Value, Hierarchy: R.Hierarchy, PackageText: R.PackageText });

      // Standardoperationerne, hentet een gang. colVhpTasklists deler dem op pr. vaerk i hukommelsen.
      colVhpStdOps = ForAll(MD_StandardTaskOperations As O, { Plant: O.Plant.Value, OperationNo: O.OperationNo, OperationShortText: O.OperationShortText, Work: O.Work, NumberOfCapacities: O.NumberOfCapacities, WorkCenter: O.WorkCenter, VendorNo: O.VendorNo, ControlKey: O.ControlKey, Price: O.Price, Currency: O.Currency, CostElement: O.CostElement, MaterialGroup: O.MaterialGroup, SapPlant: O.SapPlant });

      colVhpTasklists = ForAll(Distinct(colVhpStdOps, Plant) As P, { Plant: P.Value, Key: P.Value & "-STD", Name: "Standard task list - " & P.Value, Description: "", Operations: ForAll(Sort(Filter(colVhpStdOps, Plant = P.Value), OperationNo) As O, { OperationNo: Text(O.OperationNo, "0000"), OperationShortText: O.OperationShortText, WorkHours: O.Work, Persons: O.NumberOfCapacities, DurationHours: O.Work / Max(Coalesce(O.NumberOfCapacities, 1), 1), MainWorkCenter: O.WorkCenter, Vendor: O.VendorNo, LongText: "", ControlKey: O.ControlKey, UnitCost: O.Price, Cost: O.Work * O.Price, Currency: O.Currency, CostElement: O.CostElement, MaterialGroup: O.MaterialGroup, OpPlant: O.SapPlant }) });

      // Appens eget begreb, ikke et SAP-felt.
      colVhpPlanTypeOptions = Table({ Key: "SingleCycle", Value: "Single cycle plan (IP41)" }, { Key: "Strategy", Value: "Strategiplan (IP42)" });

      // De items, der gemmes: har en kort tekst eller en funktionsplads.
      VhpSaveableItems = Filter(colVhpItems, !IsBlank(Trim(ShortText)) || !IsBlank(FunctionalLocation));

      // Reglerne fra den tidligere Validate-knap. Tom = ingen fejl.
      VhpValidationErrors = With(
          { isStrat: varVhpPlan.PlanType = "Strategy", hasPkgs: !IsEmpty(Filter(colVhpStrategyPackages, StrategyKey = varVhpPlan.Strategy)) },
          With(
              {
                  itemErr:
                      Concat(
                          Filter(
                              VhpSaveableItems,
                              IsBlank(ShortText) || IsBlank(MainWorkCenter) || IsBlank(ActivityType) || IsBlank(FunctionalLocation)
                          ),
                          "Item " & Text(ItemId) & " (" & Coalesce(ShortText, "no short text") & "): missing required fields.",
                          Char(10)
                      ),
                  s1:
                      If(isStrat && IsBlank(varVhpPlan.Strategy),
                          "S1: A strategy must be chosen on a strategy plan.", ""),
                  s3:
                      If(isStrat,
                          Concat(
                              Filter(VhpSaveableItems, IsBlank(TasklistKey)),
                              "S3: Item " & Text(ItemId) & " has no task list - the package allocation belongs to the task list.",
                              Char(10)
                          ), ""),
                  s4:
                      If(isStrat && hasPkgs,
                          Concat(
                              Filter(colVhpOperations, Len(Coalesce(PackagesKey, ";")) <= 1),
                              "S4: Item " & Text(ItemId) & " operation " & OperationNo &
                              " has no package and would never be carried out.",
                              Char(10)
                          ), ""),
                  s5:
                      If(isStrat,
                          Concat(
                              Filter(
                                  colVhpStrategyPackages As P,
                                  P.StrategyKey = varVhpPlan.Strategy &&
                                  CountRows(Filter(colVhpOperations, ";" & Text(P.PackageNo) & ";" in Coalesce(PackagesKey, ";"))) = 0
                              ),
                              "S5: Package " & ShortCode & " (" & Text(CycleLength) & " " & CycleUnit &
                              ") has no operations - the plan would call an empty order.",
                              Char(10)
                          ), ""),
                  r1:
                      If(
                          !IsBlank(varVhpPlan.Plant) && !IsBlank(varVhpPlan.PlanText) &&
                              !StartsWith(Upper(varVhpPlan.PlanText), Upper(varVhpPlan.Plant)),
                          "R1: Plan Text should start with the plant code " & varVhpPlan.Plant &
                              " - otherwise the plan cannot be found without searching by plant.", ""),
                  r2:
                      With(
                          { n: CountRows(Filter(VhpSaveableItems, StartsWith(ActivityType, "110") || StartsWith(ActivityType, "115"))) },
                          If(
                              n > 0 && IsBlank(varVhpPlan.SortField),
                              "R2: Sort Field is required: " & Text(n) &
                                  " item(s) have activity type 110 or 115.", "")),
                  r4:
                      With(
                          { n: CountRows(Filter(VhpSaveableItems, !IsBlank(Revision))) },
                          If(
                              n > 0 && (varVhpPlan.FirstCallDay <> 1 || varVhpPlan.FirstCallMonth <> 1),
                              "R4: " & Text(n) & " item(s) are marked as outage work. " &
                                  "First call must be 01/01, otherwise the task misses the outage.", ""))
              },
              Concat(
                  Filter(
                      Table(
                          { t: itemErr }, { t: s1 }, { t: s3 }, { t: s4 }, { t: s5 },
                          { t: r1 }, { t: r2 }, { t: r4 }
                      ),
                      !IsBlank(t)
                  ),
                  t, Char(10)
              )
          )
      );

      // Trin 1: planhovedet er gemt og laast.
      VhpStepPlanDone = varVhpPlanCommitted && varVhpPlanLocked;

      // Trin 2: alle items er gemt som valid.
      VhpStepItemDone = CountRows(VhpSaveableItems) > 0 && CountRows(Filter(VhpSaveableItems, Status <> "valid")) = 0;

      // Trin 3: alle items har en tasklist.
      VhpStepTasklistDone = CountRows(VhpSaveableItems) > 0 && CountRows(Filter(VhpSaveableItems, IsBlank(TasklistKey))) = 0;

      // Trin 4: alle items har operationer - og paa en strategiplan med pakker en pakke pr. operation.
      VhpStepOpsDone = CountRows(VhpSaveableItems) > 0 &&
          CountRows(Filter(VhpSaveableItems, !(ItemId in colVhpOperations.ItemId))) = 0 &&
          (varVhpPlan.PlanType <> "Strategy" || !(!IsEmpty(Filter(colVhpStrategyPackages, StrategyKey = varVhpPlan.Strategy))) || CountRows(Filter(colVhpOperations, Len(Coalesce(PackagesKey, ";")) <= 1)) = 0);

      // Planen, som den ville blive gemt. Sammenlignes med varVhpSavedJson.
      VhpStateJson = JSON(
          {
              Plan: varVhpPlan,
              Items: VhpSaveableItems,
              Ops: DropColumns(colVhpOperations, Selected),
              Objs: colVhpItemObjects,
              Mats: DropColumns(colVhpMaterials, Selected)
          }
      );

      // Trin 5: planen staar i SharePoint, og intet er aendret siden.
      VhpStepSaveDone = !IsBlank(varVhpPlanKey) && varVhpSavedJson = VhpStateJson;

      // Planen er indsendt og ligger i godkendelse eller SAP-oprettelse.
      VhpSubmitted = varVhpFlow.Status in ["In Progress", "Ready for creation in SAP", "Published"];

      // System- og omkostningsgodkendelsen er overstaaet.
      VhpApprovalDone = varVhpFlow.Stage in ["Quality", "Done"] || varVhpFlow.Status in ["Ready for creation in SAP", "Published"];

      // Kvalitetsgodkendelsen er overstaaet - planen venter paa SAP.
      VhpQualityDone = varVhpFlow.Status in ["Ready for creation in SAP", "Published"];

      // Planen er oprettet i SAP.
      VhpInSap = varVhpFlow.Status = "Published";

      // Submit er aktiv, naar trin 1-4 er faerdige, reglerne ingen fejl finder, og planen ikke allerede er indsendt.
      VhpCanSubmit = !varVhpSaving && !VhpSubmitted && VhpStepPlanDone && VhpStepItemDone && VhpStepTasklistDone &&
          VhpStepOpsDone && IsBlank(VhpValidationErrors);
    OnError: |
      =Trace(
          "Unhandled error",
          TraceSeverity.Error,
          { Message: FirstError.Message, Source: FirstError.Source, Observed: FirstError.Observed }
      );
      Notify("Something went wrong: " & FirstError.Message, NotificationType.Error)
    OnStart: |
      =If(false, ClearCollect(colVhpItems, { ItemId: 0, ShortText: "", FunctionalLocation: "", FlDescription: "", MainWorkCenter: "", ActivityType: "", ObjectList: "", Revision: "", OrstedResponsible: "", Initials: "", LongText: "", NonFlowUserStatus: "", TasklistKey: "", TasklistName: "", Status: "", SpId: 0 }));

      If(false, ClearCollect(colVhpOperations, { ItemId: 0, OperationNo: "", OperationShortText: "", WorkHours: 0, Persons: 0, DurationHours: 0, MainWorkCenter: "", Vendor: "", LongText: "", PackagesKey: ";", Selected: false, ControlKey: "", Cost: 0, UnitCost: 0, Currency: "", CostElement: 0, MaterialGroup: "", SpId: 0 }));

      If(false, ClearCollect(colVhpFl, { Code: "", Description: "", Display: "", Maintainable: false, Level: "" }));

      If(false, ClearCollect(colVhpItemObjects, { ItemId: 0, Code: "", Description: "" }));

      If(false, ClearCollect(colVhpObjDraft, { Code: "", Description: "" }));

      If(false, ClearCollect(colVhpPickerSelected, { OperationNo: "" }));

      If(false, ClearCollect(colVhpOpsDone, { ItemId: 0 }));

      If(false, ClearCollect(colVhpMaterials, { ItemId: 0, LineId: 0, MaterialNo: "", Description: "", Unit: "", Quantity: 0, OperationNo: "", Selected: false }));

      If(false, ClearCollect(colVhpAttachments, { ItemId: 0, FileName: "", FileUrl: "", Identifier: "", FileSize: 0, OperationsKey: ";", Status: "", Selected: false }));

      If(false, ClearCollect(colVhpAttFiles, { Name: "", Link: "", Identifier: "" }));

      If(false, ClearCollect(colVhpAttKeep, { FileName: "", OperationsKey: ";" }));

      If(false, ClearCollect(colVhpAttUp, { Name: "", Ok: false }));

      If(false, ClearCollect(colVhpSavedItems, { LocalId: 0, SpId: 0, ItemKey: "" }));

      If(false, ClearCollect(colVhpSavedOps, { LocalItemId: 0, OpNo: "", SpId: 0, TaskKey: "" }));

      If(false, ClearCollect(colVhpSpItems, { ID: 0, ItemID: "", Sceq: false }));

      If(false, ClearCollect(colVhpAdmOld, { ID: 0, ItemID: "", Title: "", ItemDescription: "", FunctionalLocation: "", ObjectList: "" }));

      If(false, ClearCollect(colVhpSpOps, { ID: 0, TaskItemID: "" }));

      If(false, ClearCollect(colVhpOldMats, { ID: 0 }));

      If(false, ClearCollect(colVhpOldAtts, { ID: 0 }));

      If(false, ClearCollect(colVhpSaveErrors, { Where: "", Msg: "" }));

      ClearCollect(colAppPrefs, { Dark: false });
      Clear(colAppPrefs);

      // TEMAVALGET. Skal staa foerst: alt hvad skaermen tegner, laeser C,
      // og C laeser darkModeEnabled.
      //
      // IfError fordi SaveData/LoadData ikke findes i Studio. Uden den
      // stopper hele OnStart, hver gang nogen trykker Preview.
      IfError(LoadData(colAppPrefs, "prefs", true), Blank());
      Set(
          darkModeEnabled,
          Coalesce(
              If(Lower(Param("theme")) = "dark", true,
                 Lower(Param("theme")) = "light", false),
              First(colAppPrefs).Dark,
              false
          )
      );

      Set(
          varVhpPlan,
          {
              Plant: "",
              Status: "",
              PlanType: "SingleCycle",
              Strategy: "",
              PlanText: "",
              SortField: "",
              Cycle: 0,
              Unit: "",
              FirstCallDay: Day(Today()),
              FirstCallMonth: Month(Today()),
              FirstCallYear: Year(Today()) + 1
          }
      );

      Set(varVhpPlanCommitted, false);
      Set(varVhpPlanLocked, false);
      Set(varVhpViewOnly, false);
      Set(varVhpBadgeOn, false);
      Set(varVhpCanEdit, false);
      Set(varVhpPlanCreatedAt, Blank());
      Set(varVhpPlanValidated, false);
      Set(varVhpItemValidated, false);
      // Sektionernes Save/Edit (issue #103), som varVhpPlanLocked: Item Editoren
      // er foldet ud, mens varVhpItemEditing er sand; Tasklist and Operations er
      // klappet sammen for items i colVhpOpsDone. varVhpOpsSavePending er det
      // item, hvis Save venter paa gemningen (0 = intet).
      Set(varVhpItemEditing, false);
      Set(varVhpOpsSavePending, 0);
      Clear(colVhpOpsDone);
      // Hvor planen er EFTER Submit: Status og ApprovalStage fra MaintenancePlans
      // (docs/32-godkendelsesflow.md). Tom = ikke indsendt. Progressbaren skifter
      // til godkendelses- og SAP-trinene, naar Status er indsendt (build_status).
      Set(varVhpFlow, { Status: "", Stage: "", ReturnComment: "" });
      // Appen aabner med EET item, der allerede er valgt. Item Editoren stod
      // foer tom og skrivebeskyttet (DM_ITEM slaar fra paa tomt
      // varVhpActiveItemId), saa det foerste man moedte var en raekke graa felter
      // og en knap, man skulle finde foerst. Nummeret er 1, saa "Add item" (som
      // taeller varVhpNextItemId een op foerst) fortsaetter ved 2.
      Set(varVhpActiveItemId, 1);
      Set(varVhpNextItemId, 1);
      Set(varVhpFlMsg, "");
      // Brugeren, som alle skrivninger stempler (REVIEW.md A10).
      Set(varVhpMe, Lower(User().Email));
      // Trinene og Submit regnes af navngivne formler (build_status.py).
      // varVhpSavedJson er planen, som den stod ved sidste gemning i SharePoint.
      Set(varVhpSavedJson, "");
      Set(varVhpPrevPlant, "");
      // FL-vaelgeren (tools/fl_picker.py): om flowet koerer, soegeteksten og
      // den sidste soegning, det valgte resultat - og Object List-popup'en.
      Set(varVhpFlBusy, false);
      Set(varVhpFlQuery, "");
      Set(varVhpFlLast, "");
      Set(varVhpFlPick, "");
      Set(varVhpObjListOpen, false);
      // Trinet, der sidst er klikket i progressbaren - dets sektion har en tyk kant.
      Set(varVhpFocusStep, 0);
      // Bekraeftelsen foer Submit.
      Set(varVhpConfirmSubmit, false);
      Set(varVhpConfirmNew, false);
      // Popupperne for materialer og dokumenter pr. operation (OperationNo, tom = lukket).
      Set(varVhpMatOpNo, "");
      Set(varVhpAttOpNo, "");
      // Lang tekst: "op" = en operation, "item" = itemets lange tekst.
      Set(varVhpLongTextTarget, "op");
      Set(varVhpTasklistPickerOpen, false);

      // Get-flowet svarer med en STRENG, der skal gennem ParseJSON.
      Set(varVhpAttJson, "");

      // Popup'en til lang tekst paa en operation. Operationen udpeges af
      // BEGGE noegler - OperationNo er kun unikt inden for et item.
      Set(varVhpLongTextOpen, false);
      Set(varVhpLongTextItemId, 0);
      Set(varVhpLongTextOpNo, "");
      Set(varVhpLongTextDraft, "");

      // Gemning i SharePoint. SpId > 0 betyder, at planen findes som raekke -
      // saa opdateres den i stedet for at blive oprettet igen.
      Set(varVhpPlanSpId, 0);
      Set(varVhpPlanKey, "");
      // Gemmet (build_save.py): konflikttjek, Save draft/Submit og planens raekke.
      Set(varVhpPlanModified, Blank());
      Set(varVhpSubmitting, false);
      Set(varVhpRequestGuid, "");
      Set(varVhpSaving, false);

      // Hjaelpepanelerne. Slaaet fra som standard - teksten er der for den, der
      // har brug for den, ikke for at fylde skaermen for alle andre.
      Set(varVhpShowHints, false);

      // Fanen i Tasklist-sektionen. Operations er den man er i oftest.
      Set(varVhpOpsTab, "ops");

      // Dyblink fra Masterdata Hub: <app-url>?reqid=<RequestGuid>.
      //
      // Det er en datahentning i OnStart, og reglen er ellers, at der ikke
      // er nogen. Undtagelsen er bevidst og betales kun af den, der
      // FAKTISK aabner et dyblink: uden parameter koeres kun Collect af et
      // tomt item, og der roeres ingen liste. Se build_load.py.
      If(
          IsBlank(Param("reqid")),

          Collect(colVhpItems, {
              ItemId: 1,
              ShortText: "",
              FunctionalLocation: "",
              FlDescription: "",
              MainWorkCenter: "",
              ActivityType: "",
              ObjectList: "",
              Revision: "",
              OrstedResponsible: "",
              Initials: Upper(First(Split(varVhpMe, "@")).Value),
              LongText: "",
              NonFlowUserStatus: "",
              TasklistKey: "",
              TasklistName: "",
              Status: "draft",
              SpId: 0
          }),

          Set(varVhpRequestGuid, Param("reqid"));
          With(
              { idx: LookUp(MD_RequestIndex, RequestGuid = varVhpRequestGuid) },
              Set(varVhpPlanSpId, idx.SourceItemId);
              With(
                  { pl: LookUp(MaintenancePlans, ID = varVhpPlanSpId) },
                  If(
                      IsBlank(pl.ID),

                      // Linket peger paa noget, der ikke er her - fx en
                      // indmelding fra et andet miljoe. Sig det, og aabn
                      // som en ny plan i stedet for at staa tom og tavs.
                      Notify(
                          "Could not find the request behind this link. Opening a new plan.",
                          NotificationType.Warning
                      );
                      Set(varVhpRequestGuid, "");
                      Set(varVhpPlanSpId, 0);
                      Set(varVhpPlanModified, Blank());
                      Collect(colVhpItems, {
                          ItemId: 1,
                          ShortText: "",
                          FunctionalLocation: "",
                          FlDescription: "",
                          MainWorkCenter: "",
                          ActivityType: "",
                          ObjectList: "",
                          Revision: "",
                          OrstedResponsible: "",
                          Initials: Upper(First(Split(varVhpMe, "@")).Value),
                          LongText: "",
                          NonFlowUserStatus: "",
                          TasklistKey: "",
                          TasklistName: "",
                          Status: "draft",
                          SpId: 0
                      }),

                      IfError(
                      // --- planhovedet ---------------------------------
                      Set(
                          varVhpPlan,
                          {
                              Plant: pl.PlantsInitial.Value,
                              Status: Coalesce(LookUp(MaintenanceItems, MaintenancePlanNo.Id = varVhpPlanSpId).Status.Value, ""),
                              PlanType: If(IsBlank(pl.StrategyKey), "SingleCycle", "Strategy"),
                              Strategy: Coalesce(pl.StrategyKey, ""),
                              PlanText: pl.Title,
                              SortField: pl.SortField.Value,
                              Cycle: pl.Cycle,
                              Unit: pl.Unit.Value,
                              FirstCallDay: Day(pl.PlannedDate),
                              FirstCallMonth: Month(pl.PlannedDate),
                              FirstCallYear: Year(pl.PlannedDate)
                          }
                      );
                      Set(varVhpPlanSpId, pl.ID);
                      Set(varVhpPlanKey, pl.PlanID);
                      Set(varVhpFlow, { Status: Coalesce(pl.Status.Value, ""), Stage: Coalesce(pl.ApprovalStage.Value, ""), ReturnComment: Coalesce(pl.ReturnComment, "") });
                      Set(varVhpPlanModified, pl.Modified);
                      Set(varVhpRequestGuid, idx.RequestGuid);
                      Set(varVhpPlanCommitted, true);
                      Set(varVhpPlanLocked, true);
                      Set(varVhpCanEdit, ((Lower(Coalesce(idx.RequesterEmail, "")) = varVhpMe && (idx.Status.Value = "Kladde")) || (IsAdmin && (idx.Status.Value = "Kladde" || idx.Status.Value = "AfventerInfo"))));
                      Set(varVhpViewOnly, !(Lower(Coalesce(Param("mode"), "")) = "edit" && varVhpCanEdit));

                      // --- de fem hentninger, PAA EEN GANG -------------
                      //
                      // Fem lister i kaede er fem rundture efter hinanden;
                      // appen venter paa SUMMEN. I Concurrent venter den kun
                      // paa den laengste.
                      //
                      // De fem er uafhaengige af hinanden. De afhaenger alle
                      // af 'pl' - men den er sat UDENFOR og er faerdig, foer
                      // Concurrent starter. Og varVhpActiveItemId nedenfor
                      // laeser colVhpItems: ogsaa sikkert, for Concurrent
                      // venter paa dem alle, foer den gaar videre.
                      Concurrent(
                          ClearCollect(
                              colVhpItems,
                              ForAll(
                                  Filter(MaintenanceItems, MaintenancePlanNo.Id = varVhpPlanSpId) As IT,
                                  {
                                      ItemId: IT.ID,
                                      ShortText: IT.Title,
                                      FunctionalLocation: IT.FunctionalLocation,
                                      FlDescription: "",
                                      MainWorkCenter: IT.MainWorkCenter.Value,
                                      ActivityType: IT.MaintenanceActivityType.Value,
                                      ObjectList: IT.ObjectList,
                                      Revision: IT.RevisionMark.Value,
                                      OrstedResponsible: IT.OrstedResponsibleEmail,
                                      Initials: IT.InitialOrstedResponsible,
                                      LongText: IT.ItemDescription,
                                      NonFlowUserStatus: Coalesce(IT.NonFlowUserStatus.Value, ""),
                                      TasklistKey: "",
                                      TasklistName: "",
                                      Status: "valid",
                                      SpId: IT.ID
                                  }
                              )
                          ),
                          ClearCollect(
                              colVhpSavedItems,
                              ForAll(
                                  Filter(MaintenanceItems, MaintenancePlanNo.Id = varVhpPlanSpId) As IT,
                                  { LocalId: IT.ID, SpId: IT.ID, ItemKey: IT.ItemID }
                              )
                          ),
                          ClearCollect(
                              colVhpOperations,
                              ForAll(
                                  Filter(TaskListMain, MaintenancePlanID.Id = varVhpPlanSpId) As OP,
                                  {
                                      ItemId: OP.MaintenanceItemNo.Id,
                                      OperationNo: Text(OP.OperationNo, "0000"),
                                      OperationShortText: OP.OperationShortText,
                                      WorkHours: OP.Work,
                                      Persons: OP.Num,
                                      DurationHours: OP.Duration,
                                      MainWorkCenter: OP.WorkCtr,
                                      Vendor: OP.Vendor,
                                      LongText: OP.LongText,
                                      PackagesKey: Coalesce(OP.PackagesKey, ";"),
                                      Selected: false,
                                      ControlKey: OP.Ctrl,
                                      Cost: OP.Price,
                                      UnitCost: If(Coalesce(OP.Work, 0) > 0, OP.Price / OP.Work, OP.Price),
                                      Currency: OP.Currency,
                                      CostElement: OP.CostElem,
                                      MaterialGroup: OP.MaterialGroup,
                                      SpId: OP.ID
                                  }
                              )
                          )
                      );

                      // Disse to LAESER colVhpSavedItems, som boelge 1
                      // skriver. De kan derfor ikke koere sammen med den.
                      Concurrent(
                          ClearCollect(
                              colVhpMaterials,
                              ForAll(
                                  Filter(MD_TasklistMaterial, PlanKey = varVhpPlanKey) As MT,
                                  {
                                      ItemId: LookUp(colVhpSavedItems, ItemKey = MT.ItemKey).LocalId,
                                      LineId: MT.LineId,
                                      MaterialNo: MT.MaterialNo,
                                      Description: MT.MaterialText,
                                      Unit: MT.Unit,
                                      Quantity: MT.Quantity,
                                      OperationNo: MT.OperationNo,
                                      Selected: false
                                  }
                              )
                          ),
                          ClearCollect(
                              colVhpAttachments,
                              ForAll(
                                  Filter(MD_TasklistAttachment, PlanKey = varVhpPlanKey) As AT,
                                  {
                                      ItemId: LookUp(colVhpSavedItems, ItemKey = AT.ItemKey).LocalId,
                                      FileName: AT.FileName,
                                      FileUrl: AT.FileUrl,
                                      Identifier: "",
                                      FileSize: AT.FileSize,
                                      OperationsKey: Coalesce(AT.OperationsKey, ";"),
                                      Status: AT.UploadStatus.Value,
                                      Selected: false
                                  }
                              )
                          )
                      );

                      // --- det, gemningen ikke skriver, afledes ---------
                      // Objektlisten ligger som tekst paa itemet ("A;B;C").
                      ClearCollect(
                          colVhpItemObjects,
                          Ungroup(
                              ForAll(
                                  colVhpItems As I,
                                  {
                                      Objs: ForAll(
                                          Filter(Split(I.ObjectList, ";"), !IsBlank(Trim(Value))) As S,
                                          { ItemId: I.ItemId, Code: Trim(S.Value), Description: "" }
                                      )
                                  }
                              ),
                              Objs
                          )
                      );
                      // Een standardarbejdsplan pr. vaerk: et item med
                      // operationer har vaerkets (trin 3 og S3 kraever den).
                      With(
                          { tl: LookUp(colVhpTasklists, Upper(Plant) = Upper(varVhpPlan.Plant)) },
                          UpdateIf(
                              colVhpItems,
                              ItemId in colVhpOperations.ItemId,
                              { TasklistKey: Coalesce(tl.Key, ""), TasklistName: Coalesce(tl.Name, "") }
                          )
                      );
                      ClearCollect(
                          colVhpOpsDone,
                          ShowColumns(
                              Filter(
                                  colVhpItems As I,
                                  !IsBlank(I.TasklistKey) && I.ItemId in colVhpOperations.ItemId &&
                                  (varVhpPlan.PlanType <> "Strategy" || !(!IsEmpty(Filter(colVhpStrategyPackages, StrategyKey = varVhpPlan.Strategy))) ||
                                      CountRows(Filter(colVhpOperations, ItemId = I.ItemId && Len(Coalesce(PackagesKey, ";")) <= 1)) = 0)
                              ),
                              ItemId
                          )
                      );

                      // --- hvad der er valgt naar skaermen tegnes -------
                      Set(varVhpActiveItemId, First(colVhpItems).ItemId);
                      Set(varVhpNextItemId, Max(colVhpItems, ItemId));
                      Notify(
                          "Opened " & idx.RequestNo & " - " &
                              Text(CountRows(colVhpItems)) & " item(s), " &
                              Text(CountRows(colVhpOperations)) & " operation line(s).",
                          NotificationType.Success
                      );
                      // Den indlaeste plan ER den gemte - Save-trinnet er groent,
                      // til noget aendres.
                      Set(varVhpSavedJson, VhpStateJson);
                      true,
                      Notify(
                          "Could not open the request: " & FirstError.Message,
                          NotificationType.Error
                      );
                      Set(varVhpRequestGuid, "");
                      Set(varVhpPlanSpId, 0);
                      Set(varVhpPlanKey, "");
                      Set(varVhpPlanModified, Blank());
                      Set(varVhpPlanCommitted, false);
                      Set(varVhpPlanLocked, false);
                      false
                      )
                  )
              )
          )
      )
    StartScreen: |-
        =ScreenVhPlan
    Theme: |-
        =PowerAppsTheme
