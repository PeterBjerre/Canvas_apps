              If(w1 = 0, "", "<div style='position:absolute;left:" & x1 & "px;top:" & (r1 * 36 + 2) & "px;width:" & w1 & "px;height:28px;box-sizing:border-box;margin:0;padding:0 13px;border:1px solid " & C.'hex-border-default' & ";border-radius:14px;background-color:" & C.'hex-state-neutral-bg' & ";color:" & C.'hex-text-primary' & ";font-size:13px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'><span style='font-size:10px;line-height:26px;font-weight:600;letter-spacing:0.5px;margin-right:6px;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(l1, "&", "&amp;"), "<", "&lt;") & "</span>" & Substitute(Substitute(d1, "&", "&amp;"), "<", "&lt;") & "</div>") &
              If(w2 = 0, "", "<div style='position:absolute;left:" & x2 & "px;top:" & (r2 * 36 + 2) & "px;width:" & w2 & "px;height:28px;box-sizing:border-box;margin:0;padding:0 13px;border:1px solid " & C.'hex-border-default' & ";border-radius:14px;background-color:" & C.'hex-state-neutral-bg' & ";color:" & C.'hex-text-primary' & ";font-size:13px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'><span style='font-size:10px;line-height:26px;font-weight:600;letter-spacing:0.5px;margin-right:6px;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(l2, "&", "&amp;"), "<", "&lt;") & "</span>" & Substitute(Substitute(d2, "&", "&amp;"), "<", "&lt;") & "</div>") &
              If(w3 = 0, "", "<div style='position:absolute;left:" & x3 & "px;top:" & (r3 * 36 + 2) & "px;width:" & w3 & "px;height:28px;box-sizing:border-box;margin:0;padding:0 13px;border:1px solid " & C.'hex-border-default' & ";border-radius:14px;background-color:" & C.'hex-state-neutral-bg' & ";color:" & C.'hex-text-primary' & ";font-size:13px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'><span style='font-size:10px;line-height:26px;font-weight:600;letter-spacing:0.5px;margin-right:6px;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(l3, "&", "&amp;"), "<", "&lt;") & "</span>" & Substitute(Substitute(d3, "&", "&amp;"), "<", "&lt;") & "</div>") &
              If(w4 = 0, "", "<div style='position:absolute;left:" & x4 & "px;top:" & (r4 * 36 + 2) & "px;width:" & w4 & "px;height:28px;box-sizing:border-box;margin:0;padding:0 13px;border:1px solid " & C.'hex-border-default' & ";border-radius:14px;background-color:" & C.'hex-state-neutral-bg' & ";color:" & C.'hex-text-primary' & ";font-size:13px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'><span style='font-size:10px;line-height:26px;font-weight:600;letter-spacing:0.5px;margin-right:6px;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(l4, "&", "&amp;"), "<", "&lt;") & "</span>" & Substitute(Substitute(d4, "&", "&amp;"), "<", "&lt;") & "</div>") &
              If(w5 = 0, "", "<div style='position:absolute;left:" & x5 & "px;top:" & (r5 * 36 + 2) & "px;width:" & w5 & "px;height:28px;box-sizing:border-box;margin:0;padding:0 13px;border:1px solid " & C.'hex-border-default' & ";border-radius:14px;background-color:" & C.'hex-state-neutral-bg' & ";color:" & C.'hex-text-primary' & ";font-size:13px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'><span style='font-size:10px;line-height:26px;font-weight:600;letter-spacing:0.5px;margin-right:6px;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(l5, "&", "&amp;"), "<", "&lt;") & "</span>" & Substitute(Substitute(d5, "&", "&amp;"), "<", "&lt;") & "</div>") &
              If(w6 = 0, "", "<div style='position:absolute;left:" & x6 & "px;top:" & (r6 * 36 + 2) & "px;width:" & w6 & "px;height:28px;box-sizing:border-box;margin:0;padding:0 13px;border:1px solid " & C.'hex-border-default' & ";border-radius:14px;background-color:" & C.'hex-state-neutral-bg' & ";color:" & C.'hex-text-primary' & ";font-size:13px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'><span style='font-size:10px;line-height:26px;font-weight:600;letter-spacing:0.5px;margin-right:6px;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(l6, "&", "&amp;"), "<", "&lt;") & "</span>" & Substitute(Substitute(d6, "&", "&amp;"), "<", "&lt;") & "</div>") &
              If(w7 = 0, "", "<div style='position:absolute;left:" & x7 & "px;top:" & (r7 * 36 + 2) & "px;width:" & w7 & "px;height:28px;box-sizing:border-box;margin:0;padding:0 13px;border:1px solid " & C.'hex-border-default' & ";border-radius:14px;background-color:" & C.'hex-state-neutral-bg' & ";color:" & C.'hex-text-primary' & ";font-size:13px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'><span style='font-size:10px;line-height:26px;font-weight:600;letter-spacing:0.5px;margin-right:6px;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(l7, "&", "&amp;"), "<", "&lt;") & "</span>" & Substitute(Substitute(d7, "&", "&amp;"), "<", "&lt;") & "</div>") &
              If(w8 = 0, "", "<div style='position:absolute;left:" & x8 & "px;top:" & (r8 * 36 + 2) & "px;width:" & w8 & "px;height:28px;box-sizing:border-box;margin:0;padding:0 13px;border:1px solid " & C.'hex-border-default' & ";border-radius:14px;background-color:" & C.'hex-state-neutral-bg' & ";color:" & C.'hex-text-primary' & ";font-size:13px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'><span style='font-size:10px;line-height:26px;font-weight:600;letter-spacing:0.5px;margin-right:6px;color:" & C.'hex-text-muted' & "'>" & Substitute(Substitute(l8, "&", "&amp;"), "<", "&lt;") & "</span>" & Substitute(Substitute(d8, "&", "&amp;"), "<", "&lt;") & "</div>") &
