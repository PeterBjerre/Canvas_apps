    OnError: |
      =Trace(
          "Unhandled error",
          TraceSeverity.Error,
          { Message: FirstError.Message, Source: FirstError.Source, Observed: FirstError.Observed }
      );
      Notify("Something went wrong: " & FirstError.Message, NotificationType.Error)
    OnStart: |
      =If(false, ClearCollect(colVhpItems, { ItemId: 0, ShortText: "", FunctionalLocation: "", FlDescription: "", MainWorkCenter: "", ActivityType: "", ObjectList: "", Revision: "", OrstedResponsible: "", Initials: "", LongText: "", NonFlowUserStatus: "", TasklistKey: "", TasklistName: "", Status: "", SpId: 0 }));

      If(false, ClearCollect(colVhpOperations, { ItemId: 0, OperationNo: "", OperationShortText: "", WorkHours: 0, Persons: 0, DurationHours: 0, MainWorkCenter: "", Vendor: "", LongText: "", PackagesKey: ";", Selected: false, ControlKey: "", Cost: 0, UnitCost: 0, Currency: "", CostElement: 0, MaterialGroup: "", ServiceNo: "", SpId: 0 }));

      If(false, ClearCollect(colVhpFl, { Code: "", Description: "", Display: "", Maintainable: false, Level: "" }));

      If(false, ClearCollect(colVhpItemObjects, { ItemId: 0, Code: "", Description: "" }));

      If(false, ClearCollect(colVhpObjDraft, { Code: "", Description: "" }));

      If(false, ClearCollect(colVhpPickerSelected, { OperationNo: "" }));

      If(false, ClearCollect(colVhpOpsDone, { ItemId: 0 }));

      If(false, ClearCollect(colVhpMaterials, { ItemId: 0, LineId: 0, MaterialNo: "", Description: "", Unit: "", Quantity: 0, OperationNo: "", Selected: false }));

      If(false, ClearCollect(colVhpAttachments, { ItemId: 0, FileName: "", FileUrl: "", Identifier: "", FileSize: 0, OperationsKey: ";", Status: "", Selected: false }));

      If(false, ClearCollect(colVhpAttFiles, { Name: "", Link: "", Identifier: "" }));

      If(false, ClearCollect(colVhpAttKeep, { FileName: "", OperationsKey: ";" }));

      If(false, ClearCollect(colVhpAttUp, { Name: "", Ok: false }));

      If(false, ClearCollect(colVhpSavedItems, { LocalId: 0, SpId: 0, ItemKey: "" }));

      If(false, ClearCollect(colVhpSavedOps, { LocalItemId: 0, OpNo: "", SpId: 0, TaskKey: "" }));

      If(false, ClearCollect(colVhpSpItems, { ID: 0, ItemID: "", Sceq: false }));

      If(false, ClearCollect(colVhpAdmOld, { ID: 0, ItemID: "", Title: "", ItemDescription: "", FunctionalLocation: "", ObjectList: "" }));

      If(false, ClearCollect(colVhpSpOps, { ID: 0, TaskItemID: "" }));

      If(false, ClearCollect(colVhpOldMats, { ID: 0 }));

      If(false, ClearCollect(colVhpOldAtts, { ID: 0 }));

      If(false, ClearCollect(colVhpSaveErrors, { Where: "", Msg: "" }));

      ClearCollect(colAppPrefs, { Dark: false });
      Clear(colAppPrefs);

      // TEMAVALGET. Skal staa foerst: alt hvad skaermen tegner, laeser C,
      // og C laeser darkModeEnabled.
      //
      // IfError fordi SaveData/LoadData ikke findes i Studio. Uden den
      // stopper hele OnStart, hver gang nogen trykker Preview.
      IfError(LoadData(colAppPrefs, "prefs", true), Blank());
      Set(
          darkModeEnabled,
          Coalesce(
              If(Lower(Param("theme")) = "dark", true,
                 Lower(Param("theme")) = "light", false),
              First(colAppPrefs).Dark,
              false
          )
      );

      Set(
          varVhpPlan,
          {
              Plant: "",
              Status: "",
              PlanType: "SingleCycle",
              Strategy: "",
              PlanText: "",
              SortField: "",
              Cycle: 0,
              Unit: "",
              FirstCallDay: Day(Today()),
              FirstCallMonth: Month(Today()),
              FirstCallYear: Year(Today()) + 1
          }
      );

      Set(varVhpPlanCommitted, false);
      Set(varVhpPlanLocked, false);
      Set(varVhpViewOnly, false);
      Set(varVhpBadgeOn, false);
      Set(varVhpCanEdit, false);
      Set(varVhpPlanCreatedAt, Blank());
      Set(varVhpPlanValidated, false);
      Set(varVhpItemValidated, false);
      // Sektionernes Save/Edit (issue #103), som varVhpPlanLocked: Item Editoren
      // er foldet ud, mens varVhpItemEditing er sand; Tasklist and Operations er
      // klappet sammen for items i colVhpOpsDone. varVhpOpsSavePending er det
      // item, hvis Save venter paa gemningen (0 = intet).
      Set(varVhpItemEditing, false);
      Set(varVhpOpsSavePending, 0);
      Clear(colVhpOpsDone);
      // Hvor planen er EFTER Submit: Status og ApprovalStage fra MaintenancePlans
      // (docs/32-godkendelsesflow.md). Tom = ikke indsendt. Progressbaren skifter
      // til godkendelses- og SAP-trinene, naar Status er indsendt (build_status).
      Set(varVhpFlow, { Status: "", Stage: "", ReturnComment: "" });
      // Appen aabner med EET item, der allerede er valgt. Item Editoren stod
      // foer tom og skrivebeskyttet (DM_ITEM slaar fra paa tomt
      // varVhpActiveItemId), saa det foerste man moedte var en raekke graa felter
      // og en knap, man skulle finde foerst. Nummeret er 1, saa "Add item" (som
      // taeller varVhpNextItemId een op foerst) fortsaetter ved 2.
      Set(varVhpActiveItemId, 1);
      Set(varVhpNextItemId, 1);
      Set(varVhpFlMsg, "");
      // Noterne ved Submit (issue #115, tools/submission_notes.py). build_load
      // fylder dem kun med det, brugeren maa se. varVhpOwnerEmail er ejeren af
      // en indlaest plan (tom = ny plan, brugeren selv).
      Set(varVhpNoteApprover, "");
      Set(varVhpNoteSelf, "");
      Set(varVhpOwnerEmail, "");
      Set(varVhpNotesEdit, false);
      // Brugeren, som alle skrivninger stempler (REVIEW.md A10).
      Set(varVhpMe, Lower(User().Email));
      // Trinene og Submit regnes af navngivne formler (build_status.py).
      // varVhpSavedJson er planen, som den stod ved sidste gemning i SharePoint.
      Set(varVhpSavedJson, "");
      Set(varVhpPrevPlant, "");
      // FL-vaelgeren (tools/fl_picker.py): om flowet koerer, soegeteksten og
      // den sidste soegning, det valgte resultat - og Object List-popup'en.
      Set(varVhpFlBusy, false);
      Set(varVhpFlQuery, "");
      Set(varVhpFlLast, "");
      Set(varVhpFlPick, "");
      Set(varVhpObjListOpen, false);
      // Trinet, der sidst er klikket i progressbaren - dets sektion har en tyk kant.
      Set(varVhpFocusStep, 0);
      // Popuppen med noterne - ved Submit og i visningen (issue #115).
      Set(varVhpConfirmSubmit, false);
      Set(varVhpConfirmNew, false);
      // Popupperne for materialer og dokumenter pr. operation (OperationNo, tom = lukket).
      Set(varVhpMatOpNo, "");
      Set(varVhpAttOpNo, "");
      // Lang tekst: "op" = en operation, "item" = itemets lange tekst.
      Set(varVhpLongTextTarget, "op");
      Set(varVhpTasklistPickerOpen, false);

      // Get-flowet svarer med en STRENG, der skal gennem ParseJSON.
      Set(varVhpAttJson, "");

      // Popup'en til lang tekst paa en operation. Operationen udpeges af
      // BEGGE noegler - OperationNo er kun unikt inden for et item.
      Set(varVhpLongTextOpen, false);
      Set(varVhpLongTextItemId, 0);
      Set(varVhpLongTextOpNo, "");
      Set(varVhpLongTextDraft, "");

      // Gemning i SharePoint. SpId > 0 betyder, at planen findes som raekke -
      // saa opdateres den i stedet for at blive oprettet igen.
      Set(varVhpPlanSpId, 0);
      Set(varVhpPlanKey, "");
      // Gemmet (build_save.py): konflikttjek, Save draft/Submit og planens raekke.
      Set(varVhpPlanModified, Blank());
      Set(varVhpSubmitting, false);
      Set(varVhpRequestGuid, "");
      Set(varVhpSaving, false);

      // Hjaelpepanelerne. Slaaet fra som standard - teksten er der for den, der
      // har brug for den, ikke for at fylde skaermen for alle andre.
      Set(varVhpShowHints, false);

      // Fanen i Tasklist-sektionen. Operations er den man er i oftest.
      Set(varVhpOpsTab, "ops");

      // Dyblink fra Masterdata Hub: <app-url>?reqid=<RequestGuid>.
      //
      // Det er en datahentning i OnStart, og reglen er ellers, at der ikke
      // er nogen. Undtagelsen er bevidst og betales kun af den, der
      // FAKTISK aabner et dyblink: uden parameter koeres kun Collect af et
      // tomt item, og der roeres ingen liste. Se build_load.py.
      If(
          IsBlank(Param("reqid")),

          Collect(colVhpItems, {
              ItemId: 1,
              ShortText: "",
              FunctionalLocation: "",
              FlDescription: "",
              MainWorkCenter: "",
              ActivityType: "",
              ObjectList: "",
              Revision: "",
              OrstedResponsible: "",
              Initials: Upper(First(Split(varVhpMe, "@")).Value),
              LongText: "",
              NonFlowUserStatus: "",
              TasklistKey: "",
              TasklistName: "",
              Status: "draft",
              SpId: 0
          }),

          Set(varVhpRequestGuid, Param("reqid"));
          With(
              { idx: LookUp(MD_RequestIndex, RequestGuid = varVhpRequestGuid) },
              Set(varVhpPlanSpId, idx.SourceItemId);
              With(
                  { pl: LookUp(MaintenancePlans, ID = varVhpPlanSpId) },
                  If(
                      IsBlank(pl.ID),

                      // Linket peger paa noget, der ikke er her - fx en
                      // indmelding fra et andet miljoe. Sig det, og aabn
                      // som en ny plan i stedet for at staa tom og tavs.
                      Notify(
                          "Could not find the request behind this link. Opening a new plan.",
                          NotificationType.Warning
                      );
                      Set(varVhpRequestGuid, "");
                      Set(varVhpPlanSpId, 0);
                      Set(varVhpPlanModified, Blank());
                      Collect(colVhpItems, {
                          ItemId: 1,
                          ShortText: "",
                          FunctionalLocation: "",
                          FlDescription: "",
                          MainWorkCenter: "",
                          ActivityType: "",
                          ObjectList: "",
                          Revision: "",
                          OrstedResponsible: "",
                          Initials: Upper(First(Split(varVhpMe, "@")).Value),
                          LongText: "",
                          NonFlowUserStatus: "",
                          TasklistKey: "",
                          TasklistName: "",
                          Status: "draft",
                          SpId: 0
                      }),

                      IfError(
                      // --- planhovedet ---------------------------------
                      Set(varVhpPlanSpId, pl.ID);
                      Set(varVhpPlanKey, pl.PlanID);
                      Set(
                          varVhpPlan,
                          {
                              Plant: pl.PlantsInitial.Value,
                              Status: Coalesce(LookUp(MaintenanceItems, MaintenancePlanNo.Value = Coalesce(varVhpPlanKey, "-")).Status.Value, ""),
                              PlanType: If(IsBlank(pl.StrategyKey), "SingleCycle", "Strategy"),
                              Strategy: Coalesce(pl.StrategyKey, ""),
                              PlanText: pl.Title,
                              SortField: pl.SortField.Value,
                              Cycle: pl.Cycle,
                              Unit: pl.Unit.Value,
                              FirstCallDay: Day(pl.PlannedDate),
                              FirstCallMonth: Month(pl.PlannedDate),
                              FirstCallYear: Year(pl.PlannedDate)
                          }
                      );
                      Set(varVhpFlow, { Status: Coalesce(pl.Status.Value, ""), Stage: Coalesce(pl.ApprovalStage.Value, ""), ReturnComment: With({ t: Coalesce(pl.ReturnComment, "") }, With({ x: Switch(t, "omkostning", "Cost", "godkendt tidligere", "Approved earlier", "systemgodkendelsen", "System approval", "omkostningsgodkendelsen", "Cost approval", "Planen har ingen items.", "The plan has no items.", "Omkostningsgodkenderen (COST) findes ikke i MD_Approver eller i Office 365.", "The cost approver (COST) is not in MD_Approver or Office 365.", "Kvalitetsgodkenderen for værket findes ikke i MD_Approver eller i Office 365.", "The quality approver for the plant is not in MD_Approver or Office 365.", If(StartsWith(t, "opretter er 1. eller 2. godkender for system "), "Requester is 1st or 2nd approver for system " & Mid(t, 46), StartsWith(t, "intet svar fra "), "No response from " & Mid(t, 16), StartsWith(t, "kvalitetsgennemgang ("), "Quality review (" & Mid(t, 22), StartsWith(t, "kvalitet "), "Quality " & Mid(t, 10), StartsWith(t, "system "), "System " & Mid(t, 8), StartsWith(t, "SAP-plan "), "SAP plan " & Mid(t, 10), t)) }, Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(x, " kr. (grænse ", " DKK (threshold "), " kr.)", " DKK)"), " findes ikke i systemmodellen", " is not in the system model"), " hører til ", " belongs to "), ", planen er til ", ", the plan is for "), " har ingen gyldig godkender i listen", " has no valid approver in the list"), " har ingen godkender i listen", " has no approver in the list"), " har ingen godkender, der findes i Office 365", " has no approver found in Office 365"), "(ingen kommentar)", "(no comment)"), "(Kladde, ", "(Draft, "), "(Indsendt, ", "(Submitted, "), "(UnderBehandling, ", "(In progress, "), "(AfventerInfo, ", "(Awaiting info, "), "(KlarTilSAP, ", "(Ready for SAP, "), "(OprettetISAP, ", "(Created in SAP, "), "(Afvist, ", "(Rejected, "), "(Annulleret, ", "(Cancelled, "))) });
                      Set(varVhpOwnerEmail, Lower(Coalesce(idx.RequesterEmail, "")));
                      Set(varVhpNoteApprover, If((Lower(Coalesce(idx.RequesterEmail, "")) = varVhpMe || IsAdmin || IsApprover || Lower(Coalesce(idx.AssignedToEmail, "")) = varVhpMe || !IsBlank(LookUp(MD_ApprovalLog, RequestGuid = varVhpRequestGuid && DecidedByEmail = varVhpMe))), Coalesce(pl.NoteToApprover, ""), ""));
                      Set(varVhpPlanModified, pl.Modified);
                      Set(varVhpRequestGuid, idx.RequestGuid);
                      Set(varVhpPlanCommitted, true);
                      Set(varVhpPlanLocked, true);
                      Set(varVhpCanEdit, ((Lower(Coalesce(idx.RequesterEmail, "")) = varVhpMe && (idx.Status.Value = "Kladde")) || (IsAdmin && (idx.Status.Value = "Kladde" || idx.Status.Value = "AfventerInfo"))));
                      Set(varVhpViewOnly, !(Lower(Coalesce(Param("mode"), "")) = "edit" && varVhpCanEdit));

                      // --- de fem hentninger, PAA EEN GANG -------------
                      //
                      // Fem lister i kaede er fem rundture efter hinanden;
                      // appen venter paa SUMMEN. I Concurrent venter den kun
                      // paa den laengste.
                      //
                      // De fem er uafhaengige af hinanden. De afhaenger alle
                      // af 'pl' - men den er sat UDENFOR og er faerdig, foer
                      // Concurrent starter. Og varVhpActiveItemId nedenfor
                      // laeser colVhpItems: ogsaa sikkert, for Concurrent
                      // venter paa dem alle, foer den gaar videre.
                      Concurrent(
                          ClearCollect(
                              colVhpItems,
                              ForAll(
                                  Filter(MaintenanceItems, MaintenancePlanNo.Value = Coalesce(varVhpPlanKey, "-")) As IT,
                                  {
                                      ItemId: IT.ID,
                                      ShortText: IT.Title,
                                      FunctionalLocation: IT.FunctionalLocation,
                                      FlDescription: "",
                                      MainWorkCenter: IT.MainWorkCenter.Value,
                                      ActivityType: IT.MaintenanceActivityType.Value,
                                      ObjectList: IT.ObjectList,
                                      Revision: If(IT.Revision, Coalesce(IT.RevisionMark.Value, First(colVhpRevisionOptions).Value), Coalesce(IT.RevisionMark.Value, "")),
                                      OrstedResponsible: IT.OrstedResponsibleEmail,
                                      Initials: IT.InitialOrstedResponsible,
                                      LongText: IT.ItemDescription,
                                      NonFlowUserStatus: Coalesce(IT.NonFlowUserStatus.Value, ""),
                                      TasklistKey: "",
                                      TasklistName: "",
                                      Status: "valid",
                                      SpId: IT.ID
                                  }
                              )
                          ),
                          ClearCollect(
                              colVhpSavedItems,
                              ForAll(
                                  Filter(MaintenanceItems, MaintenancePlanNo.Value = Coalesce(varVhpPlanKey, "-")) As IT,
                                  { LocalId: IT.ID, SpId: IT.ID, ItemKey: IT.ItemID }
                              )
                          ),
                          ClearCollect(
                              colVhpOperations,
                              ForAll(
                                  Filter(TaskListMain, MaintenancePlanID.Value = Coalesce(varVhpPlanKey, "-")) As OP,
                                  {
                                      ItemId: OP.MaintenanceItemNo.Id,
                                      OperationNo: Text(OP.OperationNo, "0000"),
                                      OperationShortText: OP.OperationShortText,
                                      WorkHours: OP.Work,
                                      Persons: OP.Num,
                                      DurationHours: OP.Duration,
                                      MainWorkCenter: OP.WorkCtr,
                                      Vendor: OP.Vendor,
                                      LongText: OP.LongText,
                                      PackagesKey: Coalesce(OP.PackagesKey, ";"),
                                      Selected: false,
                                      ControlKey: OP.Ctrl,
                                      Cost: OP.Price,
                                      UnitCost: If(Coalesce(OP.Work, 0) > 0, OP.Price / OP.Work, OP.Price),
                                      Currency: OP.Currency,
                                      CostElement: OP.CostElem,
                                      MaterialGroup: OP.MaterialGroup,
                                      ServiceNo: OP.ServiceNo,
                                      SpId: OP.ID
                                  }
                              )
                          ),
                          Set(varVhpNoteSelf, If((Lower(Coalesce(idx.RequesterEmail, "")) = varVhpMe || IsAdmin), Coalesce(LookUp(VHP_NoteToSelf, RequestGuid = varVhpRequestGuid).Note, ""), ""))
                      );

                      // Disse to LAESER colVhpSavedItems, som boelge 1
                      // skriver. De kan derfor ikke koere sammen med den.
                      Concurrent(
                          ClearCollect(
                              colVhpMaterials,
                              ForAll(
                                  Filter(MD_TasklistMaterial, PlanKey = varVhpPlanKey) As MT,
                                  {
                                      ItemId: LookUp(colVhpSavedItems, ItemKey = MT.ItemKey).LocalId,
                                      LineId: MT.LineId,
                                      MaterialNo: MT.MaterialNo,
                                      Description: MT.MaterialText,
                                      Unit: MT.Unit,
                                      Quantity: MT.Quantity,
                                      OperationNo: MT.OperationNo,
                                      Selected: false
                                  }
                              )
                          ),
                          ClearCollect(
                              colVhpAttachments,
                              ForAll(
                                  Filter(MD_TasklistAttachment, PlanKey = varVhpPlanKey) As AT,
                                  {
                                      ItemId: LookUp(colVhpSavedItems, ItemKey = AT.ItemKey).LocalId,
                                      FileName: AT.FileName,
                                      FileUrl: AT.FileUrl,
                                      Identifier: "",
                                      FileSize: AT.FileSize,
                                      OperationsKey: Coalesce(AT.OperationsKey, ";"),
                                      Status: AT.UploadStatus.Value,
                                      Selected: false
                                  }
                              )
                          )
                      );

                      // --- det, gemningen ikke skriver, afledes ---------
                      // Objektlisten ligger som tekst paa itemet ("A;B;C").
                      ClearCollect(
                          colVhpItemObjects,
                          Ungroup(
                              ForAll(
                                  colVhpItems As I,
                                  {
                                      Objs: ForAll(
                                          Filter(Split(I.ObjectList, ";"), !IsBlank(Trim(Value))) As S,
                                          { ItemId: I.ItemId, Code: Trim(S.Value), Description: "" }
                                      )
                                  }
                              ),
                              Objs
                          )
                      );
                      // Een standardarbejdsplan pr. vaerk: et item med
                      // operationer har vaerkets (trin 3 og S3 kraever den).
                      With(
                          { tl: LookUp(colVhpTasklists, Upper(Plant) = Upper(varVhpPlan.Plant)) },
                          UpdateIf(
                              colVhpItems,
                              ItemId in colVhpOperations.ItemId || !IsBlank(FunctionalLocation),
                              { TasklistKey: Coalesce(tl.Key, ""), TasklistName: Coalesce(tl.Name, "") }
                          )
                      );
                      ClearCollect(
                          colVhpOpsDone,
                          ShowColumns(
                              Filter(
                                  colVhpItems As I,
                                  !IsBlank(I.TasklistKey) && I.ItemId in colVhpOperations.ItemId &&
                                  (varVhpPlan.PlanType <> "Strategy" || !(!IsEmpty(Filter(colVhpStrategyPackages, StrategyKey = varVhpPlan.Strategy))) ||
                                      CountRows(Filter(colVhpOperations, ItemId = I.ItemId && Len(Coalesce(PackagesKey, ";")) <= 1)) = 0)
                              ),
                              ItemId
                          )
                      );

                      // --- hvad der er valgt naar skaermen tegnes -------
                      Set(varVhpActiveItemId, First(colVhpItems).ItemId);
                      Set(varVhpNextItemId, Max(colVhpItems, ItemId));
                      Notify(
                          "Opened " & idx.RequestNo & " - " &
                              Text(CountRows(colVhpItems)) & " item(s), " &
                              Text(CountRows(colVhpOperations)) & " operation line(s).",
                          NotificationType.Success
                      );
                      // Den indlaeste plan ER den gemte - Save-trinnet er groent,
                      // til noget aendres.
                      Set(varVhpSavedJson, VhpStateJson);
                      true,
                      Notify(
                          "Could not open the request: " & FirstError.Message,
                          NotificationType.Error
                      );
                      Set(varVhpRequestGuid, "");
                      Set(varVhpPlanSpId, 0);
                      Set(varVhpPlanKey, "");
                      Set(varVhpPlanModified, Blank());
                      Set(varVhpPlanCommitted, false);
                      Set(varVhpPlanLocked, false);
                      false
                      )
                  )
              )
          )
      )
    StartScreen: |-
        =ScreenVhPlan
    Theme: |-
        =PowerAppsTheme
