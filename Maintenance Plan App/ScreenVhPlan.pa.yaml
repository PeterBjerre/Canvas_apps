Screens:
  ScreenVhPlan:
    Properties:
      Fill: =RGBA(237, 241, 247, 1)
    Children:
      - conVhpRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Fill: =RGBA(237, 241, 247, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - conVhpShell:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =IfError(40 + conVhpHero.Height + 20 + conVhpPlanCard.Height + 20 + conVhpItemsSplit.Height + 20 + conVhpOpsCard.Height + 20 + conVhpDispatchCard.Height + 120, 3000)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =20
                  Width: =Parent.Width
                Children:
                  - conVhpHero:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(215, 222, 232, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 251, 253, 1)
                        FillPortions: =0
                        Height: =258
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width
                      Children:
                        - conVhpHeroGrid:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =108
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                              Width: =Parent.Width
                            Children:
                              - conVhpHeroLeft:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Height: =108
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutMinWidth: =0
                                    Width: =If(App.Width < 900, Parent.Width, Parent.Width - 250 - 16)
                                  Children:
                                    - txtVhpEyebrow:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="VH-PLAN"
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(89, 102, 122, 1)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="VH-PLAN"
                                          Wrap: =false
                                    - txtVhpTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="VH-plan"
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(26, 34, 49, 1)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =42
                                          LayoutMinWidth: =220
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =28
                                          Text: ="VH-plan"
                                          Wrap: =false
                                    - txtVhpSubtitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Opret planheader, laas planen, tilfoej items, bind tasklist pr. item, indberet via mailkladde."
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(89, 102, 122, 1)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          Height: =40
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: ="Opret planheader, laas planen, tilfoej items, bind tasklist pr. item, indberet via mailkladde."
                              - conVhpHeroActions:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =36
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutMinWidth: =0
                                    Width: =250
                                  Children:
                                    - conVhpHeroActionsRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =36
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =10
                                          LayoutJustifyContent: =LayoutJustifyContent.End
                                          LayoutMinWidth: =0
                                          Width: =250
                                        Children:
                                          - btnVhpValidate:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Validate"
                                                Align: =Align.Center
                                                AlignInContainer: =AlignInContainer.Center
                                                BasePaletteColor: =RGBA(0, 103, 174, 1)
                                                Color: =RGBA(255, 255, 255, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =36
                                                Layout: =ButtonLayout.TextOnly
                                                OnSelect: |-
                                                  =Set(varVhpPlanValidated, true);
                                                  Set(varVhpItemValidated, true);
                                                  Set(
                                                      varVhpLastValidationErrors,
                                                      Concat(
                                                          Filter(
                                                              colVhpItems,
                                                              IsBlank(ShortText) || IsBlank(MainWorkCenter) || IsBlank(ActivityType) || IsBlank(FunctionalLocation)
                                                          ),
                                                          "Item " & Text(ItemId) & " (" & Coalesce(ShortText, "no short text") & "): missing required fields.",
                                                          Char(10)
                                                      )
                                                  );
                                                  Set(
                                                      varVhpRuntimeInfo,
                                                      "Validated: " & Text(CountRows(colVhpItems)) & " item(s), " &
                                                      Text(CountRows(colVhpOperations)) & " operation line(s), " &
                                                      Text(CountRows(Filter(colVhpItems, Status = "invalid"))) & " invalid item(s)."
                                                  )
                                                RadiusBottomLeft: =10
                                                RadiusBottomRight: =10
                                                RadiusTopLeft: =10
                                                RadiusTopRight: =10
                                                Size: =14
                                                Text: ="Validate"
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =110
                                          - btnVhpExport:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Export JSON"
                                                Align: =Align.Center
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =ButtonAppearance.Secondary
                                                BorderColor: =RGBA(215, 222, 232, 1)
                                                BorderThickness: =1
                                                Color: =RGBA(26, 34, 49, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =36
                                                Layout: =ButtonLayout.TextOnly
                                                OnSelect: |-
                                                  =Set(
                                                      varVhpExportJson,
                                                      "{" &
                                                      """plant"":""" & varVhpPlan.Plant & """," &
                                                      """planText"":""" & varVhpPlan.PlanText & """," &
                                                      """items"":" & Text(CountRows(colVhpItems)) & "," &
                                                      """operations"":" & Text(CountRows(colVhpOperations)) &
                                                      "}"
                                                  );
                                                  Set(varVhpRuntimeInfo, "JSON exported: " & Text(CountRows(colVhpItems)) & " item(s), " & Text(Len(varVhpExportJson)) & " characters.")
                                                RadiusBottomLeft: =10
                                                RadiusBottomRight: =10
                                                RadiusTopLeft: =10
                                                RadiusTopRight: =10
                                                Size: =14
                                                Text: ="Export JSON"
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =130
                        - conVhpProcessStrip:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =26
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                              Width: =Parent.Width
                            Children:
                              - txtVhpStep1:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="1. Plan"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =If(true, RGBA(255, 255, 255, 1), RGBA(89, 102, 122, 1))
                                    Fill: =If(true, RGBA(0, 103, 174, 1), RGBA(228, 233, 241, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =0
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =12
                                    Text: ="1. Plan"
                                    Width: =118
                                    Wrap: =false
                              - txtVhpStep2:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="2. Item"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =If(varVhpPlanCommitted, RGBA(255, 255, 255, 1), RGBA(89, 102, 122, 1))
                                    Fill: =If(varVhpPlanCommitted, RGBA(0, 103, 174, 1), RGBA(228, 233, 241, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =0
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =12
                                    Text: ="2. Item"
                                    Width: =118
                                    Wrap: =false
                              - txtVhpStep3:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="3. Tasklist"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =If(varVhpPlanCommitted && CountRows(colVhpItems) > 0, RGBA(255, 255, 255, 1), RGBA(89, 102, 122, 1))
                                    Fill: =If(varVhpPlanCommitted && CountRows(colVhpItems) > 0, RGBA(0, 103, 174, 1), RGBA(228, 233, 241, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =0
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =12
                                    Text: ="3. Tasklist"
                                    Width: =118
                                    Wrap: =false
                              - txtVhpStep4:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="4. Operations"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =If(varVhpPlanCommitted && !IsBlank(LookUp(colVhpItems, ItemId = varVhpActiveItemId, TasklistKey)), RGBA(255, 255, 255, 1), RGBA(89, 102, 122, 1))
                                    Fill: =If(varVhpPlanCommitted && !IsBlank(LookUp(colVhpItems, ItemId = varVhpActiveItemId, TasklistKey)), RGBA(0, 103, 174, 1), RGBA(228, 233, 241, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =0
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =12
                                    Text: ="4. Operations"
                                    Width: =118
                                    Wrap: =false
                              - txtVhpStep5:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="5. Dispatch"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =If(varVhpPlanCommitted && CountRows(colVhpOperations) > 0, RGBA(255, 255, 255, 1), RGBA(89, 102, 122, 1))
                                    Fill: =If(varVhpPlanCommitted && CountRows(colVhpOperations) > 0, RGBA(0, 103, 174, 1), RGBA(228, 233, 241, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =0
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =12
                                    Text: ="5. Dispatch"
                                    Width: =118
                                    Wrap: =false
                        - txtVhpRuntimeInfo:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =varVhpRuntimeInfo
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =RGBA(89, 102, 122, 1)
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Segoe UI'
                              Height: =36
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: =varVhpRuntimeInfo
                        - conVhpLegend:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =20
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =3
                              LayoutMinWidth: =0
                              Width: =110
                            Children:
                              - txtVhpLegendStar:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="*"
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =RGBA(179, 50, 60, 1)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="*"
                                    Width: =10
                                    Wrap: =false
                              - txtVhpLegendText:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Skal udfyldes"
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =RGBA(89, 102, 122, 1)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Skal udfyldes"
                                    Width: =110
                                    Wrap: =false
                  - conVhpPlanCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(215, 222, 232, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 251, 253, 1)
                        FillPortions: =0
                        Height: =650
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        LayoutMinWidth: =0
                        PaddingBottom: =18
                        PaddingLeft: =18
                        PaddingRight: =18
                        PaddingTop: =18
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width
                      Children:
                        - conVhpPlanHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - conVhpPlanHeadLeft:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width - 64 - 12
                                  Children:
                                    - conVhpPlanHeadTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Plan Header"
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(26, 34, 49, 1)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =19
                                          Text: ="Plan Header"
                                          Wrap: =false
                                    - conVhpPlanHeadDesc:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Vedligeholdelsesplanens stamdata og tidsparametre."
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(89, 102, 122, 1)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          Height: =20
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="Vedligeholdelsesplanens stamdata og tidsparametre."
                                          Wrap: =false
                              - conVhpPlanHeadBadge:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Step 1"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =RGBA(89, 102, 122, 1)
                                    Fill: =RGBA(228, 233, 241, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =0
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =11
                                    Text: ="Step 1"
                                    Width: =64
                                    Wrap: =false
                        - txtVhpPlanLockState:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: |-
                                =If(varVhpPlanLocked, "Plan locked: " & varVhpPlan.Plant & " " & varVhpPlan.PlanText & " (" & varVhpPlan.Status & "). Click Edit to make changes.", "Plan is open for editing.")
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =If(varVhpPlanLocked, RGBA(0, 83, 140, 1), RGBA(89, 102, 122, 1))
                              Fill: =If(varVhpPlanLocked, RGBA(222, 240, 252, 1), RGBA(228, 233, 241, 1))
                              Font: =Font.'Segoe UI'
                              Height: =20
                              PaddingBottom: =4
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =4
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: |-
                                =If(varVhpPlanLocked, "Plan locked: " & varVhpPlan.Plant & " " & varVhpPlan.PlanText & " (" & varVhpPlan.Status & "). Click Edit to make changes.", "Plan is open for editing.")
                        - conVhpPlanGrid:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(App.Width < 640, 6 * (2 * 62 + 20) + 5 * 16, 6 * 62 + 5 * 16)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =16
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - conVhpPlanRow1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(App.Width < 640, 2 * 62 + 20, 62)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =20
                                    LayoutMinWidth: =0
                                    LayoutWrap: =true
                                    Width: =Parent.Width
                                  Children:
                                    - conVhpCellPlant:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          FillPortions: =If(App.Width < 1024, 0, 1)
                                          Height: =62
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =6
                                          LayoutMinWidth: =0
                                          Width: =If(App.Width < 640, Parent.Width, (Parent.Width - 20) / 2)
                                        Children:
                                          - conVhpCellPlantRow:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderStyle: =BorderStyle.None
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =20
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =3
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                                              Children:
                                                - conVhpCellPlantLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: ="Plant"
                                                      BorderStyle: =BorderStyle.None
                                                      BorderThickness: =0
                                                      Color: =RGBA(26, 34, 49, 1)
                                                      Fill: =RGBA(0, 0, 0, 0)
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =20
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: ="Plant"
                                                      Wrap: =false
                                                - conVhpCellPlantStar:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: ="Skal udfyldes"
                                                      BorderStyle: =BorderStyle.None
                                                      BorderThickness: =0
                                                      Color: =RGBA(179, 50, 60, 1)
                                                      Fill: =RGBA(0, 0, 0, 0)
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =20
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: ="*"
                                                      Width: =10
                                                      Wrap: =false
                                          - drpVhpPlant:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="drpVhpPlant"
                                                Appearance: =Appearance.Outline
                                                BorderColor: =If(varVhpPlanValidated && IsBlank(Self.Selected.Value), RGBA(179, 50, 60, 1), RGBA(215, 222, 232, 1))
                                                BorderStyle: =BorderStyle.Solid
                                                BorderThickness: =1
                                                Color: =RGBA(26, 34, 49, 1)
                                                Default: =LookUp(colVhpPlantCodes, Value = varVhpPlan.Plant)
                                                DisplayMode: =If(varVhpPlanLocked, DisplayMode.Disabled, DisplayMode.Edit)
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Value
                                                Items: =colVhpPlantCodes
                                                LayoutMinWidth: =0
