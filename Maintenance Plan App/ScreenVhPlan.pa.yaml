                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: |-
                          =If(
                              CountRows(colVhpPickerSelected) = 0,
                              Set(varVhpRuntimeInfo, "Select one or more lines first."),
                              With(
                                  { tl: LookUp(colVhpTasklists, Key = LookUp(colVhpItems, ItemId = varVhpActiveItemId).TasklistKey) },
                          ForAll(
                              Filter(tl.Operations, CountRows(Filter(colVhpPickerSelected, OperationNo = OperationNo)) > 0),
                              Collect(
                                  colVhpOperations,
                                  {
                                      ItemId: varVhpActiveItemId, OperationNo: OperationNo,
                                      OperationShortText: OperationShortText, WorkHours: WorkHours,
                                      DurationHours: DurationHours, MainWorkCenter: MainWorkCenter, Vendor: Vendor,
                                      LongText: LongText, Selected: false
                                  }
                              )
                          )
                              );
                              Set(varVhpRuntimeInfo, "Added " & Text(CountRows(colVhpPickerSelected)) & " operation line(s) from tasklist.");
                              Clear(colVhpPickerSelected);
                              Set(varVhpTasklistPickerOpen, false)
                          )
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =14
                        Text: ="Add selected lines"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =170
      - btnVhpSendEmail:
          Control: ModernButton
          Properties:
            AccessibleLabel: ="Send as email"
            Align: =Align.Center
            BasePaletteColor: =RGBA(0, 103, 174, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(varVhpPlanCommitted, DisplayMode.Edit, DisplayMode.Disabled)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =44
            Layout: =ButtonLayout.TextOnly
            OnSelect: |-
              =Launch(
                  "mailto:sapvedligehold@orsted.com" &
                  "?subject=" & EncodeUrl("VH-plan " & varVhpPlan.Plant & " " & varVhpPlan.PlanText & " (" & Text(Today(), "dd-mm-yyyy") & ")") &
                  "&body=" & EncodeUrl(
                      "Hej SAP vedligehold," & Char(10) & Char(10) &
                      "VH-plan klar til oprettelse i SAP:" & Char(10) &
                      "Plant: " & varVhpPlan.Plant & Char(10) &
                      "Plan text: " & varVhpPlan.PlanText & Char(10) &
                      "Status: " & varVhpPlan.Status & Char(10) &
                      "Cycle: " & Text(varVhpPlan.Cycle) & " " & varVhpPlan.Unit & Char(10) &
                      "Items: " & Text(CountRows(colVhpItems)) & " (" & Text(CountRows(Filter(colVhpItems, Status = "valid"))) & " valid, " & Text(CountRows(Filter(colVhpItems, Status = "invalid"))) & " invalid)" & Char(10) &
                      "Operations: " & Text(CountRows(colVhpOperations)) & Char(10) & Char(10) &
                      Concat(
                          FirstN(Sort(colVhpItems, ItemId), 15),
                          "- " & If(IsBlank(ShortText), "Item " & Text(ItemId), ShortText) & " | FL " & Coalesce(FunctionalLocation, "-") & " | " & Upper(Status),
                          Char(10)
                      ) & Char(10) & Char(10) &
                      "Sendt fra VH-plan appen den " & Text(Now(), "dd-mm-yyyy hh:mm")
                  )
              );
              Set(varVhpRuntimeInfo, "Email draft prepared: " & Text(CountRows(colVhpItems)) & " item(s).")
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            RadiusTopLeft: =22
            RadiusTopRight: =22
            Size: =14
            Text: ="Send as email"
            VerticalAlign: =VerticalAlign.Middle
            Width: =190
            X: =App.Width - 210
            Y: =App.Height - 70
