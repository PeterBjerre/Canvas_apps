                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: |-
                                                    ="Validate"
                                                Align: |-
                                                    =Align.Center
                                                AlignInContainer: |-
                                                    =AlignInContainer.Center
                                                BasePaletteColor: |-
                                                    =RGBA(0, 103, 174, 1)
                                                Color: |-
                                                    =RGBA(255, 255, 255, 1)
                                                Font: |-
                                                    =Font.'Segoe UI'
