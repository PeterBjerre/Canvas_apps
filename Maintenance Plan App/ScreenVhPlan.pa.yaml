                            ="Upload"
                        Align: |-
                            =Align.Center
                        AlignInContainer: |-
                            =AlignInContainer.Center
                        BasePaletteColor: |-
                            =C.'color-brand-primary'
                        Color: |-
                            =C.'text-on-primary'
                        Font: |-
                            =Font.'Segoe UI'
                        FontWeight: |-
                            =FontWeight.Semibold
                        Height: |-
                            =36
                        Icon: |-
                            ="ArrowUpload"
                        Layout: |-
                            =ButtonLayout.IconBefore
                        OnSelect: |-
                            =Clear(colVhpAttUp);
                            If(
                                IsBlank(LookUp(colVhpSavedItems, LocalId = varVhpActiveItemId).ItemKey),
                                Notify("Save the plan before attaching documents - the folder is named after the item.", NotificationType.Warning),
                            
                                If(
                                    CountRows(attVhpAttPicker.Attachments) = 0,
                                    Notify("Choose one or more files first.", NotificationType.Warning),
                            
                                    ClearCollect(
                                        colVhpAttUp,
                                        ForAll(
                                            attVhpAttPicker.Attachments As F,
                                            {
                                                Name: F.Name,
                                                Ok: IfError(
                                                    Lower(
                                                        Text(
                                                            'BioSap-TaskListAttachment'.Run(
                                                                LookUp(colVhpSavedItems, LocalId = varVhpActiveItemId).ItemKey,
                                                                { file: { contentBytes: F.Value, name: F.Name } }
                                                            ).flowrunsuccess
                                                        )
                                                    ) = "true",
                                                    false
                                                )
                                            }
                                        )
                                    );
                                    Reset(attVhpAttPicker);
                            
                                    ClearCollect(
                                        colVhpAttKeep,
                                        ForAll(
                                            Filter(colVhpAttachments, ItemId = varVhpActiveItemId) As A,
                                            { FileName: A.FileName, OperationsKey: A.OperationsKey }
                                        )
                                    );
                                    Set(
                                        varVhpAttJson,
                                        'BioSap-GetSubmittedAttachments'.Run("TaskListDocuments/" & LookUp(colVhpSavedItems, LocalId = varVhpActiveItemId).ItemKey).files
                                    );
                                    ClearCollect(
                                        colVhpAttFiles,
                                        ForAll(
                                            ParseJSON(Coalesce(varVhpAttJson, "[]")),
                                            {
                                                Name: Text(ThisRecord.Name),
                                                Link: Text(ThisRecord.Link),
                                                Identifier: Text(ThisRecord.Identifier)
                                            }
                                        )
                                    );
                                    RemoveIf(colVhpAttachments, ItemId = varVhpActiveItemId);
                                    Collect(
                                        colVhpAttachments,
                                        ForAll(
                                            colVhpAttFiles As F,
                                            {
                                                ItemId: varVhpActiveItemId,
                                                FileName: F.Name,
                                                FileUrl: F.Link,
                                                Identifier: F.Identifier,
                                                FileSize: 0,
                                                OperationsKey: Coalesce(
                                                    LookUp(colVhpAttKeep, FileName = F.Name).OperationsKey,
                                                    ";"
                                                ),
                                                Status: "Uploaded",
                                                Selected: false
                                            }
                                        )
                                    );
                                    Clear(colVhpAttKeep);
                            
                                    If(
                                        CountRows(Filter(colVhpAttUp, Ok = false)) > 0,
                                        Notify(
                                            "SharePoint refused: " &
                                            Concat(Filter(colVhpAttUp, Ok = false), Name, ", "),
                                            NotificationType.Error
                                        ),
                                        Notify("Document(s) uploaded.", NotificationType.Success)
                                    )
                                )
                            );
                            UpdateIf(
                                colVhpAttachments,
                                ItemId = varVhpActiveItemId &&
                                    FileName in Filter(colVhpAttUp, Ok).Name &&
                                    !(";" & varVhpAttOpNo & ";" in Coalesce(OperationsKey, ";")),
                                { OperationsKey: Coalesce(OperationsKey, ";") & varVhpAttOpNo & ";" }
                            )
