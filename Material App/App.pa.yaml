      // LAYOUTTOKENS. Genereret af tools/layout_tokens.py - ret ikke her.
      //
      // LayoutContext er den, man kan LAESE. LayoutRank er den, man kan
      // SAMMENLIGNE med: "desktop eller bredere" er LayoutRank >= 3.
      // Braekpunkterne staar eet sted for alle apps.
      LayoutContext = If(
          App.Width >= 1600, "Wide",
          App.Width >= 1024, "Desktop",
          App.Width >= 720, "Tablet",
          "Mobile"
      );

      LayoutRank = If(
          App.Width >= 1600, 4,
          App.Width >= 1024, 3,
          App.Width >= 720, 2,
          1
      );

      // ADMIN. Genereret af tools/permissions.py - ret ikke her.
      // Een delegerbar LookUp i admin-listen, laest dovent og kun een gang.
      IsAdmin = !IsBlank(LookUp(UserAndGroups, Title = "Admin" && Member = Lower(User().Email)));

      // Vaerkerne. Eneste opslagsliste appen laeser, og den laeses foerst,
      // naar dropdownen aabnes.
      colDomPlants = Sort(ForAll(PlantList As R, { Value: R.Title }), Value);
    OnError: |
      =Trace(
          "Unhandled error",
          TraceSeverity.Error,
          { Message: FirstError.Message, Source: FirstError.Source, Observed: FirstError.Observed }
      );
      Notify("Something went wrong: " & FirstError.Message, NotificationType.Error)
    OnStart: |
      =If(false, ClearCollect(colDomRows, { RowId: 0, ItemKey: "", RequestNo: "", Status: "", FileCount: 0, MaterialDescription: "", Plant: "", FunctionalLocation: "", NoBomItem: false, Manufacturer: "", ModelNumber: "", ManufacturerPartNo: "", Supplier: "", SupplierPartNo: "", DeliveringTime: 0, Price: 0, PriceUnit: "", StockUnit: "", RecommendedStock: 0, StrategicPart: "", WearPart: "" }));

      If(false, ClearCollect(colDomAttachments, { RowId: 0, FileName: "", FileUrl: "", Identifier: "", Selected: false }));

      If(false, ClearCollect(colDomAttUp, { Name: "", Ok: false }));

      If(false, ClearCollect(colDomFl, { Code: "", Description: "", Display: "", Maintainable: false, Level: "" }));

      ClearCollect(colAppPrefs, { Dark: false });
      Clear(colAppPrefs);

      // TEMAVALGET. Skal staa foerst: alt hvad skaermen tegner, laeser C,
      // og C laeser darkModeEnabled.
      //
      // IfError fordi SaveData/LoadData ikke findes i Studio. Uden den
      // stopper hele OnStart, hver gang nogen trykker Preview.
      IfError(LoadData(colAppPrefs, "prefs", true), Blank());
      Set(
          darkModeEnabled,
          Coalesce(
              If(Lower(Param("theme")) = "dark", true,
                 Lower(Param("theme")) = "light", false),
              First(colAppPrefs).Dark,
              false
          )
      );

      Set(varDomMe, Lower(User().Email));
      Set(varDomRequestNo, "");
      Set(varDomRequestGuid, "");
      Set(varDomViewOnly, false);
      Set(varDomBadgeOn, false);
      Set(varDomCanEdit, false);
      Set(varDomActiveRowId, Blank());
      // Hvilken raekke detaljeruden viser. Blank = ruden er skjult.
      Set(varDomDetailsId, Blank());
      // Sletning sker bag en bekraeftelse: hvilken raekke, og om den er aaben.
      Set(varDomDeleteId, Blank());
      Set(varDomConfirmDelete, false);
      // Hvilken raekke dokumentpopuppen viser. Blank = lukket.
      Set(varDomDocsId, Blank());
      Set(varDomRowStatus, "valid");
      Set(varDomAttJson, "");
      Set(varDomFlMsg, "");
      // FL-vaelgeren (tools/fl_picker.py): soegeteksten, den sidste soegning,
      // og om flowet koerer.
      Set(varDomFlQuery, "");
      Set(varDomFlLast, "");
      Set(varDomFlBusy, false);
      Set(varDomInfo, "");
      // Listen: false = Compact, true = All columns (issue #67/#68).
      Set(varDomAllCols, false);

      // Er formularen blevet tjekket? Styrer om en kraevet feltkant maa vaere
      // roed. false ved opstart: en tom formular, ingen har roert, skal ikke
      // staa og lyse roedt. Saettes af Gem/Indsend - se domain_parts.REQUIRED.
      Set(varDomValidated, false)
    StartScreen: |-
        =ScreenMaterial
    Theme: |-
        =PowerAppsTheme
