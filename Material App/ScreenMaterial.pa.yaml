                      ItemKey: Coalesce(R.ItemKey, ""),
                      RequestNo: Coalesce(R.RequestNo, ""),
                      Status: Coalesce(R.RowStatus.Value, "valid"),
                      FileCount: Coalesce(R.FileCount, 0),
                      MaterialDescription: Coalesce(R.MaterialDescription, ""),
                      Plant: Coalesce(R.Plant, ""),
                      FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                      Manufacturer: Coalesce(R.Manufacturer, ""),
                      ModelNumber: Coalesce(R.ModelNumber, ""),
                      ManufacturerPartNo: Coalesce(R.ManufacturerPartNo, ""),
                      Supplier: Coalesce(R.Supplier, ""),
                      SupplierPartNo: Coalesce(R.SupplierPartNo, ""),
                      DeliveringTime: R.DeliveringTime,
                      Price: R.Price,
                      PriceUnit: Coalesce(R.PriceUnit, ""),
                      StockUnit: Coalesce(R.StockUnit, ""),
                      RecommendedStock: R.RecommendedStock,
                      StrategicPart: Coalesce(R.StrategicPart, ""),
                      WearPart: Coalesce(R.WearPart, ""),
                      LongText: Coalesce(R.LongText, "")
                  }
