          Set(varDomActiveRowId, Blank());
          Set(varDomRowStatus, "valid");
          Set(varDomValidated, false);
          Set(varDomFText, "");
          Set(varDomFPlant, "");
          Set(varDomFFunctionalLocation, "");
          Set(varDomFManufacturer, "");
          Set(varDomFModelNumber, "");
