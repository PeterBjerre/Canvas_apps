    <section class="site-hero">
      <h1>Functional Location - Extract</h1>
      <div class="hero-action-row">
        <a class="hero-link-btn" href="functional-location.html">Back</a>
        <button id="btnExtractClassify" class="action-btn primary" type="button">Extract and Classify</button>
      </div>
      <p id="flExtractRuntime" class="small-muted" aria-live="polite" aria-atomic="true">Paste FL values and run extract.</p>
    </section>

    <section class="workspace-grid">
      <div class="workspace-main">
        <div class="glass-panel">
          <h2>Extract Input</h2>
          <p class="small-muted">One FL per line. Optional format: FL;ACT_CLASS.</p>
          <textarea id="flExtractInput" class="extract-input" aria-label="Functional Location input, one per line" spellcheck="false"></textarea>
        </div>

        <div class="glass-panel">
          <h2>Extract Output</h2>
          <div id="flExtractClassTabs" class="pill-tab-row" aria-label="Extract class tabs"></div>
          <div id="flExtractOutput"></div>
        </div>
      </div>

      <aside class="workspace-side">
        <div class="glass-panel">
          <h3>Metrics</h3>
          <div class="metric-grid" aria-live="polite" aria-atomic="true">
            <div class="metric-card">
              <span class="label">Input Rows</span>
              <span id="flExtractMetricRows" class="value">0</span>
            </div>
            <div class="metric-card">
              <span class="label">Class Buckets</span>
              <span id="flExtractMetricClasses" class="value">0</span>
            </div>
            <div class="metric-card">
              <span class="label">Rules Data</span>
              <span id="flExtractDataState" class="value">-</span>
            </div>
          </div>
          <p id="flExtractMeta" class="small-muted" aria-live="polite" aria-atomic="true">-</p>
        </div>
      </aside>
    </section>

    <footer class="footer-note">FL extract.</footer>
