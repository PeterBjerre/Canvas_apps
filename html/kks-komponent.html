<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="tokens.css?v=20260804" />
  <link rel="stylesheet" href="styles.css?v=20260804" />
  <link rel="stylesheet" href="site.css?v=20260804" />
  <link rel="stylesheet" href="shell.css?v=20260807" />
</head>
<body data-page="kks" data-kks-detail="off" data-kks-mode-scope="component">
  <div class="site-shell">
    <header class="site-topbar">
      <a class="site-brand" href="index.html">
        <span class="site-brand-mark" aria-hidden="true"></span>
        <span>BIO SAP</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" data-nav="home">Forside</a>
        <a href="functional-location.html" data-nav="functional-location">Functional Location</a>
        <a href="vh-plan.html" data-nav="vh-plan">VH-plan</a>
        <a href="materialer.html" data-nav="materialer">Materialer</a>
        <a href="equipment.html" data-nav="equipment">Equipment</a>
        <a href="kks-kks.html" data-nav="kks">KKS</a>
        <a href="vgb-aggregat.html" data-nav="vgb">VGB</a>
        <a href="faq.html" data-nav="faq">FAQ</a>
      </nav>
    </header>

    <section class="site-hero kks-hero">
      <div class="kks-hero-main">
        <h1>KKS Opslag</h1>
        <p>Komponentnøgle visning med samme søge- og klikflow.</p>
      </div>
    </section>

    <section class="glass-panel kks-control-shell">
      <div class="lookup-toolbar">
        <div class="hero-action-row" aria-label="Nøgleområde">
          <a class="hero-link-btn" href="kks-kks.html">Funktionsnøgle</a>
          <a class="hero-link-btn" href="kks-aggregat.html">Aggregatnøgle</a>
          <a class="hero-link-btn primary" href="kks-komponent.html">Komponentnøgle</a>
        </div>
        <div class="kks-nav-mode" aria-label="Navigationsvisning">
          <div class="kks-nav-mode-switch" role="group" aria-label="Skift navigationsmode">
            <button id="kksNavModeClassic" type="button" class="kks-nav-mode-btn" data-mode="classic" aria-pressed="true">Klassisk</button>
            <button id="kksNavModeExplorer" type="button" class="kks-nav-mode-btn" data-mode="explorer" aria-pressed="false">Explorer</button>
          </div>
        </div>
      </div>

      <div id="kksClassicShell" class="kks-nav-stack">
        <div class="kks-nav-lane">
          <div id="kksLevel1Row" class="kks-filter-row kks-level-row" aria-label="Komponent bogstaver"></div>
        </div>
        <div class="kks-nav-lane">
          <div id="kksLevel2Row" class="kks-filter-row kks-level-row" aria-label="Komponent undergrupper"></div>
        </div>
      </div>

      <div id="kksExplorerShell" class="kks-explorer-shell" hidden>
        <div class="kks-explorer-toolbar">
          <button type="button" id="kksExplorerBack" class="kks-explorer-action" data-action="back" title="Tilbage">&lt;</button>
          <button type="button" id="kksExplorerForward" class="kks-explorer-action" data-action="forward" title="Frem">&gt;</button>
          <button type="button" id="kksExplorerUp" class="kks-explorer-action" data-action="up" title="Op">^</button>
          <div id="kksExplorerCrumbs" class="kks-explorer-crumbs" aria-label="KKS sti"></div>
        </div>
        <div id="kksExplorerNodes" class="kks-explorer-nodes" aria-label="KKS mapper"></div>
      </div>

      <div id="kksSearchRail" class="kks-search-rail">
        <div class="kks-search-line">
          <div class="kks-search-combo combo-box">
            <input id="kksSearch" class="kks-search" type="search" aria-label="Søg i KKS-koder" placeholder="Søg kode eller beskrivelse" autocomplete="off" />
            <div id="kksSearchSuggestions" class="combo-panel" hidden></div>
          </div>
          <div id="kksPath" class="kks-path"></div>
        </div>
      </div>
    </section>

    <section class="glass-panel kks-preview-shell kks-preview-full">
      <div class="kks-preview-head">
        <p id="kksPreviewTitle" class="kks-preview-title">Vælg en sektion</p>
      </div>

      <div class="data-table-wrap">
        <table class="data-table data-table-kks">
          <thead>
            <tr>
              <th scope="col">Kode</th>
              <th scope="col">Beskrivelse</th>
              <th scope="col">Kilde</th>
            </tr>
          </thead>
          <tbody id="kksRowsBody"></tbody>
        </table>
      </div>

      <div id="kksRowsEmpty" class="kks-empty-state" hidden aria-live="polite">Ingen rækker i den valgte visning.</div>
    </section>

    <footer class="footer-note">
      KKS shell.
    </footer>
  </div>

  <script src="js/modules/text-utils.js"></script>
  <script src="js/data/kks-component.generated.js"></script>
  <script src="js/app-kks.js?v=20260803"></script>
  <script src="js/shell.js?v=20260731"></script>
</body>
</html>
