      - btnEqOpen:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: ="Open the request"
            Align: =Align.Center
            Appearance: =ButtonAppearance.Outline
            BorderColor: =C.'border-default'
            BorderThickness: =1
            Color: =C.'text-primary'
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            Layout: =ButtonLayout.TextOnly
            OnSelect: |-
              =IfError(
                  // Har en sletning roert det, skaermen viser? (tools/request_delete.py)
                  Set(varEqStaleNow, Coalesce(gblEqStale, false));
                  If(
                      varEqStaleNow,
                      Set(gblEqStale, false);
                      If(
                          !IsBlank(varEqRequestGuid) && IsBlank(LookUp(MD_RequestIndex, RequestGuid = varEqRequestGuid)),
                          Set(gblEqWant, Blank());
                          Set(varEqOpened, "")
                      )
                  );

                  // DEN SAMLEDE APP: klargoer skaermen, naar hubben eller et dyblink
                  // beder om noget andet end det, den viser. Se BIO SAP App/build/
                  // build_screens.py, open_block().
                  With(
                      { wantKey: If(
                          gblNavTo = "Eq",
                          "new:0",
                          Coalesce(
                          gblEqWant,
                          If(Lower(Param("domain")) = "equipment", "link:" & Param("reqid")),
                          "new"
                      )
                      ) },
                      If(
                          wantKey <> Coalesce(varEqOpened, ""),
                          Set(varEqLoading, true);
                          Set(varEqOpened, wantKey);
                          Set(
                              gblEqReqId,
                              If(StartsWith(wantKey, "req:"), Mid(wantKey, 5),
                                 StartsWith(wantKey, "edit:"), Mid(wantKey, 6),
                                 StartsWith(wantKey, "link:"), Mid(wantKey, 6), "")
                          );
                          Set(gblEqMode, If(StartsWith(wantKey, "edit:") || (StartsWith(wantKey, "link:") && Lower(Coalesce(Param("mode"), "")) = "edit"), "edit", "view"));
                          // Live status (issue #92): the first step is the request itself.
                          Set(varEqLoadFailed, false);
                          Set(varEqLoadSlow, false);
                          Set(varEqLoadStep, If(IsBlank(gblEqReqId), "Setting up a new request", "Finding the request"));
                          If(false, ClearCollect(colEqRows, { RowId: 0, ItemKey: "", RequestNo: "", Status: "", FileCount: 0, Description: "", Plant: "", RequestType: "", EquipmentCategory: "", Manufacturer: "", TypeDesignation: "", SerialNumber: "", FunctionalLocation: "", ClassData: "", RoomCoordinates: "", Placement: "", WarrantyStart: Blank(), WarrantyEnd: Blank(), EquipmentNumber: "" }));

                          If(false, ClearCollect(colEqAttachments, { RowId: 0, FileName: "", FileUrl: "", Identifier: "", Selected: false }));

                          If(false, ClearCollect(colEqAttUp, { Name: "", Ok: false }));

                          If(false, ClearCollect(colEqFl, { Code: "", Description: "", Display: "", Maintainable: false, Level: "" }));

                          Set(varEqMe, Lower(User().Email));
                          Set(varEqRequestNo, "");
                          Set(varEqRequestGuid, "");
                          Set(varEqViewOnly, false);
                          Set(varEqBadgeOn, false);
                          Set(varEqCanEdit, false);
                          // Hvilken raekke detaljeruden viser. Blank = ruden er skjult.
                          Set(varEqDetailsId, Blank());
                          // Sletning sker bag en bekraeftelse: hvilken raekke, og om den er aaben.
                          Set(varEqDeleteId, Blank());
                          Set(varEqConfirmDelete, false);
                          // Hvilken raekke dokumentpopuppen viser. Blank = lukket.
                          Set(varEqDocsId, Blank());
                          Set(varEqAttJson, "");
                          Set(varEqFlMsg, "");
                          Set(varEqFlBusy, false);
                          Set(varEqActiveRowId, Blank());
                          Set(varEqRowStatus, "valid");
                          Set(varEqValidated, false);
                          Set(varEqFText, "");
                          Set(varEqFPlant, "");
                          Set(varEqEditorOpen, false);
                          Set(varEqFRequestType, "");
                          Set(varEqFEquipmentCategory, "");
                          Set(varEqFManufacturer, "");
                          Set(varEqFTypeDesignation, "");
                          Set(varEqFSerialNumber, "");
                          Set(varEqFFunctionalLocation, "");
                          Set(varEqFClassData, "");
                          Set(varEqFRoomCoordinates, "");
                          Set(varEqFPlacement, "");
                          Set(varEqFWarrantyStart, Blank());
                          Set(varEqFWarrantyEnd, Blank());
                          Set(varEqFlQuery, ""); Set(varEqFlLast, ""); Set(varEqFlMsg, ""); Clear(colEqFl); Reset(cmbEqFl);
                          Set(varEqInfo, "");
                          If(
                              !IsBlank(gblEqReqId) && varEqRequestGuid <> gblEqReqId,
                              Set(varEqRequestGuid, gblEqReqId);
                              Set(varEqIdx, LookUp(MD_RequestIndex, RequestGuid = varEqRequestGuid));
                              If(
                                  IsBlank(varEqIdx),
                                  Set(gblToast, { Text: "Could not find the request behind this link. Rows you save start a new request.", Kind: "Warning", At: Now() });
                                  Set(varEqRequestGuid, ""); Set(varEqRequestNo, ""),
                                  Set(varEqRequestNo, varEqIdx.RequestNo);
                                  Set(varEqCanEdit, ((Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe && (varEqIdx.Status.Value = "Kladde")) || (IsAdmin && (varEqIdx.Status.Value = "Kladde" || varEqIdx.Status.Value = "AfventerInfo"))));
                                  Set(varEqViewOnly, !(Lower(Coalesce(gblEqMode, "")) = "edit" && varEqCanEdit))
                              )
                          );
                          Set(varEqLoadStep, "Loading saved rows");
                          If(
                              (!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)),
                              ClearCollect(
                                  colEqRows,
                                  ForAll(
                                      SortByColumns(Filter(EquipmentItems, RequestGuid = varEqRequestGuid), "Created", SortOrder.Descending) As R,
                                      {
                                          RowId: R.ID,
                                          ItemKey: Coalesce(R.ItemKey, ""),
                                          RequestNo: Coalesce(R.RequestNo, ""),
                                          Status: Coalesce(R.RowStatus.Value, "valid"),
                                          FileCount: Coalesce(R.FileCount, 0),
                                          Description: Coalesce(R.Description, ""),
                                          Plant: Coalesce(R.Plant, ""),
                                          RequestType: Coalesce(R.RequestType, ""),
                                          EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                          Manufacturer: Coalesce(R.Manufacturer, ""),
                                          TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                          SerialNumber: Coalesce(R.SerialNumber, ""),
                                          FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                          ClassData: Coalesce(R.ClassData, ""),
                                          RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                          Placement: Coalesce(R.Placement, ""),
                                          WarrantyStart: R.WarrantyStart,
                                          WarrantyEnd: R.WarrantyEnd,
                                          EquipmentNumber: Coalesce(R.EquipmentNumber, "")
                                      }
                                  )
                              ),
                              ClearCollect(
                                  colEqRows,
                                  ForAll(
                                      SortByColumns(Filter(EquipmentItems, RequesterEmail = varEqMe), "Created", SortOrder.Descending) As R,
                                      {
                                          RowId: R.ID,
                                          ItemKey: Coalesce(R.ItemKey, ""),
                                          RequestNo: Coalesce(R.RequestNo, ""),
                                          Status: Coalesce(R.RowStatus.Value, "valid"),
                                          FileCount: Coalesce(R.FileCount, 0),
                                          Description: Coalesce(R.Description, ""),
                                          Plant: Coalesce(R.Plant, ""),
                                          RequestType: Coalesce(R.RequestType, ""),
                                          EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                          Manufacturer: Coalesce(R.Manufacturer, ""),
                                          TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                          SerialNumber: Coalesce(R.SerialNumber, ""),
                                          FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                          ClassData: Coalesce(R.ClassData, ""),
                                          RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                          Placement: Coalesce(R.Placement, ""),
                                          WarrantyStart: R.WarrantyStart,
                                          WarrantyEnd: R.WarrantyEnd,
                                          EquipmentNumber: Coalesce(R.EquipmentNumber, "")
                                      }
                                  )
                              )
                          )
                      )
                  );

                  If(
                      varEqStaleNow,
                      If(
                          (!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, "")) = varEqMe)),
                          ClearCollect(
                              colEqRows,
                              ForAll(
                                  SortByColumns(Filter(EquipmentItems, RequestGuid = varEqRequestGuid), "Created", SortOrder.Descending) As R,
                                  {
                                      RowId: R.ID,
                                      ItemKey: Coalesce(R.ItemKey, ""),
                                      RequestNo: Coalesce(R.RequestNo, ""),
                                      Status: Coalesce(R.RowStatus.Value, "valid"),
                                      FileCount: Coalesce(R.FileCount, 0),
                                      Description: Coalesce(R.Description, ""),
                                      Plant: Coalesce(R.Plant, ""),
                                      RequestType: Coalesce(R.RequestType, ""),
                                      EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                      Manufacturer: Coalesce(R.Manufacturer, ""),
                                      TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                      SerialNumber: Coalesce(R.SerialNumber, ""),
                                      FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                      ClassData: Coalesce(R.ClassData, ""),
                                      RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                      Placement: Coalesce(R.Placement, ""),
                                      WarrantyStart: R.WarrantyStart,
                                      WarrantyEnd: R.WarrantyEnd,
                                      EquipmentNumber: Coalesce(R.EquipmentNumber, "")
                                  }
                              )
                          ),
                          ClearCollect(
                              colEqRows,
                              ForAll(
                                  SortByColumns(Filter(EquipmentItems, RequesterEmail = varEqMe), "Created", SortOrder.Descending) As R,
                                  {
                                      RowId: R.ID,
                                      ItemKey: Coalesce(R.ItemKey, ""),
                                      RequestNo: Coalesce(R.RequestNo, ""),
                                      Status: Coalesce(R.RowStatus.Value, "valid"),
                                      FileCount: Coalesce(R.FileCount, 0),
                                      Description: Coalesce(R.Description, ""),
                                      Plant: Coalesce(R.Plant, ""),
                                      RequestType: Coalesce(R.RequestType, ""),
                                      EquipmentCategory: Coalesce(R.EquipmentCategory, ""),
                                      Manufacturer: Coalesce(R.Manufacturer, ""),
                                      TypeDesignation: Coalesce(R.TypeDesignation, ""),
                                      SerialNumber: Coalesce(R.SerialNumber, ""),
                                      FunctionalLocation: Coalesce(R.FunctionalLocation, ""),
                                      ClassData: Coalesce(R.ClassData, ""),
                                      RoomCoordinates: Coalesce(R.RoomCoordinates, ""),
                                      Placement: Coalesce(R.Placement, ""),
                                      WarrantyStart: R.WarrantyStart,
                                      WarrantyEnd: R.WarrantyEnd,
                                      EquipmentNumber: Coalesce(R.EquipmentNumber, "")
                                  }
                              )
                          )
                      )
                  ),
                  Set(varEqLoadFailed, true);
                  Set(varEqOpened, "")
              );

              // Klar - ventespinneren forsvinder.
              Set(varEqBadgeOn, StartsWith(Coalesce(varEqOpened, ""), "req:") || StartsWith(Coalesce(varEqOpened, ""), "edit:") || StartsWith(Coalesce(varEqOpened, ""), "link:"));
              Set(varEqLoading, false);
              Set(varEqLoadSlow, false);
              Set(gblNavigating, false);
              Set(gblNavTo, "")
            RadiusBottomLeft: =R.input
            RadiusBottomRight: =R.input
            RadiusTopLeft: =R.input
            RadiusTopRight: =R.input
            Size: =T.input
            Text: ="Open"
            VerticalAlign: =VerticalAlign.Middle
