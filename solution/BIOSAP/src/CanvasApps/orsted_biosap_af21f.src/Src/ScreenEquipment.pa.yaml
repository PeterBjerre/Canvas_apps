                                Set(varEqViewOnly, false);
                                Set(varEqCanEdit, false);
                                Set(varEqActiveRowId, Blank());
                                Set(varEqRowStatus, "valid");
                                Set(varEqValidated, false);
                                Set(varEqFText, "");
