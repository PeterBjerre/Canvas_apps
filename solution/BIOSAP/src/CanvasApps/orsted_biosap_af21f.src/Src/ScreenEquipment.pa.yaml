                        - btnEqSave:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =C.'color-brand-primary'
                              Color: =C.'text-on-primary'
                              DisplayMode: =If(varEqViewOnly || varEqRowStatus = "submitted", DisplayMode.View, DisplayMode.Edit)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: =If(IsBlank(varEqActiveRowId), "Add", "Save")
                              OnSelect: "=Set(varEqSaving, true);\n// Add row / Update row (UX-review F2): faerdig, naar kravene er opfyldt,\n// ellers kladde. Kun beskrivelsen kraeves for at gemme.\nIf(\n    (!IsBlank(Trim(Coalesce(varEqFText, \"\"))) && !IsBlank(varEqFPlant)),\n    Set(varEqValidated, true);\n    If(\n        IsBlank(Trim(Coalesce(varEqFText, \"\"))) || IsBlank(varEqFPlant),\n        Set(gblToast, { Text: \"Description and Plant are required.\", Kind: \"Warning\", At: Now() }); true,\n        (!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, \"\")) = varEqMe)) && !IsAdmin,\n        Set(gblToast, { Text: \"You can only change your own requests.\", Kind: \"Warning\", At: Now() }); true,\n    \n        Set(varEqAdmNew, IsBlank(varEqActiveRowId));\n        Set(\n            varEqAdmDiff,\n            If((!IsBlank(varEqRequestGuid) && !IsBlank(varEqIdx) && varEqIdx.RequestGuid = varEqRequestGuid && !(Lower(Coalesce(varEqIdx.RequesterEmail, \"\")) = varEqMe)) && !varEqAdmNew, With({ o: LookUp(colEqRows, RowId = varEqActiveRowId) },\n                Concat(\n                    Filter(\n                        Table(\n                        { f: \"Description\", a: Text(o.Description), b: Text(varEqFText) },\n                        { f: \"Plant\", a: Text(o.Plant), b: Text(varEqFPlant) },\n                        { f: \"Status\", a: Text(o.RequestType), b: Text(varEqFRequestType) },\n                        { f: \"Equipment type\", a: Text(o.EquipmentCategory), b: Text(varEqFEquipmentCategory) },\n                        { f: \"Manufacturer\", a: Text(o.Manufacturer), b: Text(varEqFManufacturer) },\n                        { f: \"Type designation\", a: Text(o.TypeDesignation), b: Text(varEqFTypeDesignation) },\n                        { f: \"Serial number\", a: Text(o.SerialNumber), b: Text(varEqFSerialNumber) },\n                        { f: \"Functional location\", a: Text(o.FunctionalLocation), b: Text(varEqFFunctionalLocation) },\n                        { f: \"Class data\", a: Text(o.ClassData), b: Text(varEqFClassData) },\n                        { f: \"Room coordinates\", a: Text(o.RoomCoordinates), b: Text(varEqFRoomCoordinates) },\n                        { f: \"Placement text\", a: Text(o.Placement), b: Text(varEqFPlacement) },\n                        { f: \"Warranty from\", a: Text(o.WarrantyStart), b: Text(varEqFWarrantyStart) },\n                        { f: \"Warranty to\", a: Text(o.WarrantyEnd), b: Text(varEqFWarrantyEnd) }\n                        ),\n                        Coalesce(a, \"\") <> Coalesce(b, \"\")\n                    ),\n                    o.ItemKey & \" \" & f & \": \" & Coalesce(a, \"(blank)\") & \" → \" & Coalesce(b, \"(blank)\"),\n                    \"; \"\n                )\n            ), \"\")\n        );\n        IfError(\n        Set(\n            varEqSpRow,\n            Patch(\n                EquipmentItems,\n                If(\n                    IsBlank(varEqActiveRowId),\n                    Defaults(EquipmentItems),\n                    LookUp(EquipmentItems, ID = varEqActiveRowId)\n                ),\n                {\n                Description: Trim(varEqFText),\n                Plant: varEqFPlant,\n                RequestType: Trim(Coalesce(varEqFRequestType, \"\")),\n                EquipmentCategory: Trim(Coalesce(varEqFEquipmentCategory, \"\")),\n                Manufacturer: Trim(Coalesce(varEqFManufacturer, \"\")),\n                TypeDesignation: Trim(Coalesce(varEqFTypeDesignation, \"\")),\n                SerialNumber: Trim(Coalesce(varEqFSerialNumber, \"\")),\n                FunctionalLocation: Trim(Coalesce(varEqFFunctionalLocation, \"\")),\n                ClassData: Trim(Coalesce(varEqFClassData, \"\")),\n                RoomCoordinates: Trim(Coalesce(varEqFRoomCoordinates, \"\")),\n                Placement: Trim(Coalesce(varEqFPlacement, \"\")),\n    