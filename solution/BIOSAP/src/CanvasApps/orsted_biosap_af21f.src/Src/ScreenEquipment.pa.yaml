                                Set(varEqFWarrantyEnd, Blank());
                                Set(varEqFlQuery, ""); Set(varEqFlLast, ""); Set(varEqFlMsg, ""); Clear(colEqFl); Reset(cmbEqFl);
                                Set(varEqInfo, "")
