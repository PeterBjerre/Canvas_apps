                Properties:
                  AccessibleLabel: =Self.Text
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =C.'text-primary'
                  Fill: =RGBA(0, 0, 0, 0)
                  Font: =Font.'Segoe UI'
                  Height: =40
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =T.body
                  Text: =IfError(gblToast.Text, "")
                  Width: =Max(0, ((Min(420, App.Width - 32)) - 14 - 8) - ((20) + 10) - ((H.hit) + 10) - 2)
            - btnEqToastClose:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: ="Close the message"
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Center
                  Appearance: =ButtonAppearance.Outline
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =1
                  Color: =C.'text-muted'
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =H.hit
                  Icon: ="Dismiss"
                  Layout: =ButtonLayout.IconOnly
                  LayoutMinWidth: =H.hit
                  OnSelect: |-
                    =Set(gblToast, { Text: "", Kind: "", At: Now() })
                  RadiusBottomLeft: =R.input
                  RadiusBottomRight: =R.input
                  RadiusTopLeft: =R.input
                  RadiusTopRight: =R.input
                  Size: =T.input
                  Text: =""
                  Tooltip: ="Close"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =H.hit
      - tmrEqToast:
          Control: Timer@2.1.0
          Properties:
            Duration: =500
            Height: =1
            OnTimerEnd: |-
              =If(
                  !IsBlank(IfError(gblToast.Text, "")) && !(IfError(gblToast.Kind, "") = "Error") &&
                  DateDiff(gblToast.At, Now(), TimeUnit.Milliseconds) >= 4000,
                  Set(gblToast, { Text: "", Kind: "", At: Now() })
              )
            Repeat: =true
            Start: =!IsBlank(IfError(gblToast.Text, "")) && !(IfError(gblToast.Kind, "") = "Error")
            Visible: =false
            Width: =1
