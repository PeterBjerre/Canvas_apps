App:
  Properties:
    OnStart: "=Set(\r\n    \r\n    orgTheme,\r\n    {\r\n        fontFamily: \"Orsted Sans\",\r\n        fontSizeHeader: 14,\r\n        fontErrorMsg: 10,\r\n        fontSizeTitle: 14,\r\n        fontSizeFieldTitle: 12,\r\n        fontSize: 11,\r\n        inputHeight: 35,\r\n        border: 0,\r\n        chevronBg: RGBA(12, 59, 94, 1),\r\n        inputFill: RGBA(\r\n            241,\r\n            242,\r\n            246,\r\n            1.0\r\n        ),\r\n        color: RGBA(\r\n            64,\r\n            153,\r\n            218,\r\n            1\r\n        ),\r\n        requiredColor: RGBA(\r\n            168,\r\n            0,\r\n            0,\r\n            1\r\n        ),    \r\n        secondColor: RGBA(\r\n            142,\r\n            205,\r\n            200,\r\n            1\r\n        ),\r\n        inputfillincolor: RGBA(241, 242, 246,1.0),    \r\n        defaultInputTextPlaceholder: \"Select..\"\r\n        \r\n    }\r\n);\r\nIf(\r\n    !IsBlank(Param(\"ID\")),\r\n    Set(\r\n        showID,\r\n        true\r\n    ),\r\n    Set(\r\n        showID,\r\n        false\r\n    )\r\n);\r\n\r\nClearCollect(\r\n    colTypeHint,\r\n    ShowColumns(First('BioSap-List-AVVStandardTasklist'), 'ID', Work),\r\n    ShowColumns(First('BioSap-List-ASVStandardTasklist'), 'ID', 'Work'),\r\n    ShowColumns(First('BioSap-List-KYVStandardTasklist'), 'ID', 'Work'),\r\n    ShowColumns(First('BioSap-List-SSVStandardTasklist'), 'ID', 'Work'),\r\n    ShowColumns(First('BioSap-List-HEVStandardTasklist'), 'ID', 'Work'),\r\n    ShowColumns(First('BioSap-List-SKVStandardTasklist'), 'ID', 'Work')\r\n);\r\n\r\n/*Set(\r\n    isAdmin,\r\n    !IsEmpty(\r\n        Filter(\r\n            'BioSap-List-UserAndGroups',\r\n            Lower(Title) = \"admin\" &&\r\n            Lower(Member) = Lower(User().Email)\r\n        )\r\n    )\r\n);*/\r\n\r\n// Extract initial from current user's email\r\n/*Set(\r\n    varCurrentUserInitial,\r\n    Left(User().Email, Find(\"@\", User().Email) - 1)\r\n);\r\n\r\n// Get full People object from Choices() matching initial\r\nSet(\r\n    varCurrentUserFromChoices,\r\n    LookUp(\r\n        Choices([@'BioSap-List-MaintenanceItems'].OrstedResponsible),\r\n        StartsWith(Email, varCurrentUserInitial)\r\n    )\r\n);*/\r\n"
    Theme: =PowerAppsTheme
