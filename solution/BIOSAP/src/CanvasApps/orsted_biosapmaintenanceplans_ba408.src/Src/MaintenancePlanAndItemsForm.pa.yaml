            - CallHorizon_DataCard1:
                Control: TypedDataCard@1.0.7
                Variant: ClassicNumberEdit
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataField: ="CallHorizon0"
                  Default: =ThisItem.'CallHorizon (CallHorizon0)'
                  DisplayName: =DataSourceInfo([@'BioSap-List-MaintenancePlans'],DataSourceInfo.DisplayName,'CallHorizon (CallHorizon0)')
                  Required: =false
                  Update: =Value(DataCardValue21.Text)
                  Visible: =false
                  Width: =331
                  X: =3
                  Y: =1
                Children:
                  - DataCardKey21:
                      Control: Label@2.5.1
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =34
                        Text: =Parent.DisplayName
