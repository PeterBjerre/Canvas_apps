            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=If(\r\n    varIsNewPlan,\r\n    UpdateContext({ showSpinner: true });\r\n    UpdateContext({ varTimerStart: true })\r\n);\r\n\r\nSubmitForm(MaintenancePlanForm);\r\n\r\n// Check for form submission errors\r\nIf(\r\n    MaintenancePlanForm.Error,\r\n    Notify(\"Error: \" & MaintenanceItemForm.Error, NotificationType.Error),\r\n    \r\n    // Success path\r\n    If(\r\n        !MaintenancePlanForm.Error, \r\n        With(\r\n            {\r\n                newPlan: MaintenancePlanForm.LastSubmit\r\n            },\r\n            // Only proceed with RunningNumber update if it's a new plan\r\n            If(\r\n                varIsNewPlan, // Only for new submission\r\n                // Step 1: Retrieve the last used running number from AppSettings\r\n                Set(varLastRunningNumber, LookUp('BioSap-List-AppSettings', Option.Value = \"RunningNoPlan\").Value);\r\n\r\n                // Step 2: Get the ID of the newly created record from the form\r\n                Set(varNewPlanID, newPlan.ID);\r\n\r\n                // Step 3: Calculate the new running number based on the formula\r\n                Set(varNewRunningNumber, (varNewPlanID - varLastRunningNumber) + 0000);\r\n\r\n                // Step 4: Concatenate \"MP\" with the calculated running number\r\n                Set(varFormattedRunningNumber, \"MP\" & Text(varNewRunningNumber, \"0000\"));\r\n\r\n                // Step 5: Patch the new running number back into the record\r\n                Patch(\r\n                    'BioSap-List-MaintenancePlans', // Replace with your SharePoint list name\r\n                    LookUp('BioSap-List-MaintenancePlans', ID = newPlan.ID), // Find the record by ID\r\n                    {\r\n                        PlanID: varFormattedRunningNumber\r\n                    }\r\n                );\r\n            );\r\n\r\n            // Set the selected item to the newly submitted plan ID & formatted plan ID\r\n            Set(SelectedItem, newPlan.ID);\r\n            Set(SelectedPlanID, newPlan.PlanID);\r\n\r\n            // Refresh the data source for the ID dropdown\r\n            //Refresh([@'BioSap-List-MaintenanceItems']);\r\n            //Refresh([@'BioSap-List-MaintenancePlans']);\r\n            \r\n            // Show the correct notification based on the tracking variable\r\n            If(\r\n                varIsNewPlan, // Check if it's a new plan\r\n                Notify(\"Plan created successfully\", NotificationType.Success),\r\n                Notify(\"Plan updated successfully\", NotificationType.Success)\r\n            );\r\n\r\n            // After submission, switch to Edit Mode (since it's now saved)\r\n            //EditForm(MaintenancePlanForm);\r\n\r\n            // Reset the mode (no longer new plan)\r\n            //Set(varIsNewPlan, false);\r\n\r\n            //NEW\r\n            If(\r\n                varIsNewPlan,\r\n                ResetForm(MaintenancePlanForm);\r\n                Navigate(Plan, ScreenTransition.Fade)\r\n            ); //NEW\r\n\r\n        )\r\n    )\r\n);\r\n\r\n/*If(\r\n    varIsNewPlan,\r\n    UpdateContext({ showSpinner: true });\r\n    UpdateContext({ varTimerStart: true })\r\n);\r\n\r\nSubmitForm(MaintenancePlanForm);\r\n\r\n// Check for form submission errors\r\nIf(\r\n    MaintenancePlanForm.Error,\r\n    Notify(\"There was an error submitting the form\", NotificationType.Error),\r\n    \r\n    // Success path\r\n    If(\r\n        !MaintenancePlanForm.Error, \r\n        With(\r\n            {\r\n                newPlan: MaintenancePlanForm.LastSubmit\r\n            },\r\n            // Set the selected item to the newly submitted plan ID\r\n            Set(SelectedItem, newPlan.ID);\r\n\r\n            // Refresh the data source for the ID dropdown\r\n            Refresh([@'BioSap-List-MaintenanceItems']);\r\n            \r\n            // Show the correct notification based on the tracking variable\r\n            If(\r\n                varIsNewPlan