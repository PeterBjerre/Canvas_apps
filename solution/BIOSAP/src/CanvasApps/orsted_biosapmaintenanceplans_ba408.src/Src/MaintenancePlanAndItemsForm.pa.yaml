                  - DataCardValue21:
                      Control: Classic/TextInput@2.3.2
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Default: "=With(\r\n    {\r\n        // Extract the numeric cycle input from user (e.g., \"10\" from DataCardValue2)\r\n        varinputCycle: Value(DataCardValue2.Text),\r\n        \r\n        // Extract the unit input and convert to lowercase for case-insensitive matching (e.g., \"wk\", \"yr\")\r\n        varinputUnit: Lower(DataCardValue6.Selected.Value),\r\n        \r\n        // Combine inputs into a single string for exact matching (e.g., \"10 wk\")\r\n        varinputText: Text(DataCardValue2.Text) & \" \" & DataCardValue6.Selected.Value\r\n    },\r\n    With(\r\n        {\r\n            // Try to find exact match (case-insensitive) in SharePoint list based on full string \"Cycle Unit\"\r\n            varexactMatch: LookUp(\r\n                'BioSap-List-CallHorizonMatrix',\r\n                Lower(CycleOrUnit) = Lower(varinputText)\r\n            )\r\n        },\r\n        If(\r\n            !IsBlank(varexactMatch),\r\n            // If exact match found, return its numeric value\r\n            varexactMatch.NewCallHorizonOrFCD,\r\n            \r\n            // If no exact match, find closest previous or equal cycle with same unit\r\n            With(\r\n                {\r\n                    // Filter SharePoint list for records where:\r\n                    // - Numeric part of CycleOrUnit <= inputCycle\r\n                    // - Unit part (case-insensitive, trimmed) matches inputUnit\r\n                    varfilteredRows: Filter(\r\n                        'BioSap-List-CallHorizonMatrix',\r\n                        Value(Left(CycleOrUnit, Find(\" \", CycleOrUnit) - 1)) <= varinputCycle &&\r\n                        Lower(Trim(Mid(CycleOrUnit, Find(\" \", CycleOrUnit) + 1, Len(CycleOrUnit)))) = varinputUnit\r\n                    )\r\n                },\r\n                If(\r\n                    // If no records found, return blank\r\n                    CountRows(varfilteredRows) = 0,\r\n                    Blank(),\r\n                    \r\n                    // Else return the numeric value of the record with the largest cycle number ≤ inputCycle\r\n                    Last(\r\n                        Sort(\r\n                            varfilteredRows,\r\n                            Value(Left(CycleOrUnit, Find(\" \", CycleOrUnit) - 1)),\r\n                            SortOrder.Ascending\r\n                        )\r\n                    ).NewCallHorizonOrFCD\r\n                )\r\n            )\r\n        )\r\n    )\r\n)\r\n\r\n/*LookUp(\r\n    'BioSap-List-CallHorizonMatrix',\r\n    CycleOrUnit = Text(DataCardValue2.Text) & \" \" & DataCardValue6.Selected.Value,\r\n    NewCallHorizonOrFCD\r\n)*/\r\n\r\n//Parent.Default"
                        DelayOutput: =true
