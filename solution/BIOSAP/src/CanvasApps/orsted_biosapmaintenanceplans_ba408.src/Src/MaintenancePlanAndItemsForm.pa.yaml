w success notification\r\n                Notify(\r\n                    If(varNewMode, \"Item created successfully!\", \"Item updated successfully!\"),\r\n                    NotificationType.Success\r\n                );\r\n\r\n                //NEW\r\n                /*Patch(\r\n                    'BioSap-List-MaintenanceItems',\r\n                    newItem,\r\n                    {\r\n                        InitialOrstedResponsible: Left(DataCardValue10.Selected.Email, Find(\"@\", DataCardValue10.Selected.Email) - 1)\r\n                    }\r\n                );*/\r\n                //NEW\r\n\r\n                // Reset form and prepare for new entry\r\n                NewForm(MaintenanceItemForm);\r\n                ResetForm(MaintenanceItemForm);\r\n\r\n                Refresh('BioSap-List-MaintenanceItems');\r\n                If(!varNewMode,\r\n                    UpdateContext({\r\n                    CurrentItem: LookUp(\r\n                        'BioSap-List-MaintenanceItems',\r\n                        ID = newItem.ID\r\n                    )\r\n                })\r\n                );\r\n                \r\n                //Set(varIsNewItem, true)\r\n\r\n                //NEW\r\n                If(\r\n                LookUp('BioSap-List-MaintenancePlans', PlanID = SelectedPlanID).Status.Value <> \"Published\",\r\n                    Set(\r\n                        varItemCount,\r\n                        CountRows(Filter('BioSap-List-MaintenanceItems', MaintenancePlanNo.Value = SelectedPlanID))\r\n                    );\r\n\r\n                    Set(\r\n                        varTaskCount,\r\n                        CountRows(Filter('BioSap-List-TaskListMain', MaintenancePlanID.Value = SelectedPlanID))\r\n                    );\r\n\r\n                    Set(\r\n                        varNewStatusPlan,\r\n                        If(\r\n                            varItemCount > 0 && varTaskCount > 0,\r\n                            { Value: \"In Progress\" },\r\n                            { Value: \"Draft\" }\r\n                        )\r\n                    );\r\n\r\n                    // Only patch if the status changed\r\n                    If(\r\n                        varNewStatusPlan.Value <> LookUp('BioSap-List-MaintenancePlans', PlanID = SelectedPlanID).Status.Value,\r\n                        Patch(\r\n                            'BioSap-List-MaintenancePlans',\r\n                            LookUp('BioSap-List-MaintenancePlans', PlanID = SelectedPlanID),\r\n                            { Status: varNewStatusPlan }\r\n                        )\r\n                    );\r\n                )//NEW\r\n            )\r\n        )\r\n    );\r\n    \r\nSet(\r\n   varHasNewRevisionItems,\r\n   !IsEmpty(\r\n      Filter(\r\n         'BioSap-List-MaintenanceItems',\r\n         MaintenancePlanNo.Value = SelectedPlanID && Revision = true\r\n      )\r\n   )\r\n);\r\n\r\nSelect(PatchDate);\r\n\r\n/*SubmitForm(MaintenanceItemForm);\r\n\r\nIf(\r\n    MaintenanceItemForm.Error,\r\n    Notify(\"Error: \" & MaintenanceItemForm.Error, NotificationType.Error),\r\n\r\n    If(\r\n        !MaintenanceItemForm.Error,\r\n        If(\r\n            MaintenanceItemForm.Mode = FormMode.New && varIsNewItem,\r\n            Notify(\"Item created successfully!\", NotificationType.Success),\r\n            Notify(\"Item updated successfully!\", NotificationType.Success)\r\n        );\r\n        \r\n        NewForm(MaintenanceItemForm);\r\n        ResetForm(MaintenanceItemForm);\r\n        Set(varIsNewItem, true)\r\n    )\r\n)*/\r\n//WORKS\r\n\r\n/*SubmitForm(MaintenanceItemForm);\r\nIf(\r\n    MaintenanceItemForm.Error = \"\",\r\n    Refresh('BioSap-List-MaintenanceItems');\r\n    //ResetForm(MaintenanceItemForm);\r\n    NewForm(MaintenanceItemForm);\r\n    Notify(\"Item submitted successfully!\", NotificationType.Success),\r\n    Notify(\"There was a problem submitting the item.\", NotificationType.Error)\r\n)*/"
            PressedBorderColor: =Self.Fill
