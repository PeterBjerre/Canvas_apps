            - Dashboard_EditIcon:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =orgTheme.color
                  Height: =Dashboard_PlanID.Height
                  Icon: |-
                    =//This expression assigns the icon for the 'editBtn' control to 'DocumentWithContent' if the status of 'ThisItem' is "Submitted"; otherwise, it assigns the icon to 'Edit'.
                    If(ThisItem.Status.Value = "Submitted",  Icon.DocumentWithContent, Icon.Edit)
                  OnSelect: |-
                    =//This expression sets the global variable 'SelectedItem' to the ID of 'ThisItem', checks if the status of 'ThisItem' is "Submitted" to either view or edit 'MainForm', and then navigates to 'MainScreen'.

                    Set(
                        SelectedItem,
                        ThisItem.ID
                    );

                    Set(
                        SelectedPlanID,
                        ThisItem.PlanID
                    );

                    Set(
                        SelectedItemStatus,
                        ThisItem.Status.Value
                    );

                    If(
                        ThisItem.Status.Value = "Draft" || ThisItem.Status.Value = "In Progress" || ThisItem.Status.Value = "Ready for creation in SAP",
                        EditForm(MaintenancePlanForm),
                        ViewForm(MaintenancePlanForm)
                    );

                    UpdateContext({
                            varNewMode: true,
                            editMode: false,
                            isItemSelected: false,
                            CurrentItem: Blank()
                    });

                    Set(
                       varHasRevisionItems,
                       !IsEmpty(
                          Filter(
                             'BioSap-List-MaintenanceItems',
                             MaintenancePlanNo.Value = SelectedPlanID && Revision = true
                          )
                       )
                    );

                    Set(varHasNewRevisionItems, varHasRevisionItems);

                    Set(varIsNewPlan, false);

                    Navigate(MaintenancePlanAndItemsForm);
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  Tooltip: =If(Dashboard_EditIcon.Icon = Icon.Edit, "Edit request", "View request details")
                  Width: =50
                  X: =1096
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
