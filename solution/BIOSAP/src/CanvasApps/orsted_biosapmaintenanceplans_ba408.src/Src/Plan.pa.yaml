            - Button3:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =orgTheme.fontFamily
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =// Collect TaskList items linked to this plan
                    ClearCollect(
                        colTasksToDelete,
                        Filter('BioSap-List-TaskListMain', MaintenancePlanID.Value = varSelectedRecord.PlanID)
                    );

                    // Collect Maintenance Items linked to this plan
                    ClearCollect(
                        colItemsToDelete,
                        Filter('BioSap-List-MaintenanceItems', MaintenancePlanNo.Value = varSelectedRecord.PlanID)
                    );

                    // Delete TaskList items
                    ForAll(
                        colTasksToDelete,
                        Remove('BioSap-List-TaskListMain', ThisRecord) //LookUp('BioSap-List-TaskListMain', ID = ThisRecord.ID))
                    );
                    Clear(colTasksToDelete);

                    // Delete Maintenance Items
                    ForAll(
                        colItemsToDelete,
                        Remove('BioSap-List-MaintenanceItems', ThisRecord) //LookUp('BioSap-List-MaintenanceItems', ID = ThisRecord.ID))
                    );
                    Clear(colItemsToDelete);

                    // Delete the Maintenance Plan
                    If(
                        !IsEmpty(Remove('BioSap-List-MaintenancePlans', varSelectedRecord)),
                        Notify("Plan and related data deleted successfully", NotificationType.Success),
                        Notify("Failed to delete Plan", NotificationType.Error)
                    );

                    Set(varShowConfirmDelete, false)

                    /*If(
                        !IsEmpty(Remove('BioSap-List-MaintenancePlans', varSelectedRecord)),
                        Notify("Plan deleted successfully", NotificationType.Success),
                        Notify("Failed to delete Plan", NotificationType.Error)
                    );*/
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Yes"
                  X: =50
                  Y: =118
