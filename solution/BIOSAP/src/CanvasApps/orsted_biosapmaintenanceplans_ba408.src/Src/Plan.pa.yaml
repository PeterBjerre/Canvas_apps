      - galleryDashboard_3:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(214, 221, 224, 1)
            BorderThickness: =1
            Height: =428
            Items: "=If(\r\n    !showID,\r\n    \r\n    SortByColumns(\r\n        Filter(\r\n            'BioSap-List-MaintenancePlans',\r\n            \r\n            (\r\n                Lower(searchBox_3.Text) in Lower(Title) || \r\n                Lower(searchBox_3.Text) in Lower(PlanID)\r\n            ) &&\r\n            \r\n            (\r\n                varIsAdmin ||  // Admins see all\r\n                Substitute(\r\n                    'Created By'.Claims,\r\n                    \"i:0#.f|membership|\",\r\n                    \"\"\r\n                ) = Lower(Office365Users.MyProfile().UserPrincipalName)\r\n            )\r\n        ),\r\n        \"ID\",\r\n        If(SortDescending1, SortOrder.Descending, SortOrder.Ascending)\r\n    ),\r\n    \r\n    showID,\r\n    \r\n    SortByColumns(\r\n        Filter(\r\n            'BioSap-List-MaintenancePlans',\r\n            \r\n            ID = Value(Param(\"ID\")) &&\r\n            (\r\n                varIsAdmin ||  // Admins can open any ID\r\n                Substitute(\r\n                    'Created By'.Claims,\r\n                    \"i:0#.f|membership|\",\r\n                    \"\"\r\n                ) = Lower(Office365Users.MyProfile().UserPrincipalName)\r\n            )\r\n        ),\r\n        \"ID\",\r\n        If(SortDescending1, SortOrder.Ascending, SortOrder.Descending)\r\n    )\r\n)\r\n\r\n/*If(\r\n    !showID,\r\n    SortByColumns(\r\n        Filter(\r\n            'BioSap-List-MaintenancePlans',\r\n            (\r\n                Lower(searchBox_3.Text) in Lower(Title) || \r\n                Lower(searchBox_3.Text) in Lower(PlanID)\r\n            ) &&\r\n            \r\n            // Only show records created by the current user\r\n            Substitute(\r\n                'Created By'.Claims,\r\n                \"i:0#.f|membership|\",\r\n                \"\"\r\n            ) = Lower(Office365Users.MyProfile().UserPrincipalName)\r\n        ),\r\n        \"ID\",\r\n        If(SortDescending1, SortOrder.Descending, SortOrder.Ascending)\r\n    ),\r\n    \r\n    showID,\r\n    SortByColumns(\r\n        Filter(\r\n            'BioSap-List-MaintenancePlans',\r\n            ID = Value(Param(\"ID\")) &&\r\n            Substitute(\r\n                'Created By'.Claims,\r\n                \"i:0#.f|membership|\",\r\n                \"\"\r\n            ) = Lower(Office365Users.MyProfile().UserPrincipalName)\r\n        ),\r\n        \"ID\",\r\n        If(SortDescending1, SortOrder.Ascending, SortOrder.Descending)\r\n    )\r\n)*/\r\n//WORKS\r\n\r\n//'BioSap-List-MaintenancePlans'\r\n/*If(\r\n  !showID,\r\n    SortByColumns(\r\n    Filter(\r\n        'BioSap-List-MaintenancePlans',\r\n        StartsWith(Title, searchBox_3.Text)\r\n        &&\r\n        Substitute(\r\n                'Created By'.Claims,\r\n                \"i:0#.f|membership|\",\r\n                \"\"\r\n            ) = Lower(Office365Users.MyProfile().UserPrincipalName)       \r\n    ),\r\n    \"ID\",\r\n    If(SortDescending1, \r\n    SortOrder.Descending, \r\n    SortOrder.Ascending\r\n    )\r\n),\r\nshowID,\r\n    //And !IsBlank(Param(\"ID\")),\r\n    SortByColumns(\r\n        Filter(\r\n            'BioSap-List-MaintenancePlans',\r\n            ID = Value(Param(\"ID\")) &&\r\n            Substitute(\r\n                'Created By'.Claims,\r\n                \"i:0#.f|membership|\",\r\n                \"\"\r\n            ) = Lower(Office365Users.MyProfile().UserPrincipalName)\r\n        ),\r\n        \"ID\",\r\n        If(\r\n            SortDescending1,\r\n            SortOrder.Ascending,\r\n            SortOrder.Descending\r\n        )\r\n    )\r\n)*/\r\n//WORKS\r\n\r\n/*,\r\nshowID,\r\n    //And !IsBlank(Param(\"ID\")),\r\n    SortByColumns(\r\n        Filter(\r\n            'BioSap-List-MaintenancePlans',\r\n            ID = Value(Param(\"ID\"))\r\n        ),\r\n        \"ID\",\r\n        If(\r\n            SortDescending1,\r\n            SortOrder.Ascending,\r\n            SortOrder.Descending\r\n        )\r\n    )\r\n)\r\n\r\nSortByColumns(\r\n        Filter(\r\n            'BioSap-List-MaintenancePlans',\r\n            StartsWith(\r\n                Title,\r\n  searchBox_3.Text\r\n            ) \r\n        ),\r\n        \"ID\",\r\n        If(\r\n            SortDescending1,\r\n            SortOrder.Descending,\r\n            SortOrder.Ascending\r\n        )\r\n    )*/\r\n"
