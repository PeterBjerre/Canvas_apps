              =// STEP 1: Submit all tasks
              ForAll(
                  colTaskList As rec,
                  If(
                      !IsBlank(rec.TaskItemID),
                      // Update existing item
                      Patch(
                          'BioSap-List-TaskListMain',
                          LookUp('BioSap-List-TaskListMain', TaskItemID = rec.TaskItemID),
                          {
                              Title: rec.Title,
                              PlantInitial: rec.PlantInitial,
                              OperationShortText: rec.OperationShortText,
                              Work: rec.Work,
                              Num: rec.Num,
                              Duration: rec.Duration,
                              Vendor: rec.Vendor,
                              VendorID: rec.VendorID,
                              LongText: rec.LongText,
                              AttachmentLink: TextInput5.Text,
                              Materials: rec.Materials,
                              Price: rec.Price,
                              Index: rec.Index
                              // TaskID and MaintenanceItemNo and MaintenancePlanID unchanged
                          }
                      ),
                      // Create new item
                      Patch(
                          'BioSap-List-TaskListMain',
                          Defaults('BioSap-List-TaskListMain'),
                          {
                              Title: TextInput6.Text,
                              PlantInitial: TextInput7.Text,
