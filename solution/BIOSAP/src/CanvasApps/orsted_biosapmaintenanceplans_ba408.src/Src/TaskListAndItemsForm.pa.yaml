                              LongText: rec.LongText,
                              Materials: rec.Materials,
                              Ctrl: rec.Ctrl,
                              WorkCtr: rec.WorkCtr,
                              CostElem:rec.CostElem,
                              Price: rec.Price,
                              Currency: rec.Currency,
                              Index: rec.Index,
                              TaskID: varNewRunningNumberTask,
                              MaintenanceItemNo: {
                                  Id: varSelectedItemInternalID,
                                  Value: varSelectedItemID
                              },
                              MaintenancePlanID: {
