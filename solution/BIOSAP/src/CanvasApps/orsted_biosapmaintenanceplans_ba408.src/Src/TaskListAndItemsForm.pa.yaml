                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Height: =29
                  Icon: =Icon.Trash
                  OnSelect: |-
                    =Remove(colTaskList, ThisItem); // Remove from collection
                    RemoveIf('BioSap-List-TaskListMain', TaskItemID = ThisItem.TaskItemID); // Remove from SharePoint

                    //NEW
                    If(
                    LookUp('BioSap-List-MaintenancePlans', PlanID = SelectedPlanID).Status.Value <> "Published",
                        Set(
                            varItemCount,
                            CountRows(Filter('BioSap-List-MaintenanceItems', MaintenancePlanNo.Value = SelectedPlanID))
                        );

                        Set(
                            varTaskCount,
                            CountRows(Filter('BioSap-List-TaskListMain', MaintenancePlanID.Value = SelectedPlanID))
                        );

                        Set(
                            varNewStatusPlan,
                                If(
                                    varItemCount > 0 && varTaskCount > 0,
                                    { Value: "In Progress" },
                                    { Value: "Draft" }
                                )
                        );

                        // Only patch if the status changed
                        If(
                            varNewStatusPlan.Value <> LookUp('BioSap-List-MaintenancePlans', PlanID = SelectedPlanID).Status.Value,
                            Patch(
                                'BioSap-List-MaintenancePlans',
                                LookUp('BioSap-List-MaintenancePlans', PlanID = SelectedPlanID),
                                { Status: varNewStatusPlan }
                            )
                        );
                    )//NEW

                    /*powerappsCopyEditIf(
                        !IsBlank(ThisItem.ID),
                        Remove('TaskList', LookUp('TaskList', ID = ThisItem.ID))
                    );
                    Remove(colTasks, ThisItem);*/

