Screens:
  NewPlan_Header:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: =Set(varCreateStep, 1)
    Children:
      - conHdrRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(248, 250, 252, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =12
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =12
            Width: =Parent.Width
          Children:
            - conHdrNav:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 640, 156, 52)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =true
                  PaddingBottom: =4
                  PaddingLeft: =4
                  PaddingRight: =4
                  PaddingTop: =4
                  Width: =Parent.Width
                Children:
                  - btnHdrNavOverview:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to Overview"
                        Appearance: =ButtonAppearance.Subtle
                        Color: =RGBA(12, 59, 94, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(Screen1, ScreenTransition.Cover)
                        Size: =11
                        Text: ="Overview"
                        Tooltip: ="Open maintenance plan overview"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =(Parent.Width - 48) / 5
                  - btnHdrNavHeader:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Current step Header"
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Set(varCreateStep, 1)
                        Size: =11
                        Text: ="Header"
                        Tooltip: ="Header step"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =(Parent.Width - 48) / 5
                  - btnHdrNavItems:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to Items"
                        Appearance: =ButtonAppearance.Subtle
                        Color: =RGBA(12, 59, 94, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(NewPlan_Items, ScreenTransition.Cover)
                        Size: =11
                        Text: ="Items"
                        Tooltip: ="Open maintenance items step"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =(Parent.Width - 48) / 5
                  - btnHdrNavOperations:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to Operations"
                        Appearance: =ButtonAppearance.Subtle
                        Color: =RGBA(12, 59, 94, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(TaskListOperations, ScreenTransition.Cover)
                        Size: =11
                        Text: ="Operations"
                        Tooltip: ="Open operations step"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =(Parent.Width - 48) / 5
                  - btnHdrNavReview:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to Review"
                        Appearance: =ButtonAppearance.Subtle
                        Color: =RGBA(12, 59, 94, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(NewPlan_Review, ScreenTransition.Cover)
                        Size: =11
                        Text: ="Review"
                        Tooltip: ="Open review step"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =(Parent.Width - 48) / 5
            - conHdrHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(12, 59, 94, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 640, 132, 72)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(Parent.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  Width: =Parent.Width
                Children:
                  - lblHdrTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="New maintenance plan title"
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =48
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =24
                        Text: ="New maintenance plan"
                        Width: =If(Parent.Width < 640, Parent.Width - 32, Parent.Width * 0.58)
