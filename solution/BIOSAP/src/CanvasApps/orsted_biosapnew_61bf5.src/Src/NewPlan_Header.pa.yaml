                        AccessibleLabel: ="Create mode and draft key"
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        Height: =48
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =varCreateMode & "  Â·  " & varDraftKey
                        Width: =If(Parent.Width < 640, Parent.Width - 32, Parent.Width * 0.42 - 12)
                        Wrap: =false
            - conHdrProgress:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
