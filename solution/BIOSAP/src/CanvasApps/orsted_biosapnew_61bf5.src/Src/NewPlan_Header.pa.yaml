                  Fill: =RGBA(226, 231, 235, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 640, 168, 42)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(Parent.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =4
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =4
                  Width: =Parent.Width
                Children:
                  - lblHdrSection:
                      Control: ModernText@1.0.0
                      Properties:
