                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 36) / 2)
                            Children:
                              - txtItmDescriptionLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Description field label"
                                    Color: =RGBA(12, 59, 94, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Item description *"
                                    Width: =Parent.Width
                                    Wrap: =false
                              - txtItmDescription:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    AccessibleLabel: ="Item description"
                                    Appearance: =Appearance.Outline
                                    BorderColor: =RGBA(214, 221, 224, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Default: =If(IsBlank(varEditItemKey), "", Coalesce(LookUp(colMaintenanceItems, LocalItemKey = varEditItemKey).ItemDescription, ""))
                                    Fill: =RGBA(241, 242, 246, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =52
                                    MaxLength: =120
                                    PaddingBottom: =8
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =8
                                    Placeholder: ="e.g. Pump seal"
                                    Required: =true
                                    Size: =12
                                    ValidationState: =If(varItemSubmitAttempted && IsBlank(Trim(Self.Text)), ValidationState.Error, ValidationState.None)
                                    Width: =Parent.Width
