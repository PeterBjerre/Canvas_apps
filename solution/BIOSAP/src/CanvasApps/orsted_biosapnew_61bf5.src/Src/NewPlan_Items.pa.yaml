Screens:
  NewPlan_Items:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varCreateStep, 2);
        Set(varItemSubmitAttempted, false);
        Set(varCreateError, "");
        Set(varItmReceiptVisible, false);
        Set(varItmConfirmDeleteVisible, false);
        Set(varEditItemKey, "");
        Set(
            varSelectedItemKey,
            If(
                CountRows(colMaintenanceItems) > 0,
                First(SortByColumns(colMaintenanceItems, "ItemNo", SortOrder.Ascending)).LocalItemKey,
                ""
            )
        )
    Children:
      - conItmRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(248, 250, 252, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - conItmHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(12, 59, 94, 1)
                  FillPortions: =0
                  Height: =158
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  Width: =Parent.Width
                Children:
                  - txtItmTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Maintenance items step title"
                        Color: =RGBA(12, 59, 94, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =24
                        Text: ="Create maintenance plan · Items"
                        Width: =Parent.Width
                        Wrap: =false
                  - txtItmStep:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Current create-plan step"
                        Color: =RGBA(226, 231, 235, 1)
                        Font: =Font.'Open Sans'
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Step 2 of 4 · Define the maintenance items covered by this plan"
                        Width: =Parent.Width
                        Wrap: =false
                  - conItmNav:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =54
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnItmNavOverview:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Go to overview"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =RGBA(255, 255, 255, 1)
                              Color: =RGBA(12, 59, 94, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Normal
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(Screen1, ScreenTransition.None)
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Size: =11
                              Text: ="Overview"
                              Tooltip: ="Open maintenance plan overview"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =If(Parent.Width < 640, (Parent.Width - 32) / 5, (Parent.Width - 48) / 5)
                        - btnItmNavHeader:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Go to plan header"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =RGBA(255, 255, 255, 1)
                              Color: =RGBA(12, 59, 94, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Normal
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(NewPlan_Header, ScreenTransition.Cover)
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Size: =11
                              Text: ="Header"
                              Tooltip: ="Edit plan header"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =If(Parent.Width < 640, (Parent.Width - 32) / 5, (Parent.Width - 48) / 5)
                        - btnItmNavItems:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Current maintenance items step"
                              Align: =Align.Center
                              BasePaletteColor: =RGBA(56, 96, 178, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Set(varCreateStep, 2)
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Size: =11
                              Text: ="Items"
                              Tooltip: ="Current maintenance items step"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =If(Parent.Width < 640, (Parent.Width - 32) / 5, (Parent.Width - 48) / 5)
                        - btnItmNavOperations:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Go to operations"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =RGBA(255, 255, 255, 1)
                              Color: =RGBA(12, 59, 94, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Normal
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(TaskListOperations, ScreenTransition.Cover)
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Size: =11
                              Text: ="Operations"
                              Tooltip: ="Open task-list operations"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =If(Parent.Width < 640, (Parent.Width - 32) / 5, (Parent.Width - 48) / 5)
                        - btnItmNavReview:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Go to review"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =RGBA(255, 255, 255, 1)
                              Color: =RGBA(12, 59, 94, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Normal
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(NewPlan_Review, ScreenTransition.Cover)
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Size: =11
                              Text: ="Review"
                              Tooltip: ="Review the maintenance plan"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =If(Parent.Width < 640, (Parent.Width - 32) / 5, (Parent.Width - 48) / 5)
            - conItmEditor:
                Control: GroupContainer@1.5.0
