                        Height: =If(Parent.Width < 640, 176, 92)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(Parent.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
