                                                ObjectType: drpItmObjectType.Selected.Value,
                                                WorkCenter: drpItmWorkCenter.Selected.Title,
                                                PlannerGroup: txtItmPlannerGroup.Text,
                                                Priority: drpItmPriority.Selected.Value,
                                                Revision: radItmRevision.Selected.Value = "Yes",
                                                RevisionMark: txtItmRevisionMark.Text
                                            }
                                        );
                                        Set(varItmReceiptVisible, true);
                                        Set(varSelectedItemKey, savedKey);
                                        Set(varEditItemKey, "");
                                        Set(varItemSubmitAttempted, false);
                                        Reset(txtItmDescription);
                                        Reset(txtItmReference);
                                        Reset(drpItmActivityType);
                                        Reset(drpItmObjectType);
                                        Reset(drpItmWorkCenter);
                                        Reset(txtItmPlannerGroup);
                                        Reset(drpItmPriority);
                                        Reset(radItmRevision);
                                        Reset(txtItmRevisionMark)
                                    )
                                )
