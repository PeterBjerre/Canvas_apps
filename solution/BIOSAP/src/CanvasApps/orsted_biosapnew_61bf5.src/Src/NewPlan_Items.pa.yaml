                                =Set(varItemSubmitAttempted, true);
                                If(
                                    !IsBlank(Trim(txtItmDescription.Text)) &&
                                    !IsBlank(Trim(txtItmReference.Text)) &&
                                    !IsBlank(drpItmActivityType.Selected) &&
                                    !IsBlank(drpItmObjectType.Selected) &&
                                    !IsBlank(drpItmWorkCenter.Selected) &&
                                    !IsBlank(drpItmPriority.Selected),
                                    With(
                                        {
                                            savedKey: If(
                                                IsBlank(varEditItemKey),
                                                "ITEM-" & Text(Now(), "yyyymmddhhmmss") & "-" & Text(RandBetween(100, 999), "000"),
                                                varEditItemKey
                                            ),
                                            savedNo: If(
                                                IsBlank(varEditItemKey),
                                                (CountRows(colMaintenanceItems) + 1) * 10,
                                                LookUp(colMaintenanceItems, LocalItemKey = varEditItemKey).ItemNo
                                            )
                                        },
                                        If(
                                            IsBlank(varEditItemKey),
                                            Collect(
                                                colMaintenanceItems,
                                                {
                                                    LocalItemKey: savedKey,
                                                    ItemNo: savedNo,
                                                    ItemDescription: txtItmDescription.Text,
                                                    ReferenceObject: txtItmReference.Text,
                                                    ActivityType: drpItmActivityType.Selected.Title,
                                                    ObjectType: drpItmObjectType.Selected.Value,
                                                    WorkCenter: drpItmWorkCenter.Selected.Title,
                                                    PlannerGroup: txtItmPlannerGroup.Text,
                                                    Priority: drpItmPriority.Selected.Value,
                                                    Revision: radItmRevision.Selected.Value = "Yes",
                                                    RevisionMark: txtItmRevisionMark.Text
                                                }
                                            ),
                                            UpdateIf(
                                                colMaintenanceItems,
                                                LocalItemKey = varEditItemKey,
                                                {
                                                    ItemDescription: txtItmDescription.Text,
                                                    ReferenceObject: txtItmReference.Text,
                                                    ActivityType: drpItmActivityType.Selected.Title,
                                                    ObjectType: drpItmObjectType.Selected.Value,
                                                    WorkCenter: drpItmWorkCenter.Selected.Title,
                                                    PlannerGroup: txtItmPlannerGroup.Text,
                                                    Priority: drpItmPriority.Selected.Value,
                                                    Revision: radItmRevision.Selected.Value = "Yes",
                                                    RevisionMark: txtItmRevisionMark.Text
                                                }
                                            )
                                        );
                                        ClearCollect(
                                            colItmRenumber,
                                            ForAll(
                                                Sequence(CountRows(colMaintenanceItems)) As idx,
                                                Patch(
                                                    Index(SortByColumns(colMaintenanceItems, "ItemNo", SortOrder.Ascending), idx.Value),
                                                    {ItemNo: idx.Value * 10}
                                                )
                                            )
                                        );
                                        ClearCollect(colMaintenanceItems, colItmRenumber);
                                        Clear(colItmRenumber);
                                        Set(
                                            varItmReceipt,
                                            {
                                                Action: "Saved",
                                                StableKey: savedKey,
                                                ItemNo: LookUp(colMaintenanceItems, LocalItemKey = savedKey).ItemNo,
                                                ItemDescription: txtItmDescription.Text,
                                                ReferenceObject: txtItmReference.Text,
