                        FontWeight: =FontWeight.Bold
                        Height: =30
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: =If(IsBlank(varEditItemKey), "Add maintenance item", "Edit maintenance item")
                        Width: =Parent.Width
                        Wrap: =false
                  - conItmFields1:
