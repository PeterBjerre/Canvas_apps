                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 36) / 2)
                            Children:
                              - txtItmActivityLabel:
                                  Control: ModernText@1.0.0
