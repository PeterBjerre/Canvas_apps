                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(varItmConfirmDeleteVisible || varItmCancelConfirmVisible, 210, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Visible: =varItmConfirmDeleteVisible || varItmCancelConfirmVisible
                  Width: =Parent.Width
                Children:
                  - txtItmConfirmHeading:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Confirmation heading"
                        Color: =If(varItmCancelConfirmVisible, RGBA(168, 0, 0, 1), RGBA(12, 59, 94, 1))
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =If(varItmCancelConfirmVisible, "Cancel draft flow?", "Delete this maintenance item?")
                        Width: =Parent.Width
                        Wrap: =false
                  - txtItmConfirmBody:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Confirmation details"
                        AutoHeight: =true
                        Color: =RGBA(90, 90, 90, 1)
                        Font: =Font.'Open Sans'
                        Height: =54
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =If(varItmCancelConfirmVisible, "This clears the working item and operation collections and returns to the overview. Existing SharePoint plans are not deleted.", "The item and its dependent operations will be removed from this draft.")
                        Width: =Parent.Width
                  - conItmConfirmActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =54
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnItmConfirmDelete:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Confirm delete item"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(168, 0, 0, 1)
                              Color: =RGBA(168, 0, 0, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =48
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: |-
                                =Set(varItmDeletedKey, varSelectedItemKey);
                                RemoveIf(colMaintenanceItems, LocalItemKey = varSelectedItemKey);
                                RemoveIf(colOperations, ItemKey = varSelectedItemKey);
                                ClearCollect(
                                    colItmRenumber,
                                    ForAll(
                                        Sequence(CountRows(colMaintenanceItems)) As idx,
                                        Patch(
                                            Index(SortByColumns(colMaintenanceItems, "ItemNo", SortOrder.Ascending), idx.Value),
                                            {ItemNo: idx.Value * 10}
                                        )
                                    )
                                );
                                ClearCollect(colMaintenanceItems, colItmRenumber);
                                Clear(colItmRenumber);
                                Set(varItmReceipt, {Action: "Deleted", StableKey: varItmDeletedKey, ItemNo: 0, ItemDescription: "", ReferenceObject: "", ActivityType: "", ObjectType: "", WorkCenter: "", PlannerGroup: "", Priority: "", Revision: false, RevisionMark: ""});
                                Set(varItmReceiptVisible, true);
                                Set(varItmConfirmDeleteVisible, false);
                                Set(varEditItemKey, "")
                              PaddingBottom: =8
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =8
                              Size: =12
                              Text: ="Confirm delete"
                              Tooltip: ="Confirm the selected action"
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: =varItmConfirmDeleteVisible
                              Width: =148
                        - btnItmCancelFlow:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Confirm cancel draft flow"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(168, 0, 0, 1)
                              Color: =RGBA(168, 0, 0, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =48
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: |-
                                =Clear(colMaintenanceItems);
                                Clear(colOperations);
                                Set(varCreateStep, 1);
                                Set(varEditItemKey, "");
                                Set(varItmCancelConfirmVisible, false);
                                Navigate(Screen1, ScreenTransition.Cover)
                              PaddingBottom: =8
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =8
                              Size: =12
                              Text: ="Confirm cancel"
                              Tooltip: ="Clear the draft and return to overview"
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: =varItmCancelConfirmVisible
                              Width: =148
                        - btnItmConfirmDismiss:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Dismiss confirmation"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BasePaletteColor: =RGBA(56, 96, 178, 1)
                              Color: =RGBA(12, 59, 94, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Normal
                              Height: =48
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Set(varItmConfirmDeleteVisible, false); Set(varItmCancelConfirmVisible, false)
                              PaddingBottom: =8
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =8
                              Size: =12
                              Text: ="Keep editing"
                              Tooltip: ="Dismiss confirmation"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =138
            - lblItmFlowError:
                Control: ModernText@1.0.0
                Properties:
                  AccessibleLabel: ="Flow validation message"
                  AutoHeight: =true
                  Color: =RGBA(168, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  Height: =28
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =varCreateError
                  Visible: =!IsBlank(varCreateError)
                  Width: =Parent.Width
