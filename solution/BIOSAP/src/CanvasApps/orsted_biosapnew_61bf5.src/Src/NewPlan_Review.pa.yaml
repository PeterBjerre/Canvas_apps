                              Font: =Font.'Open Sans'
                              Height: =176
                              PaddingBottom: =4
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =4
                              Size: =11
                              Text: |-
                                ="Stable operation ID: " & Text(ThisItem.ExternalID, "0") & Char(10) & "Operation no: " & ThisItem.OpNo & Char(10) & "Item key: " & ThisItem.ItemKey & Char(10) & "Description: " & ThisItem.Description & Char(10) & "Operation text: " & ThisItem.OpText & Char(10) & "Work center: " & ThisItem.WorkCenter & Char(10) & "Control key: " & ThisItem.ControlKey & Char(10) & "Work hours: " & Text(ThisItem.WorkHours, "0.0") & Char(10) & "Duration hours: " & Text(ThisItem.DurationHours, "0.0") & Char(10) & "Standard code: " & Coalesce(ThisItem.StandardCode, "") & Char(10) & "Sequence: " & Text(ThisItem.SeqNo, "0")
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
