                        Items: =colSubmittedOperations
                        LoadingSpinner: =LoadingSpinner.Controls
                        LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
                        Selectable: =false
                        ShowScrollbar: =false
                        TemplatePadding: =8
                        TemplateSize: =192
                        Width: =Parent.Width
                      Children:
                        - txtRevSubmittedOperation:
                            Control: ModernText@1.0.0
