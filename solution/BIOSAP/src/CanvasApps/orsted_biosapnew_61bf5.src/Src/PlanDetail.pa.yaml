Screens:
  PlanDetail:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varPlanDetailEditMode, varPlanDetailMode = "Edit");
        Set(varPlanDetailAttempted, false);
        Set(varPlanDetailError, "");
        Set(varPlanCommentAttempted, false);
        Set(varPlanMutationReceiptVisible, false)
    Children:
      - conPlanDetailRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(248, 250, 252, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =12
            Width: =Parent.Width
          Children:
            - conPlanDetailNav:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(12, 59, 94, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 640, 100, 52)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =true
                  PaddingBottom: =4
                  PaddingLeft: =4
                  PaddingRight: =4
                  PaddingTop: =4
                  Width: =Parent.Width
                Children:
                  - btnPlanDetailNavOverview:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to Overview"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =RGBA(255, 255, 255, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(Screen1, ScreenTransition.Cover)
                        Size: =11
                        Text: ="Overview"
                        Tooltip: ="Open maintenance plan overview"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =If(Parent.Width < 640, (Parent.Width - 32) / 3, (Parent.Width - 48) / 3)
                  - btnPlanDetailNavMyPlans:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to My plans"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =RGBA(255, 255, 255, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(MyPlans, ScreenTransition.Cover)
                        Size: =11
                        Text: ="My plans"
                        Tooltip: ="Open your maintenance plans"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =If(Parent.Width < 640, (Parent.Width - 32) / 3, (Parent.Width - 48) / 3)
                  - btnPlanDetailNavNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to New plan"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =RGBA(255, 255, 255, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(NewPlan_Header, ScreenTransition.Cover)
                        Size: =11
                        Text: ="New plan"
                        Tooltip: ="Create a new maintenance plan"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =If(Parent.Width < 640, (Parent.Width - 32) / 3, (Parent.Width - 48) / 3)
            - conPlanDetailHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(12, 59, 94, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 640, 132, 86)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(Parent.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingTop: =12
                  Width: =Parent.Width
                Children:
                  - txtPlanDetailTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Selected plan title"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =22
                        Text: =If(varSelectedPlanID = 0, "", LookUp(MaintenancePlans, ID = varSelectedPlanID).Title)
                        Width: =If(Parent.Width < 640, Parent.Width - 32, Parent.Width * 0.58)
                        Wrap: =false
                  - txtPlanDetailIdentity:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Selected plan identity"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(226, 231, 235, 1)
                        Font: =Font.'Open Sans'
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: =If(varSelectedPlanID = 0, "", LookUp(MaintenancePlans, ID = varSelectedPlanID).PlanID & "  ·  ID " & Text(LookUp(MaintenancePlans, ID = varSelectedPlanID).ID))
                        Width: =If(Parent.Width < 640, Parent.Width - 32, Parent.Width * 0.24)
                        Wrap: =false
                  - txtPlanDetailStatus:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Selected plan status"
                        Align: =Align.Right
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =If(varSelectedPlanID = 0, "", LookUp(MaintenancePlans, ID = varSelectedPlanID).Status.Value)
                        Width: =If(Parent.Width < 640, Parent.Width - 32, Parent.Width * 0.18 - 8)
                        Wrap: =false
            - conPlanDetailNoSelection:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 640, 168, 120)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Visible: =varSelectedPlanID = 0 || IsBlank(LookUp(MaintenancePlans, ID = varSelectedPlanID).ID)
                  Width: =Parent.Width
                Children:
                  - txtPlanDetailNoSelection:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="No plan selected message"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(12, 59, 94, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="No plan selected"
                        Width: =Parent.Width - 32
                        Wrap: =false
                  - txtPlanDetailNoSelectionHelp:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="No plan selected guidance"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(90, 90, 90, 1)
                        Font: =Font.'Open Sans'
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Choose a plan from My plans to view its details."
                        Width: =Parent.Width - 32
                        Wrap: =false
                  - btnPlanDetailNoSelectionBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Return to My plans"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Secondary
                        Color: =RGBA(12, 59, 94, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(MyPlans, ScreenTransition.Cover)
                        Size: =11
                        Text: ="Back to My plans"
                        Tooltip: ="Return to your plans"
                        Width: =If(Parent.Width < 640, Parent.Width - 32, 180)
