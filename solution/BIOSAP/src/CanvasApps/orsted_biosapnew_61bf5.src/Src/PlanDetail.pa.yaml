                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Set(varPlanDetailMode, "Correct"); Set(varPlanDetailEditMode, true); Set(varPlanDetailAttempted, false); Set(varPlanDetailError, "")
                        Size: =11
                        Text: ="Correct returned plan"
                        Tooltip: ="Correct the returned plan before resubmitting"
