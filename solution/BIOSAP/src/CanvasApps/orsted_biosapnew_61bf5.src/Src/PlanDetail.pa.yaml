                        DisplayMode: =If(LookUp(MaintenancePlans, ID = varSelectedPlanID).Status.Value <> "In Progress", DisplayMode.Disabled, DisplayMode.Edit)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: |-
                          =Set(varPlanDetailAttempted, true);
                          If(
                              !varPlanDetailEditMode &&
                              !IsBlank(LookUp(MaintenancePlans, ID = varSelectedPlanID).ID) &&
                              LookUp(MaintenancePlans, ID = varSelectedPlanID).Author.Email = varUserMail &&
                              LookUp(MaintenancePlans, ID = varSelectedPlanID).Status.Value = "In Progress" &&
                              !IsBlank(Trim(LookUp(MaintenancePlans, ID = varSelectedPlanID).Title)) &&
                              LookUp(MaintenancePlans, ID = varSelectedPlanID).Cycle > 0 &&
                              !IsBlank(LookUp(MaintenancePlans, ID = varSelectedPlanID).PlannedDate),
                              With(
                                  {
                                      resubmittedPlan: Patch(
                                          MaintenancePlans,
                                          LookUp(MaintenancePlans, ID = varSelectedPlanID),
                                          {Status: {Value: "Ready for creation in SAP"}}
                                      )
                                  },
                                  Set(varLastPlanMutation, {Action: "Plan resubmitted", Entity: "Maintenance plan", StableID: resubmittedPlan.ID, PlanID: resubmittedPlan.PlanID, Title: resubmittedPlan.Title, Cycle: resubmittedPlan.Cycle, PlannedDate: resubmittedPlan.PlannedDate, CallHorizon0: resubmittedPlan.CallHorizon0, SchedulingPeriod: resubmittedPlan.SchedulingPeriod, Status: resubmittedPlan.Status.Value, Body: "", AuthorMail: varUserMail, CreatedOn: Now()});
                                  Refresh(MaintenancePlans);
                                  ClearCollect(colMyPlans, SortByColumns(Filter(MaintenancePlans, varIsAdmin || Author.Email = varUserMail), "ID", SortOrder.Descending));
                                  Collect(colPlanAudit, {AuditID: GUID(), PlanID: resubmittedPlan.PlanID, Title: "Plan resubmitted", ActorMail: varUserMail, FromStatus: "In Progress", ToStatus: resubmittedPlan.Status.Value, CreatedOn: Now()});
                                  Set(varPlanMutationReceiptVisible, true)
                              ),
                              Set(varPlanDetailError, "Resubmit is available only for a valid returned plan in In Progress.")
                          )
                        Size: =11
                        Text: ="Resubmit"
                        Tooltip: ="Resubmit this returned plan for SAP creation"
                        Visible: =!varPlanDetailEditMode && LookUp(MaintenancePlans, ID = varSelectedPlanID).Status.Value = "In Progress" && LookUp(MaintenancePlans, ID = varSelectedPlanID).Author.Email = varUserMail && !IsBlank(Trim(LookUp(MaintenancePlans, ID = varSelectedPlanID).Title)) && LookUp(MaintenancePlans, ID = varSelectedPlanID).Cycle > 0 && !IsBlank(LookUp(MaintenancePlans, ID = varSelectedPlanID).PlannedDate)
                        Width: =If(Parent.Width < 640, Parent.Width, 120)
            - txtPlanDetailError:
