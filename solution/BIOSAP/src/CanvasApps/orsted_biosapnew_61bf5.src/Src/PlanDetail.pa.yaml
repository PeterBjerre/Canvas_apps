                        Text: ="Save changes"
                        Tooltip: ="Save changes by stable plan ID"
                        Visible: =varPlanDetailEditMode
                        Width: =If(Parent.Width < 640, Parent.Width, 150)
                  - btnPlanDetailResubmit:
