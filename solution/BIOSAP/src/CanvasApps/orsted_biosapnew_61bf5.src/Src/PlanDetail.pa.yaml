                  Visible: =varPlanDetailError <> "" || (varSelectedPlanID <> 0 && !IsBlank(LookUp(MaintenancePlans, ID = varSelectedPlanID).ID) && LookUp(MaintenancePlans, ID = varSelectedPlanID).Status.Value <> "In Progress" && !varPlanDetailEditMode)
