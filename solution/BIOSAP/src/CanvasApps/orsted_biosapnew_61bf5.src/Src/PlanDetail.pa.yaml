                        Text: ="Cancel"
                        Tooltip: ="Discard unsaved changes"
                        Visible: =varPlanDetailEditMode
                        Width: =If(Parent.Width < 640, Parent.Width, 110)
                  - btnPlanDetailSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Save plan changes"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: =If(IsBlank(Trim(txtPlanDetailTitleInput.Text)) || numPlanDetailCycle.Value <= 0 || IsBlank(dpPlanDetailDate.SelectedDate), DisplayMode.Disabled, DisplayMode.Edit)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: |-
                          =Set(varPlanDetailAttempted, true);
                          If(
                              !IsBlank(LookUp(MaintenancePlans, ID = varSelectedPlanID).ID) &&
                              LookUp(MaintenancePlans, ID = varSelectedPlanID).Author.Email = varUserMail &&
                              (LookUp(MaintenancePlans, ID = varSelectedPlanID).Status.Value = "Draft" || LookUp(MaintenancePlans, ID = varSelectedPlanID).Status.Value = "In Progress") &&
                              !IsBlank(Trim(txtPlanDetailTitleInput.Text)) &&
                              numPlanDetailCycle.Value > 0 &&
                              !IsBlank(dpPlanDetailDate.SelectedDate),
                              Set(varPlanDetailError, "");
                              With(
                                  {
                                      updatedPlan: Patch(
                                          MaintenancePlans,
                                          LookUp(MaintenancePlans, ID = varSelectedPlanID),
                                          {
                                              Title: Trim(txtPlanDetailTitleInput.Text),
                                              Cycle: numPlanDetailCycle.Value,
                                              PlannedDate: dpPlanDetailDate.SelectedDate,
                                              CallHorizon0: If(LookUp(MaintenancePlans, ID = varSelectedPlanID).Unit.Value = "M", numPlanDetailCycle.Value * 30, If(LookUp(MaintenancePlans, ID = varSelectedPlanID).Unit.Value = "Q", numPlanDetailCycle.Value * 90, numPlanDetailCycle.Value * 365)),
                                              SchedulingPeriod: numPlanDetailCycle.Value
                                          }
                                      )
                                  },
                                  Set(
                                      varLastPlanMutation,
                                      {
                                          Action: If(varPlanDetailMode = "Correct", "Correction saved", "Draft edit saved"),
                                          Entity: "Maintenance plan",
                                          StableID: updatedPlan.ID,
                                          PlanID: updatedPlan.PlanID,
                                          Title: updatedPlan.Title,
                                          Cycle: updatedPlan.Cycle,
                                          PlannedDate: updatedPlan.PlannedDate,
                                          CallHorizon0: updatedPlan.CallHorizon0,
                                          SchedulingPeriod: updatedPlan.SchedulingPeriod,
                                          Status: updatedPlan.Status.Value,
                                          Body: "",
                                          AuthorMail: varUserMail,
                                          CreatedOn: Now()
                                      }
                                  );
                                  Refresh(MaintenancePlans);
                                  ClearCollect(colMyPlans, SortByColumns(Filter(MaintenancePlans, varIsAdmin || Author.Email = varUserMail), "ID", SortOrder.Descending));
                                  Collect(colPlanAudit, {AuditID: GUID(), PlanID: updatedPlan.PlanID, Title: If(varPlanDetailMode = "Correct", "Correction saved", "Draft edit saved"), ActorMail: varUserMail, FromStatus: updatedPlan.Status.Value, ToStatus: updatedPlan.Status.Value, CreatedOn: Now()});
                                  Set(varPlanMutationReceiptVisible, true);
                                  Set(varPlanDetailEditMode, false);
                                  Set(varPlanDetailMode, "View")
                              ),
                              Set(varPlanDetailError, "Enter a title, a cycle greater than 0, and a planned date before saving.")
                          )
