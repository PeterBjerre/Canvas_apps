                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(90, 90, 90, 1)
                        Font: =Font.'Open Sans'
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
