                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 640, 420, 270)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  Visible: =varSelectedPlanID <> 0 && !IsBlank(LookUp(MaintenancePlans, ID = varSelectedPlanID).ID)
                  Width: =Parent.Width
                Children:
                  - txtPlanDetailCommentsHeading:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Plan comments heading"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(12, 59, 94, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Comments"
                        Width: =Parent.Width - 32
                        Wrap: =false
                  - txtPlanDetailCommentsNote:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Session local comments note"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(90, 90, 90, 1)
                        Font: =Font.'Open Sans'
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="Comments are saved for the current session only."
                        Width: =Parent.Width - 32
                        Wrap: =false
                  - txtPlanDetailCommentInput:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        AccessibleLabel: ="New plan comment"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        Color: =RGBA(12, 59, 94, 1)
                        Fill: =RGBA(241, 242, 246, 1)
                        Font: =Font.'Open Sans'
                        Height: =64
                        MaxLength: =500
                        Placeholder: ="Add a note (500 characters maximum)"
                        TriggerOutput: =TriggerOutput.FocusOut
                        Type: =TextInputType.Multiline
                        ValidationState: =If(varPlanCommentAttempted && IsBlank(Trim(Self.Text)), ValidationState.Error, ValidationState.None)
                        Width: =Parent.Width - 32
                  - btnPlanDetailAddComment:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Add plan comment"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: =If(IsBlank(Trim(txtPlanDetailCommentInput.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: |-
                          =Set(varPlanCommentAttempted, true);
                          If(
                              !IsBlank(Trim(txtPlanDetailCommentInput.Text)),
                              Set(
                                  varLastPlanMutation,
                                  {
                                      Action: "Comment added",
                                      Entity: "Plan comment",
                                      StableID: varSelectedPlanID,
                                      PlanID: LookUp(MaintenancePlans, ID = varSelectedPlanID).PlanID,
                                      Title: "",
                                      Cycle: 0,
                                      PlannedDate: Today(),
                                      CallHorizon0: 0,
                                      SchedulingPeriod: 0,
                                      Status: LookUp(MaintenancePlans, ID = varSelectedPlanID).Status.Value,
                                      Body: Trim(txtPlanDetailCommentInput.Text),
                                      AuthorMail: varUserMail,
                                      CreatedOn: Now()
                                  }
                              );
                              Collect(
                                  colPlanComments,
                                  {
                                      CommentID: GUID(),
                                      PlanID: LookUp(MaintenancePlans, ID = varSelectedPlanID).PlanID,
                                      Title: Trim(txtPlanDetailCommentInput.Text),
                                      AuthorMail: varUserMail,
                                      IsAdmin: false,
                                      CreatedOn: Now()
                                  }
                              );
                              Set(varPlanMutationReceiptVisible, true);
                              Reset(txtPlanDetailCommentInput);
                              Set(varPlanCommentAttempted, false)
                          )
                        Size: =11
                        Text: ="Add comment"
                        Tooltip: ="Save a session-local comment"
                        Width: =If(Parent.Width < 640, Parent.Width - 32, 150)
                  - galPlanDetailComments:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Plan comments history"
                        FillPortions: =0
                        Height: =If(Parent.Width < 640, 190, 120)
                        Items: =SortByColumns(Filter(colPlanComments, PlanID = LookUp(MaintenancePlans, ID = varSelectedPlanID).PlanID), "CreatedOn", SortOrder.Descending)
                        Selectable: =false
                        TabIndex: =0
                        TemplatePadding: =4
                        TemplateSize: =58
                        Width: =Parent.Width - 32
                      Children:
                        - conPlanDetailCommentRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(248, 250, 252, 1)
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              PaddingBottom: =4
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =4
                              Width: =Parent.TemplateWidth
                            Children:
                              - txtPlanDetailCommentRowText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Comment text"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(12, 59, 94, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =24
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Text: =ThisItem.Title
                                    Width: =Parent.Width - 16
                              - txtPlanDetailCommentRowMeta:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Comment author and timestamp"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(90, 90, 90, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: =ThisItem.AuthorMail & "  ·  " & Text(ThisItem.CreatedOn, "[$-en-US]mmm d, yyyy h:mm AM/PM")
                                    Width: =Parent.Width - 16
                                    Wrap: =false
                  - txtPlanDetailCommentsEmpty:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Empty comments message"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(90, 90, 90, 1)
                        Font: =Font.'Open Sans'
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="No comments for this plan in this session."
                        Visible: =galPlanDetailComments.AllItemsCount = 0
                        Width: =Parent.Width - 32
                        Wrap: =false
