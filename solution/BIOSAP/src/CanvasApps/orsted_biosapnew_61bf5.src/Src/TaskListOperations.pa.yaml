                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Review"
                        Tooltip: ="Open review"
                        Width: =Max(92, (Parent.Width - 64) / 5)
