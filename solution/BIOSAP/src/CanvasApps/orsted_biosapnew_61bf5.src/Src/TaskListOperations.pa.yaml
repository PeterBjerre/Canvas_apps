      - conOpsRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(248, 250, 252, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            Width: =Parent.Width
          Children:
            - conOpsNav:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(12, 59, 94, 1)
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =72
                  LayoutMinWidth: =0
                  LayoutWrap: =true
                  PaddingBottom: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =12
                  Width: =Parent.Width
                Children:
                  - btnOpsOverview:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to overview"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(255, 255, 255, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Normal
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(Screen1, ScreenTransition.None)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Overview"
                        Tooltip: ="Open overview"
                        Width: =Max(92, (Parent.Width - 64) / 5)
                  - btnOpsHeader:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to plan header"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(255, 255, 255, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Normal
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(NewPlan_Header, ScreenTransition.None)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Header"
                        Tooltip: ="Open plan header"
                        Width: =Max(92, (Parent.Width - 64) / 5)
                  - btnOpsItems:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to maintenance items"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(255, 255, 255, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Normal
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Navigate(NewPlan_Items, ScreenTransition.None)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Items"
                        Tooltip: ="Open maintenance items"
                        Width: =Max(92, (Parent.Width - 64) / 5)
                  - btnOpsOperations:
                      Control: ModernButton@1.0.0
