                        AccessibleLabel: |-
                          ="Current step: operations"
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =RGBA(64, 153, 218, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =Set(varCreateStep, 3)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Operations"
                        Tooltip: ="Current step"
                        Width: =Max(92, (Parent.Width - 64) / 5)
                  - btnOpsReview:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go to review"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(255, 255, 255, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Normal
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: =If(varCreateStep >= 4, Navigate(NewPlan_Review, ScreenTransition.None))
