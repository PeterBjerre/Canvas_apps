                                      (IsBlank(OpText) || IsBlank(WorkCenter) || IsBlank(ControlKey) || WorkHours < 0 || DurationHours < 0)
                                  )
                              ) = 0,
                              Set(varCreateStep, 4);
                              Set(varCreateError, "");
                              Navigate(NewPlan_Review, ScreenTransition.None),
                              Set(varCreateError, "Add at least one valid operation for the selected item before review.")
                          )
                        Size: =12
                        Text: ="Continue to review"
                        Tooltip: ="Review this draft"
                        Width: =170
