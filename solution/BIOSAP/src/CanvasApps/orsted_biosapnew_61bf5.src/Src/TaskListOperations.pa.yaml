Screens:
  TaskListOperations:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varCreateStep, 3);
        Set(varOpsFormOpen, false);
        Set(varOpsDeletePrompt, false);
        Set(varOpsCancelPrompt, false);
        Set(varOperationSubmitAttempted, false);
        Set(varCreateError, "");
        Set(varReceiptVisible, false);
        Set(varOpsCommittedSearch, "");
        Set(
            varSelectedItemKey,
            Coalesce(
                varSelectedItemKey,
                If(CountRows(colMaintenanceItems) > 0, First(colMaintenanceItems).LocalItemKey, "")
            )
        );
        Set(
            varTaskListDescription,
            Coalesce(varTaskListDescription, "Cooling water pump inspection task list")
        );
        Set(varOpsCatalogID, Blank());
        Set(varOpsStandardCode, "");
        Set(varOpsOpText, "");
        Set(varOpsWorkCenter, "");
        Set(varOpsControlKey, "PM01");
        Set(varOpsWorkHours, 0);
        Set(varOpsDurationHours, 0);
        Set(varEditOperationKey, "");
