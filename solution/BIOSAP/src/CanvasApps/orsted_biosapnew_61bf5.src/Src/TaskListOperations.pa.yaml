                                                    WorkCenter: txtOpsWorkCenter.Text,
                                                    ControlKey: drpOpsControlKey.Selected.Value,
                                                    WorkHours: numOpsWork.Value,
                                                    DurationHours: numOpsDuration.Value,
                                                    StandardCode: Coalesce(varOpsStandardCode, "")
                                                }
                                            ),
