                                =Set(varOperationSubmitAttempted, true);
                                If(
                                    !IsBlank(drpOpsItem.Selected.LocalItemKey) &&
                                    !IsBlank(txtOpsOpText.Text) &&
                                    !IsBlank(txtOpsWorkCenter.Text) &&
                                    !IsBlank(drpOpsControlKey.Selected.Value) &&
                                    !IsBlank(numOpsWork.Value) &&
                                    !IsBlank(numOpsDuration.Value) &&
                                    numOpsWork.Value >= 0 &&
                                    numOpsDuration.Value >= 0,
                                    With(
