                              AccessibleLabel: ="Task list description label"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(12, 59, 94, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="Task list description"
                              Width: =Parent.Width
                              Wrap: =false
                        - txtOpsDescription:
                            Control: ModernTextInput@1.1.1
                            Properties:
                              AccessibleLabel: ="Task list description"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              BorderColor: =RGBA(214, 221, 224, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Default: =varTaskListDescription
                              Fill: =RGBA(241, 242, 246, 1)
                              Font: =Font.'Open Sans'
                              Height: =44
                              MaxLength: =120
                              OnChange: =Set(varTaskListDescription, Self.Text)
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =8
                              Placeholder: ="Describe this task list"
                              Required: =true
                              Size: =12
