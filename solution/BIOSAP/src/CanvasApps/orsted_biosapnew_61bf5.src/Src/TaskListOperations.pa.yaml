                              OnSelect: |-
                                =With(
                                    {
                                        deletedKey: varSelectedOperationKey,
                                        deletedRow: LookUp(colOperations, LocalOperationKey = varSelectedOperationKey)
                                    },
                                    If(
                                        !IsBlank(deletedRow.LocalOperationKey),
                                        RemoveIf(colOperations, LocalOperationKey = deletedKey);
                                        ForAll(
                                            Sequence(CountRows(Filter(colOperations, ItemKey = deletedRow.ItemKey))) As idx,
                                            With(
                                                {rec: Index(Sort(Filter(colOperations, ItemKey = deletedRow.ItemKey), SeqNo, SortOrder.Ascending), idx.Value)},
                                                Patch(colOperations, LookUp(colOperations, LocalOperationKey = rec.LocalOperationKey), {SeqNo: idx.Value * 10, OpNo: Text(idx.Value * 10, "0000")})
                                            )
                                        );
                                        Set(varLastCreateReceipt, {Action: "Deleted", Entity: "Operation", StableKey: deletedKey, ItemKey: deletedRow.ItemKey});
                                        Set(varReceiptVisible, true)
                                    );
                                    Set(varOpsDeletePrompt, false);
                                    Set(varSelectedOperationKey, "")
                                )
