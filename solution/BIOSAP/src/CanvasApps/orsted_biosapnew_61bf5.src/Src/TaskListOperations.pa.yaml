                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Pick a standard operation"
                        Width: =Parent.Width
                        Wrap: =false
                  - cmbOpsStandard:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        AccessibleLabel: ="Search and select a standard operation"
                        AlignInContainer: =AlignInContainer.Stretch
                        AllowExternalSelectedItems: =false
                        Appearance: =Appearance.Outline
                        BorderColor: =RGBA(214, 221, 224, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DelayOutput: =true
                        Fill: =RGBA(241, 242, 246, 1)
                        Font: =Font.'Open Sans'
                        Height: =48
                        InputTextPlaceholder: ="Search by operation, code or work center"
                        ItemDisplayText: =ThisItem.Title & "  -  " & ThisItem.field_5
                        Items: =Switch(Left(varDraftPlan.PlantKey, 3), "ASV", 'ASV Standard Tasklist', "AVV", 'AVV Standard Tasklist', "HEV", 'HEV Standard Tasklist', "KYV", 'KYV Standard Tasklist', "SKV", 'SKV Standard Tasklist', "SSV", 'SSV Standard Tasklist', 'ASV Standard Tasklist')
                        OnChange: |-
                          =If(
                              !IsBlank(Self.Selected.ID),
                              Set(varOpsCatalogID, Self.Selected.ID);
                              Set(varOpsStandardCode, Text(Self.Selected.field_1));
                              Set(varOpsOpText, Self.Selected.field_5);
                              Set(varOpsWorkCenter, Self.Selected.field_2);
                              Set(varOpsControlKey, Self.Selected.field_4);
                              Set(varOpsWorkHours, Value(Self.Selected.field_6));
                              Set(varOpsDurationHours, Value(Self.Selected.field_9));
                              Set(varOpsFormOpen, true)
                          )
                        PaddingBottom: =8
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =8
                        SelectMultiple: =false
                        Size: =12
                        Width: =Parent.Width
