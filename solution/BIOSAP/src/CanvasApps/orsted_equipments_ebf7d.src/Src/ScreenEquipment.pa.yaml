                                    BorderThickness: =0
                                    Color: =If(!IsBlank(varEqDeleteSnapshot), RGBA(179, 50, 60, 1), RGBA(89, 102, 122, 1))
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    Height: =20
                                    LayoutMinWidth: =260
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =If(!IsBlank(varEqDeleteSnapshot), varEqDeleteSnapshot, varEqRuntimeInfo)
                                    Visible: =!IsBlank(varEqDeleteSnapshot) || !IsBlank(varEqRuntimeInfo)
                                    Wrap: =false
                              - btnEqSubmitRows:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Indsend gemte raekker"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =RGBA(0, 103, 174, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(CountRows(Filter(colEquipmentRows, Status = "valid")) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinWidth: =190
                                    OnSelect: |
                                      =If(
                                          CountRows(Filter(colEquipmentRows, Status = "valid")) = 0,
                                          Set(varEqRuntimeInfo, "No valid rows to submit."),
                                          Set(varEqSubmitCount, CountRows(Filter(colEquipmentRows, Status = "valid")));
                                          UpdateIf(colEquipmentRows, Status = "valid", { Status: "submitted" });
                                          Set(varEqRuntimeInfo, "Submitted " & varEqSubmitCount & " rows.")
                                      )
                                    RadiusBottomLeft: =18
                                    RadiusBottomRight: =18
                                    RadiusTopLeft: =18
                                    RadiusTopRight: =18
                                    Size: =14
                                    Text: ="Submit saved rows"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =190
                  - conEqFooterBar:
