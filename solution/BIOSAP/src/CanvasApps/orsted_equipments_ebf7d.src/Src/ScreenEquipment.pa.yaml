                                          varEqCsv,
                                          "RowId;RequestType;Plant;EquipmentNumber;Description;EquipmentCategory;Manufacturer;TypeDesignation;SerialNumber;FunctionalLocation;FunctionalLocation1;FunctionalLocation2;ClassData;RoomCoordinates;Placement;WarrantyStart;WarrantyEnd;DocumentType;DocumentLink;Status" & Char(10) &
