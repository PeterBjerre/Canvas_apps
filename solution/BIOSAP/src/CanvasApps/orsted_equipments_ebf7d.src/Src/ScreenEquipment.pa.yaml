                                                      DisplayMode: |-
                                                        =If(
                                                            !IsBlank(drpEqPlant.Selected.Label)
                                                            && (varFormRequestType <> "new" || (
                                                                !IsBlank(Trim(txtEqDescription.Text))
                                                                && !IsBlank(Trim(drpEqEquipmentCategory.Selected.Value))
                                                                && !IsBlank(Trim(txtEqManufacturer.Text))
                                                                && !IsBlank(Trim(txtEqTypeDesignation.Text))
                                                                && !IsBlank(Trim(txtEqFunctionalLocation.Text))
