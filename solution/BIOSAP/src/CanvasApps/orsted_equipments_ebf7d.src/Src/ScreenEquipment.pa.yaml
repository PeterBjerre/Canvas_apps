                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Send som e-mail"
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =RGBA(0, 103, 174, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              DisplayMode: =If(CountRows(Filter(colEquipmentRows, Status = "valid")) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Segoe UI'
                              Height: =36
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =190
                              OnSelect: |
                                =Set(varEqRuntimeInfo, "Email draft prepared: " & CountRows(colEquipmentRows) & " rows.")
                              RadiusBottomLeft: =18
                              RadiusBottomRight: =18
                              RadiusTopLeft: =18
                              RadiusTopRight: =18
                              Size: =14
                              Text: ="Send email"
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: =CountRows(Filter(colEquipmentRows, Status = "valid")) > 0
                              Width: =190
      - conEqDetailsModal:
