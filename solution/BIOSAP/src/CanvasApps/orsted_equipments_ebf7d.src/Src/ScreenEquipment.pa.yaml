            PaddingLeft: =18
            PaddingRight: =18
            PaddingTop: =16
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Visible: =!IsBlank(varEqSelectedRowId)
            Width: =Min(700, App.Width - 40)
            X: =(App.Width - Self.Width) / 2
            Y: =Max(20, (App.Height - Self.Height) / 3)
          Children:
            - conEqDetailsModalHead:
