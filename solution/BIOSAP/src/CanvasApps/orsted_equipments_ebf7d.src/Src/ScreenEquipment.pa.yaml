            - conEqDetailsModalBodyWrap:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(215, 222, 232, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height - 90
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Parent.Width
                Children:
                  - htmlEqDetailsModalBody:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =Parent.Height
                        HtmlText: |-
                          =With(
                              {r: LookUp(colEquipmentRows, RowId = varEqSelectedRowId)},
                              With(
                                  {
                                      thStyle: "text-align:left;background:#F4F6FA;color:#59667A;font-size:12px;font-weight:600;padding:9px 12px;border-bottom:1px solid #D7DEE8;",
                                      tdLbl: "padding:9px 12px;border-bottom:1px solid #EDF1F7;font-size:13px;color:#59667A;vertical-align:top;width:220px;",
                                      tdVal: "padding:9px 12px;border-bottom:1px solid #EDF1F7;font-size:14px;color:#1A2231;vertical-align:top;",
                                      statusBg: Switch(r.Status, "valid", "#E8F5EE", "invalid", "#FDECEC", "submitted", "#DEF0FC", "#E4E9F1"),
                                      statusFg: Switch(r.Status, "valid", "#157F5C", "invalid", "#B3323C", "submitted", "#00538C", "#59667A"),
                                      statusLbl: Switch(r.Status, "valid", "Valid", "invalid", "Invalid", "submitted", "Submitted", "-")
                                  },
                                  "<div style='font-family:Segoe UI,sans-serif;'><table style='width:100%;border-collapse:collapse;'><thead><tr>" &
                                  "<th style='" & thStyle & "'>COLUMN</th><th style='" & thStyle & "'>VALUE</th>" &
                                  "</tr></thead><tbody>" &
                                  "<tr><td style='" & tdLbl & "'>Status</td><td style='" & tdVal & "'><span style='display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;background:" & statusBg & ";color:" & statusFg & ";'>" & statusLbl & "</span></td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Request type</td><td style='" & tdVal & "'>" & Coalesce(r.RequestType, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Plant</td><td style='" & tdVal & "'>" & Coalesce(r.Plant, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Equipmentnummer</td><td style='" & tdVal & "'>" & Coalesce(r.EquipmentNumber, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Beskrivelse</td><td style='" & tdVal & "'>" & Coalesce(r.Description, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Equipment type</td><td style='" & tdVal & "'>" & Coalesce(r.EquipmentCategory, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Fabrikat</td><td style='" & tdVal & "'>" & Coalesce(r.Manufacturer, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Type betegnelse</td><td style='" & tdVal & "'>" & Coalesce(r.TypeDesignation, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Serienummer</td><td style='" & tdVal & "'>" & Coalesce(r.SerialNumber, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Func. location</td><td style='" & tdVal & "'>" & Coalesce(r.FunctionalLocation, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Func. loc. 1</td><td style='" & tdVal & "'>" & Coalesce(r.FunctionalLocation1, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Functional location 2</td><td style='" & tdVal & "'>" & Coalesce(r.FunctionalLocation2, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Klasse data</td><td style='" & tdVal & "'>" & Coalesce(r.ClassData, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>ROOM (koordinater)</td><td style='" & tdVal & "'>" & Coalesce(r.RoomCoordinates, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Placering</td><td style='" & tdVal & "'>" & Coalesce(r.Placement, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Garanti start</td><td style='" & tdVal & "'>" & Coalesce(r.WarrantyStart, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Garanti slut</td><td style='" & tdVal & "'>" & Coalesce(r.WarrantyEnd, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Dokument type</td><td style='" & tdVal & "'>" & Coalesce(r.DocumentType, "-") & "</td></tr>" &
                                  "<tr><td style='" & tdLbl & "'>Dokument link</td><td style='" & tdVal & "'>" & Coalesce(r.DocumentLink, "-") & "</td></tr>" &
                                  "</tbody></table></div>"
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width
