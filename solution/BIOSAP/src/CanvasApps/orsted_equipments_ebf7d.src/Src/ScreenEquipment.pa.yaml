                              BorderColor: =RGBA(215, 222, 232, 1)
                              BorderThickness: =1
                              Color: =RGBA(26, 34, 49, 1)
                              DisplayMode: =If(CountRows(Filter(colEquipmentRows, RowId < varEqSelectedRowId)) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Segoe UI'
                              Height: =36
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: |
                                =Set(varEqSelectedRowId, Coalesce(Max(Filter(colEquipmentRows, RowId < varEqSelectedRowId), RowId), varEqSelectedRowId))
