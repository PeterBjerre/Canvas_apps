                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinWidth: =0
                            Children:
                              - txtMatEyebrow:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Sektion Materialer"
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =RGBA(89, 102, 122, 1)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="MATERIALER"
                                    Wrap: =false
                              - txtMatTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Materialer Driftsrelateret"
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =RGBA(26, 34, 49, 1)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(App.Width < 640, 32, 42)
                                    LayoutMinWidth: =If(App.Width < 640, 0, 260)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < 640, 21, 28)
                                    Text: ="Materialer Driftsrelateret"
                                    Wrap: =false
                              - txtMatSubtitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Beskrivelse af siden"
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =RGBA(89, 102, 122, 1)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =If(App.Width < 640, 84, 56)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
