                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =28
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =6
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          RadiusBottomLeft: =18
                                          RadiusBottomRight: =18
                                          RadiusTopLeft: =18
                                          RadiusTopRight: =18
                                          Width: =98
                                        Children:
                                          - txtMatKpiTotalLabel:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: ="Antal raekker i alt"
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =RGBA(89, 102, 122, 1)
                                                Fill: =RGBA(0, 0, 0, 0)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: ="Total"
                                                Width: =38
                                                Wrap: =false
                                          - txtMatKpiTotalValue:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: ="Antal raekker i alt vaerdi"
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =RGBA(26, 34, 49, 1)
                                                Fill: =RGBA(0, 0, 0, 0)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Text(CountRows(colMaterialRows))
                                                Width: =26
                                                Wrap: =false
                                    - conMatKpiValid:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =28
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =6
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          RadiusBottomLeft: =18
                                          RadiusBottomRight: =18
                                          RadiusTopLeft: =18
                                          RadiusTopRight: =18
                                          Width: =98
                                        Children:
                                          - txtMatKpiValidLabel:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: ="Antal gyldige raekker"
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =RGBA(89, 102, 122, 1)
                                                Fill: =RGBA(0, 0, 0, 0)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: ="Valid"
                                                Width: =38
                                                Wrap: =false
                                          - txtMatKpiValidValue:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: ="Antal gyldige raekker vaerdi"
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =RGBA(26, 34, 49, 1)
                                                Fill: =RGBA(0, 0, 0, 0)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Text(CountRows(Filter(colMaterialRows, Status = "valid")))
                                                Width: =26
                                                Wrap: =false
                                    - conMatKpiInvalid:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =28
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =6
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          RadiusBottomLeft: =18
                                          RadiusBottomRight: =18
                                          RadiusTopLeft: =18
                                          RadiusTopRight: =18
                                          Width: =108
                                        Children:
                                          - txtMatKpiInvalidLabel:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: ="Antal ugyldige raekker"
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =RGBA(89, 102, 122, 1)
                                                Fill: =RGBA(0, 0, 0, 0)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: ="Invalid"
                                                Width: =48
                                                Wrap: =false
                                          - txtMatKpiInvalidValue:
