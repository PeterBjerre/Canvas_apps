Screens:
  ScreenMaterialer:
    Properties:
      Fill: =RGBA(237, 241, 247, 1)
    Children:
      - conMatRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Fill: =If(IsBlank(varSelectedRowId), RGBA(237, 241, 247, 1), RGBA(197, 203, 214, 1))
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - conMatShell:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(237, 241, 247, 1)
                  FillPortions: =0
                  Height: =Coalesce(40 + conMatHero.Height + conMatFormPanel.Height + conMatSavedPanel.Height + conMatFooterBar.Height + 100, 1840)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =If(App.Width < 640, 12, 20)
                  LayoutMinWidth: =0
                  PaddingBottom: =If(App.Width < 640, 12, 20)
                  PaddingLeft: =If(App.Width < 640, 12, If(App.Width < 1024, 16, 24))
                  PaddingRight: =If(App.Width < 640, 12, If(App.Width < 1024, 16, 24))
                  PaddingTop: =If(App.Width < 640, 12, 20)
                  Width: =Parent.Width
                Children:
                  - conMatHero:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(215, 222, 232, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 251, 253, 1)
                        FillPortions: =0
                        Height: =If(App.Width < 640, 280, If(App.Width < 1024, 240, 184))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(App.Width < 1024, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        PaddingBottom: =If(App.Width < 640, 12, 14)
                        PaddingLeft: =If(App.Width < 640, 12, 16)
                        PaddingRight: =If(App.Width < 640, 12, 16)
                        PaddingTop: =If(App.Width < 640, 12, 14)
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width
                      Children:
                        - conMatHeroLeft:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Height: =If(App.Width < 640, 156, 152)
