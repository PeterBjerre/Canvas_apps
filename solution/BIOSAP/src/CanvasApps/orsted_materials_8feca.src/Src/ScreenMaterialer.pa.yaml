                                              Properties:
                                                AccessibleLabel: ="Antal ugyldige raekker vaerdi"
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =RGBA(26, 34, 49, 1)
                                                Fill: =RGBA(0, 0, 0, 0)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Text(CountRows(Filter(colMaterialRows, Status = "invalid")))
                                                Width: =26
                                                Wrap: =false
                        - conMatHeroRight:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =If(App.Width < 1024, AlignInContainer.Stretch, AlignInContainer.Start)
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(App.Width < 640, 84, 40)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =If(App.Width < 1024, LayoutJustifyContent.Start, LayoutJustifyContent.End)
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                              Width: =If(App.Width < 1024, Parent.Width - If(App.Width < 640, 24, 32), 330)
                            Children:
                              - conMatModeSwitch:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(228, 233, 241, 1)
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    PaddingTop: =4
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    Width: =184
                                  Children:
                                    - btnMatModeDrift:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Skift til Drift"
                                          Align: =Align.Center
                                          Appearance: =If(varMode = "drift", ButtonAppearance.Primary, ButtonAppearance.Transparent)
                                          BasePaletteColor: =RGBA(0, 122, 204, 1)
                                          Color: =If(varMode = "drift", RGBA(255, 255, 255, 1), RGBA(89, 102, 122, 1))
                                          Font: =Font.'Segoe UI'
                                          Layout: =ButtonLayout.TextOnly
                                          OnSelect: |
                                            =Set(varMode, "drift");
                                            Set(varRuntimeInfo, "Drift mode.")
                                          RadiusBottomLeft: =16
                                          RadiusBottomRight: =16
                                          RadiusTopLeft: =16
                                          RadiusTopRight: =16
                                          Size: =14
                                          Text: ="Drift"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =88
                                    - btnMatModeProjekt:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Skift til Projekt"
                                          Align: =Align.Center
                                          Appearance: =If(varMode = "projekt", ButtonAppearance.Primary, ButtonAppearance.Transparent)
                                          BasePaletteColor: =RGBA(0, 122, 204, 1)
                                          Color: =If(varMode = "projekt", RGBA(255, 255, 255, 1), RGBA(89, 102, 122, 1))
                                          Font: =Font.'Segoe UI'
                                          Layout: =ButtonLayout.TextOnly
                                          OnSelect: |
                                            =Set(varMode, "projekt");
                                            Set(varRuntimeInfo, "Project mode.")
                                          RadiusBottomLeft: =16
                                          RadiusBottomRight: =16
                                          RadiusTopLeft: =16
                                          RadiusTopRight: =16
                                          Size: =14
                                          Text: ="Projekt"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =88
                              - btnMatExport:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Eksportér alle raekker som CSV"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =RGBA(0, 103, 174, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |
                                      =Set(
                                          varCsv,
                                          "RowId;FunctionalLocation;Manufacturer;ModelNumber;ManufacturerPartNo;MaterialDescription;Documentation;StockUnit;Price;PriceUnit;DeliveringTime;RecommendedStock;Supplier;SupplierPartNo;StrategicPart;WearPart;Plant;Status" & Char(10) &
                                          Concat(
                                              colMaterialRows,
                                              RowId & ";" & FunctionalLocation & ";" & Manufacturer & ";" & ModelNumber & ";" &
                                              ManufacturerPartNo & ";" & MaterialDescription & ";" & Documentation & ";" &
                                              StockUnit & ";" & Price & ";" & PriceUnit & ";" & DeliveringTime & ";" &
                                              RecommendedStock & ";" & Supplier & ";" & SupplierPartNo & ";" & StrategicPart & ";" &
                                              WearPart & ";" & Plant & ";" & Status,
                                              Char(10)
                                          )
                                      );
                                      Set(varRuntimeInfo, "CSV exported: " & CountRows(colMaterialRows) & " rows, " & Len(varCsv) & " characters.")
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Size: =14
                                    Text: ="Export CSV"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =130
                  - conMatFormPanel:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(215, 222, 232, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 251, 253, 1)
                        FillPortions: =0
                        Height: |
                          =40 + conMatFormHead.Height + 16 + conMatGrid.Height + 16 + conMatFormBottom.Height
                              + If(IsBlank(varLastValidationErrors), 0, conMatErrors.Height + 16)
                              + If(IsBlank(varSaveReceiptId), 0, conMatReceipt.Height + 16)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinWidth: =0
                        PaddingBottom: =If(App.Width < 640, 12, 20)
                        PaddingLeft: =If(App.Width < 640, 12, If(App.Width < 1024, 16, 20))
                        PaddingRight: =If(App.Width < 640, 12, If(App.Width < 1024, 16, 20))
                        PaddingTop: =If(App.Width < 640, 12, 20)
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width
                      Children:
                        - conMatFormHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(App.Width < 640, 88, 40)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                              Width: =Parent.Width
                            Children:
                              - txtMatFormHeading:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Spare Parts Form"
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =RGBA(26, 34, 49, 1)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =19
                                    Text: ="Spare Parts Form"
                                    Width: =148
                                    Wrap: =false
                              - conMatLegend:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Height: =20
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =3
                                    LayoutMinWidth: =0
                                    Width: =92
                                  Children:
                                    - txtMatLegendStar:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Obligatorisk markering"
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(179, 50, 60, 1)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="*"
                                          Width: =10
                                          Wrap: =false
                                    - txtMatLegendText:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Skal udfyldes"
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(89, 102, 122, 1)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          Height: =20
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="Skal udfyldes"
                                          Width: =110
                                          Wrap: =false
                              - btnMatNoBom:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Slaa No BOM Item til eller fra"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =If(varNoBom, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =RGBA(0, 122, 204, 1)
                                    BorderColor: =RGBA(215, 222, 232, 1)
                                    BorderThickness: =1
                                    Color: =If(varNoBom, RGBA(255, 255, 255, 1), RGBA(89, 102, 122, 1))
                                    Font: =Font.'Segoe UI'
                                    Height: =34
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |
                                      =Set(varNoBom, !varNoBom);
                                      If(varNoBom, Set(varFormFL, ""); Reset(txtMatFL));
                                      Set(varRuntimeInfo, "No BOM Item " & If(varNoBom, "ON", "OFF") & ".")
                                    RadiusBottomLeft: =18
                                    RadiusBottomRight: =18
                                    RadiusTopLeft: =18
                                    RadiusTopRight: =18
                                    Size: =14
                                    Text: |-
                                      ="No BOM Item: " & If(varNoBom, "ON", "OFF")
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =180
                        - conMatGrid:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =Coalesce(conMatGridRow1.Height + conMatGridRow2.Height + conMatGridRow3.Height + conMatGridRow4.Height + 36, 284)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - conMatGridRow1:
                                  Control: GroupContainer@1.5.0
